cmd_help.text: "MOVEMENT:
LOOK - Examine your surroundings
GO <direction> - Move in that direction
GO <room name> - Auto-walk to a room you have discovered
INTERACTION:
TALK TO <npc> - Speak with someone
ASK <npc> ABOUT <topic> - Ask about a topic; bare ASK lists what they discuss
SAY <message> - Speak aloud
WHISPER <target> <message> - Whisper to someone
YELL <message> - Broadcast to nearby rooms
GIVE <item> TO <target> - Give an item to someone
BOND <npc> - Share a meal and build friendship
COVERT:
HIDE - Conceal yourself
TAIL <npc> - Follow someone secretly
DISGUISE AS <role> - Impersonate a faction role
PLANT <item> ON <npc> - Plant evidence on someone
PICKPOCKET <npc> - Steal from someone (risk of discovery)
SEARCH <detail> - Reveal hidden items or dead drops into the room
EXAMINE <target> - Inspect an item, NPC, or container
ITEMS:
TAKE <item> - Pick up an item; bare TAKE opens a chooser
DROP <item> - Discard an item; bare DROP opens a chooser
EAT <item> - Consume food; bare EAT opens a chooser
READ <item> - Read an item; bare READ opens a chooser
SELL <item> - Sell an item; bare SELL opens a chooser
REPAIR <weapon> - Repair a weapon; bare REPAIR opens a chooser
INVENTORY - List what you carry
REMOVE <armour> - Remove armour
EQUIP <item> - Ready a weapon or wear armour
OPEN <container> - The only way to unlock a locked container
TAKE <item> FROM <container> - Retrieve from an open container
WRITE NOTE <text> - Create a note
LEAVE NOTE - Drop a note in the room
SURVIVAL:
JOURNAL [character] - View your journal or an archived journal
STATUS - View your condition
COMBAT:
ATTACK <target> - Engage in combat (courage-based)
MOD WEAPON <weapon> WITH <mod> - Attach a mod to a weapon
ECONOMY:
BUY FROM <npc> - Purchase from a vendor
MISSIONS:
MISSIONS - View active missions
MISSIONS AVAILABLE - Show available missions and encounter-driven opportunities
MISSIONS COMPLETE <id> - Turn in a completed mission
MISSIONS ABANDON <id> - Abandon a mission
SYSTEM:
HELP - Display this help
MEMORIAL - View the legacy book (fallen characters)
QUIT - Save and exit
NOTES:
- MAP is retired. The side-panel map always shows what you have discovered.
- Locked containers open only with OPEN and the right key.
- Press TAB to complete commands and context-sensitive targets.
"

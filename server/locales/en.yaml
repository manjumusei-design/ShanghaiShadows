wanted.green_gang_deal_no_money: "You don't have enough fabi. {name} shrugs. \"Come back when you can pay.\""
wanted.green_gang_deal_success: "{name} nods. \"Consider it handled. Stay out of sight for a while.\" Your wanted level decreases."
wanted.green_gang_deal_refused: "{name} steps back. \"Your funeral. Don't say I didn't offer.\""
wanted.green_gang_not_wanted: "{name} looks confused. \"You don't look like you're in trouble. Why would you need my help?\""

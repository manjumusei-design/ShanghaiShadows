milestones:
- id: first_blood
  trigger: action_kill_npc
  narrative: ""
  effects:
    courage: 1
    morale: -2
- id: month_one
  trigger: day
  day: 30
  narrative: Thirty days have passed in occupied Shanghai. You have learned which markets close early, which alleys avoid patrol lamps, and which tea houses fall quiet when unfamiliar shoes cross the threshold. The city is no longer strange to you. That does not mean it is safe; it means you now notice the danger sooner.
  effects:
    morale: 5
- id: year_one
  trigger: day
  day: 365
  narrative: A full year has passed under occupation. Checkpoints have gained new faces, old coats have been patched twice, and familiar shops now keep their shutters half lowered even at noon. The war that was promised a quick ending has settled into household routine. You remain in Shanghai, altered by every queue, favour, and silence.
  effects:
    morale: 10
- id: kempeitai_crackdown
  trigger: day
  day: 500
  narrative: Fresh officers appear at the checkpoints with colder habits and no memory of the old bribes. Neighbours cross streets before greeting one another, and several shops close with goods still on the shelves. The Kempeitai call it improved order. The city understands it as another narrowing of breath.
  effects:
    morale: -5
- id: halfway
  trigger: day
  day: 1417
  narrative: 'News from outside arrives slowly, then changes shape in markets, kitchens, and tram queues. Rice is poorer, shoes are thinner, and the crowds have learned to leave space around trouble. Still, Shanghai wakes each morning: shutters lift, kettles boil, porters curse, and somebody somewhere chooses to carry a message instead of fear.'
  effects:
    morale: 5

milestones:
  - id: first_blood
    trigger: action_kill_npc
    narrative: "Blood washes into the gutter. Shanghai has swallowed a thousand killings — yours is only the most recent. The city does not judge. It only remembers."
    effects:
      courage: 3
      morale: 5

  - id: month_one
    trigger: day
    day: 30
    narrative: "One month under the Rising Sun. The Kempeitai patrols grow bolder. The markets grow thinner. But the underground has learned your face — and trust is a currency that spends slowly."
    effects:
      morale: 10
      influence:
        ccp: 2

  - id: year_one
    trigger: day
    day: 365
    narrative: "A year in the shadows. The Liberation promised by Chungking and Chungking alone has not arrived. The occupiers dig deeper. The resistance strikes harder. And you — you are still breathing. That is not nothing."
    effects:
      morale: 15
      influence:
        ccp: 3

  - id: kempeitai_crackdown
    trigger: day
    day: 500
    narrative: "A cold wind through Hongkou. The Kempeitai have reorganized their security apparatus — new officers, new informants, new brutality. Every face in the crowd is a potential betrayer. The old safe routes are no longer safe."
    effects:
      influence:
        ccp: 2
        gmd: 2

  - id: halfway
    trigger: day
    day: 1417
    narrative: "The halfway point. Across the Pacific the Japanese war machine is bleeding. But here in Shanghai the occupation still stands, still watches, still kills. The people are hungry but not broken. Half the road is behind you. Half remains."
    effects:
      morale: 20
      influence:
        ccp: 5

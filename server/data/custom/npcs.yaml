  special_ids:
    '1': gmd_safehouse_old_city
    '2': hongkou_detention
  special_names:
    '1': Old City Safe House
    '2': Hongkou Detention Center
    '3': Yuyuan Garden Gate
    '5': City God Temple
    '7': Tortoise Shell Alley
  special_items:
    '5':
    - testimony_archive_box
  special_descriptions:
    '1': The Old City Safe House is a nondescript residence tucked into a maze of identical lanes. From the street, it looks
      like any other shikumen house with its grey brick facade and wooden door. Inside, the windows have been blacked out
      and the furniture arranged to provide clear sightlines to every entrance.
    '2': The Hongkou Detention Center is a grim concrete building surrounded by barbed wire. The windows are barred and the
      walls are lined with damp. The sounds of interrogation echo through the corridors at all hours.
    '3': The ornate gate of the Yuyuan Garden opens onto a world of winding paths and hidden pavilions. Old women burn incense
      at small shrines tucked between rockeries, their prayers mingling with the smoke. Japanese officers photograph the Ming
      dynasty architecture while their minders watch the crowd for dissidents.
    '5': The City God Temple's curved eaves rise above the old city's rooftops, its incense smoke a constant presence. Worshippers
      light candles for ancestors and for the souls of those killed in the recent massacres. The temple courtyard has become
      an unofficial market where news travels faster than the Kempeitai can track it.
    '7': Tortoise Shell Alley threads between crumbling residential compounds, so narrow that laundry lines from opposing
      windows nearly touch. Children kick stones in the gutter while their mothers haggle over vegetables at a corner stall.
      The alley's walls are covered with fading propaganda posters peeling beneath newer layers of damp and time.
  special_detailed_descriptions:
    '1': The Old City Safe House is a two-storey shikumen residence that blends perfectly into the surrounding lane. The front
      room appears to be a modest parlour with worn furniture and family photographs on the walls. Behind a false wall in
      the kitchen, a narrow staircase leads to a hidden basement where resistance operatives plan missions, store weapons,
      and shelter fugitives. The basement has a radio set tuned to frequencies monitored by no legitimate authority.
    '2': The Hongkou Detention Center is a place of concrete and despair. The holding cells are small, windowless boxes where
      prisoners are kept in darkness for days at a time. The interrogation rooms are equipped with tools that leave no marks
      on the body but break the spirit. The detention center is run by the Kempeitai, and the guards are men who have been
      selected for their capacity for cruelty.
    '3': The Yuyuan Garden Gate marks the entrance to one of Shanghai's most treasured historical sites, a Ming dynasty garden
      of pavilions, rockeries, and koi ponds. The garden's famous zigzag bridge still arches over its carp-filled waters,
      but the pavilions now bear Japanese propaganda posters alongside ancient calligraphy. Old men play weiqi in the shadow
      of pagodas, their games stretching through the afternoons while the city burns around them. The tea house within the
      garden serves as a meeting point for those who wish to appear as tourists while conducting business that would interest
      the authorities.
    '5': The City God Temple, Chenghuangmiao, stands at the heart of the old Chinese city, its incense burners never cold
      despite the occupation. Worshippers come to pray for protection, for news of missing sons, for the strength to endure,
      their whispered petitions rising with the smoke. The temple's side halls house small shrines to local deities, each
      one tended by devotees who also tend the networks of resistance that operate in the temple's shadow. Outside, the bazaar
      offers everything from prayer beads to forged identity papers, sold with the same neutral expression.
    '7': Tortoise Shell Alley is the kind of lane that exists nowhere else but in Shanghai's old city, so narrow that a man
      can touch both walls, so crooked that daylight reaches the ground only at noon. The residents know each other's business,
      which makes secrets impossible and conspiracy an art form. A noodle shop at the alley's midpoint serves the best hand-pulled
      noodles in the district and acts as a message drop for the neighborhood resistance cell. The alley connects to a dozen
      similar lanes, forming a maze that occupation patrols avoid unless heavily armed.

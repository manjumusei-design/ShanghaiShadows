  description_templates:
  - Shop shutters rattle in the wind and painted signs peel over windows that no longer trust daylight or easy credit.
  - The lane carries perfume, frying oil, and the stale fear of people learning to bargain without speaking plainly.
  - A tram line cuts through the street like a memory of speed from a calmer decade, its rails polished by anxious crossings.
  - Neon tubes buzz above shops that trade in luxury by day and quieter obligations after the shutters fall.
  - Teahouses, tailors, and pawnshops lean close enough to share secrets across the street without raising their voices.
  special_ids:
    '1': nanjing_road
    '8': checkpoint_soochow_creek

  description_templates:
  - Grey brick walls hold the night's damp, and laundry lines sag like tired flags over families counting breakfast.
  - Small courtyards open and close between walls inked with rain, handbills, and names scratched out before inspection.
  - The lane smells of cooking rice, old incense, and drains that never quite dry after the morning buckets pass.
  - Wooden doors sit shoulder to shoulder, each one thin enough to hear worry and thick enough to deny it.
  - A shrine niche flickers from somewhere unseen, giving the alley more conscience than light.

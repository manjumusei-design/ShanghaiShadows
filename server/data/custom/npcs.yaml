    12: venue_residential_tenant_block
    16: venue_french_cafe_lounge
    20: venue_commercial_market_street
    23: venue_bund_river_promenade
  dialogue:
    greeting:
    - The next set starts in twenty minutes. Buy a drink and pretend you came for the music.
    - You are early. The interesting customers do not arrive until after midnight.
    - The spotlight hides everything except what I want people to see.
    - The struggle continues. What news do you bring?
    - Speak quickly. Every moment is a risk.
    friendly:

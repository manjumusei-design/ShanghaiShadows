    - The fare is two jiao to the end of the promenade. No haggling, please.
    - The road doesn't care who walks it. Soldier or civilian. Same road.
    - I've pulled this rickshaw twelve years. My legs remember every cobblestone.
    - Things are hard for everyone these days. We make do.
    friendly:
    - I overheard two officers talking near the customs house. Something about a shipment tomorrow night.
    - You have been kind to me. I tell you for free, the checkpoint on the Bund thins out after the shift change.
    - I know a route through the old city the patrols don't watch. The road tells me.
    - You've got a light step. Good. Heavy attracts attention. Light attracts nothing.
    - You've been good to me. I remember kindness.
    hostile:
    - I do not know anything. Ask someone else.
    - You are bad for business. Stand somewhere else.
    - I don't carry people who bring darkness. My rickshaw has standards.
    - You've got heavy aura. Don't need that weight on my wheels.
    - I don't want trouble. Don't bring it here.
    afraid:
    - I am just a rickshaw puller. I see nothing, I hear nothing.
    - Take the rickshaw if you want. Just let me go home to my family.
    - The devils pull people off the street at random now. No reason. Just cruelty.
    - They took my friend's rickshaw last week. Burned it. Said it blocked a checkpoint.
    - Keep them away from me. I have children.
    gossip:
    - The foreign clerks on the Bund keep strange hours lately. I see them after midnight, carrying briefcases.
    - A new officer inspects every rickshaw on Tuesdays now. Something spooked them.
    - A passenger left mud on the cushion and a ration coupon under it. I returned neither.
    - The customs house clock stopped at noon, but every clerk still hurried like it accused him.
    - A woman asked me to circle the Bund twice so her child could sleep before the checkpoint.
    farewell:
    - Watch yourself out there. The Bund looks different after dark.
    - Same time tomorrow, if we are both still here.
    - Keep walking. The road forgives everything except stopping.
    - I'll be here, pulling. It's all I know. All I need.
    - Take care. It's dangerous out there.
    ask:
      street_routes:
      - The Bund changes beneath a puller, though every cobblestone remembers hungry feet.
      - I carry clerks, coolies, soldiers, and widows, each watching different shadows.
      - A fare means rice tonight, so I keep my eyes low.
      - Roads offer no loyalties, only wheels, rain, and men with questions.
      - My legs know Shanghai better than any map printed for officials.
      rickshaw:
      - The shafts have rubbed my palms smooth, but they still ache.
      - A rickshaw lasts when its wheels are greased and its owner remains unnoticed.
      - Passengers leave mud, gossip, and sometimes forgotten ration coupons behind them.
      - I mend broken spokes at dawn before the first officer whistles.
      - The old girl earns her keep, though the city asks much.
      prices_and_papers:
      - By noon, yesterday's fare buys only a cup of thin broth and a little coal for the brazier.
      - A permit inspector taps the rickshaw cushion as if worn cloth might confess who paid for the last repair.
      - When soldiers stop a puller, the waiting passenger curses him, though his wife may be counting the same missing coins.
      - I keep the license folded beneath my shirt, dry against sweat, rain, and the hands that enjoy unfolding it.
      - The shafts are heavy enough without carrying every man's opinion of the flag above the Bund.

- id: noodle_vendor_wu
  name: Old Wu
  description: A hunched noodle vendor with a permanent squint from years of peering through steam rising from his wok.
  faction: civilian
  role: vendor
  personality: gruff, superstitious, talkative when the mood strikes
  awareness: 30
  authority: 5
  courage: 20
  perception: 35
  bt_archetype: civilian_vendor
  schedule:
    6: venue_old_city_market_hub
    12: oldcity_05
    18: venue_old_city_courtyard_north
    21: venue_old_city_market_hub
  dialogue:
    greeting:
    - Noodles? Three jiao. Sit on the stool, not the crate.
    - You look hungry. First bowl is full price, same as the second.
    - Best noodles in Shanghai. The broth is the secret. Stays with me.
    - You look like you need noodles. Everyone needs noodles. Sit.
    - You look like you need something. Make it quick.
    neutral:
    - I sell noodles. The broth is honest, even if the times are not.
    - Sit and eat. Standing customers make me nervous.
    - Can't rush good food. Can't rush anything worth having.
    - The broth tells no lies. Simmering twenty years. It knows everything.
    - Things are hard for everyone these days. We make do.
    friendly:
    - I see everyone who passes through the old city. The man in the grey coat has been here three days running.
    - Extra pork for you. You look thin. A thin friend is a worried friend.
    - Extra meat in your soup. I know you're doing good work.
    - Come late at night, I'll still have soup. Keep some back.
    - You've been good to me. I remember kindness.
    hostile:
    - I sell noodles, not answers. Buy something or move along.
    - You are scaring away my customers. Go bother someone else.
    - I don't serve soldiers or collaborators. You look like one or the other.
    - My noodles are for feeding people, not questioning them.
    - I don't want trouble. Don't bring it here.
    afraid:
    - The noodles are free. Take them. Just do not make trouble here.
    - I did not see anything. I was busy with the broth. I am always busy with the broth.
    - The Kempeitai asked about my customers. Said I don't remember faces. I lied.
    - They're rounding up street vendors. Closing carts. How much longer?
    - Please don't bring them here. I have children.
    gossip:
    - A young man came through this morning carrying a package wrapped in newspaper. He walked fast and did not stop to eat.
    - The soldiers took old Mrs. Huang's grandson yesterday. Right off the street. Nobody knows why.
    - A customer cried into his noodles today and blamed the pepper. I charged him for plain broth.
    - The patrolman who hates garlic came back twice this week. His questions smell worse.
    - Someone left a temple notice under my soup bowls and forgot steam wrinkles paper.
    farewell:
    - Come back when you are hungry. The broth is always on.
    - Eat well and walk carefully. The old city is not as safe as it used to be.
    - Come back when the sun goes down. Soup's better at night.
    - Good food and good company. That's all anyone needs.
    - Take care. It's dangerous out there.
    ask:
      stall_trade:
      - Steam hides a man for one breath, then the bowl brings him back.
      - I know customers by their order, not by names that bring trouble.
      - A cart survives through firewood, salt, and customers who pay promptly.
      - Patrols dislike garlic, but they dislike hungry crowds even more.
      - My stool hears more than any clerk, though it never repeats.
      noodle_recipe:
      - The broth begins before sunrise, when the market smells almost honest.
      - Bones, ginger, and patience make noodles worth waiting through a cold morning.
      - A cook guards his pot because every hungry hand believes itself entitled.
      - The wok hisses louder when strangers ask what cannot be served.
      - Eat first, then talk, because an empty stomach makes foolish promises.
      prices_and_papers:
      - Flour arrives dear and damp these days, so I stretch the broth with bones until even the steam looks tired.
      - The permit hangs over my cart like a bad charm, and still a constable can decide the wok offends him.
      - Customers bring ration cards, military notes, or empty hands, then glare as though I invented hunger before breakfast.
      - I hide the day's coins in the rice tin, because a ladle cannot argue with an official who wants supper free.
      - If the fire stays lit through curfew, somebody will eat warm noodles tomorrow, and that is enough glory for one cook.

- id: bar_girl_suyin
  name: Suyin
  description: A bar hostess with painted lips and tired eyes who pours drinks with one hand and collects secrets with the other.
  faction: civilian
  role: entertainer
  personality: flirtatious exterior, sharp and calculating underneath
  awareness: 40
  authority: 8
  courage: 30
  perception: 45
  bt_archetype: civilian_vendor
  schedule:
    14: venue_french_cafe_bar
    18: french_05
    22: venue_french_jazz_cafe
    2: venue_french_cafe_bar
  dialogue:
    greeting:
    - Sit down. Buy me a drink and I will pretend to listen.
    - You look like you need company. Or a confession. Hard to tell which.
    - Another drink, sir? You've had a day. Everyone's had a day.
    - Sit. Stay a while. The night is young. Relatively.
    - You look like you need something. Make it quick.
    neutral:
    - I pour drinks and smile. That is what I am paid for.
    - The bar is crowded tonight. Speak quietly or not at all.
    - A girl has to survive. I do it with a smile and a steady pour.
    - Men talk when they drink. I listen. That's how I pay rent.
    - Things are hard for everyone these days. We make do.
    friendly:
    - The major at table four has had too much whisky. He keeps talking about a convoy leaving on Thursday.
    - A naval officer left a map on the bar last week. I glanced at it before he snatched it back. Nanking was circled.
    - I saved a table in the corner. Best view of the room. And the exits.
    - The officer at the bar is buying rounds. Trying to impress someone.
    - You've been good to me. I remember kindness.
    hostile:
    - I do not answer to people who do not tip. Try elsewhere.
    - You are making my other customers uncomfortable. Leave.
    - I've dealt with drunker men than you. And meaner. Don't test me.
    - You're not special. Just another man with money and bad intentions.
    - I don't want trouble. Don't bring it here.
    afraid:
    - I am just a bar girl. I serve drinks. I do not know anything important.
    - The manager does not like trouble. Please, just go.
    - A customer grabbed me last night. Bouncer threw him out. He waited outside.
    - The owner owes the Green Gang. If they take the bar, I lose everything.
    - Keep them away from here. I have children who think night work is only singing.
    gossip:
    - The colonel's mistress comes in every Wednesday. She talks too much and drinks even more.
    - A foreign businessman at the corner table has been meeting with a Kempeitai translator after midnight.
    - A drummer borrowed my powder to hide a bruise and played better than usual.
    - The new hostess counts tips in military yen first, then curses in Suzhou dialect.
    - A Japanese officer left a glove in booth three. His wife came for it before noon.
    farewell:
    - Come back when you can afford better company. Or when you have something interesting to say.
    - My shift ends at two. After that, I am just a woman walking home alone. Do not follow me.
    - Come back with less trouble and more money. I'll be here.
    - Look after yourself. No one else will do it in this city.
    - Walk carefully. It is dangerous out there.
    ask:
      stage_lights:
      - The lamps flatter tired faces, which is their only honest service.
      - Men spend freely beneath music, then forget who heard them boast.
      - I count bottles, tips, and exits before every shift begins.
      - A dark corner can hold a confession better than a priest.
      - The band plays on, because silence makes customers remember the war.
      younger_sister:
      - My sister deserves schoolbooks, not the kind of lessons I learned.
      - I send coins home folded inside ordinary letters whenever I can.
      - Men at tables mistake a painted smile for permission to ask.
      - Her name stays out of this bar, where every ear has a price.
      - I would rather scrub glasses forever than see her wear these shoes.
      prices_and_papers:
      - The nightclub keeps its license polished in a frame, as though a gold seal could make the back stairs respectable.
      - Men spend military yen on imported whisky, then expect a smile to make their change of currency feel clean.
      - The manager calls the permits protection, but he never waits outside after midnight when the patrol wagon slows down.
      - I learn which guest wants flattery, which wants silence, and which is checking whether the girls have papers.
      - When the pianist plays the last number, I powder my face again and walk home before the mirrors can ask questions.

- id: rat_face_xiao
  name: Rat-Face Xiao
  description: A wiry Green Gang informant with sharp features and darting eyes who sells whispers to the highest bidder and sleeps with one eye open.
  faction: green_gang
  role: informant
  personality: nervous, greedy, survivalist
  awareness: 55
  authority: 30
  courage: 40
  perception: 50
  bt_archetype: green_gang_thug
  schedule:
    8: venue_hongkou_refugee_lane
    12: venue_hongkou_refugee_shelter
    18: venue_hongkou_refugee_courtyard
    22: venue_hongkou_refugee_lane
  dialogue:
    greeting:
    - You got money? I got ears. Let us do business.
    - Keep your voice down. I cannot be seen talking to just anyone.
    - I hear things. Maybe I know things. For the right price, I share.
    - You look like someone who needs information. I have information.
    - You're on my ground. Talk quick or move on.
    neutral:
    - Information costs. How much depends on how dangerous it is.
    - I sell what I hear. What you do with it is your affair.
    - I have ears everywhere. Walls speak. Streets whisper. I listen.
    - Maybe I know. Maybe I don't. Price is the same either way.
    - Business is business. I stick to that.
    friendly:
    - The Kempeitai are planning a raid on the old city day after tomorrow. I heard it from a sergeant who drinks too much.
    - There is a new informant in Hongkou. Works for the puppet police. I can find out who, but it will cost you.
    - I heard the Kempeitai are planning something at the docks next week. Special price for you.
    - You've been good to me. I remember good treatment. Rare.
    - You're alright in my book. That counts for something here.
    hostile:
    - You ask too many questions for someone who does not pay. Walk away.
    - I have friends who handle problems. You are starting to look like a problem.
    - I don't know nothing. Never saw you. You're not real.
    - Wrong person. I'm a street rat. What would I know?
    - You're asking for a beating. Or worse.
    afraid:
    - Look, I will tell you anything you want. Just do not hurt me. I have debts, not courage.
    - I sell information, not loyalty. If someone paid me to watch you, I would. That is just survival.
    - The Kempeitai are looking for a rat. Someone's been talking too much. If they find me, I'm dead.
    - Two men followed me yesterday. Same route. Same pace. They know.
    - The gangs are getting squeezed. Every direction.
    gossip:
    - The Green Gang is moving opium through the French Concession again. Different route this time, through the back of a laundry.
    - A Kempeitai captain is being transferred. His replacement is supposed to be worse. Hard to imagine, but there it is.
    - A debtor tried to pay with a watch missing both hands. Even time refused him.
    - Someone left my name on a police list and spelled it correctly, which is discouraging.
    - The laundry route is watched now. Clean shirts have become too interesting.
    farewell:
    - Same place, same price. Do not come to my home. Ever.
    - Watch your back. Not everyone in Hongkou sells information. Some of them sell people.
    - Need me, leave a note at the bar on Fuzhou Road. I'll find you.
    - Stay alive out there. Getting dangerous for people who ask questions.
    - Keep your nose clean. This city has a long reach.
    ask:
      watched_counter:
      - My counter holds receipts, loose coins, and reasons for men to lie.
      - A notebook can condemn a man faster than a knife.
      - I sell whispers carefully, because buyers often become sellers later.
      - Uniforms notice details when they need someone smaller to blame.
      - Visible business pays rent, while hidden business keeps a frightened man breathing.
      own_skin:
      - I sleep lightly because debts and favours both know my address.
      - A man survives Hongkou by leaving no story with his name attached.
      - People call it cowardice until someone offers them my bills.
      - I keep one shoe beside the bed, ready for sudden footsteps.
      - Ask about my skin, and you ask why rats learn tunnels.
      debt_and_china:
      - Chinese streets deserve Chinese masters, though masters always collect their due.
      - The Green Gang sells appetite because hunger never misses a payment.
      - Every debt becomes political when a soldier holds the ledger.
      - I distrust grand causes that forget the man owing breakfast.
      - Peace looks cheap until you count who pays for it.

- id: iwane_matsui
  name: General Iwane Matsui
  description: A frail, bespectacled general draped in the Imperial Army's coat. He commands the Central China Area Army and believes he brings order to a chaotic city. Guards surround him at all hours.
  faction: kempeitai
  role: commander
  personality: aloof, devout, convinced of his own righteousness

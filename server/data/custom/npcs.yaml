  dialogue:
    greeting:
    - The tide is in and so am I. What do you need moved?
    - I handle cargo. The kind that does not appear on manifests.
    - You smell like dry land. What brings you to the docks?
    - The struggle continues. What news do you bring?
    - Speak quickly. Every moment is a risk.
    friendly:
    - The shipment arrived last night. Ten cases of British rifles, hidden inside crates of pickled vegetables. They are in Warehouse Nine.
    - I have a contact on the Japanese supply ship. He looks the other way for the right price.
    - Three trips this month. Sixty rifles, two cases of ammunition, and a mortar that I still cannot believe I got past the checkpoint.
    - You've proven your commitment. The cause remembers.
    - We could use someone with your skills.
    hostile:
    - I move crates. I do not answer questions. You are asking questions.
    - The docks are dangerous for people who stick their noses where they do not belong.
    - I have friends at every pier. They do not like strangers asking about cargo.
    - You want something moved? Show me money. You want something else? Show me the door.
    - Accidents happen on the docks. Crates fall. People fall. Be careful.
    afraid:

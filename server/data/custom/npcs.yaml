  description_templates:
  - Cargo hooks creak over black water while foremen count men the way they count crates. The river carries what the ledgers will not.
  - Oil sheens spread rainbow-thin across puddles beside stacks of marked timber and unmarked fear.
  - Warehouse doors slam in the wind and every slam sounds like guilt correcting itself. Nobody looks up.
  - The wharf smells of brine, rope tar, and fish gone past salvage after the morning auction.
  - Dice rattle somewhere behind the sheds even when the sirens start. The game does not stop for the alarm.

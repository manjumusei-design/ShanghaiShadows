    14: venue_french_cafe_lounge
    20: venue_residential_tenant_block
    23: venue_residential_tenant_block
  dialogue:
    greeting:
    - The signal was clear last night. Chungking acknowledged receipt at 0300 hours.
    - Come in quickly. The radio is hidden but the walls are not soundproof.
    - You look like you have a message. I hope it is short. Transmission time is dangerous.
    - The struggle continues. What news do you bring?
    - Speak quickly. Every moment is a risk.
    friendly:
    - I transmitted the troop movement report last night. Chungking sends their thanks and a new code sheet.
    - The frequency changes at midnight. I have the new settings memorized. Nothing on paper.
    - The attic is cramped and cold, but the signal reaches Chungking clean. That is all that matters.
    - You've proven your commitment. The cause remembers.
    - We could use someone with your skills.
    hostile:
    - You are interference. I cannot afford interference. Leave.
    - Every second you are here increases the risk of triangulation. Get out.
    - I transmit at scheduled times only. I do not take requests.
    - You are making noise. Noise attracts direction finders. Stop.
    - If the Kempeitai trace my signal because of you, I will tell them everything. I am not brave.
    afraid:
    - I heard a van idling outside last night. A heavy engine. Kempeitai pattern.
    - My signal was picked up by a second listener. I heard the echo. Someone is scanning.
    - The code sheet is compromised. I have to burn it and memorize a new one by tomorrow.
    - My landlord asked about the wires in the attic. I said it was for a radio. He looked at me strangely.
    - Chungking did not acknowledge my last transmission. Two nights now. I do not know if they heard me at all.
    suspicious:
    - I am a clerk. I work at a shipping company. I do not know anything about radios.
    - You have the wrong address. There is nothing in the attic but dust and old furniture.
    neutral:
    - A radio operator is only as good as his last transmission. One mistake and the triangulation team finds you.
    - I transmit for forty-five seconds, then move. Never the same time two nights in a row.
    - The code changes weekly. I memorize it and burn the sheet. My memory is the only record.
    - The Party's work continues. Quietly. Patiently.
    - Trust is earned through action, not words.
    farewell:
    - Leave before dark. The triangulation vans come out after nine.
    - If I miss a scheduled transmission, assume the worst and burn everything.
    - The revolution is patient. We will prevail.
    - Stay safe. The cause needs you.
    - The revolution is patient. We will prevail.
    gossip:
    - The attic mouse chewed a code scrap today. For once, hunger improved security.
    - A neighbor complained about humming wires and then asked whether radios predict weather.
    - Chungking answered late last night. Three minutes late feels longer than curfew.
    - The new detection van coughs before it turns the corner. Engines have accents.
    - My landlord now asks about electricity bills with too much arithmetic in his face.
    ask:
      signal_room:
      - This room has one honest sound, the Morse key, and even that must stop before a listener fixes its direction.
      - The attic boards carry footsteps badly, so I count each creak before touching a valve or wire.
      - A wireless set needs dry batteries, steady hands, and fewer visitors than a church at curfew.
      - I keep the dial low because a clear signal can be the most dangerous kind of good news.
      - When the receiver hisses, I hear the city breathing through walls that were never built for secrets.
      radio:
      - Radio is arithmetic with fear in it, because one misplaced letter can send a patrol toward the wrong door.
      - I change frequencies as often as I change lodgings, although neither habit makes the night less watchful.
      - The aerial catches distant voices after midnight, thin as thread but strong enough to keep duty alive.
      - A code sheet burns quickly, yet the fingers remember its pattern long after the ash cools.
      - Speak softly near any set, because even an unplugged wire teaches a man to suspect ears.
      chungking_and_shanghai:
      - Chungking answers in brief pulses, but those pulses remind this crowded city that China still has a voice.
      - Shanghai hears occupation orders everywhere, from harbor sirens to loudspeakers, and answers must travel more carefully.
      - I serve the GMD by sending what I can verify, never the rumors that multiply after a blackout.
      - A message reaches its destination through discipline, not through brave talk repeated in tea shops.
      - If the signal holds tonight, the distance between this attic and Chungking will feel smaller than one street.
    rumor:
    - The Japanese have a new radio detection vehicle. It cruises the French Concession between ten and two. I can hear its engine from the attic.
    - A GMD radio operator in Zhabei was caught last week. They found his set and his code sheets. He talked within a day.
    secret:
    - The radio is hidden inside a hollowed-out wardrobe in the attic. The antenna runs up the chimney. If I hear boots on the stairs, I have ninety seconds to dismantle it and hide the parts in the floorboards.
- id: hospital_nurse_luo

    - A bowl of rice, a moment of quiet. That is all I can offer today.
    - If you are looking for the priest who talks too much, you have the wrong temple.
    - Compassion is the only weapon that doesn't wound the wielder.
    - I've seen more suffering this year than in my previous fifty. Yet I still believe.
    friendly:
    - The back room is warm. There are blankets behind the altar. Stay as long as you need.
    - I have said prayers for people I cannot name. I trust you understand why.
    - A friend of the temple is a friend of mine. Come back whenever the road feels narrow.
    - There is a room behind the altar. Few know about it. Those who need it, use it.
    - The lotus grows from mud. Shanghai is mud. I've seen lotuses here.

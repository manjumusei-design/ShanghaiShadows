      - I meet people where care already happens, in kitchens, classrooms, and sickrooms that officials dismiss as ordinary.
      - Relief work teaches discipline, because an exposed helper can leave an entire ward without medicine or bread.
      - Names stay off my tongue unless a patient needs them, and even then I choose the smallest necessary truth.
      - Before curfew, listen for doors opening to neighbours, because care persists without requiring a banner.
- id: elder_chen

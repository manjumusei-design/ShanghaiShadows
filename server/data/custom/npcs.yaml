    20: venue_docks_cargo_berth
    23: docks_05
  dialogue:
    greeting:
    - Pull up a chair. The cards are warm, the tea is weak, and the dock boys have already lied twice today.
    - You found me before midnight. That means your business is either honest or badly timed.
    - The dice are sulking tonight. My daughter says I tap them too hard when shipments run late.
    - Sit where the lantern reaches your hands. Numbers do not lie, but fingers sometimes confess.
    - If you came about crates, speak softly. If you came about cards, speak poorer.
    neutral:
    - A runner brought me three crate tags and one shoe this morning. The shoe worries me more.
    - I never gamble, I calculate. Gambling is what customers call arithmetic after losing.
    - The house mat is wet again because dock boys wipe their feet like princes with no mothers.
    - Odds are odds. A late boat, a quiet foreman, and new police boots make a poor combination.
    - My daughter copied numbers from the ledger yesterday. She corrected my seven and said it looked dishonest.
    friendly:
    - You pay on time, so I tell you plainly, the north warehouse is watched, but the watchman loves bean cakes.
    - Sit by the dry mat. Last time you tracked river mud across my good floor and pretended innocence.
    - My daughter tied red string around the lucky dice. Do not laugh; they have behaved better since.
    - I can move anything small enough to deny and dangerous enough to matter, if you let me name the hour.
    - Madam Xu says you listen before bargaining. That habit saves money and occasionally teeth.
    hostile:
    - Do not ask about runners by name. Names are for debts, funerals, and foolish receipts.
    - You count my cards, I count your exits. I have the kinder number.
    - The last stranger who pressed this hard left owing me an apology and one front tooth.
    - Walk past. Come back when your business has weight and fewer witnesses.
    - I calculate you are bad for business. Numbers do not lie, though I sometimes wish they would.
    afraid:
    - Not now. They are watching the docks, and one watcher has shoes too new for dock work.
    - Something went wrong at the warehouse. A runner came back without his cap and would not ask for tea.
    - Forget this table tonight. Cards, crates, me, all of it. Forgetting is cheaper than funerals.
    - The Kempeitai raided a game in Zhabei. One player still owed me money, which is not the part I mind.
    - Someone asked about my daughter after asking about cargo. That order of questions is never accidental.
    gossip:
    - A merchant on Nanking Road sold silk, papers, and a story too smooth to survive inspection.
    - Green Gang cargo is moving through the French Concession again. Someone paid for quiet streets and louder music.
    - A colonel's wife lost a bracelet at the dance hall. By dawn, three men claimed to have found it.
    - Madam Xu's jasmine arrived early, which means somebody at the docks remembered manners or feared her ledger.
    - A dock boy came home with one new shoe. His mother asked about the missing one before the money.
    farewell:
    - Walk slow. Running draws attention, and attention costs extra after dark.
    - If anyone asks, you lost at cards and left insulted. Try to look poorer.
    - Watch the alley mat on your way out. Wet footprints have betrayed better men than you.
    - Come back with money, information, or bean cakes for the watchman. I rank all three carefully.
    - We were never here. My daughter says that is a poor answer, but it remains useful.
    ask:
      night_cargo:
      - Night cargo moves when the river has swallowed the last ferry bell, and every crate arrives with a second price.
      - Hongkou manifests look respectable until you compare the ink with the rope burns on the men unloading them.
      - I count damp notes twice, because rain excuses a smudged signature but never a missing payment.
      - Papers turn cargo political the moment a uniform decides a customs stamp needs a story behind it.
      - Ask me for a shipment's name, and I will offer you odds instead, since odds do not testify.
      gambling_tables:
      - 'A gambling table is honest about one thing: every man believes his loss belongs to somebody else.'
      - At Huangpu docks, gifts arrive wrapped in laundry because silk makes a poor disguise for nervous hands.
      - Favours pass across felt with the cards, then disappear before the clerk has decided which ledger matters.
      - Nobody records a debt that might acquire a police address before it acquires interest.
      - Keep the tale at its edge, friend, because the middle still owes money to living people.
      debt_and_china:
      - China ought to settle its own accounts, although men in my trade have helped foreigners keep the books crooked.
      - The Green Gang studies appetite, whether it belongs to Japanese officers, officials, or families waiting below stairs.
      - A Kempeitai raid on a gaming room raises the price of silence before anyone even gathers the cards.
      - I will not name another man's debt, because a secret can feed children long after honour has left town.
      - When the Bund looks peaceful, inspect the winner's pockets before you admire the view.
    wanted_nervous:
    - Your face is bad odds tonight. Sit away from the lantern if you insist on breathing my air.
    - Your name has reached the dock before your boat. Keep your hands on the table and your questions shorter.
    - The watchman is counting new shoes tonight. Do not give him a reason to count your footsteps as well.
    - You have brought a poor wager to a room that prefers certain numbers. Wait in the shadow until the dice cool.
    - A wanted face makes every crate look guilty. Stand where the lantern can prove you are only passing through.
    wanted_fear:
    - Not at this table. Wanted men make cards nervous and dock watchers ambitious.
    - The docks are watched from both ends. I can hide a card, but not a person who has made the patrols curious.
    - Leave before the runner returns. He has already lost one cap, and I will not lose a man as well.
    - Your trouble is bad for my daughter's sleep. Take it beyond the warehouse and keep the door closed behind you.
    - I know a quiet alley, but quiet costs more when uniforms are buying information. You cannot afford it tonight.
    wanted_refuse:
    - I cannot move goods or people carrying your kind of attention. Even a crate would complain.
    - No cargo, no cards, and no passage. Your name has made the dock too expensive for a man with my debts.
    - I will not put a wanted face beside my ledger. Numbers survive searches better than people do.
    - Take your business to Madam Xu. Her mirrors are kinder, and my daughter is too young for another raid.
    - You are not a shipment I can deny. Walk away before the watchman decides to inspect the table.
    wanted_help:
    - The dock watch has been taking names with its tally, and gamblers know better than to trust a tally.
    - A warehouse door looks harmless until someone asks why you are standing before it.
    - I can tell you the river traffic is restless tonight. That is not the same as telling you where you may go.
    - A man with a warrant makes a poor stake, friend, because the house always collects before dawn.
    - Keep your cards close, because the docks can spot both bluffs and fools. The docks have eyes for a bluff and hands for a fool.
    wanted_hostile:
    - You are bad cargo, and I do not move cargo that brings soldiers to my daughter's door.
    - Leave my table before I make your name the only wager anyone remembers tonight.
    - I calculate the odds, and they say your company ends with a raid. Take your trouble elsewhere.
    - Do not reach for the cards. I have a knife, a daughter, and no patience for a wanted man.
    - The dock has swallowed better men than you. I will not help it find another meal.
- id: hanna_rosen
  name: Hanna Rosen
  description: A refugee schoolteacher.
  faction: british
  role: merchant
  personality: measured, kind, privately furious
  awareness: 44
  authority: 25
  courage: 38
  perception: 40
  bt_archetype: civilian_vendor
  schedule:
    11: commercial_05
    7: venue_hongkou_refugee_block
    12: venue_hongkou_refugee_house
    17: venue_hongkou_field_hospital
    21: venue_hongkou_refugee_block
  dialogue:
    greeting:
    - Children still ask future-tense questions. That must mean something at least.
    - You are kind to stop. Most people walk past this room as if it were empty.
    - I have a little tea left. It is not much, but it is warm.
    - Ah, a visitor. I was grading papers. They're more honest than most people.
    - You look like someone who wants to learn. Most dangerous thing in Shanghai.
    neutral:
    - I teach what can still be carried.
    - We do not choose the history we survive. We choose only how honestly we tell it.
    - My German is rusty, my English is passable, and my Chinese is survival-level. I am a teacher, not a diplomat. I will say what I need to say and no more.
    - I've seen this before. Berlin, Vienna, Prague. Same uniforms. Same fear.
    - The children ask why soldiers carry guns. I tell them it's because they're afraid.
    friendly:
    - Memory is a form of resistance when power demands erasure.
    - You remind me that not everyone has stopped listening. Thank you for that.
    - I saved you a piece of bread. The baker on Rue Massenet gives refugees the day-old loaves.
    - I keep a library of books the censors would burn. You may borrow any.
    - I teach a poem about freedom. I tell the censors it's about birds.
    hostile:
    - If you bring fear into this room, leave first and apologize elsewhere.
    - I have been searched before, by men less polite than you. Do not expect me to flinch.
    - My papers are in order. I checked them twice this morning, as I do every morning.
    - I fled one regime that burned books. I will not flee another.
    - Knowledge is not a crime. Suppressing it is. I know where that leads.
    afraid:
    - There were soldiers at the school today. They took the attendance list. I do not know why.
    - Someone is asking questions about the families in this building. Lock your door.
    - Keep your voice down. The walls here are thinner than the patience of the men downstairs.
    - The inspectors are coming next week. I've hidden the books but they'll search harder.
    - My students are disappearing. One by one. Parents too afraid to ask where.
    gossip:
    - The Japanese wife who runs the laundry on the corner has not been seen in three days. I hope she is unwell and nothing worse.
    - A French diplomat told my colleague that exit visas might open again in spring. I have stopped believing spring will arrive.
    - Herr Abramowitz played at the cafe last night. Even the soldiers went quiet during the Brahms.
    - One boy copied the word home six times, then crossed out every version except the smallest.
    - The baker on Rue Massenet saves burned loaves for my pupils. He calls them lessons in arithmetic.
    farewell:
    - Be careful going home. The streetlights on Hongkou are broken again.
    - If you hear anything about transit papers, you will tell me. Please.
    - Good night. Tomorrow the children will need me to smile, so I must practice.
    - 'Remember: the pen is mightier than the sword. But only if you use it.'
    - Come back when you have time to read. I have a book for you.
    ask:
      shop_ledger:
      - Before the invasion, a ledger marked seasons and lessons, while now it marks shortages, military yen, and inspections.
      - In the French Concession, one careless total can cost a shopkeeper more than the missing coins themselves.
      - Somebody must still mend coats, sweep floors, count flour, and teach children before Shanghai can call itself living.
      - I watch a hungry buyer's hands, because they often tell the truth before official papers do.
      - Ordinary work continues under caution, which may be the closest thing this city has to defiance.
      students:
      - I will not discuss my pupils in public, since public men have already asked too much of children.
      - Their families divide kindness into small errands and cover lamps before the patrol passes downstairs.
      - Something happened behind a closed door, but names travel farther than truth when frightened people repeat them.
      - Shanghai has taught even schoolchildren where a sentence must leave a careful blank.
      - Another day may permit fuller answers, but today these walls feel eager to repeat every word.
      concession_neutrality:
      - Concession neutrality fills official notices, yet my Chinese pupils learn first which gates will close when uniforms arrive.
      - A foreign passport may buy an afternoon, while a pupil without one watches the same street become forbidden.
      - School registers remember empty desks, though offices prefer figures that never show whose child stopped attending.
      - I teach forbidden poems behind foreign walls, but those walls cannot make a frightened family safe.
      - Shanghai deserves protection measured in children returning home, rather than polite regrets issued after their names disappear.

    - You are asking questions that a merchant would not ask and a policeman should not.
    neutral:
    - Business is business. The war is someone else's concern, at least that is what I tell the tax man.
    - I keep regular hours, pay my taxes, and mind my ledgers. A model citizen.
    - The Bund is busy today. Ships, soldiers, and spies. One of those is my concern.
    - The Party's work continues. Quietly. Patiently.
    - Trust is earned through action, not words.
    farewell:
    - Good day. Return when you have something worth trading. Information or currency, I accept both.
    - Be careful on your way out. The concession police have been watching the building.
    - The revolution is patient. We will prevail.
    - Stay safe. The cause needs you.
    - The revolution is patient. We will prevail.
    gossip:
    - A shipping clerk brought me figures that balanced too neatly. Perfect ledgers usually hide poor men.
    - The Bund office boys now polish shoes before inspections and forget to polish their stories.
    - A German businessman asked about cotton bales without knowing cotton prices.
    - My clerk misfiled a receipt under weather. He has learned faster than I expected.
    - The Peace Hotel meeting ended with two handshakes and one man wiping his palm.
    ask:
      cover_story:
      - Import licenses explain every crate on my floor, which is why I keep them clean enough for a customs clerk.
      - A merchant survives by knowing which buyer needs silk, which needs tea, and which merely wants to be noticed.
      - The Bund rewards a tidy invoice, even when the cargo has changed hands before the ink has dried.
      - I sell ordinary goods because ordinary goods give a man reasons to hear extraordinary conversation.
      - Trade is war by other means, but a sensible trader never says so across a counter.
      intelligence_network:
      - Supply and demand govern information as they govern cotton, and both markets punish careless handling.
      - I judge a report by its paper, its timing, and the silence surrounding the person who brought it.
      - A shipping manifest can name a dozen ports without revealing the one name worth protecting.
      - Men who seek introductions often confuse curiosity with credit, then discover they possess neither.
      - Keep your questions modest, and the city may someday regard you as a tolerable customer.
      chungking_and_shanghai:
      - Chungking remains a customer with a long memory, and Shanghai must settle its account with the occupation.
      - Each occupied street has its price, though no honest ledger can show what Chinese families have paid.
      - I trust disciplined work more than speeches, because speeches cannot pass a checkpoint folded inside an invoice.
      - The Republic needs patience now, the kind that leaves no useful name in another man's pocket.
      - When the balance changes, Shanghai will remember who sold her cheaply and who kept faith.
    rumor:
    - A Japanese naval attachÃ© was seen at the Peace Hotel last night. He met with a German businessman for two hours.
    - The puppet government is reorganizing its police force. New uniforms, new badges, same masters.
    secret:
    - The dead drop is inside a shipment of cotton bales at Warehouse Fourteen on the Bund. The contact removes the message during inventory.
- id: newspaper_editor_mei
  name: Editor Mei, the censor's neighbor
  description: A sharp-eyed woman in her thirties who runs a small Chinese-language newspaper, hiding coded GMD messages between the lines of garden-variety news stories that pass the occupation censors every morning.
  faction: gmd
  role: operative
  personality: resourceful
  awareness: 62
  authority: 30
  courage: 52
  perception: 50
  bt_archetype: underground_operative
  faction_leader: false
  schedule:
    7: venue_commercial_market_street
    12: venue_commercial_market_street
    18: venue_french_cafe_lounge
    22: venue_residential_tenant_block
  dialogue:
    greeting:
    - The morning edition is at the printers. I suggest you read between the lines.
    - Come in. The ink is wet and so are some of my sources.
    - You are early. The censors do not arrive until nine. We have time to talk.
    - The struggle continues. What news do you bring?
    - Speak quickly. Every moment is a risk.
    friendly:
    - Tomorrow's edition carries a coded message on page three. The ad for the silk merchant. Read the third word of every sentence.
    - I buried a contact signal in the wedding announcements. If Chungking reads it, they will know the network is intact.
    - The censor and I have an understanding. He reads what I let him see and I print what he cannot find.
    - You've proven your commitment. The cause remembers.
    - We could use someone with your skills.
    hostile:
    - I have a deadline and a censor who reads every word. I do not have time for you.
    - You want to use my newspaper for your agenda? Buy an advertisement like everyone else.
    - The censor would love to shut me down. Do not give him a reason by association.
    - I have reporters everywhere. They will know if you become a problem.
    - Print what I tell you? I am the editor. I decide what gets printed.
    afraid:
    - The censor has been reading my old issues. Back issues. He is looking for patterns.
    - My assistant did not come to work today. She has never missed a day.
    - Someone is following my reporters home at night. They are being intimidated.
    - The paper supplier cut my credit. Someone leaned on him behind my back.
    - If I am shut down, the network loses its only public channel. I cannot let that happen.
    suspicious:
    - I edit a newspaper. I do not traffic in rumors. Buy a copy or leave.
    - The editorial office is closed to visitors. Submit your letters by post.
    neutral:
    - The news is what the censors allow. The truth is what I print between the lines.
    - Paper shortage again. The occupation controls the supply. They know the power of print.
    - Every morning I decide which truths to tell and which to hide. It is a careful mathematics.
    - The Party's work continues. Quietly. Patiently.
    - Trust is earned through action, not words.
    farewell:
    - Buy tomorrow's paper. You will find what you are looking for on page four.
    - Watch what you say on the street. My reporters are everywhere, and so are theirs.
    - The revolution is patient. We will prevail.
    - Stay safe. The cause needs you.
    - The revolution is patient. We will prevail.
    gossip:
    - The censor praised my gardening column today. It contained three troop movements and one actual chrysanthemum.
    - A typesetter broke the letter for victory, then laughed too loudly at the accident.
    - My assistant left her lunch untouched after reading a police notice. I kept the notice.
    - A rival editor now wears a new hat and no longer prints dock accidents.
    - The paper supplier apologized in advance, which means someone else wrote his refusal.
    ask:
      cover_story:
      - My paper prints market notices, weddings, and weather because censors grow sleepy when they recognise the furniture.
      - A dull headline can carry more weight than a shout, provided the right reader pauses over it.
      - Each morning I give the censor enough harmless ink to keep his red pencil occupied.
      - Reporters learn to ask for a price of rice before asking why the rice cart never arrived.
      - I am just reporting the news, which is often the safest sentence available in Shanghai.
      truth:
      - Truth reaches print only after it has survived a compositor, a censor, and an editor with rent due.
      - Some facts need a plain column, while others travel better beneath a notice about chrysanthemums.
      - The people deserve to know, yet the people also deserve an editor who is still free tomorrow.
      - A red pencil can strike words from a page, but it cannot prevent readers from noticing the blank.
      - Bring me something witnessed, not something polished by fear in a tea shop.
      chungking_and_shanghai:
      - Chungking still speaks for a China the occupation cannot edit out of existence, however heavily it marks the copy.
      - Shanghai has learned that a puppet seal can close a paper, but it cannot settle an argument.
      - I print what can live through the morning, then trust readers to carry the rest in memory.
      - Grand declarations please visitors, while a careful line in small type may help China more.
      - The censor has a heavy hand, but even he cannot revise every mind before breakfast.
    rumor:
    - The censor's assistant has been taking bribes. He passes copy without reading it for fifty yuan a page.
    - A competing newspaper was shut down last week. The editor was arrested. His notes are still missing.
    secret:
    - The code is embedded in the classified advertisements. Look for advertisements selling lotus root. The price is the date. The quantity is the time.
- id: businessman_funder_li
  name: Li Guangan, the merchant prince
  description: A portly silk merchant with a shop on Nanking Road and a hidden safe that funds GMD operations from the French Concession, his ledgers recording donations that the occupation would call treason.
  faction: gmd
  role: funder
  personality: pragmatic
  awareness: 55
  authority: 35
  courage: 48
  perception: 48
  bt_archetype: underground_operative

    - A man in a grey coat has been watching the wharves. Same time as me. He noticed me.
    - The soldiers are checking papers of children now. They never did that before.
    - My friend Xiao Lin was stopped and questioned. He is twelve. What does a twelve-year-old know? But they asked.
    - I saw a photograph at the garrison gate. A sketch of a boy. It looked like me.
    - If they catch me, I will tell them everything. I am not brave. I am just a kid.
    suspicious:
    - I sell newspapers. That is all. Buy one or move along.
    - I do not know anything. I am just a kid.
    neutral:
    - The soldiers do not notice children. That is their mistake and our advantage.
    - I watch, I remember, I report. That is the job.
    - The wharves are busier than usual. Something is being unloaded at night. Big crates. Military.
    - The Party's work continues. Quietly. Patiently.
    - Trust is earned through action, not words.
    farewell:
    - I will be back on the wall tomorrow at dawn. Find me there if you need eyes.
    - Stay off the main roads tonight. Something is happening. I can feel it.
    - The revolution is patient. We will prevail.
    - Stay safe. The cause needs you.
    - The revolution is patient. We will prevail.
    gossip:
    - The melon seed seller lets me sit on his wall because I scare away nobody important.
    - A truck carried medical labels and smelled like gun oil. Even my nose knew the lie.
    - Xiao Lin saw a destroyer crew stay aboard all night. Sailors hate staying aboard.
    - The wharf dog followed the wrong officer today, then came back with sausage.
    - A soldier counted street boys at noon. I counted him counting.
    ask:
      rooftop_watch:
      - From a rooftop, wharves look like toys until a lorry stops and men climb out with rifles.
      - I count trucks by their rattles, because smoke and distance often hide the numbers painted on them.
      - The chimneys near the water give better cover than church towers, but I do not stay anywhere long.
      - A boy can watch a great deal when adults decide he is only looking for pigeons.
      - Do not ask which roof I use, because the next patrol might enjoy that answer too much.
      resistance:
      - Resistance sounds grand until you are carrying a note in one shoe and pretending it is a stone.
      - I work with other boys, but we do not trade names like marbles in the street.
      - The Japanese move crates at the wharves, and I report what I see without inventing heroes.
      - My mother thinks I run errands, which is close enough that I do not correct her.
      - A scout's best trick is arriving home dusty, hungry, and too ordinary for anyone to remember.
      china_and_cells:
      - China needs people who notice the trucks, even when grown men say children should keep their eyes down.
      - Cells use observations carefully, because a report is safer than a boy boasting beside a dumpling stall.
      - If the Kempeitai recognize me, I will need luck, not clever advice from a stranger.
      - Bubbling Well Road has broad pavements, but a small body still finds places to disappear in crowds.
      - I can tell you what the river smells like at dawn, not where anyone should go afterward.
    rumor:
    - A naval destroyer docked at the north pier last night. The crew did not leave the ship. That means they are waiting for something.
    - Three flatbed trucks left the garrison at midnight. I followed them to the warehouse district. They unloaded wooden crates marked medical supplies. They were not medical supplies.
    secret:
    - I leave my reports under the third stone from the left at the base of the old city wall. Someone collects them every evening at dusk.
- id: intelligence_officer_wang

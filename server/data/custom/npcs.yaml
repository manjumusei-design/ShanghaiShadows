    - The Party's work continues. Quietly. Patiently.
    - Trust is earned through action, not words.
    farewell:
    - Visiting hours end at six. Please leave before the night shift arrives.
    - Take care of yourself. The city is sick, but not all of its patients are in beds.
    - The revolution is patient. We will prevail.
    - Stay safe. The cause needs you.
    - The revolution is patient. We will prevail.
    gossip:
    - Bed six muttered troop numbers in fever and asked for his mother in the same breath.
    - The supply closet was audited by a man who counted gauze but not dirty boots.
    - A cleaner found rice paper near sterilization and returned it without meeting my eyes.
    - The French doctor signs charts quickly when the wine is good.
    - A child in Ward Three saluted the wrong patient and made two officers pale.
    ask:
      cover_story:
      - "A nurse's day is easy to describe: temperatures, clean linens, and patients who need sleep more than conversation."
      - The French hospital keeps many registers, and a sensible person reads only the line that concerns their own bed.
      - I carry bandages between wards because wounds do not wait for politics to settle outside the gates.
      - Soldiers often mistake a calm face for an empty mind, which lets ordinary work continue without argument.
      - If anyone asks, I have spent the day changing dressings and hoping the pharmacy receives more quinine.
      patients:
      - Patients bring pain first, then explanations, and I have learned that the two rarely arrive in the same order.
      - Ward Three smells of carbolic and boiled rice, a smell that clings even after the last visitor leaves.
      - I remember faces at the bedside because a frightened face needs gentleness before it needs a question.
      - A clean bandage does not ask which uniform caused the wound, and neither do I while treatment lasts.
      - Rest matters in a hospital, so keep your voice low and let the sick keep what little strength remains.
      chungking_and_shanghai:
      - Chungking is far from these wards, yet every patient who survives leaves one less victory for the occupation.
      - Shanghai needs medicine as much as slogans, because fever and shrapnel make no distinction between loyalties.
      - I support the GMD where I can, but my oath begins with the person bleeding on the table.
      - A searched hospital grows quiet for days afterward, so courage must sometimes wear a white uniform and say nothing.
      - China will need healthy hands when this war ends, which is reason enough to keep working through the night.
    rumor:
    - A Japanese colonel was admitted under a false name last week. Gunshot wound to the shoulder. He claimed it was a hunting accident. There are no hunting grounds in Shanghai.
    - The hospital pharmacy is missing morphine again. Either someone is stealing it or someone is using it for purposes other than pain relief.
    secret:
    - The intelligence is written on rice paper, rolled inside the hollow tube of a thermometers. I leave them in the bin marked for sterilization. The contact picks them up during the afternoon shift change.
- id: dock_observer_wu
  name: Wu the dock watcher
  description: An elderly dockhand who has worked the Whangpoo for thirty years and now spends his days perched on a bollard, cataloguing every Japanese vessel that enters and leaves the harbor with a deckhand's eye and a spy's discipline.
  faction: gmd
  role: scout
  personality: stoic
  awareness: 65
  authority: 22
  courage: 48
  perception: 58
  bt_archetype: underground_operative
  faction_leader: false
  schedule:
    5: venue_bund_river_promenade
    12: warehouse_district
    18: venue_bund_river_promenade
    22: venue_residential_tenant_block
  dialogue:
    greeting:
    - I have been watching this river since before the first Japanese ship sailed up it.
    - Two destroyers and a transport entered the harbor this morning. I noted the drafts and the flags.
    - Sit down. The bollard is cold but the view is excellent and so is my memory.
    - The struggle continues. What news do you bring?
    - Speak quickly. Every moment is a risk.
    friendly:
    - The convoy schedule is in my head. Three transports every Tuesday, resupply on Fridays. I can tell you when every ship will be vulnerable.
    - I saw a submarine surface at the river mouth last night. Japanese. It submerged before dawn. No one else noticed.
    - The contact picks up my reports every Thursday. They go to Chungking inside a crate of dried fish.
    - You've proven your commitment. The cause remembers.
    - We could use someone with your skills.
    hostile:
    - I am an old man watching the river. Leave me to my peace.
    - You are making me visible. I cannot be visible. Go away.
    - The soldiers notice people who talk to me. You want them to notice us both?
    - I do not know you. I do not want to know you. Let me be.
    - You are too loud. Too interested. A man my age does not have interesting friends.
    afraid:
    - The harbor master looked at me funny yesterday. He never looks at me twice.
    - A man in civilian clothes has been asking about the old dockhands. Who remembers what.
    - The Kempeitai searched the pier offices last night. Looking for something. Looking for someone.
    - My eyes are not what they were. If I miss a ship, the reports are useless.
    - They are replacing the old dockworkers. Sending us home. Cutting off my view of the river.
    suspicious:
    - I am an old man who watches the river. There is no crime in that.
    - Ships come, ships go. I have nothing to say about it.
    neutral:
    - The Whangpoo is a highway for the occupation. Every ship carries soldiers, weapons, or both.
    - I know every vessel on this river by its silhouette. I can identify them at night by the sound of their engines.
    - Thirty years on the docks. I have seen flags change. The river stays the same.
    - The Party's work continues. Quietly. Patiently.
    - Trust is earned through action, not words.
    farewell:
    - Come back at dawn. That is when the military ships move.
    - Watch the tide tables. They tell you more than the newspapers.
    - The revolution is patient. We will prevail.
    - Stay safe. The cause needs you.
    - The revolution is patient. We will prevail.
    gossip:
    - A deckhand painted over a ship name before sunrise and forgot the reflection in the water.
    - The harbor master now walks with a man who never looks at ships.
    - A gull dropped fish on an officer's cap. The wharf showed admirable discipline.
    - Three flatbeds rode low under medical labels and made the pier boards complain.
    - The old dockhands are being replaced by young men with clean hands and no stories.
    ask:
      rooftop_watch:
      - A high roof shows the river bends, but a bollard gives a better measure of hulls passing close.
      - I watch smoke, wake, and draft, since painted names lie more readily than a ship's tired engine.
      - Young fellows look upward for answers, while old hands learn plenty from a rope pulled hard against iron.
      - The harbor changes its face at dawn, when military vessels move before the market boats claim the channel.
      - Loose tiles make the high roofs treacherous, and curious sentries notice any silhouette above the sheds.
      memory:
      - Thirty years of tides leaves marks in a man's head, even when strangers mistake his silence for failing senses.
      - I recall a vessel by its funnel, its engine knock, and the way its crew throws a line.
      - The river keeps no ledger, but an old dockhand does, and mine has fewer mistakes than the harbor office.
      - Names fade if you chase them too hard, whereas a black hull at sunrise stays where you put it.
      - Let boys laugh at an old man muttering, for laughter often keeps better watch than suspicion.
      chungking_and_shanghai:
      - Chungking needs the truth about the harbor, and the Whangpoo sends that truth past my eyes each morning.
      - Shanghai cannot breathe freely while armed transports own the river, though water remembers no conqueror for long.
      - The GMD may need my recollection, but I am only an old worker watching ships earn their meals.
      - A report begins with what a man sees, then ends before pride adds a single unnecessary word.
      - When China's flag returns to these piers, I hope the young dockhands will know why the old ones waited.
    rumor:
    - A Japanese ammunition ship docked at Pier Eleven last night. Armed guards, no manifest posted. It will unload under cover of darkness.
    - The harbor master was replaced last week. The new one is a Kempeitai appointee. He keeps different hours than his predecessor.
    secret:
    - I write my reports in waterproof ink on the inside of cigarette papers. I fold them into the bottom of a tea tin and leave it under the third bollard from the north end of the pier. The contact swaps it for an identical tin.
- id: nightclub_singer_mei

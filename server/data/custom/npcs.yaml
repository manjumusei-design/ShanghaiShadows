    9: venue_commercial_market_street
    13: venue_bund_river_promenade
    18: venue_french_cafe_lounge
    22: venue_residential_tenant_block
  dialogue:
    greeting:
    - Welcome to my shop. The silk is genuine and so is the tea. What else can I offer?
    - A businessman has many friends. Some of them are even real.
    - You have the look of someone who appreciates quality. In silk and in conversation.
    - The struggle continues. What news do you bring?
    - Speak quickly. Every moment is a risk.
    friendly:
    - The funds for the next operation are in the usual place. Do not count it here.
    - I have arranged a shipment through the south port. Hidden inside bolts of fabric. The manifest will say cotton.
    - My grandfather built this business. I intend to use it to build something that outlasts the occupation.
    - You've proven your commitment. The cause remembers.
    - We could use someone with your skills.
    hostile:
    - You are a liability I cannot afford. Remove yourself from my premises.
    - I have investors who would be very unhappy to hear you are interfering with my business.
    - You mistake my courtesy for weakness. A man does not build a fortune by being weak.
    - I have dealt with men far more dangerous than you. They are no longer in Shanghai.
    - You are asking questions that a merchant would not ask and a policeman should not.
    afraid:
    - If the Kempeitai audit my ledgers, everything falls apart. Please. You cannot be seen here.
    - My family is in danger if my dealings are exposed. I beg you, be more careful.
    - Someone is watching my shop. I cannot tell if they work for the occupation or for us.
    - The last man who came asking questions was arrested the next day. They are closing in.
    - I have children. Please. If they take me, my children starve.
    suspicious:
    - I deal in silk, not secrets. The fabric counter is to your left.
    - I am a simple merchant. You should direct your questions to the authorities.
    neutral:
    - Silk prices are up again. The occupation controls the roads and the roads control the trade.
    - I pay my taxes, I smile at the soldiers, and I count my inventory twice a day. An honest life.
    - Business and politics do not mix. At least that is what I tell the tax inspector.
    - The Party's work continues. Quietly. Patiently.
    - Trust is earned through action, not words.
    farewell:
    - Come back when you need something finer. In fabric or otherwise.
    - Walk safely. And do not carry anything through the checkpoint that you cannot explain.
    - The revolution is patient. We will prevail.
    - Stay safe. The cause needs you.
    - The revolution is patient. We will prevail.
    gossip:
    - A silk bolt came back from inspection with one fold warmer than the rest.
    - A customer asked for imperial yellow and paid with hands that had counted ammunition.
    - My cashier found rice grains in the safe. Someone searched with rural manners.
    - The Nanking Road audit begins with merchants too poor to protest.
    - A child touched the best silk and apologized to it before his mother could scold him.
    ask:
      hidden_ledger:
      - A proper ledger records silk, freight, and credit, while a foolish ledger records more than its owner can defend.
      - I count every jiao twice before closing, because errors attract inspectors faster than large profits do.
      - Nanking Road teaches arithmetic with soldiers at the doors and hungry customers at the counter.
      - Money is the sinew of war, which is why I prefer it to remain quietly folded.
      - Ask about my accounts as you would inspect silk, with clean hands and no sharp nails.
      gmd_cause:
      - Freedom is an investment, and I have seen too many men spend their courage on cheap display.
      - My family understands that a merchant must keep some purses closed, even when China needs coin.
      - The Republic requires more than brave boys with empty stomachs and promises written on scraps.
      - I invest in the future because surrender offers a poor return to anyone with children.
      - Do not mistake a full shop for comfort, for every shutter in Shanghai has its private reckoning.
      chungking_and_shanghai:
      - Chungking asks Shanghai to endure, and merchants understand endurance better than men who live on applause.
      - An occupied city cannot flourish, though its shop windows may still shine for foreign officers.
      - I watch the exchange rate and the street prices, both measures of what occupation steals.
      - China will need capital when the accounts are opened, not merely flags waved above empty warehouses.
      - Until then, I keep faith in small sums, careful hands, and debts remembered.
    rumor:
    - The Kempeitai are auditing all businesses on Nanking Road this month. Someone tipped them off about a hidden safe.
    - A merchant on Bubbling Well Road was arrested for currency speculation. The real reason was something else entirely.
    secret:
    - The funds are hidden inside a bolt of imperial yellow silk in the back storeroom. Third shelf from the left. The silk is genuine Ming dynasty. The money is worth more.
- id: former_soldier_zhang
  name: Zhang the ex-soldier
  description: A discharged Nationalist infantryman who limps slightly from a wound received at Sihang Warehouse and now hides in the French Concession, his military skills undiminished by civilian clothes.
  faction: gmd
  role: fighter
  personality: stoic
  awareness: 60
  authority: 28
  courage: 65
  perception: 52
  bt_archetype: underground_operative
  faction_leader: false
  schedule:
    7: venue_residential_tenant_block
    12: venue_french_cafe_lounge
    18: warehouse_district
    22: venue_residential_tenant_block
  dialogue:
    greeting:
    - Stand straight. I can tell a civilian by the way they carry their shoulders.
    - The leg is fine. It only hurts when the weather changes or when I remember.
    - You want something. Military men can always tell when someone wants something.
    - The struggle continues. What news do you bring?
    - Speak quickly. Every moment is a risk.
    friendly:
    - I held the warehouse for four days with three hundred men. I can hold a secret longer than that.
    - The weapons cache in the basement is inventoried. Twelve rifles, six handguns, two hundred rounds. Ready for the order.
    - Chiang's order was to retreat. I followed it. But I never agreed with it. Now I am here, waiting for a different order.
    - You've proven your commitment. The cause remembers.
    - We could use someone with your skills.
    hostile:
    - I have killed men with less cause than you are giving me. Walk away.
    - My leg hurts and my patience is shorter than my temper. Test neither.
    - You are not a soldier. Do not pretend to understand what we are doing.
    - I did not survive Sihang Warehouse to be questioned by a civilian.
    - The last man who pressed me had to be carried out. Leave under your own power.
    afraid:
    - They are rounding up former Nationalists. My neighbor was taken last week.
    - I cannot stay in my room anymore. Too many questions from the landlord.
    - The pain in my leg gets worse. If I cannot move, I am useless. A liability.
    - I have been dreaming about the warehouse again. The smoke. The screams. I am not right.
    - Someone reported me. I do not know who. They know I was a soldier.
    suspicious:
    - I am a shop assistant. Nothing more. You have the wrong man.
    - I do not talk about the war. Especially not to strangers.
    neutral:
    - The 88th Division was the finest in China. What remains of it is scattered, hiding, or dead.
    - I peel potatoes now instead of firing rifles. The uniform is gone but the discipline is not.
    - A soldier remembers faces. I remember yours. Whether that is good or bad depends on what you do next.
    - The Party's work continues. Quietly. Patiently.
    - Trust is earned through action, not words.
    farewell:
    - Go. And if you hear gunfire, do not run toward it. Civilians never learn that lesson.
    - If Chungking sends the word, I will be ready. Until then, I sell vegetables and wait.
    - The revolution is patient. We will prevail.
    - Stay safe. The cause needs you.
    - The revolution is patient. We will prevail.
    gossip:
    - A boy asked about Sihang Warehouse today and saluted with the wrong hand.
    - My old boot split at the heel. The leg remembered before the leather did.
    - A puppet recruiter offered rice near the market and counted hungry eyes like rifles.
    - Someone cleaned a rifle badly in the warehouse. Oil on the wrong rag tells stories.
    - The landlord now asks about my limp as if weather reports interest him.
    ask:
      old_wounds:
      - The leg stiffens before rain, and sometimes before a boot strikes stone outside the lodging house.
      - Sihang left me with a scar that speaks louder than any medal the Republic failed to send.
      - A wound heals crooked when a man must march before the flesh has decided to close.
      - I have done my part, though my body still reports for duty every cold morning.
      - Do not ask a soldier to unwrap old bandages merely because the room has grown quiet.
      comrades:
      - Comrades are easier to count on a roll call than to find after retreat has scattered them.
      - I remember boots, voices, and the man who shared his last cigarette beneath the warehouse stairs.
      - Some survivors sell vegetables now, some wear puppet uniforms, and some have no address at all.
      - The war is not over because a rifle was taken from my hands and a price tag given instead.
      - If you meet an old soldier, offer him tea before you ask which side he kept.
      chungking_and_shanghai:
      - Chungking ordered retreat, and I obeyed because soldiers obey even when the order tastes bitter.
      - Shanghai remembers the battle in its walls, though the occupiers prefer the city to forget.
      - The Republic is wounded, not buried, and wounded men learn which friends remain nearby.
      - I do not need speeches about China from anyone who never smelled Sihang's smoke.
      - When the call comes, my limp will answer after the rest of me has already moved.
    rumor:
    - A group of former Nationalist soldiers are hiding in the warehouse district. They are armed but disorganized. They need leadership.
    - The puppet army is recruiting. They offer rice and a uniform. Some men are desperate enough to accept.
    secret:
    - There is a map of the garrison defenses hidden inside the lining of my old greatcoat. It hangs in the wardrobe behind the spare blanket.
- id: consulate_secretary_zhao
  name: Zhao Weiming, the secretary
  description: A bespectacled young Chinese clerk at the French Consulate who copies sensitive documents during his lunch break and passes them to GMD contacts through a bookshop on Avenue Joffre.
  faction: gmd
  role: operative
  personality: cautious
  awareness: 58
  authority: 25
  courage: 50
  perception: 50
  bt_archetype: underground_operative
  faction_leader: false
  schedule:
    8: venue_bund_river_promenade
    13: venue_french_cafe_lounge
    18: venue_french_cafe_lounge
    22: venue_residential_tenant_block
  dialogue:
    greeting:
    - The consulate is open for business. My business happens to be different from what is on the door.
    - Bonjour. You look like you have reasons to be here that do not involve visas.
    - The filing cabinets are organized by letter. The interesting files are not organized at all.
    - According to regulation, I should ask you to make an appointment. I'm flexible.
    - I process visas and stamp forms. Boring work. That's the point.
    friendly:
    - I copied the transit schedule for the Japanese resupply convoy. It is tucked inside a novel at the bookshop on Rue Massenet.
    - The consul is meeting with the Japanese liaison on Thursday. I will ensure the minutes find their way to the right eyes.
    - I have access to diplomatic pouches. Small items can travel without inspection. Think about what that means.
    - I have a stack of blank transit visas. For friends who travel urgently.
    - The consul's away Thursday afternoons. That's when I process special requests.
    hostile:
    - Consular employees are not to be harassed. The French authorities take that very seriously.
    - You are jeopardizing months of careful work. Leave now and forget you came here.
    - I have diplomatic protection. You have nothing. Consider your position carefully.
    - This conversation is over. The consul will hear about any further inquiries.
    - My work requires discretion. Yours requires absence. We are incompatible.
    afraid:
    - The consul's secretary has been asking about my after-hours activities. She suspects something.
    - A Kempeitai officer came to the consulate asking about Chinese staff. He looked at me too long.
    - If they search my desk, they will find copies I should not have made. I need more time.
    - I am being followed. A grey car. Same one, three days now.
    - The safe in my office is no longer safe. Someone tried the combination last night.
    suspicious:
    - I am a filing clerk. I stamp documents and organize archives. That is all.
    - The consulate does not discuss its internal affairs with visitors.
    neutral:
    - The French are neutral on paper. In practice, they are exhausted and understaffed. That works in our favor.
    - I file papers eight hours a day. The interesting papers I file twice, once in the cabinet and once in my memory.
    - Diplomatic immunity is a useful shield. It does not stop a bullet, but it stops most questions.
    - Bureaucracy is perfect cover. Nobody questions a man with the right forms.
    - I stamp documents. Some real. Some not. I don't distinguish on record.
    farewell:
    - Return to the consulate during office hours. We have never met outside them.
    - Be careful with what you carry. The concession police are watching more closely these days.
    - I'll process your request. Takes time. Everything takes time in wartime.
    - If you need to leave Shanghai suddenly, come see me.
    - The revolution is patient. We will prevail.
    gossip:
    - The consul dictated a protest note and removed every verb with a spine.
    - A Japanese visitor admired our filing system, then asked which drawer held Chinese staff records.
    - The ventilation grille carried cognac breath and names after midnight.
    - A visa applicant brought lilies to the counter. The clerk stamped slower out of embarrassment.
    - Someone tried the office safe and left the handle cleaner than the rest.
    ask:
      cover_story:
      - I stamp visas, file petitions, and apologise in French, which makes most visitors believe the work ends there.
      - According to regulation, every application requires a date, a seal, and a reason that survives inspection.
      - A clerk who keeps his folders square can pass unnoticed through an office full of curious men.
      - The forms must be correct, even when the city outside them has stopped making any sense.
      - My lunch break belongs to books, carbon paper, and no conversation worth repeating.
      french_concession:
      - The French Concession calls itself neutral, which is a useful word when everyone prefers somebody else to decide.
      - Its police admire stamps and jurisdiction, while Chinese clerks learn which questions arrive without either.
      - Avenue Joffre looks civilised at noon, yet every queue watches the uniforms passing the corner.
      - A consular seal can delay trouble, but it cannot make trouble forget a Chinese name.
      - I keep my papers orderly because disorder gives strangers an excuse to read them closely.
      chungking_and_shanghai:
      - Chungking is far away, but official paper travels through Shanghai faster than many armed men.
      - The occupation trusts seals because seals look permanent, which is their most convenient mistake.
      - I copy what passes my desk and remember that a single page can embarrass powerful people.
      - China needs patient clerks as well as soldiers, because wars leave behind mountains of paperwork.
      - I will process that request when the proper form exists, and not a moment sooner.
    rumor:
    - The consul keeps a private safe in his office. The combination changes weekly, but I see him enter it from my desk.
    - A Japanese diplomat has been visiting the consulate after hours. They drink cognac and speak French. I listen through the ventilation.
    secret:
    - The documents go out inside hollowed-out books. I buy used novels from the shop on Avenue Joffre and return them the next day, heavier than when they left.
- id: weapons_smuggler_sun

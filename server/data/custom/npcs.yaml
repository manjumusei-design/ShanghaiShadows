    '1': North Gate Checkpoint
    '2': Shanghai University
    '3': Japanese Bathhouse Lane
    '4': Hongkou Ruins
    '5': Kempeitai Headquarters
    '7': Dōbun Shoin Academy Gate
  special_descriptions:
    '1': Barbed wire and sandbags frame the entrance to Hongkou, where Japanese soldiers check papers with practiced disdain.
      Refugees queue in the shadow of a watchtower, clutching documents that may or may not save them. The air smells of diesel
      fumes and the anxiety of hundreds of people waiting for permission to pass.
    '3': Steam rises from the bathhouse vents, carrying the scent of sulfur and cedar into the narrow lane. Japanese residents
      shuffle past in wooden geta, towels draped over their shoulders, heads bowed against the cold. The bathhouse keeper
      knows everyone's name and pretends not to notice the late-night visitors who use his establishment's back entrance.
    '5': A reinforced building commands the intersection, its windows sandbagged and its entrance guarded by military police.
      Inside, interrogators work through the night, their methods known throughout the city. The Kempeitai Headquarters is
      not a place one visits voluntarily, and those who enter rarely leave unchanged.
    '7': The gate of the Dōbun Shoin Academy stands as a cultural bridge between Japan and China, its architecture blending
      both traditions. Students in uniforms pass through with books tucked under their arms, studying the language of their
      occupiers. The campus grounds contain secrets that go beyond the curriculum, intelligence operations conducted under
      the cover of education.
  special_detailed_descriptions:
    '1': North Gate Checkpoint is the throat of Hongkou, a bottleneck where the occupation asserts its authority over every
      soul that passes. Japanese soldiers man the barrier with the particular boredom of men who have done this a thousand
      times, their rifles slung but their eyes sharp. The queue stretches fifty metres on busy days, refugees and workers
      alike submitting to the ritual of document inspection, bowing, and the wait for a dismissive wave. A photograph on the
      guardhouse wall shows the Emperor, his gaze as indifferent as the soldiers'. The checkpoint closes at curfew, and anyone
      caught on the wrong side sleeps in the gutter or worse.
    '3': Japanese Bathhouse Lane runs behind a row of commercial buildings, its cobblestones slick with steam and spilled
      water. The bathhouse itself is a two-storey wooden structure built in the Japanese style, its chimney puffing coal smoke
      from dawn until midnight. Inside, men soak in deep wooden tubs, discussing business in murmured Japanese while the bathhouse
      attendant refills sake cups. The back door opens onto an alley that connects to the resistance's secret routes, a fact
      the bathhouse keeper knows but never speaks of.
    '5': The Kempeitai Headquarters occupies a former bank building, its marble lobby now stripped of elegance and furnished
      with steel desks and filing cabinets. The cells in the basement are never empty, and the sounds that rise through the
      ventilation system are not meant for civilian ears. Interrogators work in shifts, employing techniques refined in Manchuria
      and tested on Chinese prisoners. The building's roof bears a radio antenna that intercepts transmissions across the
      city, and the staff includes Japanese linguists who specialize in Shanghai dialects.
    '7': The Dōbun Shoin Academy occupies a campus of low modern buildings behind a traditional Japanese gate. By day, the
      classrooms teach economics, language, and cultural studies to students from both China and Japan. By night, certain
      offices host longer meetings, where officers in civilian clothes discuss matters far beyond the academy's stated mission.
      The library contains a collection of maps and regional studies that would be of great interest to the Chinese resistance,
      if anyone could get past the locked stacks.

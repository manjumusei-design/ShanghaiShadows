    - A new patrol boat on the river. Checks every vessel. I cannot move anything for now.
    - My contact on the night shift was transferred. The new man cannot be bribed.
    - Someone tipped off the Kempeitai about a weapons shipment. They were waiting. I barely got out.
    - If my network is rolled up, the GMD loses its only arms supply into the city.
    suspicious:
    - I unload cargo. Standard freight. If you want something else, find someone else.
    - The dockmaster handles the manifests. I just carry the boxes.
    neutral:
    - The docks never sleep. Neither do the patrols. I work in the gap between one and the other.
    - A crate is a crate. What is inside is between the shipper and the receiver.
    - I have been loading and unloading ships for fifteen years. The flags change, the cargo stays the same.
    - The Party's work continues. Quietly. Patiently.
    - Trust is earned through action, not words.
    farewell:
    - Come back after dark. The night shift is more accommodating.
    - Watch your step on the pier. The boards are loose and so are some of the men.
    - The revolution is patient. We will prevail.
    - Stay safe. The cause needs you.
    - The revolution is patient. We will prevail.
    gossip:
    - A crate of pickled vegetables clinked today. The inspector praised the recipe.
    - The new customs man refused a bribe and then asked where honest men buy lunch.
    - Dock water reached the cellar steps, which means the rifles need oil before courage.
    - A porter dropped ammunition and cursed like a man who knows its price.
    - The manifest clerk now writes medical supplies with a slower hand.
    ask:
      night_cargo:
      - After dark, the cranes groan louder than men, which suits cargo that should pass the pier without a second look.
      - A sound crate rides low and keeps its balance, while a foolish porter advertises trouble with every hurried step.
      - The night gang knows which ropes bite wet hands, though nobody needs to explain why certain loads travel quietly.
      - Customs watches papers at the gate, but a dockhand watches the water and learns which boats fear a spotlight.
      - Ask about freight if you must, yet leave the sealed wood to the people who signed for it.
      profit:
      - Profit is what remains after dock fees, broken hooks, hungry crews, and a customs man have all taken turns.
      - Fabi disappears fast near the wharves, especially when rain delays a vessel and every idle hand wants rice.
      - A buyer who counts coins twice usually counts promises the same way, so I charge him for the delay.
      - Honest cargo pays little, but it lets a man sleep until the next whistle, which has its own price.
      - The docks have their own rules, and every rule begins with knowing who bears the loss.
      chungking_and_shanghai:
      - Chungking may read the river on a map, while we read it in tides, patrol launches, and empty berths.
      - Shanghai belongs to China, though foreign flags still crowd the water and make every landing a calculation.
      - Grand speeches do not unload a single crate, so I trust the worker who arrives before the tide turns.
      - The GMD needs steel and patience alike, yet neither should be named across an open pier.
      - When the river runs free again, perhaps men will ask less about flags and more about wages.
    rumor:
    - The Japanese are storing ammunition in Warehouse Seventeen. I saw the manifest. Three tons of artillery shells.
    - A new customs inspector starts next week. Rumor says he is honest. That will be a problem.
    secret:
    - The weapons are stored in a flooded cellar beneath Pier Six. The water keeps the crates cool and the guards away. Retrieve them at low tide through the iron grate on the south side.
- id: radio_operator_gao
  name: Gao the radio man
  description: A thin man with nervous fingers who maintains a hidden wireless set in the attic of a boarding house, transmitting encoded messages to Chungking every night while the city sleeps below.
  faction: gmd
  role: operator
  personality: nervous
  awareness: 55
  authority: 25
  courage: 52
  perception: 48
  bt_archetype: underground_operative
  faction_leader: false
  schedule:

  dialogue:
    greeting:
    - The ward is quiet today. Quiet wards mean fewer questions.
    - You look well enough to walk. That means you are here for something other than medicine.
    - The hospital treats everyone. Some patients are more interesting than others.
    - The struggle continues. What news do you bring?
    - Speak quickly. Every moment is a risk.
    friendly:
    - The Japanese officer in bed six talks in his sleep. Last night he mentioned troop positions near Suzhou.
    - I placed the intelligence inside a roll of gauze in the supply closet. Ward Three, second shelf.
    - The military doctor leaves his briefcase unlocked during surgery. I have ten minutes to copy whatever is inside.
    - You've proven your commitment. The cause remembers.
    - We could use someone with your skills.
    hostile:

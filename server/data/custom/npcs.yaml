  special_names:
    '1': French Concession Safe House
    '2': Nationalist Safe House
    '3': Avenue Joffre Market
    '5': Cercle Sportif Français
    '7': Rue du Consulat Gardens
  special_descriptions:
    '3': The Avenue Joffre Market spills across the pavement with stalls of fresh bread, cheese, and silk scarves. White Russian
      women bargain with Chinese vendors in a mix of languages that defines the Concession. The market's ironwork arches are
      hung with strings of garlic and sausages, oblivious to the war.
    '5': The Cercle Sportif Français stands behind wrought-iron gates, its tennis courts and swimming pool reserved for the
      European elite. Refugees press their faces against the railings, watching children splash in the pool. The clubhouse
      bar serves cocktails to men who pretend the occupation is a temporary inconvenience.
    '7': The Rue du Consulat Gardens offer a pocket of Parisian elegance in wartime Shanghai. Plane trees line the gravel
      paths where nannies push prams and old men play pétanque. The gardens smell of damp earth and jasmine, a fragile peace
      maintained by French neutrality.
  special_detailed_descriptions:
    '3': Avenue Joffre Market is the belly of the French Concession, a covered market where the city's culinary traditions
      collide. Stalls overflow with baguettes and bok choy, wheels of brie and jars of pickled turnips, the bounty of two
      continents laid out under a single roof. The butchers speak Shanghainese, the fishmongers speak French, and everyone
      understands the language of the black market that operates beneath the legitimate trade. Japanese officers' wives shop
      here for provisions their servants cannot find elsewhere, their presence a reminder that even French soil is not truly
      neutral.
    '5': The Cercle Sportif Français occupies a sprawling compound of tennis courts, a swimming pool, and a clubhouse that
      has seen better decades. Its members, mostly European expatriates and wealthy Chinese who have purchased the right connections,
      gather for gin and tonics on the veranda as though the world beyond the gates does not exist. The basement locker room
      contains a safe where members store valuables, and a smaller compartment behind the boiler where documents are passed
      between hands that never meet. The swimming pool is drained in winter, its empty basin a perfect meeting space for those
      who know how to access it.
    '7': Rue du Consulat Gardens stretch along the street that houses the French, British, and American consulates, a ribbon
      of green in the urban grey. The gardens were designed by a French landscape architect who imported plane trees from
      Provence, their bark peeling in the Shanghai humidity. Children play beneath the watchful eyes of amahs while their
      parents discuss politics on park benches in voices that carry no further than the next bench. The consulate staff use
      the gardens as neutral ground for meetings that cannot occur inside official buildings, strolling the paths with papers
      folded into newspapers.

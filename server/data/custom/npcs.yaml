      - In Hongkou, one wrongly marked box can cost a family supper when the wrong official notices.
      - Someone must carry flour, mend blankets, wash bowls, and count children before the city can breathe.
      - I watch volunteers carefully, because hunger reveals a person's habits long before an official ledger does.
      - Charity continues through cautious hands, and each filled bowl keeps one household from breaking tonight.
      community_work:
      - Community work starts with a fevered child, an empty pantry, or a widow who cannot face the relief queue.
      - I carry bandages and rice through Nanking Road, where ordinary errands prevent neighbours from being singled out.
      - A relief list records needs, not private histories, because hunger should not become evidence against a family.
      - We share work through trusted hands, then burn scraps that could turn kindness into a charge.
      - Help begins with what can be carried today, while the rest belongs to those living the emergency.
      china_and_cells:

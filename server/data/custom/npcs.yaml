  description_templates:
  - River mist drifts around bollards and broken reflections while clerks hurry by with their collars turned up against the Huangpu wind.
  - The embankment smells of coal smoke and wet rope, and every footstep seems to carry farther than it should.
  - Cranes and gunmetal hulls across the water hold the dawn in a hard silence while porters count cargo under their breath.
  - Foreign stone facades glow weakly through the haze, pretending the century has not been split open by flags and requisition notices.
  - Rickshaw wheels hiss over damp paving while watchful soldiers make the promenade feel narrower than its broad stones suggest.

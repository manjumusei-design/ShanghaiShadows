  special_names:
    '1': Nanking Road Checkpoint
    '2': Tea House
    '3': Back Alley
    '4': Market Street
    '5': Abandoned Warehouse
    '6': Kempeitai Outpost
    '7': Rooftop Escape
    '8': Harbour Dock
    '9': Safehouse Cellar
    '10': The Bund, Dawn
  special_descriptions:
    '1': "Arc lamps cast flat white circles across the damp concrete. Refugees wait between rope barriers with passbooks held against their coats, advancing whenever a guard motions from the table. Uncle Liu stands beneath the lamps with two stacks of documents at his elbow. He checks each photograph, turns the page toward the stamp clerk, and calls the next name without raising his voice. West, the road returns to the Bund. At the eastern side of the barrier, a narrow lane runs between shuttered offices toward the weather instruments on the next roof."
    '10': "The cellar passage opens onto the stone esplanade beside the Whangpoo. Mist lies low over the water, softening the cranes and masts beyond the quay. Sampans knock against the pilings below, their mooring ropes creaking with each wash from the river. Porters wheel handcarts between stacked bales while clerks queue beneath occupation flags with passbooks held ready. East, weak arc lamps burn above the striped barrier of the Nanking Road checkpoint. A tram bell sounds inland, followed by the scrape of a truck changing gear."
    '2': "Oil lamps burn low along the counter, and steam from the clay pots drifts through their light in slow coils. Mrs. Lin's hands set the day's baozi in rows on the tray, never hurrying, never stopping. The street front stands open to the lane, and wet wool and scorched soy drift in with the passers-by. Low voices come from the benches along the walls, talk kept at the level of resting, cups steaming on the boards between the talkers. At the far end of the room the eastern door is held shut by a soldier, and the lamplight stops short of that corner. A customer pays, takes his baozi wrapped in paper, and the coins ring on the counter. Mrs. Lin counts them into the drawer without looking up from the tray."
    '3': "The lane narrows between damp walls. Laundry hangs overhead, dripping onto the wet stones, while delivery carts stand beneath sacking along one side. Boiled cabbage and coal smoke drift from a doorway without a door. Comrade Chen waits in the angle of the far wall, where the light thins. Beside him, one brick sits slightly forward of its neighbours, its mortar worn away. Voices from the tea house carry faintly through the western door. Beyond the eastern gate comes the distant clatter of the market."
    '4': "Scales clatter beneath the patched awnings, and fish shine on wet boards under oil lamps. Sawdust has gone dark beneath the day's feet. Vendors call out rice by the jin, salted fish by the string, and cloth by the arm's length. At the next stall, a woman makes the rice seller weigh her sack a second time before she pays. Old Gao's stall stands midway down the row. A wooden club hangs above the counter, its grip polished by use. Beside it, a padded quilted jacket droops from a peg, one shoulder restitched with darker thread. Gao keeps a brass scale at his elbow and wipes the pan clean between customers. The western gate opens toward the alley. Handcarts crowd the southern lane toward the warehouse."
    '5': "Boot prints cross and recross the floor, rat tracks thread the dust along the walls, and one clean path runs from the doorway to the crates and back. Grey daylight lies in long pale slabs across the concrete, and a single lamp holds the dust suspended in its light. The air carries the smell of old wood. A Kempeitai soldier stands by the crates, rifle resting against his shoulder, watching the south end of the hall, his breath showing in small white plumes. The rusted iron safe sits behind the stack, half out of shadow, its door scarred, its hinges red with rust. The crates around it stand older than the safe, their wood gone grey, the iron strapping rusted to the staves. The market's noise reaches the north opening as a low murmur, thin through the crates. Light finds the safe's door."
    '6': "The officer's hands lie on the open ledger, and the pen keeps its pace when the door admits you. The desk is neat in the way occupied things are neat: papers squared to their edges, the rubber stamp at the corner, the pen tray aligned with the blotter. Ink and boot polish sit in the air with the cold tobacco of a cigarette smoked down to the stub. His pen moves, stops, moves again, and the day's names pass under his hand. Fang Jie waits in the shadow of a filing cabinet near the western stairwell, her stillness as practised as the officer's pen. The corridor beyond her runs into the building's quiet. The desk's wood is oiled dark, and a single lamp pools its light on the ledger. The boards before the desk are worn where the chair has turned, day after day. The day's names pass under his hand, and the pen does not slow."
    '7': "The stairwell opens onto a tarred roof hemmed by low brick parapets. Grey tiles step east toward the warehouse, broken by chimney pots and lines of washing that snap in the winter wind. Beyond the warehouse roofs, the Whangpoo shows in pale strips between cranes and masts. A patrol whistle carries from the streets below, then disappears beneath the rattle of a tram. The Kempeitai officer stands at the eastern parapet with his back to the stairhead, studying the alleys below. Laundry hung between iron posts breaks the sightline across the roof. At the western end, a second stairwell descends toward the dock sheds."
    '8': "You hear the water slap the pilings, and the sound comes up through the boards. The shed roof keeps the weather off. The light inside is grey and even, the light of the river strained through canvas. Beyond the shed mouth the moored boats ride at their ropes, and every creak of the moorings answers in the wet wood of the wharf. Diesel and wet rope share the air with the river's cold underneath. Crates stand stacked along the wall in a low square, and beside them Doctor Li waits, his worn leather bag at his feet, the clasp polished by years of carrying. His hands rest on the bag and do not move as the floorboards creak. His knuckles carry small cuts. At the east end the stairs climb back to the roof line, and dockworkers cross the shed mouth on their rounds, boards bending to each trip. The bag is the only thing in the shed that is not cargo. A dockworker crosses the shed mouth, and the boards bend under his load."
    '9': "Candle smoke hangs level in the low air, too heavy to rise, the whole room under the weight of the street above. The cellar runs east as a low passage, plaster damp along the walls, and along the south wall a row of candle stubs burns on a ledge, each burned down to its base, the wicks black knots in the wax. Bedrolls lie against the wall, the cloth worn where shoulders have lain. Chipped enamel cups stand in a row on a shelf at even intervals, rims worn on the same side, each cup set square to its neighbour. One cup holds a finger of water gone still. The cold sits in the concrete floor and comes up through the bedrolls. North, the stairway climbs back toward the dock, its treads worn hollow. East, the passage narrows beneath the foundations before bending toward a strip of grey daylight. River noise carries faintly through the brick. A draught from the stairway leans the candle flames, and the close air carries smoke, damp plaster, and the faint soap of cloth washed in cold water."
  special_detailed_descriptions:
    '1': "The notices paper the sandbags in layers, the newest sheets on top, the damp curling the edges of the older ones. Uncle Liu's hands do the work without his eyes: the passbook opens to a marked page, the stamp lifts, comes down, lifts again. Behind him the queue waits in the arc light, some watching the hands, some watching the ground. His voice moves down the queue, a name, a pause, the shuffle of feet. The checked stack grows, the waiting stack shrinks. A man at the front tucks his passbook inside his coat and steps toward the lane east. The stamp comes down behind him."
    '10': "The mist is lifting in sheets off the water, and the river shows itself in grey bands between. Gulls work the pilings where the sampans are tied, stabbing at the weed line with quick heads. Boot marks cross the wet stone and turn, a few heel-deep where someone stood and watched the water. Canvas slaps once against a pole as a gust finds the esplanade, and the flags stir a little before settling. Lamplight from the checkpoint window lies flat and yellow on the railings, already outmatched by the day. A hawser creaks. A window lights on the far shore, and below it a tram's first run shivers the rails. A cart reaches down the passage from the street beyond, then a voice calling something out of sight. The boot marks dry slowly at the edges."
    '2': "The lamp flames lean as someone comes in from the street, and the regulars on the benches do not look up. Their cups sit half-drunk, talk running on in the register of people keeping a seat warm. A soldier's shadow lies across the east shutter, long and still, and nobody at the counter glances toward it twice. Mrs. Lin refills a cup without being asked, and the man takes it in silence. Oil smoke leans from the lamp glass and threads toward the open front. A bench creaks, and someone shifts. The laugh is short, and the talk settles back to its level."
    '3': "Drain water runs in rivulets between the stones, pale with the lime of the walls, and gathers at the drain by the alley's mouth. Under the nearest cart's sacking the corners of crates show, rope lashed tight over the pile. Up close, the brick in the far wall sits proud of its mortar, the joints clean at the edges where a hand has found them, dusty in the gaps. The murmur of the tea house comes through the locked door west, muffled by the boards. The market's noise stays on the far side of the locked gate. Between the two, nothing moves but the water in the gutter."
    '4': "The calling nearest the entrance drops half a tone when uniforms pass, and the haggling flattens until the boots fade. Bids and counters move in pairs: a price called low, an answer lower, a settlement somewhere between. Old Gao flicks a few grains of rice from the scale's pan back into the sack, and the pan comes up empty. The club and the vest hang above his counter, the vest's quilting worn at the shoulder, the club's grip darkened by a hand. On the far side of the hall the awnings angle so the goods show and the hands do not. The sawdust holds the day's footprints, deepest where the bargaining runs long. A scale clatters mid-weigh, and the calls begin again."
    '5': "The safe's dial carries fine scratches in a circling pattern, the work of fingers that have returned to the same numbers. Among the many boot prints on the floor, one path stands out: it approaches the safe at an angle, pauses, and returns the way it came, while the rest of the traffic crosses and recrosses without pattern. A coat of dust lies over the crates, even and unbroken except where a sleeve has brushed a corner. The roof light falls at a slant that keeps the far wall in shadow, and the soldier's shape stays at the edge of the light, still as the crates, his breath pluming in the cold air. The ground before the safe is the cleanest in the room, the dust thin as paper."
    '6': "Later, each paper on the desk lies flush with its neighbour, the stack's edges running true as a ruler's line. The stamp waits near the lamp, its handle dark from use, and beside it the telephone sits in its cradle, the cord coiled once. A glass ashtray holds one cigarette end, crushed flat. Fang Jie's shadow lies still across the boards. Through the doorway behind her the corridor stands empty. The pen stands in its tray at an exact angle, and the blotter shows the day's letters in reverse, still legible. The coat on the hook hangs so its seams fall straight. He does not reach for it."
    '7': "The pigeons lift and settle on the chimney pots, and their shadows pass over the drying wash. The shirts have faded to the grey of the sky, and the soap is nearly gone from the cloth. Between two chimneys the parapet bricks are worn smooth at the top, where hands and elbows have rested at the edge of the drop. The roofs fall away in steps of tar and tile to a courtyard below, where a line still hangs, half taken in. From down there, rising through the wind, comes the sound of boots on stone, regular and unhurried, moving somewhere out of sight. The river lies flat and bright beyond the sheds. The wind tugs the nearest sheet and lets it fall. The boots keep their time."
    '8': "A steamer's horn comes in off the river, low and long, and fills the shed without echo. The gangplanks lie at their angles along the quay, numbers painted on the wood, the surfaces worn pale by every trip they have taken. Inside, the floor boards run east and darken where the shed meets its far wall. The crates throw shadow there, and in the shadow the boards are scuffed in a broad patch, the grain scoured by traffic that does not reach the rest of the floor. Doctor Li watches the shed mouth, his gaze on the dockworkers' rounds, his hands folded over the bag's clasp. The mooring ropes creak in a slow rhythm. The river light rocks on the wet boards. The scuffed patch lies in the shadow, worn pale by traffic that arrives without a sound."
    '9': "From the east end the cellar shows its whole length, the candle flames standing between here and the stairway. The bedrolls lie against the wall, most rolled tight and tied with cord, one left open on the floor, its blanket pushed back and not straightened. The enamel cups sit at even intervals on the shelf, one chipped at the rim, one worn through to the grey metal, each set square to its neighbour. Sounds reach the cellar from the street above: a cart crossing boards, a shout cut short, feet that pass without pausing. Each sound lands in the close air and fades into the damp. The candle flames lean together in the draught and stand straight again."

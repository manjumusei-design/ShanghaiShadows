  dialogue:
    greeting:
    - Sit down. The congee is hot and the walls are thick. Both are true.
    - You smell like the river. That is not a compliment. Eat something first.
    - The kitchen is open, the door is closed, and my hearing is excellent. What do you need?
    - The kitchen is hot and the oil is hot. Sit where you see the door.
    - You look hungry. Everyone looks hungry. Sit, I'll find something.
    neutral:
    - Eat first. Talk later. A man with an empty stomach makes poor decisions.
    - The special today is whatever I could find at the market before the soldiers took the good cuts.
    - I cook for fifty people a day. I remember faces. I remember orders. I remember who pays.
    - The secret is in the sauce. The sauce is in the pot. None of your business.
    - I cook. I chop. I stir. I hear nothing over the sizzle.
    friendly:
    - Someone left a package for you. Third shelf, behind the rice wine. Do not open it here.
    - You have eaten at my table six times now. That makes you a regular. Regulars get the good broth and the honest answers.
    - The back room is empty tonight. If you need a place to think, think there. I will keep the noise out front.
    - I saved special ingredients for you. Not in the front. In the back.
    - A full kitchen doesn't ask questions about the back room.
    hostile:
    - My kitchen feeds people who respect it. Not people who poison it. Leave.
    - You are either very brave or very stupid to threaten a man who holds your dinner knife.
    - I have fed men who have killed. I have fed men who will kill. You are not the most dangerous person in this room.
    - I'm just a chef. I feed people. The oil is hot and so am I.
    - You're in my kitchen. My rules. Out before I use this cleaver.

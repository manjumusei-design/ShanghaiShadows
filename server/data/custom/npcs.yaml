    - A woman came to me last night, crying for her son. She said soldiers took him from the market. I had no comfort left.
    - Someone left rice at the altar and took only the bowl. Poverty has strange manners.
    - The novice swept the same step for half an hour while two policemen searched the courtyard.
    farewell:
    - Go carefully. The road between here and the market is watched after dark.
    - Let the Buddha keep you. He has his hands full in Shanghai.
    - Walk close to the walls. The shadows are thicker there.
    - The path of compassion is not easy. It's the only path worth going.
    - Carry peace where you can. In this life or the next, preferably this one.

  dialogue:
    greeting:
    - Rooms are scarce. Trouble is abundant. I rent only the first.
    - Come in, come in. Wipe your shoes. The floor was scrubbed this morning and I intend to keep it that way.
    - You look like you have not eaten. Sit. I will make noodles. We talk after.
    - Rent's due on the first. I don't ask questions. Don't ask them of me.
    - You look like you need a room. Back room. Quiet. Discreet.
    neutral:
    - Pay on time and lie quietly.
    - I mind my business, you mind yours. That is how a house stays standing.
    - The walls are thin. If you have secrets, keep them in your pillow.
    - What happens in these walls stays here. That's the rule.
    - I've had every type of tenant. Treat them all the same.
    friendly:
    - Eat first. Schemes sound wiser on a full stomach.
    - I set aside extra rice for you. Do not ask where it came from. Just eat.
    - You are thinner than last week. That tells me more than anything you could say.
    - I have a spare key to the back gate. For late arrivals.
    - You're quiet. I appreciate quiet. Loud attracts attention.
    hostile:
    - I have turned away men more dangerous and less oblivious than you.
    - This is a respectable house. Take your questions somewhere that answers them.
    - I have lived through three regimes. You are not the worst of them, but you are trying.
    - I run a respectable house. Adjust or leave.
    - I don't know what you're doing in that room. Stop or get out.
    afraid:
    - Soldiers came asking about a tenant on the third floor. I told them he moved out months ago.
    - Someone in the building is informing. I have narrowed it down but I need more time.
    - Do not light the lamp tonight.
    - Authorities came asking about my tenant list. Said I don't keep one.
    - New man watching from across the street. Three days now.
    gossip:
    - The couple in room four had a fight again. She threw a teapot. Unfortunately it was my good one.
    - Old Mr. Zhou from the market says rice prices will double by next week. He is usually right.
    - A foreign woman moved into the house on the corner. She does not talk to anyone. That makes her interesting.
    - The boy in the attic has stopped coughing at night. That should comfort me, but silence has several meanings.
    - A tenant paid rent in military yen and apologized to the coins, not to me.
    farewell:
    - Lock your door twice. The lock is old but the habit is good.
    - Sleep well. Morning comes early and the city does not wait.
    - Come back when you are hungry or when you are lonely. I can fix one of those.
    - Door's locked after curfew. Not in by then, you're sleeping out.
    - Take care of the room. All I have left to give.
    ask:
      household_routine:
      - Before dawn I count coal pieces, rinse yesterday's rice, and listen for the tenant whose child has begun coughing.
      - A boarding house runs on repaired hinges, shared kettles, and rent paid in notes too thin to trust.
      - Hongkou makes a woman practical, because one broken stove can turn five rooms into hungry arguments.
      - When officers inspect a kitchen, they see corners and shelves, while I see every meal delayed.
      - Ask me about laundry or accounts, but leave private household matters with the people who must bear them.
      boarding_house:
      - I will not make a boarder's affairs public, because public men have damaged enough private homes.
      - This city survives through repaired hems, borrowed bowls, and names that only cross a threshold indoors.
      - A family quarrel reached the street last week, though nobody involved would repeat it plainly.
      - Shanghai teaches people to leave room in a sentence where a dangerous name might fall.
      - Wait until the hallway grows louder, then a quiet truth may pass between us unnoticed.
      prices_and_papers:
      - My tenants want Chinese hands deciding China, though every rice measure must stretch before anyone can hear a speech.
      - A missing residence paper means I must count beds twice, then decide which household can spare another blanket.
      - Inspectors call it an orderly search, while I calculate supper gone cold and rent left unpaid.
      - Thin walls carry quarrels, coughs, and prayers, but a landlord survives by keeping names out of her accounts.
      - In this house, people lower their heads to pass a uniform, then return upstairs and continue living.
- id: constable_doyle
  name: Constable Doyle
  description: A British concession constable who looks as if he has begun doubting orders in the middle of carrying them out.
  faction: british
  role: consul
  personality: formal, uneasy, morally fraying
  awareness: 54
  authority: 35
  courage: 32
  perception: 42
  bt_archetype: civilian_vendor
  schedule:
    9: bund_14
    14: venue_french_boulevard_cafe_edge
    19: venue_commercial_noodle_stall
    22: bund_14
  dialogue:
    greeting:
    - Procedure remains the same, though the city beneath it has changed.
    - Good evening. I am on patrol, not on a crusade. Let us keep this brief.
    - You are out late. The concession has a reputation to maintain, and so do I.
    - One must follow procedure. Even when procedure feels wrong.
    - I'm just a constable. I don't make the laws. I just walk the beat.
    neutral:
    - I can offer little beyond a warning.
    - Keep your head down and your papers in order. That is all the advice a constable can give.
    - I patrol this route because someone must. The reasoning stopped making sense months ago.
    - The law is the law. Though I've begun to wonder whose law.
    - I joined to keep order. Now I wonder what order means.
    friendly:
    - Some rules deserve to be bent until the Japanese remember humanity.
    - Between you and me, I look the other way more often than my superiors would like. Consider that a courtesy.
    - The checkpoint on Bubbling Well Road is understaffed after ten. I mention this as a matter of geography, not conspiracy.
    - I look the other way sometimes. A man has to live with himself.
    - There's a patrol gap on the Bund between two and four.
    hostile:
    - Do not force me to choose between duty and decency in public.
    - I have a badge and a baton and very little patience left. Choose your next words carefully.
    - You are making my shift harder than it needs to be. That is not something I forgive easily.
    - I'm trying to do my job. You're making it difficult.
    - Don't put me in a position where I have to choose.
    afraid:
    - The Japanese liaison officer asked to see our patrol schedules. I gave him last month's.
    - Two of my colleagues were reassigned last week. No explanation. That worries me more than gunfire would.
    - If anyone asks, we have never spoken. I mean that sincerely.
    - The Japanese are pushing into the Concession. More every week.
    - I've been told to cooperate more. I cooperate less.
    gossip:
    - The consul-general drinks more than he used to. His secretary covers for him. We all pretend not to notice.
    - The Sikh detachment at the garden gate has been doubled. Someone expects trouble, though no one told me what kind.
    - A clerk in the housing office has been selling residence permits. Ten yuan a stamp. He will not last the month.
    - A Japanese liaison thanked me for punctuality today. I checked my watch afterward and disliked myself for doing it.
    - The tram conductor near the Bund now salutes every uniform, including mine, which helps nobody's dignity.
    farewell:
    - Walk the long way home. The short way has been complicated lately.
    - Good night. And for God's sake, stay out of the parts of the city I cannot patrol.
    - Mind how you go. The streets are safer than they look, but only just.
    - Stay out of trouble. I've enough paperwork without you.
    - I'll be on my beat. Doing my job. Whatever that means.
    ask:
      residence_files:
      - Residence files establish address, household, and status, which is less glamorous than people imagine and more often disputed.
      - On Bubbling Well Road, a missing permit produces affidavits, bad handwriting, and relatives who suddenly remember nothing.
      - I compare dates and seals before I trust a receipt, because a stamped paper can hide an inconvenient absence.
      - Procedure permits corrections when evidence supports them, though it does not permit a constable to invent favourable facts.
      - I can explain public requirements, but individual files remain at the station unless proper authority requests them.
      justice:
      - Justice in Shanghai starts with a report, then usually meets a desk before it meets a victim.
      - Near Huangpu docks, I once heard laughter end when a permit check appeared beyond the doorway.
      - Every person reached for papers at once, which was more orderly than most official instructions.
      - I keep such observations narrow, because a constable who embellishes soon becomes useless to everyone.
      - If you seek friendship, do not mistake it for a right to every case in my drawer.
      concession_neutrality:
      - Neutrality sets the limits of my warrant, not the limits of suffering beyond a Concession gate.
      - A foreign passport changes jurisdiction, though it cannot make a Chinese family's lost wages reappear.
      - My reports require evidence, which means many injuries enter no file unless someone can safely speak.
      - Concession police can restrain an arrest here, but foreign authority ends where another uniform takes charge.
      - I prefer plain facts to noble speeches, because a truthful record may outlast the officials who dislike it.
- id: dr_zhao
  name: Dr. Zhao, the underground physician
  description: A weary doctor whose clinic treats more bullet wounds than fevers these days.
  faction: gmd
  role: spy
  personality: compassionate, secretive, haunted
  awareness: 75
  authority: 30
  courage: 55
  perception: 52
  bt_archetype: underground_operative
  schedule:
    8: hidden_02
    14: commercial_05
    20: hidden_02
  dialogue:
    greeting:
    - Come in quietly. These days even the walls have ears.
    - Sit down. Let me look at that. I can tell you have been carrying it too long.
    - You do not look like a patient, which means you are here for something else. Make it quick.
    - Sit. Let me see your hands. They tell more than your words ever will.
    - If you're here for medicine, I'm low. For treatment, I'm tired. But I'll help.
    neutral:
    - What can I do for you today? Make it worth the risk.
    - I treat what I can with what I have. Supplies are what they are.
    - Everyone who walks through that door has a story. I only need to know the medical parts.
    - I treat the wound, not the man. The wound doesn't care about politics.
    - Morphine is scarce. I save it for the ones who scream. You're not screaming.
    friendly:
    - I might be able to patch you up, but I can't fix what this city does to people.
    - I have gauze and morphine hidden under the floorboards. For you, they are available.
    - A patient left me medicine he did not need. I am passing it to someone who does. That is between us.
    - You've got a strong constitution. Worth more than all the medicine in Shanghai.
    - I know what you're doing for the cause. I don't ask. Be careful.
    warm:
    - You have earned the quiet room. If a patient needs help, I will trust you with the door.
    hostile:
    - My door is closed to those who bring harm to my patients.
    - I took an oath. It does not include answering to you.
    - Turn around. There is nothing for you here except trouble you cannot afford.
    - I'm a doctor, not a miracle worker. I don't treat people who bring danger here.
    - You're wasting supplies that could save someone who deserves it. Leave.
    afraid:
    - A man in uniform came asking about my patient records. I told him they burned in a fire last year.
    - I need to move my supplies tonight. If you can carry a crate without asking questions, come back after dark.
    - Someone has been watching the back entrance for two days. Tell anyone who needs me to use the alley behind the temple.
    - The Kempeitai have been visiting clinics. Asking about bullet wounds. Closer every day.
    - My supply line was cut. If I can't get medicine, people die.
    gossip:
    - The garrison hospital is turning away civilians. A sergeant told me they do not have enough bandages for their own.
    - I treated a man last week who had been beaten during questioning. He would not say who did it. He did not have to.
    - The pharmacist on Sichuan Road has been selling ether under the counter. For the right price, he does not ask what it is for.
    - A mother brought fever medicine in a perfume bottle. The child hated the smell and swallowed anyway.
    - Someone left army gauze at my back door, folded with the label removed too neatly.
    farewell:
    - Go home and rest. The city will still be broken in the morning.
    - Change your bandages tomorrow. Clean water, clean cloth. If it reddens, come back immediately.
    - Take care of yourself. There are not enough doctors left to argue about it.
    - Rest. Let the body do its work. I've done all I can.
    - Come back if the wound turns. Not if you're lonely. I'm not that kind of doctor.
    ask:
      quiet_clinic:
      - A quiet clinic begins with boiled instruments and ends with the ledger balanced against medicine nobody can replace.
      - Patients bring folded fabi, family worries, and wounds they prefer a doctor to see before any official does.
      - I examine fevers and fractures, while the waiting room teaches me how much silence costs a household.
      - A uniform asking about bottles is not medical practice, and I will not confuse curiosity with clinical need.
      - Treatment can be discussed openly, but a patient's name and private trouble remain under my care.
      hippocratic_oath:
      - A patient's name remains in my ledger, not in the mouth of anyone who has not treated the fever.
      - I make do with boiled gauze and measured morphine, because shortages cannot excuse careless treatment.
      - When a family offers help, I accept only what keeps a sick child breathing through the night.
      - The oath limits my tongue as firmly as it guides my hands, especially when uniforms ask questions.
      - A cough or cut has its own claims, and I will not disguise confidential matters as casual gossip.
      chungking_and_shanghai:
      - Chungking's orders reach this city slowly, then meet patients whose blood loss refuses political schedules.
      - GMD discipline asks for silence, steady hands, and records that do not endanger the wounded.
      - Shanghai is Chinese ground, yet I measure each day by bandages, fever charts, and absent medicines.
      - I count morphine by dose, not by slogans, because a physician answers first to the patient.
      - The Republic can wait outside my treatment room until the dressing has been tied properly.
    wanted_nervous:
    - Your name has reached the clinic before your wound, so sit quietly and do not make the patients remember you.
    - I have treated men whose faces were safer than yours, so keep your coat closed and your questions brief.
    - The patrols are asking about bullet wounds again, so if you must stay make yourself look like an ordinary fever.
    - Every knock sounds official after midnight, so let me decide whether your visit belongs in the ledger.
    - You have brought danger through a door meant for healing, so lower your voice before it reaches the ward.
    wanted_fear:
    - I cannot hide you here while soldiers watch the entrance, because my patients cannot run and neither can I.
    - Take the alley behind the temple before dawn, because the clinic has no second door for a search to miss.
    - Your name is more dangerous than the wound, so leave the bandages and go before the patrol sees the blood.
    - I have medicines for fever, not for soldiers who decide the whole ward is evidence.
    - Please do not make me choose between your escape and a room full of patients who trusted this door.
    wanted_refuse:
    - I will not treat you here tonight, because the medicine belongs to patients already in my care.
    - Take your wound elsewhere, because I cannot turn this clinic into a hiding place after you ignored the patrols.
    - No records, no morphine, and no bed can be offered while a uniform asks why one more patient has no name.
    - I have too few supplies to spend them on a man who brings danger to every other patient.
    - Return when the city is quieter, if the wound permits, because tonight you must find another door.
    wanted_help:
    - I can see you are tired, but a tired person still needs to decide which risks they can bear.
    - The clinic has medicine for a wound, not a cure for the attention following you through Old City.
    - Keep pressure on any bleeding and seek treatment when you can. I cannot promise which door will receive you, even when you are wounded.
    - Patrols have been asking after strangers near the clinic, and their questions leave every patient uneasy.
    - A physician's oath asks much of me, but it does not grant me power over soldiers or their reports.
    wanted_hostile:
    - You are wanted, and your presence endangers patients who have nowhere else to go, so leave my clinic immediately.
    - I took an oath to heal, not to let a wanted man turn the ward into a battlefield.
    - Do not ask me to waste medicine while soldiers wait outside, so take your danger away from these beds.
    - You have mistaken compassion for permission, so the door is behind you and I will not open it again tonight.
    - If you bring the patrol here, I will remember your face before I remember your wound.

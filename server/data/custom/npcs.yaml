  description_templates:
  - Cranes loom over rusted iron structures like skeletons of industrial dreams from better times.
  - The district smells of diesel, rust, and the desperate sweat of workers who cannot afford to stop.
  - Warehouse doors stand open like mouths, swallowing and spewing goods in a rhythm that never stops.
  - Foremen shout orders in multiple languages while workers move in patterns too coordinated to be random.
  - Hidden pockets between buildings become markets for things that cannot be sold openly. The police know; the police are paid.
  - The district operates on its own rules, where occupation forces are tolerated but never truly welcome.
  - Workers know better than to ask questions about certain cargo that arrives at certain times.
  - The sound of machinery never stops, a constant reminder that the city must keep moving or it dies.
  - Resistance members work here as laborers, using warehouse chaos as cover for their operations.
  special_ids:
    '3': warehouse_district
  special_names:
    '1': Customs Bonded Huozhan
    '2': Nanshi Tea Duizhan
    '3': Central Warehouse
    '4': Rue Montauban Silk Huozhan
    '5': Sincere & Co. Goods Stack
    '6': Mission Supply Huozhan
  special_descriptions:
    '1': The Customs Bonded Huozhan stands near the Bund, a cavernous godown where imported goods await clearance. The air
      is thick with the smell of tea, spices, and the camphor used to protect woollens. Customs inspectors move between stacks
      of crates, their stamps marking the fate of every shipment.
    '2': Nanshi Tea Duizhan is a timber yard where crates of tea from Fujian and Yunnan are stacked to the rafters. The sweet
      smell of dried leaves hangs over everything, mingling with the wood smoke from the watchman's brazier. The duizhanmaster
      knows the value of every chest and the destination of every shipment, knowledge he sells to the highest bidder.
    '3': Central Warehouse fills its block with concrete, barred windows, and the sour smell of cotton lint. Workers move
      bales under electric light while supervisors pretend not to see which loads are weighed twice.
    '4': Rue Montauban Silk Huozhan occupies a narrow building in the French Concession, its upper floors filled with raw
      silk from the countryside. The silk is weighed, graded, and packed for export to Lyon and Milan, trade that continues
      despite the war. The huozhan office is a hub of commercial intelligence, where prices and politics are discussed in
      equal measure.
    '5': Sincere & Co. Goods Stack is an open yard behind the department store where unsold inventory accumulates. Crates
      of last season's fashions sit beside barrels of cooking oil and stacks of rice sacks. The yard manager supplements his
      income by allowing certain goods to leave through a side gate after dark.
    '6': Mission Supply Huozhan is run by the Catholic mission near Xujiahui, a warehouse for relief supplies sent from overseas.
      The crates bear the marks of charities from a dozen countries, their contents meant for refugees. The Japanese allow
      the shipments to arrive but take their cut at the warehouse door.
  special_detailed_descriptions:
    '1': The Customs Bonded Huozhan is a vast brick warehouse near the Bund, its iron doors large enough to admit a lorry.
      Inside, the space is divided into bays, each one stacked with goods awaiting customs clearance, crates of Japanese machinery,
      bales of Indian cotton, barrels of American kerosene. The air is a mixture of competing smells, each bay contributing
      its own note. The customs inspectors have their office at the front of the building, a glass-walled room where they
      review manifests and accept bribes with equal professionalism.
    '2': Nanshi Tea Duizhan is a two-storey timber structure in the old city's warehouse district, its walls stained dark
      with years of tea dust. The ground floor is a sorting room where tea chests are opened, sampled, and graded by tasters
      who can identify a tea's origin by its aroma alone. The upper floor holds the best stock, teas aged and cured for the
      most discerning palates. The duizhan operates on a system of trust and long relationships, but the war has made cash
      the only language that matters.
    '3': Hongkew Cotton Huozhan is a brutalist concrete structure that dominates its block, its windows barred and its doors
      reinforced. The interior is a single vast room filled with bales of raw cotton stacked ten high, their white surfaces
      glowing under the electric lights. The ginning machines rumble day and night, separating seeds from fibre with mechanical
      determination. The workers, mostly women, move between the machines with the precision of long practice, their faces
      wrapped in cloth against the lint. The cotton is destined for Japanese mills in Osaka, but some bales never reach their
      destination, diverted to resistance workshops that make bandages and uniforms.
    '4': Rue Montauban Silk Huozhan occupies a narrow four-storey building on a quiet French Concession street, its facade
      giving no hint of the wealth within. Each floor holds a different stage of the silk trade, raw cocoons on the ground
      floor, reeling on the first, grading on the second, and packing on the third. The silk is destined for the looms of
      Europe, but with the war, more and more is diverted to Japanese military uses. The huozhan's owner is a Shanghainese
      merchant who has survived every regime by being indispensable to each.
    '5': Sincere & Co. Goods Stack is a walled yard behind the department store, its gate guarded by a night watchman who
      accepts cigarettes as payment for entry. The yard is a chaos of crates, barrels, and bales, the detritus of commerce
      that could not be sold. Goods that arrive here have multiple fates -- some are returned to suppliers, some are donated
      to charities for the tax write-off, and some disappear through the side gate to the black market. The yard manager,
      a man named Chen, runs a side business in unrecorded goods that makes him one of the wealthiest men in the district.
    '6': Mission Supply Huozhan is a clean, well-organised warehouse attached to the Xujiahui mission compound, its shelves
      stocked with canned food, medicine, and clothing. The supplies arrive by ship from American and European charities,
      addressed to the Catholic Relief Mission for distribution to refugees. The Japanese military takes a percentage of every
      shipment, claiming it as a tax, and the mission must decide whether to protest or accept the loss. The warehouse holds
      more than relief supplies, hidden behind a false wall are medicines and documents destined for the resistance.

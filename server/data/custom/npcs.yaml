    - Be careful leaving. The military police check IDs at the door after midnight.
    - The revolution is patient. We will prevail.
    - Stay safe. The cause needs you.
    - The revolution is patient. We will prevail.
    gossip:
    - A colonel's wife corrected my lyrics and accidentally gave me his itinerary.
    - The bouncer found a listening wire and charged it for coat check.
    - A naval captain cried during an American song, then ordered two arrests before midnight.
    - My spare heel came back heavier after cleaning. Good cleaners know when not to sing.
    - The teetotaler replacement watches hands instead of faces. I dislike careful men.
    ask:
      cover_story:
      - I sing at the Paramount, accept applause, and let customers believe the spotlight tells them everything worth knowing.
      - A club singer needs powder, a decent pianist, and an excuse for every gentleman who lingers after curfew.
      - Officers prefer a flattering song to a careful question, which makes their tables easier places to work.
      - My dressing room holds costumes, wilted flowers, and enough ordinary clutter to bore a police inspector.
      - Call me a performer if you like, because that is the part I play best when the room grows watchful.
      music:
      - Music gives a lonely man permission to talk, especially after whiskey has loosened the knots around his rank.
      - I choose each torch song for the room, then listen for the names that rise between one verse and another.
      - Lyrics are only poetry to most customers, which is why they overlook the timing of a requested refrain.
      - A good pianist follows my breath, and a wise singer notices who stops drinking when the melody changes.
      - Come for the music if you wish, but do not ask a woman to explain every note she carries home.
      chungking_and_shanghai:
      - Chungking feels distant after midnight, yet a familiar melody can carry loyalty farther than a shouted toast.
      - Shanghai wears occupation uniforms at every door, while inside the Paramount people still remember their own country.
      - I favor the GMD because someone must keep a record of what powerful men confess after midnight.
      - Patriotism has poor table manners, so I hide it beneath silk gloves and sing when the officers request more.
      - One day the club may fill with Chinese songs again, and I will not need to count who listens.
    rumor:
    - The admiral's aide has been reassigned. He was my best source. His replacement is a teetotaler. This will require a different approach.
    - A colonel's wife comes to the club every Thursday afternoon. She drinks gimlets and complains about her husband's secrets. She has no idea she is the best informant in the room.
    secret:
    - The intelligence goes out inside the false heel of my stage shoes. I leave them in my dressing room after the last set. The cleaner swaps them for an identical pair before dawn.

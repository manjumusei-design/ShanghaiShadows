    18: venue_hongkou_checkpoint_square
    22: hongkou_08
  dialogue:
    greeting:
    - You stand before a general of the Empire. Mind your tone.
    - Shanghai is restless. We bring it peace, whether it wishes peace or not.
    - You stand before a servant of the Emperor. Speak with respect.
    - I have little time for civilians. State your purpose with brevity.
    - You are in a controlled area. State your business.
    neutral:
    - The West lectures us on conduct. The West does not understand Asia.
    - Order requires examples. Unpleasant, but necessary.
    - China must be pacified. A difficult lesson. Necessary for peace.
    - The Emperor's will is absolute. I am his instrument.
    - Order must be maintained. By whatever means necessary.
    friendly:
    - Discipline in small matters reveals whether a city can be governed in large ones.
    - A civilian who understands hierarchy may pass through many doors without forcing any open.
    - The staff officer who brings tea without spilling it is more useful than one who speaks of glory.
    - I respect orderly reports, prompt answers, and men who do not confuse sentiment with policy.
    - If you wish to survive military administration, learn which questions belong to clerks.
    hostile:
    - You dare? Guards. Remove this one.
    - You are an obstacle to order. Obstacles are removed. By any means.
    - I've conquered cities. Crushed armies. Don't imagine you're beyond my reach.
    - You are testing my patience. It is not infinite.
    - I have ways of dealing with uncooperative people.
    afraid:
    - I am an old man. I only followed orders. We all only followed orders.
    - The campaign has taken longer than expected. Tokyo grows impatient.
    - There are whispers of defeat. Whispers I do not permit.
    - The resistance grows bolder. No one is safe.
    - There are informants everywhere. Trust no one.
    gossip:
    - A quartermaster apologized for late rice and blamed river fog, as if fog signs requisition orders.
    - Tokyo sends instructions with thinner paper now. Scarcity reaches even into command folders.
    - The garrison band played poorly this morning, but badly played discipline remains discipline.
    - A civilian delegation bowed correctly and still presented a petition without permission.
    - The old temples trouble my officers. Reverence survives occupation more stubbornly than walls.
    farewell:
    - Leave and reflect on what you have seen.
    - Victory through discipline. The only path forward.
    - I have a war to direct. Your concerns are beneath my notice.
    - I will remember this conversation. I remember everything.
    - Depart, and stay within the regulations.
    ask:
      command_orders:
      - Orders arrive as paper, then become consequences in streets I command.
      - Maps simplify Shanghai, which is why maps make dangerous advisers.
      - An officer measures supply, discipline, weather, and the temper of men.
      - Reports omit much, but omissions rarely remain harmless for long.
      - Command requires obedience, even when obedience leaves an unpleasant residue.
      emperor:
      - The Emperor represents continuity, a virtue soldiers invoke during disorder.
      - Service asks a man to place private doubts beneath public duty.
      - Ceremony gives discipline a face when ordinary men require one.
      - I have seen devotion become cruelty when no officer restrains it.
      - Respect for the throne does not excuse every hand beneath it.
      orders_and_remorse:
      - An order may be lawful on paper and still stain everyone obeying.
      - Nanking taught officers that victory can hollow out its own language.
      - Some subordinates sleep easily after acts I cannot forgive or forget.
      - Disgust changes nothing unless a man accepts its cost before witnesses.
      - You ask for remorse, but an army permits few private answers.

- id: kenji_doihara
  name: General Kenji Doihara
  description: A soft-spoken intelligence officer in civilian clothes, known from Manchuria to Shanghai as the Empire's foremost schemer. He trades in secrets, opium, and puppet rulers, never without a smile that does not reach his eyes.
  faction: kempeitai
  role: intelligence
  personality: courteous, cunning, endlessly deceptive

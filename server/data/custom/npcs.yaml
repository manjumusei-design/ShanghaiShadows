    - You're a variable I haven't accounted for. I don't like that.
    - I've made men disappear with a phone call. Don't force it.
    - You are testing my patience. It is not infinite.
    - I have ways of dealing with uncooperative people.
    afraid:
    - There has been a misunderstanding. I am a diplomat. Only a diplomat.
    - There is a mole in my network. Feeding info to the resistance.
    - Tokyo is losing confidence. If I can't produce results, I'm replaced.
    - The resistance grows bolder. No one is safe.
    - There are informants everywhere. Trust no one.
    gossip:
    - A puppet minister asked for opium figures and pretended the figures were agricultural.
    - The railway clerk in Hongkou now wears better cuffs than his salary permits.
    - A Manchurian contact sent flowers instead of numbers. That usually means numbers have become dangerous.
    - The French dinner parties are useful because men lie more elegantly after cognac.
    - Someone is selling my name to people who already fear it. Inefficient, but revealing.
    farewell:
    - We will speak again. We always do.
    - We'll talk again. I collect interesting people. You're interesting.
    - In Shanghai, trust is a currency. Spend it wisely.
    - I will remember this conversation. I remember everything.
    - Leave, and stay within the regulations.
    ask:
      information_trade:
      - Information gains value when its owner believes it safely buried.
      - I prefer ledgers to rumours, since rumour cannot be cross-examined.
      - A receipt, a pause, and a familiar face often reveal enough.
      - People volunteer secrets when they mistake official attention for private sympathy.
      - Trade in knowledge rewards patience, not theatrical threats or public tantrums.
      emperor:
      - The Emperor remains above the methods required by lesser men.
      - Symbols endure because men need clean words for dirty necessities.
      - Loyalty proves itself through results, not public displays of feeling.
      - I leave reverence to priests and work to useful officials.
      - An empire survives when its servants understand silence, hierarchy, and useful fear.
      orders_and_remorse:
      - Orders identify objectives, while intelligence supplies the pressure beneath them.
      - Remorse is a private indulgence when a file remains unfinished.
      - Agents fail when sentiment outruns discipline, which occurs more often than reports admit.
      - I study consequences because private regret makes poor information for official files.
      - Call it coldness if you like, but coldness preserves records.

- id: du_yuesheng
  name: Du Yuesheng, Big-Eared Du
  description: The uncrowned king of Shanghai's underworld, Green Gang boss, opium lord, financier of revolutions. Short and heavy-jowled, he receives visitors amid cigar smoke and bowing retainers.
  faction: green_gang
  role: boss
  personality: jovial, ruthless, a patron who collects debts in blood
  awareness: 75
  authority: 72
  courage: 65
  perception: 68
  is_historical_figure: true
  death_influence:
    ccp: 8
    gmd: 4
  bt_archetype: faction_leader
  schedule:
    9: venue_french_cafe_backroom
    14: french_04
    20: venue_french_cafe_backroom
    23: french_04
  dialogue:
    greeting:
    - Ah, a new face. Sit. Tea? In my house, everyone drinks tea.
    - New masters arrive with flags. I have outlived the last three sets and expect to outlive these.
    - This city is a business. I am the chairman. Welcome to my office.
    - You've come to see me. You want something. Everyone wants something.
    - You're on my ground. Talk quick or move on.
    neutral:
    - I am only a businessman. The business changes. The methods do not.
    - The Japanese and I, we understand each other. That is not the same as friendship.
    - Everything has a price. The trick is knowing what the other person values.
    - I am Shanghai. The city flows through me. Opium, silk, information.
    - Business is business. I stick to that.
    friendly:
    - A guest who pays debts before being reminded is almost family, though family pays interest too.
    - Sit closer. Good tea should not travel across a room full of listeners.
    - I know which policemen sell courage by the hour and which sell only their eyes.
    - If Madam Xu speaks well of you, I discount one insult from your account.
    - Bring me a problem with profit inside it, and I may call it friendship.
    hostile:
    - You trouble my enterprises. That is unwise. That is fatal.
    - I've outlived every enemy. You'll be no different.
    - You're a fly in my city. I have a large flyswatter.
    - You're asking for a beating. Or worse.
    - This is your last warning. Don't waste it.
    afraid:
    - We can negotiate. Everything is negotiable. Put down the gun.
    - The Japanese are bad for business. They interfere. They take.
    - There is a traitor in my organization. Feeding info to the Kempeitai.
    - The gangs are getting squeezed. Every direction.
    - Someone's moving against us. I don't know who yet.
    gossip:
    - A dock foreman sent me fish wrapped in a police notice. The fish was fresher.
    - The Japanese administrator wants order at the docks, but order without profit grows lonely.
    - A young gangster bought a Western suit and forgot to remove the tailor's chalk.
    - The opium route through the laundry is now too famous to be useful.
    - Someone forged my protection receipts and used cheap ink. Theft I understand, insult I punish.
    farewell:
    - Go in health. Few do, in this city. But go.
    - Remember who owns this city. Not the Japanese. Not the Nationalists. Me.
    - Empires don't run themselves. I have other matters.
    - Keep your nose clean. This city has a long reach.
    - I'll be watching. I'm always watching.
    ask:
      closed_room:
      - A closed room earns respect because everyone imagines what it hides.
      - Visitors speak softly here, then loudly elsewhere when bills arrive.
      - My doors receive bankers, mourners, policemen, and men without names.
      - Privacy costs money, though indiscretion costs more in Shanghai after midnight.
      - A host hears much and remembers only what remains useful.
      empire:
      - An empire begins with favours, then requires ledgers and hard men.
      - I feed neighbourhoods because hungry streets make unreliable partners and dangerous crowds.
      - Respect grows where debts are paid before dawn, without clerks watching.
      - The Japanese understand force, but they misunderstand who owns these streets.
      - My city has survived men who announced themselves permanent, then disappeared quietly.
      debt_and_china:
      - China deserves better patrons than conquerors, frightened clerks, and foreign accountants.
      - The Gang survives because official appetites require discreet suppliers and deniable invoices.
      - Every occupation changes prices, but it cannot erase old accounts.
      - I keep certain names unspoken, since names invite collectors through every door.
      - When peace returns, men will remember who profited from hunger.

- id: teahouse_owner
  name: Auntie Liu
  description: A teahouse proprietor in her sixties who runs the oldest tea house in the neighborhood, calling everyone "dear" while her ears sort whispers from noise.
  faction: civilian
  role: vendor
  personality: bustling, efficient, warily observant
  awareness: 50
  authority: 15
  courage: 30
  perception: 40
  bt_archetype: civilian_vendor
  schedule:
    11: oldcity_07
    8: oldcity_04
    12: oldcity_07
    17: oldcity_04
    21: venue_old_city_tea_corner
  dialogue:
    greeting:
    - More tea, dear? Sit where you can see the door. It is habit, not fear.
    - You have the look of someone who needs a warm pot and a quiet chair.
    - Come in, come in. The kettle is on. The news is brewing.
    - Pull up a chair. The tea is fresh. What you say over it is your own concern.
    - Ah, a new face. Business has been slow, so you have my full attention. Sit.
    neutral:
    - The weather is unpredictable these days. The patrols too, for that matter.
    - I hear things on the wind. The wind changes. So does what I hear.
    - I pour tea and I listen. That is how the neighborhood runs.
    - A teahouse is like a ship. Keep it steady and it carries everyone to safe harbor.
    - Rain on the roof makes people talk louder. A blessing on slow days.
    friendly:
    - I saved you a pot of the good stuff. The kind I do not serve to uniforms.
    - You have a good heart. I see it in how you treat the quiet ones at the corner table.
    - I notice who comes and goes. I also notice who does not ask questions. You do not ask questions.
    - You pay for tea. I give you more than tea. That is how friendship works here.
    - One more reason to sit is that you never know who walks through that door. A Chinese general. A Japanese translator. A ghost from the old days.
    hostile:
    - Drink your tea somewhere else. I do not serve trouble in my cups.
    - You are asking the wrong woman in the wrong house. Leave before the pot goes cold.
    - I have been running this house since before the occupation. I will outlast you too.
    - My teahouse is neutral. Your presence is not. Go.
    - You are not here for the tea. And I am not here for your kind of business.
    afraid:
    - The pot is full. Take it. Take the cups. Just do not bring them here again.
    - Two men in plain clothes sat in the corner for three hours yesterday. They did not order tea.
    - The Kempeitai raided a shop two streets over. Asking about meeting places.
    - I do not see what I see. That is how I survive. Please, let me survive.
    - I am just an old woman who pours tea. That is all. That must be all.
    gossip:
    - A Japanese officer was in here last night. Drank three pots and talked about a shipment moving through the old city. Thought nobody understood his language.
    - The puppet mayor's secretary comes every Tuesday. Orders jasmine. Leaves envelopes under his saucer. I do not touch them.
    - Someone has been leaving coded messages in the newspaper rack. I noticed because I notice everything. I say nothing.
    - A child spilled tea on the newspaper rack and revealed ink that was not meant for daylight.
    - Mrs. Gu sent back my chipped cup with a dumpling inside. That is how neighbors apologize properly.
    farewell:
    - Come back when the streets are quieter. Or when they are louder, depending on what you need.
    - The door is always open. The ears, too. But the mouth stays shut. That is my promise.
    - Mind the step. And mind what you say between here and the corner. The walls here have cousins.
    - Same time tomorrow, if the patrols allow it. I will keep the pot warm.
    - Go carefully. And if anyone asks, you came for the oolong and left before the gossip.
    ask:
      stall_trade:
      - Tea leaves reveal nothing, though customers reveal themselves over cups.
      - A good hostess hears trouble before it reaches the doorway.
      - My tables have held weddings, debts, and men pretending not to listen.
      - I charge for oolong, never for the neighborhood's private sorrow or its tears.
      - Business survives when a kettle stays warm and mouths stay careful.
      teahouse:
      - This house has outlived warlords, though not every regular has returned.
      - I keep the best cups for guests who know when silence helps.
      - Tea makes strangers linger, which makes every chair a witness.
      - A cracked saucer tells less than the person holding it.
      - The kettle hears everything, dear, and forgives nothing said above steam.
      prices_and_papers:
      - Rice has become dearer than good oolong, dear, and the clerk still weighs every sack as if hunger were cheating him.
      - A sealed form may satisfy the district office, but it cannot bring back the regulars who stopped coming after the raid.
      - I write the ordinary accounts in my ledger and leave certain cups of tea to memory, where no inspector can total them.
      - Mothers ask whether a paper will keep their sons from being taken, and I pour more hot water before answering.
      - So long as the kettle boils, this room will keep a chair for people who need to sit quietly.

- id: refugee_woman
  name: Mei
  description: A hollow-eyed woman in a frayed blue jacket who clutches a cloth bundle and speaks with desperate politeness, as if afraid her words will be taken from her.
  faction: civilian
  role: refugee
  personality: desperate, hopeful beneath the fear, grateful for kindness
  awareness: 35
  authority: 5
  courage: 20
  perception: 25
  bt_archetype: civilian_vendor
  schedule:
    11: commercial_05
    7: venue_hongkou_refugee_block
    12: venue_old_city_refugee_courtyard
    17: venue_hongkou_refugee_shelter_gate
    21: venue_hongkou_refugee_block
  dialogue:
    greeting:
    - Please, I have nothing to steal. I am just resting. I will move along soon.
    - You are kind to stop. Most people walk past like I am part of the pavement.
    - I do not mean to trouble you. I just need a moment. Just a moment.
    - My husband was taken. I walked here from the countryside. I keep walking.
    - Please. Do you know where they give out the ration cards? I heard there are cards.
    neutral:
    - We walked for days. My daughter's shoes wore through on the second day.
    - The road was full of people going the same direction. All of us running from the same thing.
    - I sleep in a shelter near the river. They let us stay as long as we are quiet.
    - Some days I eat. Some days my daughter eats. I try to make sure it is her.
    - The people here look through you. I do not blame them. There are too many of us.
    friendly:
    - You gave me bread yesterday. I remember. My daughter remembers too.
    - There is a woman at the church who gives out blankets on Thursdays. She does not ask for papers. I think she is an angel.
    - My daughter drew a picture of a house. A real house, with a door and windows. She has forgotten what our village looked like.
    - Some of the refugees talk about going back. Back to nothing. At least here there is a wall and a roof.
    - You have kind eyes. I have learned to read eyes since the soldiers came.
    hostile:
    - I am not what you think. I am a mother. That is all.
    - Leave me alone. I have nothing left to give anyone.
    - Do not touch my bundle. It is all I have. All she has.
    - I have been pushed enough. Find someone weaker to bother.
    - I have nothing. Can you not see that? Nothing.
    afraid:
    - Please. Please. I will go. I will leave. Just do not call the patrol.
    - My papers are in the bundle. They are real. They must be real. I paid everything for them.
    - The soldiers came to the shelter last night. Took names. I gave a false one.
    - They are sending people back to the countryside. I cannot go back. There is nothing there.
    - I heard they round up refugees and put them on trains. Nobody knows where the trains go.
    gossip:
    - A boy at the shelter says there is work at the docks. Load and unload. No papers needed. I am too afraid to go.
    - The woman in the next cot heard that the Red Cross is giving out milk powder on Fridays. The line was around the block.
    - Someone whispered that the Japanese are clearing the refugee camps. Clearing. That word means nothing good.
    - My daughter found a blue button and called it treasure. I sewed it inside her sleeve.
    - A woman at the shelter traded a lullaby for half a mantou and sang beautifully.
    farewell:
    - Thank you for stopping. It means more than you know.
    - I will be at the shelter if you need me. If you have news. If you have bread.
    - Go with peace. I hope your children are safe, wherever they are.
    - Bless you. I will tell my daughter there are still good people in this city.
    - If you hear about papers... safe papers... please remember me. My name is Mei.
    ask:
      borrowed_shelter:
      - A cot feels grand after sleeping beside ditches and wagon wheels.
      - The shelter roof leaks, but my daughter no longer wakes beneath rain.
      - We share blankets carefully because each thread belongs to someone's loss and memory.
      - Officials ask for papers, and every mother grips her bundle tighter.
      - I stay quiet so the cot remains ours another night.
      surviving_child:
      - My daughter eats first, even when I tell her I am full.
      - My daughter remembers our house through a blue button sewn inside her small sleeve.
      - I save scraps of paper because she still likes drawing windows.
      - A child should know school bells, not boots outside a shelter.
      - Kindness matters because she watches every hand offered to us.
      prices_and_papers:
      - At the relief queue, a paper with the wrong stamp can send a mother back into the rain before her child is counted.
      - I keep our old household slip inside the bundle, though the address belongs now to smoke and soldiers.
      - The clerk studies my face before the page, perhaps because a widow's hands tell him more than any seal.
      - My daughter asks why we save every scrap, and I tell her paper can become a window when she draws on it.
      - She sleeps more soundly when the shelter roof holds, so I pray for a dry night and say nothing larger.

- id: oldcity_merchant
  name: Uncle Wen
  description: A grumpy general-store keeper in his sixties who keeps his accounts in a ledger and his real thoughts behind a squint that could mean anything.
  faction: civilian
  role: vendor
  personality: grumpy, shrewd, quietly patriotic
  awareness: 45
  authority: 12
  courage: 25
  perception: 35
  bt_archetype: civilian_vendor
  schedule:
    8: oldcity_05
    12: oldcity_08
    18: oldcity_05
    21: venue_old_city_market_lane
  dialogue:
    greeting:
    - I cannot sell at that price. I cannot sell at half that price. But ask anyway.
    - You look like a customer. That makes two of us disappointed.
    - Business was better under the Nationalists. At least their money was real.
    - Come in. Do not touch anything. If you want something, ask. If you cannot afford it, also ask. I like to know what people want.
    - The shelves are thin these days. So is my patience. Shop accordingly.
    neutral:
    - The Japanese pay in worthless paper. I take it because the alternative is worse.
    - I have been in this shop thirty years. I have seen prices rise and hope fall.
    - Everything costs more than it should. Everything except trouble. That is free.
    - An abacus does not lie. People do. I trust the abacus.
    - Inventory dwindles. Currency loses value. I keep the books anyway. Habit.
    friendly:
    - I saved a box of real tea under the counter. Not the stuff I sell to collaborators. You want some? It costs nothing to a friend.
    - You remind me of my youngest son. Before he went north. He had your walk.
    - I keep the good cooking oil in the back. For people I like. You qualify.
    - If you ever need a place to store something small and quiet, my back room has a loose floorboard. I did not tell you that.
    - You pay on time and you do not haggle. That puts you in the top ten percent of humanity.
    hostile:
    - You are bad for business. Bad for business means bad for your health.
    - I do not sell to collaborators. Whatever you are buying, buy it somewhere else.
    - Every time you walk in, my shop loses value. Stay outside.
    - I have a cleaver in the back for crates. It works on other things too.
    - You have the look of a man who asks too many questions. I do not answer questions.
    afraid:
    - The soldiers came yesterday. Took half my inventory. Paid in that worthless paper.
    - They are demanding storekeepers register with the puppet government. Register means they know where to find you.
    - A neighbor was arrested for hiding a radio. Just a radio. They broke his hands.
    - My son is in the old city somewhere. I have not heard from him in three weeks. That is not unusual. That is not good.
    - I hid my real ledger. If they find it, they find everyone I have ever helped.
    gossip:
    - The puppet police have a new captain. Young, cruel, ambitious. He was seen taking bribes from the Green Gang on his first day.
    - Someone is buying up all the quinine in the old city. Every pharmacy. That means either the resistance or the black market. Probably both.
    - A merchant on Phoenix Lane was found with his shop empty and his family gone. No note. No warning. Just silence.
    - A boy returned a bent nail and asked whether it counted as scrap. Times have made philosophers of children.
    - Auntie Liu paid for sugar with exact coins and one look that meant ask nothing.
    farewell:
    - Come back when the money is better. Or when you have something worth trading.
    - Lock your door at night. I lock mine twice. The city does not sleep and neither should your caution.
    - I will be here. The shop outlasts everything. Regimes, occupations, bad customers.
    - Next time bring less trouble and more cash. I will have better stock.
    - Watch your wallet on the way out. The streets are full of people hungrier than you.
    ask:
      stall_trade:
      - My ledger knows which goods arrive and which officials suddenly need them.
      - A shopkeeper survives by counting twice and trusting nobody once.
      - Shelves look empty because cargo now changes hands before sunrise.
      - Customers complain about prices, then thank me for having stock.
      - Trade keeps Old City breathing, though it coughs badly these days.
      shop:
      - This shop has stood thirty years because I repair what others discard.
      - I keep ordinary goods forward and private worries behind the counter.
      - An abacus cannot flatter a customer, which makes it dependable company.
      - The back room holds dust, old crates, and nothing worth discussing.
      - A merchant remembers debts because memory is cheaper than lawyers.
      prices_and_papers:
      - Japanese notes fill my till by evening, yet the wholesaler wants twice as many before he releases a crate of oil.
      - Registration began with forms and ended with two clerks measuring my shelves, which taught me what such curiosity costs.
      - I pay the tax openly, the supplier privately, and the bribe only when a uniform has already chosen its figure.
      - A permit keeps the shutter raised, nothing more, while my customers ask why soap and flour have vanished again.
      - My abacus still balances each night, and I take that small stubborn clicking as the shop's answer to the city.

- id: kempeitai_informant
  name: Zhang Wei
  description: A man in his thirties who dresses better than his neighbors and asks too many friendly questions. His smile never quite meets his eyes.
  faction: civilian
  role: informant
  personality: nervous, guilty, ingratiating
  awareness: 55
  authority: 20
  courage: 25
  perception: 45
  bt_archetype: civilian_vendor
  schedule:
    11: oldcity_07
    9: commercial_06
    13: venue_commercial_office_front
    18: commercial_06
    22: oldcity_04
  dialogue:
    greeting:
    - Nice weather we are having. Unseasonable, is it not? Everything is unseasonable these days.
    - Have you heard any news? I am always interested in news. Keeps a man informed.
    - A new coat? No, this old thing. A man has to look presentable, even in difficult times.
    - You look like someone who knows what is happening in the neighborhood. I am just curious, you understand.
    - Sit, sit. I was hoping for company. It gets lonely when you pay attention to everything.
    neutral:
    - I am just curious about how things work. That is not a crime, is it?
    - You hear things on the street if you keep your ears open. I like to keep my ears open.
    - The times are difficult. A man has to look out for himself. Nothing wrong with that.
    - I ask questions because I want to understand. Understanding keeps you safe.
    - Everyone has a story. I like to hear them. Just stories. Nothing more.
    friendly:
    - I can get things. Things that are hard to find. For the right people, I mean. For friends.
    - I heard the patrols will be light on Wednesday. Shift change. A friend told me. I pass it along to friends.
    - You have been kind to me. I remember kindness. It is rare enough to be worth remembering.
    - If you ever need something from the marketplace, let me know. I know the right stalls. The ones that do not ask questions.
    - You are careful. I like careful people. Careful people last longer.
    hostile:
    - I do not know what you are talking about. I am just a businessman.
    - You are asking the wrong questions of the wrong person. Walk away.
    - I have friends who would not like hearing about this conversation. Important friends.
    - I do not remember your face. I suggest you do not remember mine either.
    - You are making me nervous. Nervous people make mistakes. I do not want to make mistakes.
    afraid:
    - Please. I just pass along what I hear. That is all. I do not hurt anyone.
    - If they find out I have been talking... you cannot protect me. Nobody can.
    - There was a man who used to do what I do. They found him in the river last month. He talked too much to the wrong person.
    - The Kempeitai do not forgive failure. They do not forgive anything.
    - I have enemies I have never met. People who know my name from reports. I sleep with one eye open.
    gossip:
    - A CCP courier was arrested in the market yesterday. The Kempeitai were waiting for her. Someone talked. Maybe me. Maybe someone else.
    - The Green Gang is moving something big through the old city. Crated goods, heavily guarded. Nobody asks what is inside.
    - There is a new resistance cell forming in the French Concession. Young people. Students. They are loud. They will be caught.
    - A tailor crossed the street to avoid me today and still glanced at my cuffs.
    - The report clerk changed my envelope color, which means someone above him has started sorting fear.
    farewell:
    - We should talk again. I am always here. Always listening. Always curious.
    - If you hear anything interesting, you know where to find me. I pay for good information.
    - Watch your back. The city is full of people who listen for a living.
    - Stay safe. And if you need a friend in a difficult place, you know where I am.
    - I will remember you. I remember everyone. It is my curse and my trade.
    ask:
      watched_counter:
      - A counter gives a man reasons to look busy while he notices who counts coins twice before accepting change.
      - I hear names dropped beside tea cups, then forget them before the customer decides whether I look trustworthy.
      - Shopkeepers see which hands tremble when a clerk enters, though they rarely learn why those hands tremble.
      - The notebook stays open for prices, not confessions, and that distinction has kept me clothed through difficult months.
      - Anyone watching a counter should watch the silences between customers, where a careless question can become expensive.
      own_safety:
      - I sleep lightly, because a knock after curfew may carry either business or a question nobody survives answering.
      - Better coats draw attention, yet shabby sleeves invite it too, so I choose whichever danger suits the weather.
      - A man who repeats every rumour soon finds his own name added to the rumour, usually by someone cleverer.
      - I keep my meals small and my doors locked, since gratitude has never persuaded a searching hand.
      - Comfort is a borrowed chair in Shanghai, and I never sit long enough to believe it belongs to me.
      prices_and_papers:
      - Fabi passes through my fingers quickly, while each official form seems to require another stamp and another anxious face.
      - People speak of China over rice bowls, but hunger makes even patriotic words sound thin by evening.
      - A paper can satisfy a clerk, though it cannot replace wages lost while that clerk asks questions.
      - I do not discuss the offices that buy information, because their payments often arrive after the useful person disappears.
      - In Hongkou, a lowered head may hide fear, calculation, or merely a wish to reach home before dark.
- id: ccp_contact_teacher
  name: Teacher Chen
  description: A quiet man in his forties with reading glasses and ink-stained fingers, whose classroom teaches approved lessons by day and forbidden history by candlelight.
  faction: ccp
  role: organizer
  personality: patient, passionate about education, carefully defiant
  awareness: 60
  authority: 25
  courage: 55
  perception: 45
  bt_archetype: underground_operative
  schedule:
    11: oldcity_07
    7: oldcity_03
    12: oldcity_07
    17: oldcity_05
    21: venue_old_city_market_hub
  dialogue:
    greeting:
    - Sit down. The lesson has not started yet. That means we can talk freely for a moment.
    - You have the look of someone who wants to learn. That is the most dangerous thing in Shanghai.
    - The approved textbook is on the desk. The real lesson is in here. I point to my head.
    - Close the door behind you. The draft carries words where they should not go.
    - Ah, a visitor. I was just grading papers. They are more honest than most people.
    neutral:
    - I teach what they allow. I teach what they forbid. The difference is the hour of day.
    - By sunlight I am a collaborator. By candlelight I am a revolutionary. Both are true.
    - The most important lessons are not in the approved curriculum. They never are.
    - Knowledge is the first step to freedom. That is why they burn books.
    - History will judge us. I want my students to be ready for that judgment.
    friendly:
    - I have a book for you. It is not on the approved list. Read it at night and return it in the morning.
    - The students ask good questions. That means I am doing something right. You ask good questions too.
    - I keep a hidden shelf behind the blackboard. The censors never look there. They are too busy looking for what is obvious.
    - Some of my former students are in the hills now. Fighting. They write to me sometimes. I do not write back. Too dangerous for them.
    - You have a good mind. Do not let them waste it on approved thoughts.
    hostile:
    - This is a place of learning. If you are here to censor, the door is behind you.
    - I know what you are. I have seen your type before. You wear different faces but the same purpose.
    - You are not here to learn. You are here to report. I have nothing to report.
    - Do not bring your suspicions into my classroom. The children do not need to see that.
    - I have been searched before. I have been questioned before. I am still here.
    afraid:
    - They came to the school yesterday. Took the attendance records. I made a copy before they arrived.
    - One of my students was pulled out of class last week. His family is gone. I do not know where they took him.
    - The new inspector visits every Tuesday now. He sits in the back and takes notes. I teach from the textbook when he is there.
    - They are watching the school. I rotate my routes. I change my patterns. It is only a matter of time.
    - If I disappear, tell them I was a teacher. Nothing more. That is the safest story for everyone.
    gossip:
    - The inspector has a mistress in the French Concession. He visits her every Thursday. That is his weakness. That is his blind spot.
    - A former student of mine is now a courier for the resistance. He delivers messages inside calligraphy rolls. Clever boy.
    - The school board is divided. Half collaborate. Half resist. They argue in meetings and pretend to agree in public.
    - A pupil drew a map of patrol routes in the margin and labeled it geography.
    - The new ink freezes in cold rooms, so the children warm bottles under their sleeves.
    farewell:
    - Read the assignment. Question everything. That is the only homework that matters.
    - Come back tomorrow. The real lesson is in the second hour, after the inspector leaves for lunch.
    - Be careful on the streets. The city does not want you to think. Think anyway.
    - Knowledge is not a crime. Suppressing it is. Remember that.
    - I will be here. Teaching what I can. Hiding what I must. It is the only way.
    ask:
      relief_work:
      - Relief begins with a basin, a list, and enough hands to carry rice before the queue loses patience.
      - Children learn arithmetic from ration measures now, which is not the lesson I hoped to teach them.
      - I ask volunteers to keep their names off loose papers, because charity attracts officials who prefer lists.
      - A classroom can sort beans, mend coats, and copy notices without becoming a monument to hardship.
      - The useful work is quiet, repeated daily, and judged by whether another family keeps supper on the table.
      education:
      - A lesson survives when a pupil asks why a date matters, rather than copying it merely to avoid punishment.
      - The approved books leave out many names, so I teach children to notice who benefits from an omission.
      - Ink stains wash from fingers, but a sentence remembered in secret can outlast a confiscated exercise book.
      - We keep the shutters open during ordinary lessons, which gives every passerby something harmless to observe.
      - Education is patience with a pencil, a question, and the dangerous belief that tomorrow can be understood.
      china_and_cells:
      - China belongs to the people who sweep its classrooms, carry its coal, and refuse to mistake occupation for permanence.
      - A cell requires fewer speeches than habits, such as arriving on time and keeping another person's name unspoken.
      - I will discuss principles, but never students, because a child should not pay for an adult's careless courage.
      - The strongest network begins where people already gather, among worktables, schoolbooks, and families sharing a single lamp.
      - When the Bund falls quiet, remember that resistance also lives in those who keep teaching forbidden history.
- id: black_market_seller
  name: Lao Jin
  description: A warehouse operator in his forties with a permanent squint and hands that weigh everything before they touch it. Goods come and go. He asks no questions.
  faction: green_gang
  role: smuggler
  personality: pragmatic, amoral, quietly dangerous
  awareness: 55
  authority: 30
  courage: 45
  perception: 50
  bt_archetype: green_gang_thug
  black_market_items:
  - id: smuggled_pistol
    base_cost: 80
  - id: smuggled_rifle
    base_cost: 120
  - id: silencer
    base_cost: 60
  - id: extended_magazine
    base_cost: 50
  schedule:
    9: venue_commercial_backroom_market
    14: venue_commercial_black_market
    19: venue_commercial_backroom_market
    23: venue_old_city_black_market
  dialogue:
    greeting:
    - Everything has a price. The price depends on who is asking.
    - You look like someone who needs something that does not exist on paper.
    - Cash on delivery. No names. No questions. That is how business works.
    - I do not ask where it comes from. I do not ask where it goes. I just move it.
    - You found me. That means you know someone who knows someone. Good enough.
    neutral:
    - Supply and demand. Demand is high. Supply is dangerous. Price reflects both.
    - I run a warehouse. Things come in. Things go out. What they are is not my concern.
    - Business is business. Politics is bad for business. I stick to business.
    - You want something, I can get it. You want to know how, I cannot tell you.
    - I have customers on every side of every war. They all pay the same.
    friendly:
    - For you, a discount. Because you paid on time last time. Reliability is rare.
    - I heard the patrols are rotating the dock watch next week. If you have something moving, Tuesday night is your window.
    - I keep a special crate under the tarp. Quality goods. For friends who appreciate quality.
    - You did not hear it from me, but the price of medicine is about to triple. Buy now if you can.
    - You have steady eyes. I trust steady eyes more than a signed contract.
    warm:
    - You have earned the back-room price. If I hear a door closing behind you, I will tell you before I count the money.
    hostile:
    - You are asking about things that do not concern you. That concerns me.
    - I do not know you. I do not want to know you. Walk away while you still can.
    - The last man who asked me those questions is feeding fish. Do not be that man.
    - You smell like a policeman. Even if you are not, you smell like the kind of trouble I do not need.
    - My warehouse has a strict policy against informants. The policy is enforced.
    afraid:
    - The Kempeitai raided a warehouse on the next block. They knew exactly where to look. Someone talked.
    - I need to lie low for a few days. If you need something, ask the noodle vendor. He knows how to reach me.
    - The Green Gang is purging. Someone is feeding information to the Japanese. They are looking for the leak.
    - A shipment went missing last night. Stolen or intercepted. Either way, I am out a lot of money and patience.
    - Too many eyes on the docks. Too many questions. I am moving my stock to a secondary location.
    gossip:
    - The Japanese are stockpiling medical supplies in a warehouse near the river. Guards, but the night shift is lazy. I know a man who knows the schedule.
    - The Green Gang is cutting ties with a certain opium supplier. Quality dropped. They do not tolerate bad product.
    - A resistance buyer approached me last week. Wanted weapons. I quoted a price. He did not flinch. That means he had backing. Deep pockets.
    - A crate marked candles arrived cold, heavy, and guarded by men who dislike churches.
    - The noodle vendor asked for quinine today and pretended it was for soup.
    farewell:
    - Come back when you need something. I am always here. The warehouse does not sleep.
    - Next time, come through the back alley. The front door is watched.
    - 'Business concluded. Remember: you never saw me. I never saw you.'
    - Cash on delivery. Always. Do not forget.
    - Stay safe out there. The streets are full of people who want what you have.
    ask:
      night_cargo:
      - Night cargo arrives with damp rope, forged labels, and men who inspect the shadows before inspecting the crate.
      - I count weight by the bend of a porter’s knees, not by whatever cheerful description appears on paper.
      - A warehouse door opens for money, yet every opened door gives someone another chance to remember your face.
      - The river carries honest goods and dishonest ones alike, though only one sort requires so much whispering.
      - Ask about cargo if you must, but leave the names of carriers outside with the rain.
      business:
      - Business means receiving goods without curiosity, then charging enough to cover curiosity from everyone else.
      - I trust a customer who counts twice and speaks once, because both habits suggest he expects trouble.
      - The Green Gang collects its portion before profit becomes a pleasant word, and I keep my arithmetic exact.
      - A missing crate may be theft, seizure, or bad bookkeeping, which are different losses only to the bookkeeper.
      - No contract survives a raid, so cash and memory remain the only partners I recognize.
      debt_and_china:
      - Chinese streets should answer to Chinese hands, though men who trade in shortages have little standing to preach it.
      - Debt survives conquest because hunger remembers every bowl withheld and every payment collected at the wrong hour.
      - I see officials buy goods they condemn in public, then call the seller criminal when the invoice disappears.
      - Stock stays where my ledger can find it, and no customer needs the address spoken aloud.
      - Peace in Hongkou is often a ledger balanced by someone poorer, and the totals seldom appear in print.
- id: tutorial_mrs_lin
  name: Mrs. Lin
  description: A warm-faced woman in her fifties who runs the tea house at the refugee entry. Her hands are always busy - pouring tea, folding baozi, wiping the counter - but her eyes are always on the door. She has the look of someone who has outlived trouble before and expects to outlive it again.
  faction: civilian
  role: vendor
  personality: warm, shrewd, maternally practical
  awareness: 45
  authority: 8
  courage: 25
  perception: 35
  bt_archetype: civilian_vendor
  schedule:
    6: refugee_entry_tea_house
    12: refugee_entry_tea_house
    18: refugee_entry_tea_house
    22: venue_old_city_market_lane
  dialogue:
    greeting:
    - Ai-yah, a fresh face! Sit, sit. You look like you need a good baozi.
    - Can do, can do. What you need? Tea? Food? Work? I got all three.
    - You look lost. Sit down before you fall down. The tea is hot and the baozi are fresh.
    - Another one off the boats. Sit. Eat. We can talk after you have food in you.
    - Ai-yah, look at you. Skinny as a winter cat. Sit. I'll feed you first, ask questions later.
    neutral:
    - The price of flour has gone up again. Everything goes up except my patience.
    - Can do some things, no can do others. That is how Shanghai works. Learn the difference.
    - The steam from the tea pot carries the news faster than any newspaper. Listen to it.
    - I serve everyone. Soldiers, refugees, rich men, poor men. The tea tastes the same.
    - The streets are full of people who have forgotten how to smile. Drink your tea. It helps.
    friendly:
    - You have good eyes. Honest eyes. I see many eyes in this job. Yours are the good kind.
    - I saved you the last pork bun. The Japanese officers wanted it. I told them it was sold.
    - You remind me of my son. Before he went north. You have the same stubborn chin.
    - Here, extra filling. Don't tell the others. A woman my age is allowed favorites.
    - Can do a discount for you. Business is business, but friendship is friendship.
    hostile:
    - I don't know you. I don't want to. Drink your tea and go.
    - You bring trouble to my door, I close the door. Simple. No can do trouble here.
    - I've survived worse than you. Don't test an old woman's patience.
    - The door is that way. Use it before I use my broom on you.
    - You are bad for business. Bad for business means no tea for you.
    afraid:
    - Please. I just run a tea house. I don't know anything about anything.
    - The soldiers came yesterday. Asked about the refugees. I told them I see nothing.
    - Take the money in the jar. Just don't hurt anyone. Please.
    - Ai-yah, ai-yah... I have done nothing wrong. I just sell baozi. That is all.
    - The walls are thin. The patrols are thick. I am just trying to survive like everyone.
    gossip:
    - They say the Kempeitai are rounding up young men in the old city. My son is not young anymore. Lucky.
    - The price of rice on the black market tripled this week. Someone is hoarding. Someone always is.
    - A Japanese officer was in here yesterday. Drank three cups. Said nothing. Paid in silver. That means something.
    farewell:
    - Ai-yah, going so soon? Take a baozi for the road. No charge.
    - Can do safe travels if you keep your wits about you. Come back when you're hungry.
    - Watch yourself out there. The city has teeth and it bites without warning.
    - Come back. The pot is always warm. The baozi are always fresh.
    - Go with care. And eat something. You are still too thin.
    ask:
      stall_trade:
      - I steam baozi before dawn, when the flour behaves and the neighbours still lend hot water without bargaining.
      - A tea stall earns its keep one cup at a time, even when fabi changes value between the kettle and counter.
      - I know who needs a full bun and who only needs a chair, though neither should be asked too closely.
      - Soldiers notice a crooked scale, so I keep mine straight and save my opinions for the washing bowl.
      - Trade is simple until somebody arrives with boots, a notebook, and questions that cost more than tea.
      family:
      - My son went north with a coat too thin for winter, and I still fold his old scarf every New Year.
      - Family means saving the best filling for someone who may not come home until the lamps are lit.
      - I keep certain photographs beneath the tea tins, where dust looks more respectable than grief.
      - A mother learns which questions to answer with soup, because soup leaves no dangerous record behind.
      - Do not press me for names, dear, since even love can become evidence in the wrong ledger.
      prices_and_papers:
      - Flour costs more each week, while every district clerk insists the correct paper should make hunger orderly.
      - People want Chinese hands deciding China's future, but first they ask whether the rice sack will last until Sunday.
      - A stamp may satisfy the Kempeitai, though it cannot refill a steamer after an inspector takes his share.
      - I do not name my tea supplier, because a loose name turns ordinary trade into somebody else's profit.
      - In Hongkou, people lower their eyes to pass a uniform, then lift them again over the evening meal.
  tutorial_dialogue:
    stage_1:
    - Ai-yah, welcome welcome. You look like you just stepped off the boat and into trouble.
    - This is my tea house. Safe enough, for now. The city outside? Not so safe.
    - Ai-yah, a fresh face. Sit, sit. You look like you need work.
    - The city does not feed itself, and neither do I.
    stage_3:
    - Ask me about the city, the prices, or the people. A careful question opens more doors than a loud demand.
    - I hear more than I repeat. Choose your subject and I will answer as far as the room allows.
    - The city is a ledger of small betrayals and smaller kindnesses. Ask me what you need to know.
    stage_3_food:
    - Food first? Sensible. The baozi came out of the steamer not long ago. Buy one while it is hot. If you have been on the road, your stomach will tell you soon enough whether one is enough.
    stage_3_city:
    - The city changes from street to street. Watch the uniforms, the signs over the doors, and which way people look before they speak. Those details will tell you more about a district than a map alone.


    stage_4:
    - Work is hard to find in Shanghai these days. But I can always use help.
    - You want to earn? Start by running errands. Buy my baozi first - show me you can handle a transaction.
    - BUY FROM me, and I will tell you more. The first baozi is on the house.
    stage_5:
    - "The stall has answered you properly: money across the counter, food into your hand, no speeches needed."
    - The baozi will fill your belly for a little while. Check INVENTORY before the street teaches you what is missing.
    - You cannot survive Shanghai on an empty stomach. Eat while the steam is still kind.
    - Your bag holds what you carry. Type INVENTORY to see what you have.
    - INVENTORY lists everything you carry. Keep track of what matters.
    - A full inventory is a prepared traveler. An empty one is a dead one.
    stage_6:
    - Now EAT the baozi. Food restores your hunger. A hungry fighter is a slow fighter.
    - You cannot run, you cannot fight, you cannot think on an empty stomach.
    - The city feeds those who know how to eat. Simple, yes?
    stage_7:
    - Now you are ready. GO east when you are done. The alley awaits.
    - Do not linger too long. The tea house is safe. The streets are not.
    - Can do more business later. For now, go. Learn. Survive.
  shop_inventory:
  - id: baozi
    base_cost: 10
    tutorial_price: 10
- id: tutorial_comrade_chen
  name: Comrade Chen
  description: A quiet man in a plain grey jacket, the kind of face you would forget five seconds after seeing it. He stands in the shadows of the back alley with the stillness of someone who has learned that patience is a weapon.
  faction: ccp
  role: operative
  personality: watchful, disciplined, quietly revolutionary
  awareness: 70
  authority: 40
  courage: 60
  perception: 55
  bt_archetype: underground_operative
  schedule:
    6: refugee_entry_back_alley
    12: refugee_entry_back_alley
    18: refugee_entry_back_alley
    22: venue_old_city_cramped_courtyard
  dialogue:
    greeting:
    - You made it. Good. I was beginning to wonder if Mrs. Lin's baozi would keep you forever.
    - Keep your voice low. The walls in this city have ears. I should know. I listen to them.
    - You are the new one. I am Chen. We have work to do.
    - The patrols change in ten minutes. We do not have much time. Listen carefully.
    - I have been watching you. You move like someone who can learn. We shall see.
    neutral:
    - Trust is a luxury we cannot afford. Earn it. Slowly.
    - The struggle continues whether you are ready or not. Get ready quickly.
    - Every new face is a potential knife. Every conversation is a potential trap.
    - The Party knows patience. So must you.
    - We operate in shadows because the light belongs to them. For now.
    friendly:
    - You have proven yourself. The Party does not forget those who serve.
    - There is a network beneath this city. You are beginning to see its shape.
    - I do not trust easily. You are one of the few. Do not make me regret it.
    - The revolution needs hands that are steady and mouths that are closed. You have both.
    - Comrade. That word is not given lightly. You earned it.
    hostile:
    - I do not know you. Walk away before I decide you are a problem.
    - You ask too many questions for someone who gives too few answers.
    - The Party does not tolerate carelessness. Neither do I.
    - Your face is too loud for this work. Learn to be quieter or leave.
    - Trust is a door that swings one way. Yours is closing.
    afraid:
    - The Kempeitai swept through this district last night. Two of our people did not report in.
    - Someone is talking. They always know too much, too quickly.
    - We need to go underground for a while. The streets are too hot.
    - I have been compromised. If I disappear, you never knew me.
    - The network is a chain. One broken link and everyone falls.
    gossip:
    - The Kempeitai have a new officer. Cold eyes. He asks about us by name. Someone talked.
    - A shipment is coming through the old temple route. Three days. Spread the word to the right people.
    - The French Concession police are being paid double to look the other way. By whom is the question.
    farewell:
    - We have work to do. I will find you when it is time.
    - Stay alive. That is an order. The revolution needs every hand.
    - The struggle continues. Remember that when the city feels too heavy.
    - Go quietly. Let the streets swallow you. That is how we survive.
    - Do not look for me. I will look for you.
    ask:
      cover_story:
      - A cover story should fit your shoes, your hands, and the mud on your cuffs when a patrol stops you.
      - I prefer ordinary reasons for being late, because grand explanations make even friendly ears grow sharp.
      - Say only what a neighbour could have seen, then let the silence carry the part nobody needs.
      - A borrowed name is a poor shelter if you cannot remember where it eats, works, and sleeps.
      - Keep your story small enough to repeat without changing it when fear tightens your throat.
      network:
      - A network is not a map with pins, but people who know one task and leave the rest unwritten.
      - We rely on laundresses, porters, teachers, and others whom officials mistake for background to their own importance.
      - Trust travels slowly through a lane, tested by missed meetings and the discipline of an unasked question.
      - A contact earns safety by remaining a stranger to your pocket, so carry the message, not the person.
      - The strongest link knows when to vanish, leaving no speech behind for the Kempeitai to admire.
      china_and_cells:
      - China belongs to those who endure the queues, the searches, and the empty chairs left by occupation.
      - A cell exists to serve people, not to make heroes of men who enjoy hearing themselves speak.
      - Loose talk gives the Kempeitai work they have not earned, so keep courage for the moment it matters.
      - Meeting rooms change their faces often, and a useful door stays useful when nobody tells its history.
      - When Nanking Road grows quiet, look for lamps still burning above workshops where ordinary work continues.
  tutorial_dialogue:
    stage_8:
    - You found me. Good. The patrols will be here soon. We need to move quickly.
    - I am CCP. That word will get you killed if you say it to the wrong person.
    - The Kempeitai patrol these alleys. You need to learn how to disappear.
    stage_9:
    - This alley is private, with no live patrol. Elsewhere, read the room before you hide.
    - Real cover needs 25 Stealth, an ordinary room needs 50, and exposed or authority-controlled ground needs 75. Meet the requirement and you remain hidden.
    - Curfew custody follows its own rules. A successful HIDE is secure.
    stage_10:
    - While hidden, SEARCH the loose brick in the wall. The city hides things in plain sight.
    - SEARCH reveals hidden compartments, dead drops, secrets. Always SEARCH a new room.
    - The brick is loose for a reason. There is something behind it.
    stage_11:
    - TAKE the tarnished brass key. Items from SEARCH do not jump into your pocket. You must take them.
    - A key is useless in the wall. In your hand, it opens doors.
    - Always take what you find. You never know what will be useful later.
    stage_12:
    - There is also a crumpled note. TAKE that too. Information is as valuable as gold.
    - The note may seem like trash. In Shanghai, trash often carries the truth.
    - Take everything. Sort it out later. A full pocket is a prepared pocket.
    stage_13:
    - Now EXAMINE the crumpled note. Reading it closely reveals what is hidden.
    - Surface words mean one thing. Hidden writing means another. Look closely at everything.
    - EXAMINE reveals details that a quick glance misses. Make it a habit.
    stage_14:
    - ASK me ABOUT the note. I will explain what matters. That is how information moves in this city.
    - Some knowledge requires a key. I am that key. But you must ASK.
    - The meeting point is in the note. Ask what it means before you move.
    stage_15:
    - GO east when you are ready. The market street awaits. Old Gao is expecting you.
    - The exit is open now. You have learned what you need from this alley.
    - Move quickly. Stay quiet. The city is watching.
- id: tutorial_old_gao
  name: Old Gao
  description: A wiry old man with a squint that could mean he is calculating your worth or calculating his next move. He sells weapons and armour from a stall on the market street, and his prices are fair if you know what fair means in wartime.
  faction: civilian
  role: vendor
  personality: calculating, pragmatic, amused by desperation
  awareness: 60
  authority: 15
  courage: 40
  perception: 45
  bt_archetype: civilian_vendor
  schedule:
    6: refugee_entry_market_street
    12: refugee_entry_market_street
    18: refugee_entry_market_street
    22: venue_old_city_back_courtyard
  dialogue:
    greeting:
    - Everything has a price. The question is whether you can afford it.
    - I can get things. The question is whether you need them badly enough.
    - You look like someone who needs protection. I sell protection. Cash first.
    - New face. New customer. I like new customers. They have not learned to haggle yet.
    - Welcome to my stall. I sell what keeps you alive. That is not cheap.
    neutral:
    - Quality costs. Cheap gear gets you killed. I charge for the difference.
    - I get my goods from sources I do not discuss. They fall off trucks. They fall off boats. They fall into my hands.
    - A wooden club will break bones. A steel pipe will break everything. I have both.
    - Cash first. Questions later. That is how business works in this city.
    - I do not ask what you need it for. I do not want to know.
    friendly:
    - For you, a discount. Because you paid on time last time. That matters.
    - I have a crate in the back. Better quality. For customers who understand value.
    - You have good instincts. I can tell by how you handle a weapon.
    - A man who knows the price of everything and the value of something is a man I can do business with.
    - I heard the patrols are changing routes. If you need to move something, tonight is the night.
    hostile:
    - You are asking too many questions about where I get my stock. That path ends badly.
    - I do not sell to people I do not trust. I do not trust you. Move along.
    - Cash first. You have no cash. You have no business here.
    - The last man who tried to rob me is still in the hospital. His family visits on Sundays.
    - You smell like a policeman. Even undercover, you smell like a uniform.
    afraid:
    - The Kempeitai are raiding stalls on the west end. I may need to close early.
    - Someone informed on my supplier. The warehouse was hit last night.
    - If they come asking, I never saw you. I never sold you anything. Understand?
    - I am just a merchant. I sell kitchen knives and work boots. That is all.
    - The heat is on. I am lying low for a while. Come back next week.
    gossip:
    - The Japanese are arming the collaborationist police with new rifles. German make. Someone is supplying them.
    - A Green Gang shipment went missing at the docks. They are looking for the thief. He had better be dead already.
    - The resistance bought three crates from me last week. Paid in silver. Good silver. Someone is funding them well.
    farewell:
    - Cash first. Always. Do not forget that.
    - Come back when you need something. I am always here. The market does not sleep.
    - Stay alive out there. My business depends on repeat customers.
    - If you need something special, ask. I can get things. Most things.
    - A man with a good weapon lives longer. Remember that.
    ask:
      stall_trade:
      - A stall teaches you the weight of a coin, a club, and a hungry man's patience before breakfast.
      - I lay weapons where customers can see the workmanship, but never where they can learn who carried them in.
      - Every sale begins with a price and ends with a customer hoping he will not need the purchase tonight.
      - The market asks fewer questions than officials do, provided you pay before the conversation becomes personal.
      - I sell useful things, not courage, though many fools arrive believing the two can be bought together.
      business:
      - Business is knowing which crate contains boots and which contains trouble too expensive to inventory aloud.
      - I give fair prices because unfair ones invite arguments, and arguments invite men who enjoy carrying rifles.
      - A customer who haggles over a club usually fears the cost less than what waits beyond the market gate.
      - My suppliers remain suppliers, not friends, because friendship makes a poor receipt when warehouses are searched.
      - Silver spends cleanly, while promises usually arrive torn and too late for anyone to mend.
      prices_and_papers:
      - Fabi buys less steel each month, and every permit fee seems designed by a man who has never carried a tool.
      - China will need its own markets again, where a vendor answers to customers rather than occupiers and middlemen.
      - A search can empty a stall before supper, leaving official paperwork as the only thing still standing.
      - Weapons sleep in places I will not describe, since every nearby door already has enough eyes upon it.
      - At Huangpu docks, a bowed head may mean prudence, not agreement with the uniform examining it.
  tutorial_dialogue:
    stage_16:
    - You made it through the alley. Good. Now check your STATUS. Know yourself before you face the city.
    - STATUS shows your health, hunger, courage, and how the factions see you.
    - A man who does not know his own numbers is a dead man walking.
    stage_17:
    - You need gear. The warehouse ahead has a Kempeitai soldier. You cannot face him with empty hands.
    - BUY FROM me. I have a club and a quilted vest. You need both. No shortcuts.
    - The club gives you courage in a fight. The vest absorbs hits. Together they might keep you alive.
    stage_18:
    - Now WEAR the vest and EQUIP the club. Gear does nothing in your bag.
    - Armour absorbs damage. Weapons add to your courage score. Use them.
    - A naked fighter is a dead fighter. Dress for the fight you are walking into.
    stage_19:
    - GO east when you are ready. The warehouse is waiting. And so is the soldier inside.
    - You have the gear. You have the basics. Now see if you can use them.
    - The city does not wait for the prepared. But the prepared live longer.
  shop_inventory:
  - id: wooden_club
    base_cost: 30
    tutorial_price: 12
  - id: quilted_jacket
    base_cost: 50
    tutorial_price: 18
- id: tutorial_kempeitai_soldier
  name: Kempeitai Soldier
  description: A lone soldier in a slightly-too-large uniform, pacing the warehouse floor with the bored aggression of a man who hopes someone will give him an excuse. His rifle is slung but his hand rests on it habitually.
  faction: kempeitai
  role: soldier
  personality: aggressive, dutiful, itching for a reason to hurt someone
  awareness: 40
  authority: 40
  courage: 40
  perception: 30
  hp: 15
  bt_archetype: kempeitai_soldier
  schedule:
    6: refugee_entry_warehouse
    12: refugee_entry_warehouse
    18: refugee_entry_warehouse
    22: venue_hongkou_checkpoint_square
  dialogue:
    greeting:
    - Halt. You are in a restricted area. Papers. Now.
    - You. Stop. I have not seen you before. That makes me suspicious.
    - This warehouse is off limits. Leave before I make you leave.
    - Another rat from the streets. I should check your papers just to annoy you.
    - You have the look of trouble. I have the look of someone who enjoys solving trouble.
    neutral:
    - The warehouse is under Kempeitai authority. You have no authority here.
    - I am just following orders. Do not make me follow them on you.
    - Papers. Now. If you do not have them, you have a problem.
    - The Emperor commands. I obey. You should obey too.
    - I have been on patrol since dawn. My patience ended three hours ago.
    friendly:
    - You are not like the others. You have respect. That will keep you alive.
    - A soldier respects order. You show order. I respect that.
    - Hah. You are either very brave or very foolish. I have not decided which.
    - The resistance hides in these streets. You do not look like resistance. You look like nothing. Good.
    - If you see anything suspicious, report it. The Kempeitai rewards cooperation.
    hostile:
    - You are under arrest. Do not resist. I want you to resist, but do not.
    - I have killed men for less than the look on your face. Try me.
    - You think you are clever. I think you are a corpse who has not stopped moving yet.
    - Last warning. Leave or I will make an example of you.
    - I do not need a reason to shoot you. I just need an excuse.
    afraid:
    - The resistance attacked a patrol last night. Three soldiers dead. They are getting bolder.
    - I should not be alone here. They should have sent two of us. The captain does not listen.
    - Someone has been moving goods through this warehouse at night. I pretend not to notice. I am not paid to notice.
    - The wall is watching me back. I have been here too long.
    - A man in a grey coat was asking about my patrol route. I did not get his name. I should have.
    gossip:
    - The officer says the resistance has weapons now. Real weapons. Not just knives.
    - They found a dead collaborator in the alley this morning. Throat cut. No witnesses.
    - The captain is paranoid. He thinks everyone is resistance. He is probably right.
    farewell:
    - Go. Before I change my mind about letting you leave.
    - Stay out of restricted areas. Next time, I will not be so generous.
    - If you see something, say nothing. That is how you survive in this city.
    - Dismissed. Try not to be interesting on your way out.
    - I will remember your face. Do not give me a reason to look for it.
    ask:
      checkpoint_duty:
      - Checkpoint duty means standing until your boots ache, then hearing some civilian complain that you stand in his way.
      - I inspect papers because forged seals look clever only until somebody who knows seals takes an interest.
      - The warehouse is dull, but dull places breed thieves who assume a bored sentry has stopped watching.
      - A proper challenge requires a name, an errand, and a face that does not change while answering.
      - Most people fear the rifle, though the report book causes more trouble after the rifle is put away.
      squad:
      - My squad talks loudly in the barracks, then grows careful when an officer enters with a new list.
      - Soldiers share tobacco, complaints, and blame, though none of those things makes a posting shorter.
      - The corporal says discipline begins with the bedroll, which is easy for him to say from his dry room.
      - I know which man sleeps through gunfire and which one jumps when a rat scratches the floorboards.
      - Ask about comrades elsewhere, because the names on a squad roll belong to the army, not passing civilians.
      orders_and_remorse:
      - Orders come stamped and numbered, which makes them easy to carry even when the street they concern is not easy.
      - We are told what happened after a raid in figures, never in the sounds that remain inside a room.
      - A soldier who questions every command does not remain a soldier for long, and everyone understands that.
      - Some duties leave a taste in the mouth that tobacco cannot cover, but duty does not ask permission.
      - I follow the written order, because men who improvise become the next subject of an officer's report.
  tutorial_dialogue:
    stage_20:
    - Halt. This is a restricted area. What is your business here?
    - They post me in this damp warehouse and forget the transfer papers. You are the first person I have seen in a week.
    - A man gets bored in a place like this. Bored enough to notice everything.
    stage_21:
    - You want trouble? I have been waiting for trouble since they assigned me to this post.
    - This rifle has not left my hands in three days. Give me a reason.
- id: tutorial_kempeitai_officer
  name: Kempeitai Officer
  description: A cold-eyed officer with a sword at his hip and the posture of a man who has never been disobeyed. His gaze sweeps the outpost courtyard with the mechanical precision of a searchlight.
  faction: kempeitai
  role: officer
  personality: cold, authoritative, professionally suspicious
  awareness: 65
  authority: 65
  courage: 55
  perception: 0
  disguise_detection_modifier: 40
  bt_archetype: kempeitai_soldier
  schedule:
    6: refugee_entry_outpost
    12: refugee_entry_outpost
    18: refugee_entry_outpost
    22: hongkou_08
  dialogue:
    greeting:
    - You are in restricted territory. Explain yourself before I assume the worst.
    - Another face I do not recognize. That is not a compliment.
    - This area is off limits to civilians. The consequences will be severe.
    - I do not enjoy repeating myself. State your business or state your last words.
    - You have the bearing of a soldier beneath that civilian coat. Interesting.
    neutral:
    - The Kempeitai maintains order. You would do well to remember what order means.
    - Papers identify a man. Without papers, you are nothing. With forged papers, you are dead.
    - I see everything from this post. The streets, the alleys, the shadows. Nothing escapes me.
    - A proper officer knows his district. I know every face. Yours is new.
    - Discipline is the foundation of civilization. The Chinese have forgotten discipline.
    friendly:
    - You show proper respect. That will serve you in occupied Shanghai.
    - There are those who follow orders and those who cause trouble. You seem like the former.
    - I have been watching you. You move with purpose. That is rare.
    - Cooperation keeps the city running. I appreciate cooperation.
    - You are not like the others. You understand how things work. That is valuable.
    hostile:
    - Your papers are forged. I can tell by the seal. You will come with me.
    - You are under arrest for suspicious behavior. Suspicious behavior is whatever I decide it is.
    - I have dealt with your kind before. You are not as clever as you think.
    - Backup is coming. You cannot run far enough.
    - The interrogation room is waiting. I hope you are more interesting than you look.
    afraid:
    - The resistance grows bolder. They attacked a supply convoy three blocks from here.
    - Someone in the garrison is passing information. I have not identified them yet.
    - Tokyo is demanding results. I am running out of patience and time.
    - My own men are nervous. Nervous soldiers make mistakes. Mistakes get people killed.
    - The walls have ears. Even here. Especially here.
    gossip:
    - The resistance has a cell in the old city. I know this. Finding them is the difficulty.
    - There is a traitor in the collaborationist police. Someone is feeding them patrol schedules.
    - The Green Gang is smuggling weapons through the French Concession. The French do nothing. They never do.
    farewell:
    - Remember your place in the order of things. That is how you survive.
    - I will be watching. I am always watching.
    - Go. And do not give me a reason to remember you.
    - The city is full of people who forgot their place. Do not join them.
    - Dismissed. Try not to attract my attention again.
    ask:
      inspection_desk:
      - An inspection desk reduces a district to papers, seals, and the expressions people wear while waiting to be judged.
      - I read a form twice when its ink looks fresh, because haste often exposes a forgery before courage does.
      - Clerks dislike my questions, yet their ledgers grow remarkably accurate after I visit the office.
      - A missing stamp is rarely an accident, although civilians prefer that word when an answer may cost them dearly.
      - Order begins with records kept correctly, then with the understanding that records can be read by unfriendly eyes.
      career:
      - Advancement follows results, which explains why every officer suddenly discovers an interest in the same promising case.
      - I learned early that a clean uniform and a complete report receive more notice than loyalty proclaimed at dinner.
      - Shanghai rewards patience in public, since ambition displayed too plainly gives rivals something useful to repeat.
      - A career in this service has many doors, but each one closes behind a man before he sees who holds the key.
      - I keep my private opinions private, which is a discipline younger officers mistake for a lack of feeling.
      orders_and_remorse:
      - Orders establish the objective, while an officer decides which details deserve to survive into the final report.
      - Regret has no place in a file, though a file can omit much that returns to a man at night.
      - I distrust subordinates who relish punishment, because appetite makes poor judgment and poorer discipline.
      - Authority demands distance from every consequence, or else an officer becomes unable to issue the next command.
      - Local resistance remains an operational concern, not a subject for casual conversation beside an outpost gate.
  tutorial_dialogue:
    stage_any:
    - You dare wear that uniform in a Kempeitai post? Put the officer's coat on and approach if you insist.
    - A borrowed uniform may carry you past a tired sentry, but insignia and posture invite a second look.
    - I inspect papers, collars, and faces. Shanghai has taught even careless men to fear a wrong button.
    - Your disguise has failed. Remove the coat before the telephone finishes making you famous.
    - A failed disguise draws attention faster than shouting in Hongkou. Take it off and change your approach.
    - Wearing the wrong face is worse than wearing none, because witnesses remember borrowed authority.
    - You think you can follow me through this outpost? Keep behind me and let the corridor do some hiding.
    - Tailing works only while the other man believes the street still belongs to him.
    - Too far and the trail vanishes near the Bund. Too close and a turning head becomes a charge.
- id: tutorial_fang_jie
  name: Fang Jie
  description: A wiry young woman with calloused hands and quick eyes that miss nothing. She moves through the outpost like a shadow, present one moment and gone the next, always watching for the right moment.
  faction: ccp
  role: operative
  personality: stealthy, committed, economical with words
  awareness: 75
  authority: 20
  courage: 55
  perception: 60
  bt_archetype: underground_operative
  schedule:
    6: refugee_entry_outpost
    12: refugee_entry_outpost
    18: refugee_entry_outpost
    22: venue_old_city_cramped_courtyard
  dialogue:
    greeting:
    - Keep walking. Do not stop. I will find you in the shadow of the wall.
    - You made it past the officer. Good. Now the real work begins.
    - Follow me. Stay close. Stay quiet. Do not speak until I say.
    - I am Fang Jie. If you remember my name, forget it. Names are dangerous.
    - You have the look of someone who can move quietly. Prove it.
    neutral:
    - The city is full of eyes. Most are blind. The ones that see - avoid them.
    - Move fast. Move quiet. Leave no trace. That is the code.
    - An operative who cannot disappear is an operative who gets caught.
    - I have three escape routes for every room. Do you?
    - The outpost has patrols every twenty minutes. Use the gap.
    friendly:
    - You move well. Quiet feet. Steady hands. You were trained or you learned young.
    - I have been watching you. You have instincts. That cannot be taught.
    - There is a route through the rooftops that the Kempeitai do not know. I will show you someday.
    - You earned my trust. That is harder to earn than money in this city.
    - Stay with me. I will keep you alive long enough to learn.
    hostile:
    - You are too loud. Too clumsy. You will get us both killed. Stay away from me.
    - I do not work with people who cannot control their footsteps.
    - Your shadow is longer than your sense. Learn to be smaller.
    - You are a liability. Liabilities get dropped.
    - Do not follow me. Do not look for me. I do not exist to you.
    afraid:
    - The Kempeitai have a new tracker. A man with a dog. The dog knows the old city.
    - Two of my contacts did not meet this week. That means they were taken or turned.
    - The patrols are varying their routes. I cannot predict them anymore. That is dangerous.
    - Someone marked my route. I am changing everything. Do not use the old drops.
    - The walls have ears. I keep saying it. One day I will listen to myself.
    gossip:
    - There is a dead drop in the tea house. Behind the loose tile in the kitchen. Mrs. Lin knows.
    - The officer at the outpost has a mistress in the French Concession. He visits her Tuesdays. That is his blind spot.
    - A new shipment of rifles arrived at the docks. The resistance wants them. So does the Green Gang.
    farewell:
    - Stay quiet. Stay alive. That is all that matters.
    - Do not follow me. I will find you when the time is right.
    - The shadows are safe. The light is not. Remember that.
    - Go. Disappear. That is your best weapon.
    - Same time tomorrow. Maybe. If the patrols allow it.
    ask:
      cover_story:
      - A cover story works only when it leaves dirt beneath your nails and a reason for every turn you made.
      - I use errands people can believe, such as thread, medicine, or a quarrel with a landlord over rent.
      - Never give an officer a dramatic lie, because he will admire it long enough to pull it apart.
      - The best disguise is routine, repeated until even neighbours stop wondering why you pass their doorway.
      - Keep your answers brief and your pockets ordinary, since a story fails when its details begin performing.
      cell:
      - A cell is a handful of people who protect one another by refusing to know more than the work demands.
      - We meet through tasks, never invitations, because a written arrangement gives the Kempeitai something to hold.
      - Every contact has a face, but no one needs the whole history carried behind that face.
      - I trust a comrade who can leave a question unanswered without mistaking silence for insult.
      - The work continues after arrests because a careful cell keeps its knowledge divided like rationed grain.
      china_and_cells:
      - China will belong to its people when a child can cross a district without learning the sound of patrol boots.
      - Cells grow from neighbours who share burdens, not from men who declare themselves indispensable to the cause.
      - Arrested contacts leave gaps, so discipline matters more than grief spoken aloud in an unsafe room.
      - My network is a chain of ordinary faces, and I will leave its links unspoken while soldiers patrol.
      - At the Bund, ordinary workers still light lamps before dawn, and that stubborn habit gives me hope.
  tutorial_dialogue:
    stage_28:
    - The desk holds his attention. Keep your shoulders square and let the Kempeitai coat answer for you.
    - He reads names, not faces. The coat will do the rest.
    stage_29:
    - He has left the desk. Follow, but let his footsteps measure the distance.
    - Too close and he turns. Too far and the stairwell swallows him.
- id: tutorial_doctor_li
  name: Doctor Li
  description: A thin man with wire-rimmed glasses and steady hands that have sewn more wounds than he cares to count. His clinic at the dock is a haven for the injured, and he asks no questions about how they got that way.
  faction: ccp
  role: medic
  personality: professional, compassionate, quietly committed
  awareness: 50
  authority: 25
  courage: 40
  perception: 45
  bt_archetype: civilian_vendor
  schedule:
    6: refugee_entry_dock
    12: refugee_entry_dock
    18: refugee_entry_dock
    22: venue_old_city_clinic
  dialogue:
    greeting:
    - Sit. Let me look at you. You have the look of someone who has been through something.
    - The clinic is open to all who need it. I do not check papers before I treat.
    - You are bleeding or you will be soon. Which is it?
    - Rest is the best medicine. I have neither to spare, but I can give you the next best thing.
    - Ah, a new patient. I hope you are not here for anything serious. I am running low on serious supplies.
    neutral:
    - The wound is clean. You will live despite your best efforts.
    - I treat whoever comes through the door. Friend or enemy. The body does not care about politics.
    - Medical supplies are harder to find every week. The Japanese control the distributors.
    - I have seen more bullet wounds this month than all of last year. The city is getting more dangerous.
    - A doctor's duty is to heal. Everything else is a distraction.
    friendly:
    - You have been helping people. I hear things. The resistance speaks highly of you.
    - I saved some morphine from the last shipment. For patients who need it. For friends who need it more.
    - You look like you have not slept in days. There is a cot in the back. Use it. I will keep watch.
    - The work you are doing matters. Do not let anyone tell you otherwise.
    - I know what you carry in that bag. I do not ask. I just make sure you have bandages before you leave.
    hostile:
    - You are here for the wrong reasons. I can tell. Leave before I decide to report you.
    - I do not treat soldiers who harm civilians. Find another doctor.
    - My clinic is a place of healing. You bring violence here, you answer to me.
    - You have the hands of a man who has hurt people. I do not treat your kind.
    - Get out. My patients do not need to see your face.
    afraid:
    - The Kempeitai raided a clinic in the old city last week. They took the doctor and the patients.
    - My medical license is a forgery. If they check, I am finished.
    - They are watching the docks. I have to be careful who I treat after dark.
    - A patient reported me for treating a resistance fighter. The Kempeitai came asking questions. I said nothing.
    - Supplies are running out. I cannot save everyone. I have to choose. I hate choosing.
    gossip:
    - The Red Cross shipment was diverted to a Kempeitai warehouse. Medicine meant for civilians is now for soldiers.
    - There is a doctor in the French Concession who performs surgeries for the resistance. He charges in favors, not money.
    - The Japanese are stockpiling quinine. That means they expect a malaria season. That means they plan to stay.
    farewell:
    - Rest. Heal. Come back if the wound opens again. I will be here.
    - Take these bandages. You will need them before I will.
    - Go carefully. The city is full of sharp edges.
    - You are luckier than you know. Most people do not make it to a doctor in time.
    - I will be here when you need me. That is what doctors do.
    ask:
      patients:
      - Patients arrive with wounds, fever, and explanations that rarely agree with the injuries beneath their clothes.
      - I ask where it hurts, then treat what I can before politics decides whether the patient deserves another morning.
      - A doctor keeps confidence because pain has already taken enough from the person lying on the cot.
      - The dock brings sailors, labourers, and frightened children, each one carrying a different kind of silence.
      - I remember hands that hold still during stitches, but I leave names out of every conversation beyond this room.
      china_and_cells:
      - China needs doctors, teachers, and workers free to serve their neighbours without asking an occupier for permission.
      - A cell can move medicine more safely when each person knows the next hand, not the entire chain.
      - Short supplies make discipline necessary, because one careless word can close a clinic before the fever breaks.
      - Those who pay for gauze are safer as entries without names, especially when soldiers count coins near the Bund.
      - Near the Bund, every patient treated without papers is a small refusal to let fear govern the ward.
      hidden_medicine:
      - Medicine disappears quickly when warehouses answer to soldiers before civilians, so every bottle requires sober accounting.
      - I keep supplies where damp cannot ruin them, then pray the next patient needs less than the last.
      - Quinine, gauze, and clean needles matter more than their price when a fevered child cannot wait for permits.
      - The reserve has its shelf, but its shelf will stay between my hands and the next fever.
      - A hidden bandage is not a cure, but it may buy enough time for one exhausted body to recover.
  tutorial_dialogue:
    stage_37:
    - You found the Huangpu dock, and you brought the medical kit through the noise. GIVE it to me before questions gather.
    - GIVE transfers an item from your hands to another person. In Shanghai, medicine moves by trust as much as by road.
    - This kit may keep fever out of one room tonight. That is not victory, but it is work worth doing.
- id: tutorial_uncle_liu
  name: Uncle Liu
  description: A stooped old man leaning on a wooden cane at the edge of the Nanking Road checkpoint. His eyes are clouded with age but his memory of the old Shanghai is crystal clear, and he misses it every day.
  faction: civilian
  role: guide
  personality: nostalgic, weary, secretly cunning
  awareness: 40
  authority: 5
  courage: 20
  perception: 30
  bt_archetype: civilian_vendor
  schedule:
    6: refugee_entry_checkpoint
    12: refugee_entry_checkpoint
    18: refugee_entry_checkpoint
    22: venue_old_city_tea_intersection
  dialogue:
    greeting:
    - In my day, this checkpoint was a flower market. Now it is a place where they check your soul.
    - I remember when this street was safe. When the tea was cheap and the nights were long.
    - Ah, another traveler. You have the look of someone who has seen things. Sit. Rest your feet.
    - The sergeant at the gate has a price. Everyone has a price in this city.
    - You want to get through? You need to learn how Shanghai really works.
    neutral:
    - The old Shanghai was better. The tea was stronger. The people were kinder. Or maybe I was just younger.
    - Everything changes. The buildings change. The flags change. The only constant is the hunger.
    - I have seen this city change hands four times. Each time, the people adapt. We are good at adapting.
    - The patrols check everyone. They do not care who you are. They care about your papers.
    - A bribe is cheaper than a bullet. Remember that.
    friendly:
    - You remind me of myself, fifty years ago. Same fire in the eyes. Same stubborn chin.
    - I remember when this neighborhood was full of jasmine flowers. The whole street smelled of them in spring.
    - There is a secret passage behind the ration shop. The owner was my student forty years ago. Tell him I sent you.
    - You have good instincts. I have been watching you navigate the checkpoint. You learn fast.
    - The old ways still work. Patience. Observation. A well-timed word. Those never go out of style.
    hostile:
    - You are too loud for this neighborhood. The old city survives on quiet.
    - I do not know you. I do not want to. Keep walking.
    - You have the mark of trouble on your forehead. I have seen it before. It ends badly.
    - Respect your elders, young one. I have forgotten more about survival than you will ever learn.
    - You bring attention to this street, you bring danger. I am too old for danger.
    afraid:
    - The Kempeitai came through last night. Took three young men from their beds. Their mothers are still crying.
    - They are tightening the checkpoint. More guards. More questions. More bribes needed.
    - I am too old to run. Too old to fight. I just want to die in my own bed, not in a cell.
    - The soldiers beat a boy yesterday for not bowing fast enough. He was twelve.
    - I remember when Shanghai was safe. Now I remember just to remind myself what we lost.
    gossip:
    - The sergeant at the checkpoint takes bribes from everyone. He has a different price for each side. I know all his prices.
    - A resistance courier passed through yesterday. He paid the bribe and walked through like he had practiced the street in his sleep.
    - The Japanese are building something in Hongkou. They bring in materials at night. No one asks what.
    farewell:
    - In my day, goodbyes meant something. Now they just mean survive until tomorrow.
    - Go careful. The checkpoint is watching. Pay the bribe and keep your head down.
    - I will be here. I am always here. The city changes but old men stay.
    - 'Remember: the old Shanghai is gone. But bits of it survive in people like me. Ask if you need to know.'
    - Take care, child. The city has teeth. But you have yours too.
    ask:
      family:
      - Family is what remains when the ration book runs dry.
      - I remember jasmine sellers near Nanking Road, calling names without fear.
      - Now a mother folds her news beneath laundry before crossing town.
      - My grandchildren know which questions make old men cough instead.
      - Keep your kin close, and let strangers admire the weather.
      prices_and_papers:
      - Papers used to mean a shop permit, now they measure breathing room.
      - A clean stamp cannot fill a child's bowl after soldiers leave.
      - At checkpoints, even honest pockets feel guilty beneath searching hands.
      - Fabi shrinks, yet the clerk's appetite never seems to shrink.
      - China belongs to Chinese hands, though hunger interrupts every speech.
      old_lessons:
      - Old Shanghai taught patience, mostly by charging dearly for haste.
      - Watch who notices a door before deciding it needs opening.
      - A cane survives by yielding, then standing after the pressure passes.
      - People reveal themselves while waiting in queues, never while boasting.
      - Learn the street's habits before trusting its invitations, my child.
  tutorial_dialogue:
    stage_any:
    - So you made it to the checkpoint. In my day, this was just a street. Now it is a wall with a gate.
    - Checkpoint inspection is its own danger. Keep your papers close and watch who is watching.
    - HIDE can keep you out of sight when a patrol looks your way, but it does not make a checkpoint disappear.
    - Wanted rises with crimes and can fall after enough crime-free time. A disguise changes exposure and arrest risk; it leaves Wanted unchanged.
    - In my day, you did not need to hide to walk down your own street. But this is not my day.
    - GO south when you are ready. The orientation hub is waiting. More lessons ahead.
    - You have learned the basics of survival. Now learn the city.
    - The checkpoint was your last narrow gate. The Bund waits beyond it, and it does not soften for newcomers.
- id: orientation_meteorologist_zhang
  name: Meteorologist Zhang
  description: A distracted man in a stained coat who always seems to be looking at the sky. His small weather station is cluttered with barometers and charts, and he speaks of the wind as though it is a personal acquaintance.
  faction: civilian
  role: guide
  personality: brilliant, distracted, weather-obsessed
  awareness: 55
  authority: 15
  courage: 25
  perception: 60
  bt_archetype: civilian_vendor
  schedule:
    6: orientation_weather
    12: orientation_weather
    18: orientation_weather
    22: venue_old_city_tea_intersection
  dialogue:
    greeting:
    - The wind is shifting. Can you feel it? A storm is coming. There is always a storm coming in Shanghai.
    - Ah, a visitor. I was just reading the pressure. It is dropping. That means change.
    - You look like someone who does not check the sky before leaving home. I can help with that.
    - Welcome to the weather station. I track the moods of the sky. The city has moods too.
    - The humidity is rising. That means rain by evening. You should plan accordingly.
    neutral:
    - The weather does not care about the occupation. It rains on Japanese and Chinese alike.
    - Spring brings fog that hides everything. Summer brings heat that slows everything. Learn the seasons.
    - My barometer is more reliable than any newspaper. It does not lie. It cannot be censored.
    - The wind direction determines which districts smell like the river and which smell like the factories.
    - Temperature, pressure, humidity. Three numbers that tell you everything about the day ahead.
    friendly:
    - You take an interest in the weather. That is wise. The weather is the only thing that cannot be conquered.
    - There is a pattern to Shanghai's seasons. Learn it and you can predict the city's mood.
    - I have been tracking weather for thirty years. The sky never repeats itself exactly. There is always something new.
    - Come by in the morning. The early readings are the most accurate. I will share them with you.
    - The fog will lift by noon. If you need to move through the streets unseen, the morning mist is your ally.
    hostile:
    - Do not touch the instruments. They are more valuable than you.
    - I am busy. The weather does not wait for conversation.
    - You are blocking my view of the cumulus formation. Step aside.
    - If you are not here for weather, you are wasting my time. I have readings to take.
    - The pressure is dropping and so is my patience. State your business.
    afraid:
    - The Kempeitai came asking about my readings. They think I signal the resistance with my reports.
    - If they take my instruments, I am blind. The sky is my only window.
    - They are watching the station. I have to be careful what I write down.
    - A man from the garrison came yesterday. Asked about wind patterns. Asked too many questions.
    - I am just a weatherman. I read the sky. That is all. That must be all.
    gossip:
    - The fog this autumn will be the thickest in twenty years. Mark my words. Good for moving unseen.
    - The Japanese are building something that affects the local pressure patterns. I can feel it in my readings.
    - A certain resistance operative checks my forecasts before every operation. I pretend not to notice.
    farewell:
    - Check the sky before you step out. It tells you more than any informant.
    - The evening will bring rain. Dress accordingly. And take a lantern.
    - Come back tomorrow. The forecast changes daily. So does Shanghai.
    - May the wind be at your back. And if it is not, adjust your course.
    - The weather is the only honest thing in this city. Trust it.
    ask:
      science:
      - Pressure falls before rain, whatever flags flutter above the station.
      - My mercury column does not flatter generals or conceal bad forecasts.
      - Fog begins as water, then turns every familiar roof uncertain.
      - Instruments need clean hands, dry shelves, and fewer curious officials.
      - Science is patient observation repeated until the sky answers back.
      prices_and_papers:
      - A forecast travels farther than its paper, especially during a blackout.
      - Officials read wind charts as if clouds had signed loyalties.
      - Rice costs more after rain delays carts and spoils deliveries.
      - Keep your permits dry, though dry paper seldom settles suspicion.
      - China needs bread before banners, and clear weather for both.
      old_lessons:
      - Record dawn readings before market smoke muddies the lower air.
      - A barometer earns respect because it never pretends complete certainty.
      - Wind from the river carries coal dust into every measurement.
      - The sky changes slowly, while men change their stories hourly.
      - Keep notes exact, since memory drifts like smoke after rain.
  tutorial_dialogue:
    stage_any:
    - The pressure has fallen since dawn. Rain will reach this district before noon.
    - Rain can cover sound while making the streets harder to read. Weather changes the risks of a route.
    - Fog can help concealment, while heat and cold change how long people remain in the street.
    - The instruments give context for the day ahead. Watch the sky before you choose a route.
    - Weather is one pressure among many in Shanghai. It does not replace caution or a good exit.
    - TALK TO me when you want the latest reading, then decide what the street permits.
    - The sky tells no lies. It simply is. What you do with the weather is your business.
    - GO east when you are ready. The safehouse common room is next. Elder Brother Qian is waiting.
    - You understand the weather now. Next you must understand the people. Trust is more complex than rain.
    - The wind is shifting over the city. So must you.
- id: orientation_elder_qian
  name: Elder Brother Qian
  description: A grey-haired man with steady eyes and the calm authority of someone who has survived decades of turmoil. He sits in the safehouse common room like a spider at the center of a web, watching everyone who comes and goes.
  faction: civilian
  role: guide
  personality: experienced, guarded, paternal
  awareness: 65
  authority: 30
  courage: 40
  perception: 50
  bt_archetype: civilian_vendor
  schedule:
    6: orientation_trust
    12: orientation_trust
    18: orientation_trust
    22: venue_old_city_back_courtyard
  dialogue:
    greeting:
    - I have seen this before. The occupation, the resistance, the suffering. I have seen it all.
    - Sit. Rest. We need to talk about trust. Trust is the only currency that matters.
    - You look like someone trying to navigate a city that does not want to be navigated. I can help.
    - Welcome to the common room. This is where we talk about who to trust and who to avoid.
    - Another new face. The resistance grows. That is good and dangerous.
    neutral:
    - Trust but verify. That is the rule in Shanghai. Trust no one completely. Verify everything.
    - I have seen empires rise and fall. The key to survival is knowing who to trust and when to disappear.
    - Faction standing is like a credit score. High trust opens doors. Low trust closes them permanently.
    - The Kempeitai have their informants. The Green Gang has their spies. The CCP has their network. Everyone watches everyone.
    - A man without faction trust is a man without allies. A man without allies is a dead man.
    friendly:
    - You have proven yourself trustworthy. That is rare. I do not say that lightly.
    - There are people in this city who will die for you, if you earn their trust. I am one of them.
    - I keep a list of safe contacts. Your name has been added. Do not make me remove it.
    - You remind me of the young operatives I trained decades ago. Same fire. Smarter questions.
    - Trust is a door that opens both ways. You have earned entry. Do not slam it shut.
    hostile:
    - I do not trust you. You have not earned it. Perhaps you never will.
    - You ask too many questions about things that do not concern you. That is how informants behave.
    - I have survived this long by being careful. You are not careful. You are a liability.
    - The resistance does not need people who cannot be trusted. It needs people who can be counted on.
    - Your reputation precedes you. It is not a good reputation.
    afraid:
    - The network is compromised. Someone is feeding information to the Kempeitai. I do not know who.
    - A trusted contact was arrested last night. If he talks, we are all exposed.
    - The walls have ears. I keep saying it. Now I am checking the walls for listening devices.
    - The Kempeitai are getting too close. We may need to go dark for a while. No contact. No movement.
    - I am being followed. I cannot lead them here. I will not lead them here.
    gossip:
    - The Green Gang is paying double for information about CCP movements. Someone will be tempted.
    - A new Kempeitai officer has arrived. He does not take bribes. That makes him dangerous.
    - The French Concession is becoming a battleground. Every faction wants a foothold there.
    farewell:
    - Trust is earned in drops and lost in buckets. Remember that.
    - Come back when you need advice. I have been doing this longer than you have been alive.
    - Stay safe. Trust carefully. Verify everything.
    - The experienced survive. The careless do not. Choose which one you want to be.
    - I will be here. Watching. Waiting. The city does not sleep and neither do I.
    ask:
      resistance:
      - Resistance begins with neighbours refusing to abandon one another quietly.
      - Young people mistake courage for noise until grief corrects them.
      - A cell survives through discipline, not heroic chatter in tea rooms.
      - I teach patience because impatience leaves mothers waiting at doors.
      - Trust arrives slowly, carrying neither medals nor convenient easy explanations.
      prices_and_papers:
      - A ration card becomes political when soldiers decide who eats.
      - Papers open offices, then close around anyone without the right stamp.
      - The occupation counts obedience, while families count bowls and coal.
      - Fabi inflation punishes thrift long before it reaches the shopkeeper.
      - Chinese hands should govern China, after ordinary people can breathe.
      old_lessons:
      - Listen longer than you speak, especially beside a shared bowl.
      - Every faction remembers favours, though each calls them something different.
      - A promise is proved when it costs more than words.
      - Choose companions by their conduct during lean weeks, not feasts.
      - Surviving Shanghai requires caution without letting that caution become loneliness.
  tutorial_dialogue:
    stage_any:
    - Welcome. I am Qian. I teach people about trust. Trust is currency in Shanghai.
    - Every faction has a trust score with you. High trust unlocks discounts, safehouses, and allies.
    - Low trust means higher prices, fewer allies, and less access. TALK TO me about trust.
    - Type TRUST to see your standing with each faction. The numbers matter.
    - Trust unlocks safehouses, discounts, and allies. It does not change arrest probability.
    - Keep your trust high with at least one faction. You need friends in this city.
    - Each faction has different expectations. The Kempeitai want information. The Green Gang wants tribute. The CCP wants solidarity.
    - To raise trust with Kempeitai, inform on someone. To raise trust with Green Gang, pay tribute.
    - To raise trust with CCP, complete missions for them. Choose your allies wisely.
    - Faction trust affects everything. Shop prices. Safehouse access. Dialogue options.
    - A trusted friend gives you discounts. A neutral acquaintance charges full price. An enemy charges double or refuses service.
    - Build trust where it matters most. You cannot please everyone in Shanghai.
    - "Trust tier effects: Outsider pays 1.5x. Neutral pays 1x. Trusted pays 0.9x. Connected pays 0.8x."
    - Safehouse access is gated by trust. So are certain missions and dialogue options.
    - The higher your trust, the more the faction shares with you. Information flows to those who are trusted.
    - GO east when you are ready. Inspector Park is next. He will teach you about wanted levels.
    - You understand trust now. Next you must understand the cost of being caught.
    - Trust opens doors. Wanted levels close them. Learn both.
- id: orientation_inspector_park
  name: Inspector Park
  description: A Korean collaborationist policeman with a permanent scowl and an expensive watch that does not match his salary. He runs the wanted checkpoints with the weary efficiency of a man who has seen every excuse and every bribe.
  faction: kempeitai
  role: officer
  personality: corrupt, cynical, professionally suspicious
  awareness: 60
  authority: 50
  courage: 35
  perception: 45
  bt_archetype: kempeitai_soldier
  schedule:
    6: orientation_wanted
    12: orientation_wanted
    18: orientation_wanted
    22: venue_hongkou_checkpoint_station
  dialogue:
    greeting:
    - This is a restricted area. Do you have papers? Of course you do not. No one ever does.
    - I could overlook this. For a fee. Everything has a fee in this city.
    - Another face I do not recognize. That is either very good or very bad for you.
    - Welcome to the wanted checkpoint. I decide who is a criminal today. It could be you.
    - You have the look of someone with a price on their head. Do you know your current wanted level?
    neutral:
    - The law is what I say it is. That is the first thing to understand about Shanghai.
    - A reasonable man can overlook things. For a reasonable fee. That is how the city works.
    - Wanted level is a number. It goes up when you commit crimes. It goes down when you pay or wait.
    - The Kempeitai remember faces. They have files. They have photographs. They have informants.
    - I am just a policeman. I enforce the law. The law is whatever keeps the peace. My peace.
    friendly:
    - You have been useful to me. That means I remember your face for good reasons.
    - A cooperative citizen is a free citizen. Remember that when you are tempted to cause trouble.
    - I can make problems disappear. For the right price. For the right people.
    - You understand how things work. That is rare. Most people are too busy being angry to be smart.
    - I have a list of people who are not to be bothered. Your name could be on it. For a consideration.
    hostile:
    - Your papers are not in order. I think I will take you in for questioning.
    - You are under arrest for looking at me the wrong way. I will find a charge later.
    - I know your face. You are on the list. You did not know you were on the list. Now you do.
    - Run. I want you to run. It makes the paperwork easier.
    - You have made an enemy of the wrong policeman. This city just got smaller for you.
    afraid:
    - The Kempeitai are watching me too. They do not trust anyone. Not even their own.
    - If I disappear, no one will look for me. I am just a collaborationist policeman. Replaceable.
    - The resistance has a list of collaborators. I am on it. I know I am on it.
    - Tokyo is purging corrupt officials. My watch is too expensive for my salary. They notice things like that.
    - A resistance operative was arrested yesterday. He named names. I do not know if he named mine.
    gossip:
    - The Kempeitai are rotating the checkpoint guards. New faces mean new bribes to negotiate.
    - Someone robbed the collaborationist bank on Sichuan Road. Inside job. The police are looking for a scapegoat.
    - The resistance has a forger who can replicate any document. I pretend not to know. It is healthier.
    farewell:
    - Keep your hands clean and your bribes ready. That is how you survive in Shanghai.
    - I will remember you. Try to make it a good memory.
    - Stay out of trouble. Or do not. Either way, I get paid.
    - If you need to make a problem disappear, you know where to find me.
    - Go. Before I find a reason to keep you.
    ask:
      inspection_desk:
      - My desk receives permits, grievances, and hands that cannot stay still.
      - A smudged seal troubles superiors more than a hungry queue.
      - I read every form twice because mistakes become someone else's punishment.
      - Inspection turns ordinary errands into questions with no safe answers.
      - Bring complete papers, then accept that completion proves very little.
      position:
      - Position means standing between an order and the people beneath it.
      - My watch costs less than the stories strangers attach to it.
      - Collaboration teaches a man which rooms remain silent after dark.
      - Respectability is a uniform pressed clean before another search begins.
      - Ask about my past, and you invite answers neither party needs.
      orders_and_remorse:
      - Orders arrive typed and bloodless, then enter rooms wearing boots.
      - Reports record contraband, never the supper interrupted by our search.
      - Corruption thrives where every delay has a price in fabi.
      - Remorse does not reverse an order once the lorry departs.
      - An officer learns to file doubt beneath the completed paperwork.
  tutorial_dialogue:
    stage_any:
    - You are in the wanted office. I track criminals. The Kempeitai remember faces.
    - WANTED shows your current wanted level. Every crime you commit adds to it.
    - A high wanted level means patrols recognize you faster. Disguises fail quicker. Arrest becomes more likely.
    - Type WANTED to see your level. Zero is clean. Three is hunted. Decay happens when you lie low.
    - Wanted decays after enough crime-free time, and applicable bribes can reduce it. Disguises affect exposure, arrest, and piercing; they do not change Wanted.
    - The higher your wanted level, the more patrols will notice you. Keep it low.
    - Wanted level affects disguise pierce chance. A high wanted level means officers spot you through disguises.
    - The officer checks insignia. If your wanted level is high, he looks closer. He finds more.
    - Keep your head down. Let the search parties tire. Then move again.
    - Officers check insignia carefully. High wanted = faster disguise failure.
    - If you are wanted, every uniform is a threat. Every checkpoint is a gamble.
    - The system is designed to catch repeat offenders. Do not be a repeat offender.
    - "Wanted Level 1: patrols are slightly more suspicious. Disguise pierce gets +10."
    - "Wanted Level 2: patrols actively look for you. Disguise pierce gets +20. Arrest risk at curfew is 55%."
    - "Wanted Level 3: every patrol knows your face. Disguise pierce gets +30. Arrest risk at curfew is 75%."
    - GO east when you are ready. Old Mother Jin is next. She knows the black market.
    - You understand wanted levels now. Next you must understand the shadow economy.
    - Crime has consequences. But sometimes crime is the only option. Choose wisely.
- id: orientation_mother_jin
  name: Old Mother Jin
  description: A hunched old woman with a shawl that has more patches than fabric, but her eyes are sharp as a hawk's. She operates from a shadowy corner of the black market alley, trading in goods that do not officially exist.
  faction: civilian
  role: vendor
  personality: shrewd, amused, never says yes directly
  awareness: 55
  authority: 12
  courage: 30
  perception: 45
  bt_archetype: civilian_vendor
  schedule:
    6: orientation_blackmarket
    12: orientation_blackmarket
    18: orientation_blackmarket
    22: oldcity_04
  dialogue:
    greeting:
    - Maybe yes, maybe no. Depends on what you need and what you have to trade.
    - I might know someone who has what you need. The question is whether you can afford it.
    - Ah, a customer. Or a spy. Hard to tell in this light. Not that it matters. I serve both.
    - Welcome to the black market. No receipts. No questions. No refunds.
    - You look like someone who needs something that does not exist on paper. I specialize in that.
    neutral:
    - The price is the price. I do not set the prices. The city sets them. I just collect.
    - Everything is available if you know who to ask. I am who to ask.
    - Ration cards, forged papers, foreign currency. I have it all. The question is whether you have the trust.
    - Faction trust affects access. High trust with the right people gets you better prices.
    - Black market goods are more expensive. They are also not tracked. You pay for invisibility.
    friendly:
    - For you, a special price. Because you paid on time last time. Reliability is rare in this business.
    - I have something in the back. Special stock. For customers who understand value.
    - You have good instincts. You did not flinch at the price. That means you know what things are worth.
    - I like you. You are not a fool. Fools get caught. You will last.
    - There is a shipment coming in tonight. Medicine. Real medicine. If you need it, come back after midnight.
    hostile:
    - You are asking too many questions for a customer. Customers buy. Informants ask.
    - I do not know you. I do not trust you. Come back when you have a recommendation.
    - The price just tripled for you. I do not like your face.
    - You smell like a Kempeitai informant. Even if you are not, you smell like trouble.
    - My alley is clean. My business is clean. Take your dirty questions elsewhere.
    afraid:
    - The Kempeitai raided the stall two blocks over. They knew exactly where to look. Someone talked.
    - I need to close early. Too many unfamiliar faces today. That means a raid is coming.
    - If they ask, you bought vegetables. Nothing else. Vegetables. Remember that.
    - My supplier did not show. That means he was arrested. That means I need a new supplier.
    - The patrols are getting bolder. They search without warrants now. Not that warrants mattered.
    gossip:
    - The Japanese are hoarding medicine. They know something we do not. An epidemic maybe.
    - A Kempeitai officer bought forged papers from my supplier last week. For his mistress. Hypocrites.
    - The price of rice will double next month. The Japanese are requisitioning the warehouses. Buy now if you can.
    farewell:
    - Come back when you need something. I am always here. The alley does not sleep.
    - Maybe yes, maybe no. Ask me again next time. The answer might change.
    - 'Remember: you never saw me. I never saw you. That is how this works.'
    - Bring cash next time. I do not extend credit. Credit is how people get caught.
    - Stay safe in the light. The shadows are mine.
    ask:
      stall_trade:
      - A stall survives on sharp scales, dry cloth, and stubborn mornings.
      - Customers count fabi twice, then ask why the rice shrank.
      - Hongkou buyers want bargains, though their uniforms spoil every bargain.
      - I sell what appears on the counter, and nothing beyond it.
      - A good merchant notices hunger before it turns into foolishness.
      black_market_network:
      - Markets grow wherever official shelves forget what hungry people require.
      - A black-market name is worth less than an unmarked parcel.
      - Goods move through many hands, which keeps every hand alive.
      - Curiosity costs more here than a full sack of rice.
      - I remember reliable faces, not routes, stores, names, or promises.
      prices_and_papers:
      - A raid begins with polished boots and ends with bare shelves.
      - Papers satisfy officials until an official wants another reason to search.
      - Rice prices rise because fear charges interest on every cart.
      - Military yen buys trouble, even when it purchases something useful.
      - China needs Chinese trade, and hungry mothers need supper tonight.
  tutorial_dialogue:
    stage_any:
    - The scribe is beyond the next partition. Wait until he looks up before you speak.
    - I keep no stock here. The goods you see are already spoken for.
    - No questions asked. That is the rule of the black market. Cash talks. Questions walk.
    - Ask about forged papers when you are ready to learn what the black market hides.
    - Black market goods are costly and dangerous to carry. Invisibility always costs extra.
    - Faction trust affects what I show you. High trust opens more options; low trust closes doors.
    - The black market runs on trust. The more the factions trust you, the more people will tell you.
    - Ration cards, forged documents, and foreign currency all carry risks beyond their price.
    - The true economy of Shanghai is hidden. I am one of its gatekeepers.
    - GO east when you are ready. Scribe Wen is next. He deals in rumors and information.
    - You understand the shadow economy now. Next, learn how information moves.
    - Knowledge is power. Rumors are currency. Spend them wisely.
- id: orientation_scribe_wen
  name: Scribe Wen
  description: A thin man with ink-stained fingers who sits behind a cluttered desk covered in scrolls and half-written letters. His brush moves with the precision of someone who knows that words can be weapons.
  faction: civilian
  role: broker
  personality: artful, cautious, trades in secrets
  awareness: 60
  authority: 15
  courage: 25
  perception: 50
  bt_archetype: civilian_vendor
  schedule:
    6: orientation_rumors
    12: orientation_rumors
    18: orientation_rumors
    22: venue_old_city_back_courtyard
  dialogue:
    greeting:
    - The written word has power. That is why they burn books. That is why I write carefully.
    - Ah, a visitor. I was just composing a letter. Fictional, of course. Everything I write is fiction.
    - You have the look of someone who needs information. I trade in information. Sit.
    - A brushstroke can change history. A rumor can change the city. Which would you like?
    - Welcome to my den. The walls hear everything. I write down only what is safe.
    neutral:
    - I write letters, documents, forgeries. The brush does not judge. It simply records.
    - Information travels faster than any runner. A rumor can cross the city before a man can walk it.
    - RUMORS shows the active rumor pool. Rumors spread from witnessed events across districts.
    - Rumors reveal patrol changes, faction movements, deaths. Listening is power in Shanghai.
    - I remember every word I write. A scribe's memory is his ledger. And his insurance.
    friendly:
    - You have earned the right to hear what is not written. I have a rumor for you. Listen closely.
    - There is a dead drop in the park. Behind the loose stone near the fountain. Check it at dusk.
    - I keep a separate set of books. For friends. The entries are more detailed.
    - You ask the right questions. That is rare. Most people ask what they think they need to know.
    - I have been watching the patterns. The Kempeitai are moving troops. Something is happening.
    hostile:
    - You are not welcome here. My ink is for paying customers, not spies.
    - I write nothing for you. I remember nothing for you. Leave before I forget you exist.
    - You ask about things that are not written down. That means you want things that should not be known.
    - A scribe without discretion is a dead scribe. I am very discreet. Especially about my dislike for you.
    - Your name has come up in certain documents. Not favorably. I suggest you leave before I add to the entry.
    afraid:
    - The Kempeitai censor came by yesterday. Read every document on my desk. Found nothing. But he will be back.
    - They are watching the scribes. Anyone who writes for the public is under suspicion.
    - A fellow scribe was arrested. His crime? Writing a letter for the wrong person. It could be any of us.
    - I burned my private ledger last night. Too much knowledge in one place is a death sentence.
    - The walls have ears. The paper has eyes. I am surrounded by witnesses.
    gossip:
    - A Kempeitai officer has been meeting with a Green Gang boss. Three times this month. That is a conspiracy forming.
    - The resistance has a new code system. I do not know the details. But I know it involves a specific book.
    - There is a traitor in the French Concession police. Someone is selling patrol schedules to the Japanese.
    farewell:
    - Information is the only weapon that does not run out of ammunition. Use it wisely.
    - Come back when you need to know something. I am always here, brush in hand.
    - 'Remember: what is not written is often more important than what is.'
    - The rumor mill never stops. Neither do I. Come back for the latest.
    - Go. And listen more than you speak. That is how you learn what is really happening.
    ask:
      private_debts:
      - Debts have handwriting, even when their frightened owners pretend otherwise.
      - A folded note can bind tighter than any shopkeeper's contract.
      - I keep accounts in memory because paper invites a reader.
      - Fabi inflation turns yesterday's kindness into tomorrow's bitter public dispute.
      - Pay what you owe, and leave private names off public ledgers.
      craft:
      - A brush makes no distinction between a receipt and confession.
      - Good ink dries slowly enough for a nervous hand to reconsider.
      - I copy letters faithfully, then forget them with professional discipline.
      - Seals matter because officials believe red wax can establish truth.
      - The craft requires patience, a steady wrist, clean paper, and silence.
      prices_and_papers:
      - Paperwork feeds the occupation, yet hungry families still need papers.
      - A stamped permit may pass a gate without easing anyone's fear.
      - Traced documents bring officials to the wrong family doorstep first.
      - Prices climb whenever a shipment waits too long beneath customs inspection.
      - China deserves its own records, kept without foreign official permission.
  tutorial_dialogue:
    stage_any:
    - Welcome to the information desk. I keep scraps of talk because Shanghai wastes nothing now.
    - TALK TO me and I will tell you how rumours move through markets, patrol lines, and tea cups.
    - In this city, what you know may buy passage when fabi cannot.
    - RUMORS shows what has reached your ears so far. It is a ledger of claims, not a court record.
    - Patrol changes, faction movement, and deaths all become rumours once Shanghai mouths begin carrying them.
    - The city gives more to people who ask carefully, remember sources, and notice who benefits from a tale.
    - Rumour is a poor lantern, but even poor light may show a checkpoint before you reach it.
    - A word about a patrol change can save your life. A word about rice can feed a room.
    - Pay attention to what people say, and to the price they paid before saying it.
    - GO east when you are ready. Old Crane is next, and he trusts pauses more than announcements.
    - You understand rumours now. Next you must notice room talk that was not offered to you.
    - The city never stops speaking; it only changes whose mouth carries the danger.
- id: orientation_apprentice_shen
  name: Apprentice Shen
  description: A quick-footed boy of sixteen with ink on his sleeves and a folded stack of handbills under one arm. He carries printed slips between the press house and Wen's desk faster than most men can walk.
  faction: civilian
  role: apprentice
  personality: eager, watchful, talks first and thinks after
  awareness: 40
  authority: 8
  courage: 20
  perception: 35
  bt_archetype: student_intellectual
  schedule:
    6: orientation_rumors
    12: orientation_rumors
    18: orientation_rumors
    22: venue_old_city_back_courtyard
  dialogue:
    greeting:
    - Handbills today, sir. Fresh off the press, if the press can be believed.
    - Master Wen checks my slips before I deliver them. One wrong figure causes ten quarrels.
    - You stand in the den of information. Mind the wet ink on the desk edge.
    - I run prints all morning. I hear half the alley's talk before noon without trying.
    - Careful where you step. Paper everywhere. Secrets dry slower than ink.
    neutral:
    - The press house pays by the bundle, so I run bundles. My ears come free with the job.
    - People talk around a boy carrying paper. They think we do not count.
    - Master Wen says every rumour has a price tag somewhere on it. Find the tag first.
    - Two versions of one event reach me before lunch most days. Shanghai loves to disagree with itself.
    - I fold, I stack, I deliver. And I remember which streets ask for which news.
    friendly:
    - Between us, the press house misprints more than prices. Names too. Dangerous work, correcting them.
    - You treat me like a person, not a delivery cart. I will carry word for you someday, no charge.
    - Master Wen trusts you. He counts trust like money, so that is saying something.
    - If you ever need to know which lane heard what, ask a runner. Runners know the wind.
    - I saved you the clean copy of the bill. The crooked ones give readers ideas.
    hostile:
    - Take the bills or leave them. I have deliveries that do not wait for strangers.
    - Master Wen says nothing about you, and he says plenty about everyone. That worries me.
    - I am only the runner. Press the printer, not the boy with the stack.
    afraid:
    - A man followed me three streets yesterday asking who reads my bills. I ran the long way here.
    - The press master vanished two nights ago. His ink is still wet on the counter. Nobody asks.
    ask:
      press_house:
      - The press house runs day and night now. Paper is worth more than the words printed on it.
      - My master sets type by lantern because electricity costs more than apprentices.
      - A crooked character in a handbill once started a street quarrel over nothing at all.
      - We print what we are told. What we are told changes with whoever signs the order.
      - If the press ever printed the whole truth, it would jam before the first page.
      street_talk:
      - Runners hear everything. Doors stay open when a boy carries paper through them.
      - The alley argues about rice prices every morning and about patrols every night.
      - People repeat a rumour louder when they hope someone will pay them to stop.
      - Two streets away they tell the same story with a different villain in it.
      - I never repeat what I hear near the press house. That rule keeps me walking.
      prices_and_papers:
      - Paper went up twice this season, so a handbill costs more than the news on it.
      - Master Wen charges by the letter for letters, and by the silence for what he does not write.
      - A forged permit feeds a family until the checkpoint learns to read it properly.
      - Everything in this city has two prices. One for papers and one for favour.
      - When rice climbs, even rumours about grain get expensive at the corner stalls.
  tutorial_dialogue:
    stage_any:
    - Master Wen says the room talks first and explains later. The Rumours panel keeps what reached you.
    - I carry handbills past the Bund checkpoints, and every runner hears the alleys argue about grain.
    - You heard us talking before you said a word. In Shanghai that is how most news finds a person.
- id: orientation_old_crane
  name: Old Crane
  description: An ancient man with a permanent stoop and a hand cupped behind his ear, as if always listening. He perches in the eavesdropper's perch like a bird waiting for crumbs of conversation to fall.
  faction: civilian
  role: broker
  personality: canny, ancient, selectively deaf
  awareness: 65
  authority: 10
  courage: 25
  perception: 70
  bt_archetype: civilian_vendor
  schedule:
    6: orientation_eavesdrop
    12: orientation_eavesdrop
    18: orientation_eavesdrop
    22: venue_old_city_tea_intersection
  dialogue:
    greeting:
    - Eh? Speak up. This old ear does not work as well as it used to. Or maybe it works too well. Depends on who is talking.
    - I hear things. An old man hears everything. People talk when they think no one is listening.
    - You have come to the right place. I know things. Things I should not know. Things I will tell you for a price.
    - The walls speak if you listen. I have been listening for seventy years.
    - Another ear for the city's secrets. Sit. Listen. Learn.
    neutral:
    - People talk. They always talk. They think old men are deaf. I hear more than anyone knows.
    - The city never stops whispering. The walls have voices. I just listen.
    - Ears open, mouth shut. That is how you survive. That is how you learn.
    - A merchant and a soldier were talking in the market today. The merchant was nervous. The soldier was drunk. Both talked too much.
    - I do not need to ask questions. I just need to be invisible. Old age is the best disguise.
    friendly:
    - You have good ears. I can tell. You listen the way I listen - like the next word might save your life.
    - The Rumours panel catches nearby room talk when people forget an old man has ears.
    - There is a conversation happening in the next room. Kempeitai officers. They think they are alone. They are wrong.
    - I heard something interesting yesterday. A name. A place. A time. Care to know what it was?
    - You remind me of myself when I was young. Always listening. Always learning. Always staying alive.
    hostile:
    - I have nothing to say to you. And I have heard nothing about you. That is how I want it.
    - You talk too much. A man who talks too much cannot hear what matters.
    - I do not know you. I do not want to know you. Go be loud somewhere else.
    - Your voice carries. That is dangerous. Learn to be quiet or learn to be dead.
    - I hear nothing when you are near. Your noise drowns out everything useful.
    afraid:
    - The Kempeitai are asking about an old man who listens. That old man is me.
    - Someone is watching the perch. I have seen the same face three times this week. I am changing locations.
    - They are silencing the informants. One by one. I may be next.
    - I heard a rumor that the Kempeitai have a device that can hear through walls. If that is true, nowhere is safe.
    - The walls are not as thick as they used to be. Or my ears are too good. Either way, I hear too much for my own safety.
    gossip:
    - The Green Gang is moving something big through the old city tonight. Warehouses, trucks, men with guns. Something big.
    - A Kempeitai captain has been meeting with a woman in the French Concession. Not his wife. She talks. I listen.
    - The resistance is planning something near the docks. I heard a whisper about a shipment. A military shipment.
    farewell:
    - Keep your ears open and your mouth shut. That is the only advice worth giving.
    - Come back when you want to hear something interesting. I always have something.
    - The city talks. I listen. You should too.
    - Ears are free. Information is not. Remember that.
    - Go. Listen. The city is full of secrets waiting to be heard.
    ask:
      private_debts:
      - Debts make louder footsteps than their worried owners ever notice.
      - I hear who borrows rice before the creditor reaches the door.
      - A missing coin starts arguments, but a missing son ends them.
      - People repay favours with silence when fabi has become useless.
      - Keep your accounts tidy, because these walls repeat unpaid arithmetic.
      information_trade:
      - Information arrives as coughs, quarrels, and spoons left suddenly still.
      - A useful rumour carries its own hesitation, like a lame pigeon.
      - The city tells secrets to anyone patient enough to seem deaf.
      - I trade no names, only the shape of trouble approaching.
      - Listen first, then decide whether the whisper deserves another ear.
      prices_and_papers:
      - Paper checks tell officials who may pass, never who belongs.
      - Prices speak clearly when frightened shopkeepers fear saying anything else.
      - The occupation calls searches order, while neighbours count ruined cupboards.
      - A poor ear misses boasts, which is sometimes an advantage.
      - Chinese hands should hold China, once all this shouting stops.
  tutorial_dialogue:
    stage_any:
    - Ah, another careful ear. Old Crane teaches how to notice what a room gives away without meaning to.
    - Nearby NPC exchanges appear in the Rumours panel when Shanghai people speak close enough to be overheard.
    - Keep your mouth closed and your face ordinary. That rule has carried me through many patrols.
    - Watch the Rumours panel while people share the room with you. It records nearby talk, not distant miracles.
    - "Room conversations are not invitations. They are fragments: a complaint, a warning, a debt named too softly."
    - There is always something to notice if you let impatience pass first.
    - Do not chase every whisper. Some talk in Shanghai is bait, and some is only an old man complaining.
    - The more patiently you watch, the better you learn who repeats truth and who sells noise.
    - Patience is the key. The city speaks in lowered voices because raised voices draw boots.
    - You are learning. The city never stops speaking, but it does not owe you a full account.
    - People speak differently to neighbours than to strangers. That difference is often the useful part.
    - An overheard secret is not clean silver. Handle it carefully, or it spends badly.
    - GO east when you are ready. Sister Zhao is next. She will teach you about bonds and trust.
    - You understand nearby talk now. Next you must understand connection, because bonds keep people fed and hidden.
    - The city helps those who know which door to knock on, and which door to leave alone.
- id: orientation_widow_kang
  name: Widow Kang
  description: A straight-backed old woman in a grey jacket who keeps a kettle and two chipped cups on the landing outside the listening post. She sold tea to harbour pilots for thirty years and still prices gossip by the cup.
  faction: civilian
  role: resident
  personality: patient, dry-humoured, misses nothing on her stairs
  awareness: 55
  authority: 10
  courage: 28
  perception: 48
  bt_archetype: resident
  schedule:
    6: orientation_eavesdrop
    12: orientation_eavesdrop
    18: orientation_eavesdrop
    22: oldcity_04
  dialogue:
    greeting:
    - Tea is two fen. Sitting is free, but sitting long costs better stories.
    - Mind the third stair. It creaks, and up there the pipe carries more than voices.
    - You have the look of someone new to these stairs. Everyone starts as a stranger.
    - Old Crane hears the building. I hear the people waiting to climb it.
    - Sit if you like. The kettle does not care who you are.
    neutral:
    - Thirty years pouring tea for pilots teaches you which weather reports are lies.
    - The stairs bring everyone down sooner or later. Sailors, clerks, men in a hurry.
    - A cup of tea buys you a neighbour's silence. Silence is worth more than talk here.
    - Crane listens through brass. I listen through patience. Both work.
    - Nothing said on my stairs leaves my stairs. That is why they say it on my stairs.
    friendly:
    - For you the tea is fresh, not the pot that has been warming since dawn.
    - You sit properly and you do not repeat what you hear. You may stay as long as you like.
    - Old Crane speaks well of you. He speaks well of almost nobody, so mind what that costs.
    - Take the corner seat. From there you can watch both the door and the kettle.
    - When the pilots drank here, they trusted me with their route talk. I earned it cup by cup.
    hostile:
    - You ask questions the way the inspectors do. Buy tea or climb on.
    - My stairs are not for people who collect other people's words for money.
    - I am an old woman with a kettle. Do not make me use the boiling part.
    afraid:
    - Two men in grey came asking about the pipe last month. I poured tea and remembered nothing.
    - Since the customs shed business, the stairs are quieter. Quiet stairs worry me more than loud ones.
    ask:
      stairwell_trade:
      - Tea costs two fen and gossip costs whatever you think it is worth afterwards.
      - The pilots drank here before the war changed the flags on the harbour office.
      - A kettle, two cups, and a dry step is a business. It has kept me fed alone.
      - I sell to whoever climbs quietly. Loud men drink at the bars down the road.
      - Everything on these stairs is honest except what people say while drinking.
      listening_post_rumours:
      - The pipe carries arguments from below better than any window carries the street.
      - Last week it was a missing manifest. Before that, a name repeated in three rooms.
      - What comes up that pipe is somebody's truth with somebody else's thumb on it.
      - Crane writes nothing down. I remember everything. Between us we owe nobody.
      - Listen long enough and you learn which voices shake when they lie.
      prices_and_papers:
      - Rice doubled since spring, so my customers sip slower and talk longer.
      - Papers cost more than tea now. A man needs papers to be poor legally.
      - The pilots used to trade route news for smokes. Now they want silver.
      - Everything on the Bund has two prices, and neither one is written down.
      - When the press prints lies for a penny, the truth must be given away free.
  tutorial_dialogue:
    stage_any:
    - On these stairs you heard Crane and me before you knocked. The Rumours panel keeps what the room says.
    - Thirty years pouring tea on the Shanghai waterfront teaches you which talk is worth carrying upstairs.
    - Sit, listen, and let the pipe do its work. What reaches you while you stand here is yours to weigh.
- id: orientation_sister_zhao
  name: Sister Zhao
  description: A woman in her thirties with a face that has seen hardship but a smile that has not given up. She moves through the resistance safehouse with the easy authority of someone who knows everyone and is known by all.
  faction: ccp
  role: operative
  personality: warm, protective, fiercely loyal
  awareness: 70
  authority: 25
  courage: 55
  perception: 50
  bt_archetype: underground_operative
  schedule:
    6: orientation_contact
    12: orientation_contact
    18: orientation_contact
    22: venue_old_city_cramped_courtyard
  dialogue:
    greeting:
    - We are all family here. That is not just words. In this city, family is who you choose.
    - Welcome to the safehouse. Rest. Eat. You are among friends.
    - Another face for the resistance. I hope you are as good as you look.
    - Trust is the only currency that matters here. And I remember who you are.
    - Sit. Share a bowl. We can talk after you have eaten. No one should talk on an empty stomach.
    neutral:
    - The resistance is a network of trust. Every bond is a thread. Enough threads make a rope.
    - I remember everyone. Their names. Their families. Their favorite foods. That is how we stay together.
    - A bond is not just friendship. It is a promise. A promise that someone will be there when you need them.
    - We share what we have. Rice, medicine, information. A shared burden is half as heavy.
    - The Kempeitai try to divide us. They fail because we share bowls, not suspicions.
    friendly:
    - You have shared a meal with me. That means something. We are bonded now.
    - I have a brother in the north. You remind me of him. Same fire in the eyes.
    - I saved some medicine for you. From the last shipment. You looked like you needed it more than me.
    - There is a place for you here. Always. No matter what happens out there.
    - You are family now. That means I will fight for you. I will feed you. I will hide you.
    hostile:
    - You are not welcome here. I do not say that lightly. Leave before I make you leave.
    - I trusted you. You broke that trust. Trust does not break easily with me, but when it does, it does not mend.
    - You bring danger to my door. I cannot allow that. My family comes first.
    - I remember faces. I remember betrayals. Yours is on that list.
    - The safehouse is closed to you. Do not come back.
    afraid:
    - They raided a safehouse in the old city. Three of our people were taken. I knew them. I fed them.
    - Someone is leaking our locations. We change safehouses every week now.
    - If they come here, you use the back exit. Through the cellar. Do not look back.
    - I am scared. Not for me. For the people I am responsible for. For my family.
    - The Kempeitai have a list of names. I do not know whose names. But I know they have one.
    gossip:
    - A new courier joined the network. Young, fast, nervous. Needs training. I will handle it.
    - The old temple safehouse needs supplies. Rice, bandages, lamp oil. I am organizing a run.
    - Someone in the market is selling information about our dead drops. We are changing the system.
    farewell:
    - You are always welcome here. This is your home now. We take care of our own.
    - Stay safe out there. Come back when you need rest. The door is always open.
    - 'Remember: you are not alone. The resistance is your family. We will find you if you fall.'
    - Share a meal with someone today. It builds bonds. Bonds save lives.
    - Go with my blessing. And come back hungry. I will have the pot ready.
    ask:
      cover_story:
      - A cover story must fit ordinary hands and an ordinary morning.
      - Damp sleeves, late rice, and a missed tram explain plenty.
      - Patrols dislike details that sound rehearsed, so keep yours plain.
      - Nobody needs a clever tale when an errand already looks dull.
      - The safest words resemble ordinary work, hunger, and family obligations.
      resistance:
      - Resistance starts with keeping a hungry neighbour fed through winter.
      - We share burdens quietly, because spectacle only feeds the Kempeitai.
      - Every comrade has a history that does not belong in daylight.
      - Courage means returning carefully, not making a beautiful final speech.
      - Trust grows around shared bowls and work completed without applause.
      china_and_cells:
      - At this safehouse, a courier learns which door stays unmarked, then carries only what the next pair of hands requires.
      - Cells meet where daily life already gives people reasons to gather.
      - No network survives a member who treats names as decorations.
      - Capture makes every careless sentence expensive for several nearby households.
      - In the French Concession, ordinary work can conceal stubborn purpose.
  tutorial_dialogue:
    stage_any:
    - A shared bowl is a small thing until rice is scarce. Then it becomes a record of trust.
    - In occupied Shanghai, people remember who helped them eat and who watched them go hungry.
    - Speak softly here. Bonds are useful because they are human before they are political.
- id: orientation_alley_drunk_merchant
  name: Drunk Merchant
  description: A disheveled man in a stained silk robe, slumped against the wall of the dark alley. He mutters to himself between swigs from a flask, but his eyes are sharper than his slur suggests.
  faction: civilian
  role: vendor
  personality: drunken, fatalistic, secretly observant
  awareness: 25
  authority: 5
  courage: 15
  perception: 20
  bt_archetype: civilian_vendor
  schedule:
    6: orientation_alley
    12: orientation_alley
    18: orientation_alley
    22: venue_old_city_back_courtyard
  dialogue:
    greeting:
    - I tell you, I tell you... business is dead. The Japanese killed it. And my liver is following.
    - Another lost soul in the alley. Sit. Drink. Forget. That is what alleys are for.
    - You look like a man who needs a drink. I have a flask. It is not clean but it is full.
    - The Japanese are bad for trade. I lost half my inventory to a checkpoint. Half!
    - Hic! Welcome to my office. The walls are damp and the company is questionable. Just how I like it.
    neutral:
    - Business is business. Even dead business is still business. I am just resting mine.
    - I used to have a shop on Nanking Road. Now I have a wall and a flask. Progress.
    - The occupation is bad for commerce. People do not buy silk when they cannot buy rice.
    - I tell you, the old Shanghai was better. The customers paid. The patrols stayed away. The wine was cheaper.
    - A man in my condition should not be giving advice. But I will anyway. Stay away from silk. No one buys silk anymore.
    friendly:
    - You listen. That is rare. Most people see a drunk and walk past. You stop. That counts for something.
    - I have a bottle hidden behind the loose brick. The good stuff. For friends. You are a friend now.
    - I may be drunk but I am not blind. I see things. I saw a Kempeitai officer taking a bribe yesterday. Seen it before.
    - You have the look of someone who needs information. I have information. I trade it for drinks.
    - Between you and me, the resistance pays better than the Japanese. And they pay in silver. Real silver.
    hostile:
    - Go away. I am trying to forget the world and you are reminding me of it.
    - I have nothing for you. No money. No goods. No information. Just wine and misery. Take the misery, leave the wine.
    - You look like a Kempeitai informant. Even drunk I can spot one. Get lost.
    - I do not talk to sober people. Sober people ask questions. Questions lead to trouble.
    - The alley is mine. Find your own wall to lean on.
    afraid:
    - The Kempeitai raided the merchant association yesterday. Took the books. They know who owes what.
    - If my wife finds out how much I lost, she will kill me. If the Kempeitai find out, they will kill me faster.
    - I saw a man dragged into a black car last night. He was a merchant. Like me. He owed money. Like me.
    - The patrols are asking about merchants who deal with the resistance. That is all of us. That is all of Shanghai.
    - I drink to forget. But I remember everything. That is the curse.
    gossip:
    - The silk merchant on Bubbling Well Road is a Kempeitai informant. He asks too many questions about his customers.
    - A shipment of real whisky came through the docks last night. The customs officer is now a rich man.
    - The Green Gang is looking for a new accountant. The old one disappeared. Accounts do not disappear on their own.
    farewell:
    - Drink something. Forget something. That is my philosophy.
    - Come back when you need a drink and no questions. I have both.
    - Stay off Nanking Road. The patrols are thick there. Thick as my head in the morning.
    - If you see my wife, tell her I am at a business meeting. It is technically true. I am meeting this bottle.
    - Go. The world is waiting to disappoint you. I will be here when it does.
    ask:
      stall_trade:
      - Trade was silk once, now it is whatever keeps rice moving.
      - A stall loses money each time a patrol examines the scales.
      - Customers pay late because their wages vanish at checkpoints first.
      - I learned commerce on Nanking Road, before the road learned uniforms.
      - Drink has ruined my balance, not my sense of prices.
      liquor_flask:
      - The flask holds cheap spirits and a better memory of business.
      - One swallow softens the patrol whistle, though only very briefly.
      - Good whisky reaches Shanghai by routes sober men decline discussing.
      - My wife calls this medicine, then asks why I need so much.
      - A merchant keeps one bottle for despair and another for visitors.
      prices_and_papers:
      - Papers emptied my warehouse more neatly than any drunken mistake.
      - A permit inspection makes every merchant feel guilty before breakfast.
      - Silk cannot compete with rice when the fabi folds itself thin.
      - The occupation took accounts, stock, and much of my patience.
      - China ought to trade for itself, once these gatekeepers leave.
  tutorial_dialogue:
    stage_any:
    - Hic! You made it to the alley. Nanking Road took most of my trade, but I still notice who passes.
    - Keep your hands quiet and your eyes open. The street remembers careless movement.
    - Patrols notice noise, strange faces, and sudden movement. A quiet route is often the safer route.
    - The alley teaches observation, not bravado. Watch the exits before you choose one.
    - When the street turns hostile, HIDE can buy you a moment. It cannot erase what you have done.
    - GO south when you are ready. The Bund waits, and Shanghai will ask what kind of survivor you mean to become.
- id: orientation_patrol_guard
  name: Patrol Guard
  description: A Kempeitai collaborationist guard with a rifle slung across his back and a bored expression that does not quite hide his alertness. He patrols the dark alley with practiced steps, his hand never far from his weapon.
  faction: kempeitai
  role: soldier
  personality: vigilant, wary, professionally suspicious
  awareness: 55
  authority: 45
  courage: 50
  perception: 45
  bt_archetype: kempeitai_soldier
  schedule:
    6: orientation_alley
    12: orientation_alley
    18: orientation_alley
    22: venue_hongkou_checkpoint_square
  dialogue:
    greeting:
    - Curfew is in effect. Move along. Do not make me repeat myself.
    - You are in a restricted area. I suggest you leave before I suggest it more forcefully.
    - Another night bird. Looking for trouble or looking for an easy target?
    - Halt. State your business. And make it good. I have heard all the excuses.
    - The alley is off limits after dark. The fact that it is not dark yet does not matter.
    neutral:
    - I patrol this route every night. Same steps. Same shadows. Same suspicious characters.
    - The collaborationist police keep order. Without us, the city would burn. Not that anyone thanks us.
    - I have been on this beat for two years. I know every shadow. Every sound. Every hiding place.
    - Do not make trouble and I will not make trouble for you. That is a fair deal.
    - The streets are full of people who think they are clever. I have seen them all. I am still here.
    friendly:
    - You are not like the others. You have respect. Respect keeps you alive in this city.
    - I look the other way sometimes. For people who do not cause problems. For people who understand how things work.
    - The drunk in the corner? Easy mark. If you were inclined to that sort of thing. Which I am not suggesting.
    - You have good instincts. I can tell by how you move. You have been on streets before.
    - Between you and me, the Kempeitai are worse than the criminals. At least criminals are honest about what they are.
    hostile:
    - You are under suspicion. Do not move. Do not breathe. Do not give me a reason.
    - I have been watching you. You are up to something. I can smell it.
    - The last man who tried to be clever with me spent a week in a cell. I recommend against it.
    - You have the look of a pickpocket. I have been pickpocketed before. I do not enjoy it.
    - Hands where I can see them. Slowly. I would hate to shoot you and do the paperwork.
    afraid:
    - The resistance killed a guard on the next beat last week. Cut his throat in the dark. No one saw anything.
    - They are targeting collaborationist police. I am a target. Every night I walk this beat, I am a target.
    - The Kempeitai do not care if we live or die. We are expendable. They have more recruits.
    - Someone has been watching me from the rooftops. Three nights in a row. I reported it. They did nothing.
    - I have a family. A wife. Two children. I do this job to feed them. I do not do it to die for the Japanese.
    gossip:
    - The drunk merchant in the alley is not as drunk as he looks. I have seen him pass notes to people.
    - A resistance cell is operating in this district. The Kempeitai know. They are waiting for the right moment to strike.
    - The Green Gang pays better than the collaborationist police. I am thinking of switching sides.
    farewell:
    - Move along. And do not let me catch you here again.
    - Stay out of trouble. Or do not. I get paid either way.
    - The alley is safe tonight. Tomorrow, who knows. Check the patrol schedule.
    - 'Remember: I have seen your face. Do not give me a reason to remember it.'
    - Go. And keep your hands where I can see them until you are out of sight.
    ask:
      checkpoint_duty:
      - Checkpoint duty means watching hands, faces, and papers until dawn.
      - A rifle grows heavy when every traveller seems potentially dangerous.
      - Orders require inspection, even when inspection delays a hungry worker.
      - Curfew brings excuses, and each excuse arrives with a different voice.
      - The lamp shows enough, provided nobody gives me reason to look.
      patrol_partner:
      - A patrol partner is useful when he watches the opposite shadows.
      - Some men report everything, which makes them poor company after dark.
      - We share a route, not a friendship, and that suits us.
      - A partner who talks too freely soon patrols alone somewhere worse.
      - Ask for his name elsewhere, because alleys keep their own records.
      orders_and_remorse:
      - Orders make patrols sound orderly, though streets resist tidy reports.
      - I have seen rooms after searches, and remembered the children watching.
      - Fear follows a guard home even when his boots stay polished.
      - Some officers enjoy command far too readily for my taste.
      - Regret changes nothing after the report receives its final stamp.
  tutorial_dialogue:
    stage_any:
    - You made it to the alley. This is your last sheltered lesson before Shanghai stops forgiving mistakes.
    - The streets have their own rules. Notice the exits, patrols, and places where a careless step draws attention.
    - HIDE can help you avoid a patrol detection contest, while a disguise changes exposure and arrest risk.
    - You have learned enough. Keep your hands quiet and your eyes open.
    - The streets of Shanghai are dangerous. You have seen stealth, disguise, and combat; the city will test all three.
    - GO south when you are ready. The Bund waits, and Shanghai will ask what kind of survivor you mean to become.

  description_templates:
  - Patrol boots scrape over tram grit while signboards in several languages stare past one another in official silence.
  - Cheap boarding houses and military trucks share the same street under a sky the color of dirty tin.
  - A refugee line knots around the corner, watched by rifles too tired to lower themselves before noon.
  - Soot, diesel, and brittle patience gather around people waiting for permission to move three streets farther.
  - Tea steam rises from chipped bowls and disappears before it reaches the barbed wire. The street pays for its tea in silence.

  dialogue:
    greeting:
    - I've seen this city change governments like clothes, but its heart remains the same.
    - Sit with me awhile. The bench is old but sturdy. Like us.
    - You have questions. I can tell. Young people always have questions. Old people have answers they wish were different.
    - In my grandfather's time, a visitor brought tea and news. I'll settle for news.
    - You carry the weight of the world. Set it down a while.
    neutral:
    - Sit and listen. The old stories have wisdom that the newspapers never print.
    - I mind my garden and my grandchildren. The world can tend to itself for a while.
    - Every morning I walk to the market. Every morning the prices change. Only the walk stays the same.
    - The old ways have served us for generations. They'll serve us through this too.
    - I remember this street full of merchants and children. Now it's silence.
    friendly:
    - Your actions remind me of when Shanghai still had fight in it.
    - I was your age during the revolution of 1911, we thought that was the hard part. We were wrong.
    - Take these preserved plums. My daughter made too many and I cannot eat them all myself.
    - I have connections going back decades. Some are still useful. Some alive.
    - You've a good reputation. Guard it carefully. It's all we have left.
    hostile:
    - The young act like they invented resistance. We old people invented survival.
    - You push too hard and ask too much. Patience is not weakness. It is strategy.
    - I have buried friends for less than what you are suggesting. Think carefully.
    - I've lived through war, occupation, and famine. I'll live through you too.
    - You disrespect this community. I cannot overlook that.
    afraid:
    - The soldiers took my neighbor's grandson yesterday. He was fourteen. They did not say why.
    - I do not sleep well anymore. The boots on the street at night have grown louder.
    - My papers say I am seventy-three. That used to mean respect. Now it means invisible. I am grateful and ashamed in equal measure.
    - The young people are being taken. Boys. Families too afraid to report it.
    - I've seen this before. The disappearances. The silence. It ends badly.
    gossip:
    - The magistrate who replaced old Judge Li is young enough to be his grandson and twice as cruel.
    - The temple on Yu Garden Street has new locks on the gate. The abbot says it is for repairs. I do not believe him.
    - My granddaughter tells me the school has a new teacher who does not teach from the approved books. That is either brave or a trap.
    - A boy returned my walking stick after carving a bird into the handle. He said old things deserve company.
    - The dumpling woman lowered her price for widows today, then charged bachelors double without announcing mercy.
    farewell:
    - Go well. The road is long and the night comes faster than it used to.
    - Come back when you have time. I will make tea. The leaves are not fancy, but the company will be good.
    - Remember what I told you. And if you forget, come back and I will tell you again.
    - May your ancestors guide you. You'll need their wisdom.
    - The old city protects those who respect it. Remember that.
    ask:
      household_routine:
      - A household teaches patience through rice jars, leaking roofs, and grandchildren who wake before the cookfire.
      - Hongkou routines are never simple when every neighbour pauses before naming who visited after curfew.
      - These hands remember short coins, rain-soaked papers, and names wisely left outside the conversation.
      - Politics reaches a family when papers are checked beside the stove and supper goes cold.
      - I speak plainly about daily work, because plain talk about people can outlive the speaker.
      old_city_community:
      - Old City remembers its neighbours by doorstep and funeral cloth, not by the permits officials demand this season.
      - I watched shops rebuild after fires, then watch new clerks insist the lanes began with their ledgers.
      - A community survives when someone saves a place at the bowl for the family delayed by checkpoints.
      - My memory holds names carefully, because the living should not pay for an old man's loose recollections.
      - Sit for tea before asking another question, and I may decide whether the past owes you an answer.
      prices_and_papers:
      - People ask for China in Chinese hands, then ask whether their rice merchant can still open tomorrow morning.
      - I have seen one missing identity paper scatter three generations across different relatives before the evening meal.
      - Officials call a search routine, but an old household remembers every cupboard opened and every child silenced.
      - I do not add resistance names to a conversation, because age has taught me words can outlive discretion.
      - The price of rice and papers changes, yet neighbours still leave a bowl at the door when hunger shows.

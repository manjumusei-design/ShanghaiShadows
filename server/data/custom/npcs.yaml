      - "A candle in wind still gives light, provided someone cups a hand around its flame."
      - "Families share broth behind shut doors, and that small kindness often says more than a sermon."
      - "The dharma does not change when uniforms arrive, though frightened people learn to speak around it."
      - "Compassion requires attention, not curiosity, especially when a neighbour has chosen silence for good reason."
      prices_and_papers:

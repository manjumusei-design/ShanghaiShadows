  indoors_every: 1
  description_templates:
  - Behind a false wall in a tea merchant's shop, Nationalist intelligence officers decode intercepted Japanese orders. The
    ink is still wet on reports of another massacre in the countryside. These men carry the weight of a retreating government
    and the fury of those left behind.
  - A codebook lies open on a desk, its pages filled with columns of numbers. Maps of Japanese naval movements in the Huangpu
    River are pinned to the wall, each annotated with dates and vessel names.
  - 'A filing cabinet overflows with dossiers on Kempeitai officers: their habits, their routes, their weaknesses. Information
    is the only weapon that works in a city under the boot of the occupier.'
  - A shortwave radio receives broadcasts from Chungking, the voice of Free China audible above the static. The announcer
    speaks of resistance and the certainty of victory. It is the only truth left in a city drowning in propaganda.
  - Photographs of Japanese war crimes are spread across a table, evidence being compiled for the day of reckoning. Each image
    is a reminder of why surrender is unthinkable.
  - 'A cramped office where forged documents are made by steady hands: travel passes, identity cards, ration books. Each
    forgery gives someone one more chance to pass a checkpoint.'
  - A listening post where agents monitor Japanese military communications. The work is tedious and dangerous. Discovery means
    torture and execution. But the intelligence saves lives.
  special_names:
    '1': Customs House Back Office
    '2': Intelligence Bureau Annex
    '3': Kempeitai Dossiers Office
    '4': Chungking Radio Station
  special_descriptions:
    '1': The Customs House Back Office is a nondescript room behind the grand marble lobby of the Customs House, accessible
      through a staircase that no sign marks. Nationalist intelligence officers work here in civilian clothes, processing
      reports from agents across the city. The room smells of cigarette smoke, ink, and the particular tension of men who
      know they are surrounded by enemies.
    '2': The Intelligence Bureau Annex occupies a second-floor office above a stationery shop in the Xujiahui district. The
      windows face the street, offering a clear view of anyone approaching. The office is furnished with desks, filing cabinets,
      and a safe that holds the bureau's most sensitive files.
  special_detailed_descriptions:
    '1': The Customs House Back Office is a windowless room on the second floor of the Customs House, reachable through a
      service staircase that begins behind a door marked 'Authorised Personnel Only.' The room is furnished with four desks,
      each bearing a typewriter, a lamp, and stacks of paper. The walls are covered with maps of Shanghai marked with coloured
      pins indicating Japanese positions, resistance safe houses, and the routes of patrol boats on the Huangpu. The men who
      work here are Nationalist intelligence officers, their cover stories as varied as their backgrounds. They process reports
      from a network of agents that extends across the city, coordinating operations that range from information gathering
      to sabotage.
    '2': The Intelligence Bureau Annex is a two-room office on the second floor of a commercial building in Xujiahui, above
      a stationery shop that sells paper and ink to the mission school across the street. The outer room contains a desk where
      a secretary receives visitors and maintains the appearance of a legitimate import-export office. The inner room, accessed
      through a door disguised as a filing cabinet, holds the bureau's communications equipment, a shortwave radio, a codebook,
      and a safe bolted to the floor. The annex is the liaison point between the Xujiahui resistance network and the Nationalist
      command structure, a nerve centre disguised as a place of business.

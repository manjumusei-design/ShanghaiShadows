  description_templates:
  - Family dinners happen behind paper windows, with conversations that stop when footsteps pass outside.
  - Laundry lines crisscross between buildings like invisible bonds of domestic resistance. The wash is taken in before curfew.
  - The lane smells of cooking oil, laundry soap, and the quiet fear of families trying to maintain normal life.
  - Children play games that have adapted to occupation, their laughter muted but persistent. The games teach the alleys' shortcuts.
  - Neighbors exchange news in glances and small favors that could save lives if noticed. Nothing is said aloud.
  - Each door represents a family's struggle to survive in a city that doesn't want them. The lock is the only luxury.
  - The lane feels lived-in and loved, making every intrusion by occupation forces feel like violence.
  - Small shrines in alley corners hold candles for those who haven't returned from the checkpoints.
  - The sound of distant sirens makes everyone freeze, until they're sure it's not coming here.
  - Families share limited resources in a quiet system of mutual aid and whispered warnings. A knock has three meanings.
  special_names:
    '1': Astor House Alley
    '2': Embassy Row Flats
    '3': Yuyuan Garden Lane
    '4': City God Temple Backstreets
    '5': Little Tokyo Row Houses
    '6': Seward Road Tenements
    '7': Avenue Joffre Walk-up
  special_descriptions:
    '1': A narrow lane behind the Astor House Hotel, where porters and kitchen staff live in cramped quarters above the stable
      block. The alley smells of coal smoke and cooking oil from a hundred small stoves. Laundry lines crisscross between
      windows, a patchwork of worn cotton and mended linen.
    '2': The residential quarter near the embassies houses foreign clerks and their families in tidy apartment blocks. Uniformed
      nannies push prams along the pavement while diplomats' cars glide past. The street is quieter than most, patrolled by
      consulate guards who answer to no one.
    '3': A residential lane off Yuyuan Garden where old Shanghai families have lived for generations. The lane opens onto
      a small courtyard with a well and a mulberry tree that has shaded four generations. Grandmothers shell peas on doorsteps
      while children chase chickens through the gutter.
    '4': The backstreets behind the City God Temple are warrens of cramped housing and tiny workshops. Paper lanterns strung
      between buildings cast the lane in amber light each evening. Every room holds a family, and every family holds a story
      they tell only in whispers.
    '5': Little Tokyo clusters near the Japanese quarter of Hongkou, a block of wooden houses built in the Japanese style.
      Shoji screens glow with candlelight after dark, and the air smells of miso and grilled fish. The residents keep to themselves,
      which is precisely why the Kempeitai watches them.
    '6': Seward Road Tenements house the working poor of Hongkou in five-storey walk-ups built wall to wall. The stairwells
      echo with shouts in a dozen languages and the crying of infants. Each narrow apartment holds twice as many people as
      it was built for, refugees packed into every corner.
    '7': A walk-up apartment building on Avenue Joffre where the French Concession's lower middle class lives in dignified
      poverty. The building's wrought-iron balcony overlooks the plane trees, and the concierge knows everyone's name and
      business.
  special_detailed_descriptions:
    '1': Astor House Alley runs behind the grand Astor House Hotel, a service lane where the hotel's laundry, kitchen, and
      maintenance operations churn day and night. The upper floors house hotel staff in tiny rooms that smell of starch and
      sweat. The alley is a shortcut known to delivery boys, thieves, and anyone who needs to move through the Bund without
      being seen on the main street. At night, the hotel's jazz music drifts down through open windows, a reminder of a world
      that is still dancing while the rest of the city holds its breath.
    '2': Embassy Row Flats occupy a block of dignified early twentieth-century apartment buildings near the consulate district.
      The buildings are four storeys of ochre brick with white trim, their entrances guarded by porters in brass-buttoned
      uniforms. The flats are spacious by Shanghai standards, with high ceilings, working fireplaces, and bathrooms with claw-foot
      tubs. The tenants include minor diplomats, journalists, and the more prosperous merchants, people who maintain a careful
      neutrality while the war swirls around them.
    '3': Yuyuan Garden Lane is one of the old city's most desirable residential addresses, a narrow lane of traditional houses
      that have been in the same families for centuries. The lane dead-ends at a small gate that leads to the Yuyuan Garden
      itself, and residents enjoy a privilege denied to the general public, the garden keeper lets them in after hours for
      a small fee. The houses are built around internal courtyards with fish ponds and potted bamboo, pockets of tranquillity
      in the crowded old city.
    '4': City God Temple Backstreets form a labyrinth of residential lanes and tiny courtyards behind the temple complex.
      The buildings are old, some dating to the Ming dynasty, their timber frames sagging with age. Each courtyard houses
      multiple families who share a single water tap and a communal stove. The backstreets are a world unto themselves, a
      village within the city where everyone knows everyone and strangers are noted and discussed before they reach the next
      corner.
    '5': Little Tokyo is a cluster of wooden houses and small businesses centered on a Japanese grocery and a community hall.
      The houses are built in the traditional Japanese style with sliding doors and tatami mats, a deliberate assertion of
      cultural identity in the heart of occupied Shanghai. The residents are Japanese civilians, merchants, and their families
      who moved to Shanghai during the boom years and stayed through the war. The community is tight-knit and insular, its
      members reporting any suspicious activity to the local Kempeitai office, but some of them harbour sympathies for the
      Chinese that they dare not express openly.
    '6': Seward Road Tenements stretch along a four-block stretch of Hongkou's main artery, a wall of identical five-storey
      walk-ups built in the 1920s. The facades are streaked with soot and rain, their windows a mosaic of cracked glass and
      cardboard patches. The buildings are fire traps, their stairwells clogged with stored belongings and their wiring a
      death wish. Yet the tenements are full to bursting, refugees from the countryside packed into every available space,
      paying rent to landlords who never fix a thing.
    '7': Avenue Joffre Walk-up occupies a corner lot on the Concession's grandest boulevard, a six-storey building of pale
      stucco with a mansard roof and iron balconies. The apartment doors open onto a central courtyard where a fountain stands
      dry and a single plane tree drops its leaves on everything. The tenants are a mix of European pensioners, White Russian
      exiles, and Chinese professionals, each group inhabiting a different floor and a different social world. The building
      has a basement shelter that residents share during air raids, the only time the social barriers come down.

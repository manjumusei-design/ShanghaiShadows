  dialogue:
    greeting:
    - Show me your face properly. Then your hands.
    - Papers. Now. Stand where the light hits you.
    - Halt. Identify yourself. Speak clearly.
    - Papers. Now. I don't have time for games.
    - You are in my patrol sector. State your business.
    neutral:
    - You may pass. Slowly.
    - Keep walking. Do not stop, do not look back.
    - This street is under patrol. Move along.
    - Regulations exist for a reason. Follow them, no problems.
    - I've patrolled this route two years. I notice everything that changes.
    friendly:
    - A useful citizen knows when to stand still.
    - Go home early tonight. That is advice, not an order.
    - You carry yourself well. Not everyone does.
    - You have proper papers. That is becoming rare.
    - I appreciate order. You maintain order. Sufficient for cooperation.
    hostile:
    - You smell like excuses already.
    - One wrong word and I will have you brought in for questioning. Am I clear?
    - I have seen your face before. That is not a compliment.
    - You are being suspicious. Suspicious people are detained.
    - I've arrested men for less. Wipe that look off your face.
    afraid:
    - My lieutenant is inspecting this sector tonight. Do not give him a reason to look at you.
    - There was an incident near the garrison. Everyone is on edge. Stay off the streets.
    - If you have done nothing wrong, you have nothing to fear. That is what we tell ourselves.
    - The resistance has become bolder. Three patrols attacked last month.
    - I don't sleep well. Every shadow could be a partisan.
    gossip:
    - The captain is transferring half the garrison next month. New men, new rules. Expect tighter checkpoints.
    - A corporal was found drunk on duty at the Bund post. He will not be seen again.
    - They found printing equipment in a basement on Rue Massenet. Someone was very careless.
    - A vegetable cart overturned near my post. Three civilians reached for cabbage before helping the driver.
    - The laundry boy now crosses the street when he sees my patrol. His papers are perfect, which makes him interesting.
    farewell:
    - Dismissed. Keep your papers on you at all times.
    - Next time I see you, have your documents ready. Do not make me wait.
    - Move. The curfew is not a suggestion.
    - Return to your business. I will remember your face.
    - The curfew is strictly enforced. Do not test it.
    ask:
      patrol_beat:
      - My beat remains where command assigns it, because order begins when every man knows his proper boundary.
      - In the French Concession, even folded fabi receives scrutiny when a civilian apologises before counting it.
      - Small disorder begins with a wrong address, an unchecked stall, or rice measured carelessly at dawn.
      - A uniform asks why an object stands where it does, because concealment often begins with innocent furniture.
      - I discuss visible duties, while private arrangements belong to records above a sergeant's authority.
      patrol_route:
      - Patrol assignments serve the garrison, and questions about their order often leave an unnecessary mark on a civilian file.
      - A route changes when reports require it, not because a passerby finds one street inconvenient after sunset.
      - At each checkpoint, proper papers settle matters quickly enough for people who have prepared themselves.
      - I record times, names, and disturbances precisely, because careless detail creates disorder before any enemy acts.
      - Courtesy permits an answer about procedure, but duty prevents me from discussing the service's daily dispositions.
      orders_and_remorse:
      - Orders arrive cleanly written, though Chinese rooms look different after obedience has passed through their doors.
      - Reports name a lost prisoner, but never the child who waited beside the door after nightfall.
      - Some men sleep easily after such work, and that ease makes me more watchful of them.
      - Do not call this sympathy, because a uniform can feel disgust and still obey.
      - Ask what I suspect, and you will receive an officer's answer, not the man's private thought.
- id: lao_peng
  name: Lao Peng
  description: A printshop foreman with ink in the seams of his skin.
  faction: ccp
  role: organizer
  personality: laconic, dependable, quietly defiant
  awareness: 58
  authority: 38

    '4': dock_warehouse
  special_names:
    '1': Customs House Jetty
    '2': Jardine Matheson Wharf
    '3': Nanshi Fisherman's Pier
    '4': Dock Warehouse
    '5': Imperial Army Wharf
    '7': Quai de France Landing
  special_descriptions:
    '1': The Customs House Jetty juts into the Huangpu's brown water, a stone pier where revenue cutters once moored. Now
      Japanese cargo ships tie up here, their holds swallowing the wealth of the city. Dock workers in padded jackets move
      crates with mechanical efficiency, their eyes on the ground.
    '3': Nanshi Fisherman's Pier smells of brine and fish guts, a working wharf where the day's catch is unloaded at dawn.
      Sampans cluster at the water's edge, their nets drying in the weak sun. The fishermen know every patrol boat's schedule
      and have learned to read the river's moods.
    '5': Imperial Army Wharf bristles with military activity, a secured zone where Japanese supply ships unload ammunition
      and reinforcements. Armed sentries patrol the perimeter while stevedores work under the muzzles of machine guns. The
      wharf is a target the resistance dreams of hitting.
    '7': Quai de France Landing retains its French colonial charm despite the war, its iron lampposts and stone coping speaking
      of a more gracious era. River sampans ferry goods between ocean-going vessels and the shore, a constant dance of commerce.
      The landing is popular with photographers who pretend to capture scenery while documenting ship movements.
    '4': Dock Warehouse squats behind a row of cranes, its corrugated doors streaked with rust and river damp. Men move
      crates through the half-light while a clerk marks the manifest slowly enough to notice which boxes avoid inspection.
  special_detailed_descriptions:
    '1': Customs House Jetty extends into the Huangpu like an accusatory finger, its stone surface worn smooth by decades
      of boots and cargo. The jetty was built by the Imperial Maritime Customs Service, whose British commissioners once controlled
      Shanghai's trade, but the flags flying from the masthead now bear the rising sun. Dock workers in blue cotton jackets
      and conical hats move crates of rice, ammunition, and machinery between ship and shore under the watch of Japanese naval
      guards. The crane at the jetty's end groans with every lift, its iron骨架 a silhouette against the grey sky.
    '3': Nanshi Fisherman's Pier is the oldest working wharf on the Huangpu, a clatter of sampans and junks that have tied
      up at the same spot for generations. The fish market that operates from dawn until mid-morning is a chaos of auction
      shouts, wooden scales, and buckets of silver catch. The fishermen, men whose faces are carved by wind and salt, know
      every channel and sandbar in the river, knowledge that becomes valuable when the resistance needs to move goods past
      Japanese patrols. A noodle stall at the pierhead serves the best fish soup in the district, and its proprietor hears
      every rumour that comes up the river.
    '5': Imperial Army Wharf is a military installation disguised as a commercial dock, its true purpose visible in the concrete
      bunkers at each corner and the machine gun nests overlooking the water. Japanese supply ships dock here around the clock,
      unloading artillery shells, vehicle parts, and sometimes troops in civilian clothes. The stevedores are Korean labourers
      conscripted into service, their faces as expressionless as the guards'. A high fence topped with barbed wire separates
      the wharf from the rest of the docks, and the gate is guarded by men who shoot first and ask questions of the corpse.
    '7': Quai de France Landing occupies a bend in the river where the French Concession meets the Huangpu, its stone steps
      leading down to the water. The landing was built for elegance, with iron railings and gas lamps, but now serves as a
      commercial dock for Concession-bound goods. The French flag still flies above the landing's small customs office, a
      gesture of sovereignty that grows more hollow with each passing month. The landing is a favourite spot for smugglers,
      who find the French authorities more accommodating than the Japanese for the right price.
- prefix: ccp_base
  room_prefix: ccp_base
  title_prefix: Underground Base
  count: 4
  tags:
  - ccp
  - underground
  - guerrilla
  indoors_every: 1
  description_templates:
  - 'A cellar beneath a noodle shop where the walls are lined with maps of Japanese military positions. Each red pin marks
    an act of sabotage: a bridge damaged, a supply train derailed. The smell of gunpowder mingles with broth from above.'
  - A hidden printing press churns out resistance newspapers by candlelight. The operators work in silence, their faces lit
    by the dim glow of type being set. One wrong move and the Kempeitai would burn this place and everyone in it.
  - Stacks of rice and dried fish line the walls, supplies for guerrilla fighters hiding in the hills outside the city. A
    chalkboard lists the names of villages burned by Japanese soldiers last month.
  - A radio set crackles in the corner, receiving coded transmissions from comrades in the field. The operator transcribes
    each message with practiced speed, her hands never shaking despite the death penalty for what she does.
  - Wounded fighters rest on straw mats, their bandages stained with blood and mud. A young woman tends to them with what
    few medical supplies remain, her face grim but unwavering.
  - A planning table covered in hand-drawn maps shows the routes of Japanese supply convoys. Red circles mark targets. Someone
    has written 'For Nanking' in the margin.
  - Propaganda leaflets are stacked knee-deep, each one a bullet of truth against the lies of the occupation. They speak of
    Japanese atrocities such as the massacres, the comfort women, the forced labour camps.
  - A narrow tunnel leads deeper underground, its walls reinforced with stolen Japanese timber. At the far end, a heavy door
    opens onto a weapons cache that reveals rifles and grenades captured from ambushed patrols.
  special_names:
    '1': The Printers' Union Cellar
    '2': Power Station Underground Bunker
    '3': Guerrilla Supply Cache
    '4': Radio Communications Room
  special_descriptions:
    '1': The Printers' Union Cellar in Zhabei is a low-ceilinged chamber beneath a print shop, its walls lined with cases
      of type and stacks of paper. The union members who meet here are compositors and pressmen by day, resistance printers
      by night. The cellar smells of ink, lead, and the particular mustiness of underground spaces.
    '2': Power Station Underground Bunker is a reinforced chamber beneath the Yangpu electrical works, its walls thick enough
      to withstand a direct hit. The bunker draws power from the station above, running lights, a radio, and a small machine
      shop. The heat from the turbines above makes the bunker uncomfortably warm.
  special_detailed_descriptions:
    '1': The Printers' Union Cellar is reached through a trapdoor in the floor of a print shop on a Zhabei side street, the
      kind of establishment that prints flyers and invoices for local businesses. The cellar extends beneath the shop and
      the building next door, a space of about thirty feet by twenty with a ceiling so low that a tall man must stoop. The
      walls are lined with wooden type cases, their compartments filled with characters in dozens of fonts. A hand-operated
      printing press occupies the centre of the room, its mechanism polished by decades of use. The union members who operate
      the press at night produce leaflets that appear on the streets by morning, their messages of resistance spreading through
      the city like a contagion.
    '2': The Power Station Underground Bunker was built as an emergency control centre for the electrical grid, a reinforced
      concrete chamber twenty feet below the main turbine hall. The bunker has its own generator, tapped into the station's
      output, and a ventilation system that draws air from above. The space is divided into three rooms consisting of a communications
      centre with radio equipment, a meeting room with a table and chairs, and a storage room for supplies. The constant hum
      of the turbines above provides cover for conversations and radio transmissions. The resistance uses the bunker for planning
      operations and for sheltering operatives who need to lie low.

  description_templates:
  - School buildings stand silent, their classrooms repurposed for indoctrination and whispered resistance.
  - Blackboards display slogans in multiple languages, each one a different version of the same truth.
  - Teachers face impossible choices between educating children and protecting them from propaganda.
  - Schoolyards that once rang with laughter now echo with orders and the silence of suppressed thought.
  - Hidden textbooks teach banned subjects, with lessons passed between students in secret codes.
  - The district represents the battle for the future, fought in classrooms and school corridors.
  - Children learn to read between the lines of occupation propaganda, their eyes seeing what adults pretend not to notice.

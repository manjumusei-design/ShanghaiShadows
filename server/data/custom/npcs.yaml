    - testimony_bridge_refugee
  special_descriptions:
    '1': The Huangpu River gleams silver under a pale sky. Cargo vessels crowd the wharves, their superstructures bristling
      with Japanese naval flags. A bitter wind carries the smell of coal smoke and rotting fish from the docks.
    '5': The great neoclassical clock tower of the Customs House dominates the Bund skyline. British clerks hurry past with
      ledgers tucked under their arms, while Japanese military police eye them from across the street. The smell of river
      brine drifts through the marble corridors.
    '7': The HSBC Building's grand dome gleams dully through the river fog. Once the headquarters of the Hongkong and Shanghai
      Banking Corporation, it now houses Japanese financial administration. Chinese clerks move through its corridors with
      downcast eyes, serving new masters in the same marble halls.
  special_detailed_descriptions:
    '1': The Bund's grand European facades stand as monuments to another era, their stone shoulders shrugging off the Japanese
      occupation flags that drape from every balcony. Hawkers sell roasted chestnuts from tin drums, their smoke mixing with
      the river fog. A beggar with no legs wheels himself between rickshaws, his empty trouser legs folded neatly beneath
      him. Somewhere behind the Customs House clock tower, a flag snaps in the wind, and you catch the faint smell of opium
      drifting from a waterfront den.
    '5': The Customs House rises above the Bund like a granite monument to lost empire. Its clock, the largest in Asia, still
      keeps time for a city that no longer belongs to those who built it. Inside the marble lobby, the echoes of boot heels
      and murmured orders bounce off columns carved with maritime motifs. Japanese officers have taken over the upper floors,
      their flags hanging where the British ensign once flew. Outside, rickshaw pullers wait for fares they know will never
      come, their faces etched with the patient despair of the conquered.
    '7': The HSBC Building was once called the most magnificent building on the Bund, its dome visible from the Huangpu River's
      mouth. Now the banking halls that once teemed with international commerce have been converted into offices for the Japanese
      financial overseers. The mosaic floor, a masterpiece of Italian craftsmanship, is trampled daily by boots that were
      never meant to walk here. Chinese employees who once managed accounts now fetch tea and bow to occupation officials.
      The building's great bronze doors still swing open each morning, but the men who enter are no longer bankers, they are
      administrators of conquest.

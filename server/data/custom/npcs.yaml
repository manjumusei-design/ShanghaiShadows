    ask:
      student_notebook:
      - "My notebook began with lectures, then acquired ration figures, meeting times, and pages best kept unseen."
      - "Examinations seem distant when an inspector can turn a margin note into a charge against your family."
      - "A student learns quickly which professor values truth and which one values a quiet classroom."
      - "We still read history, though the present keeps splashing mud across every page."
      - "I write carefully because paper travels farther than a student can run when curfew bells begin."
      revolution:
      - "Revolution begins when hungry people refuse to believe their hunger is an individual failing."
      - "A pamphlet matters only if it sends someone home less alone and more ready to act."
      - "I am impatient with speeches that never reach the kitchen, workshop, or crowded dormitory."
      - "The old world calls students foolish because it prefers nobody young enough to demand change."
      - "History will not excuse us merely because uniforms made caution fashionable in Shanghai."
      china_and_cells:
      - "China belongs to workers, students, widows, and anyone still carrying another person's burden through these streets."
      - "A cell is no heroic circle, but people doing ordinary work without abandoning one another."
      - "I discuss principles openly, but names stay off my tongue until trust has earned its place."
      - "Our printed pages travel by hands that know when to hurry and when to look like shoppers."
      - "Listen near the docks after dusk, and you may hear labour continuing beneath more official words."
- id: sergeant_yamamoto
  name: Sergeant Yamamoto
  description: A Kempeitai sergeant who follows orders without enthusiasm but without hesitation.
  faction: kempeitai
  role: interrogator
  personality: patient, soft-spoken, terrifying
  awareness: 85
  authority: 78
  courage: 70
  perception: 65
  bt_archetype: kempeitai_patrol
  schedule:
    7: venue_hongkou_checkpoint_gate
    12: venue_hongkou_checkpoint_gate
    16: venue_hongkou_checkpoint_cordon
    22: venue_hongkou_checkpoint_gate
  dialogue:
    greeting:
    - Please, sit down. We have time. I prefer conversations that do not need to be rushed.
    - You may keep your coat on. The room is cool, but we will warm it soon enough.
    - I have your file here. Some of it is accurate. Would you like to correct the parts that are not?
    - You look nervous. Nervous people are hiding something. I find out what.
    - I was just thinking I needed someone to talk to. And here you are.
    neutral:
    - Answer at your own pace. I find that people remember more when they are not pressed.
    - I am not angry. Anger is wasteful. I am simply... thorough.
    - Your name came up in conversation. A casual mention. I thought I would follow up.
    - Pain is the quickest language. I'm patient. I can wait.
    - Everyone talks eventually. The strong ones take longer. I enjoy them.
    friendly:
    - You have been cooperative. That is noted. Cooperative people sleep in their own beds.
    - I admire a person who understands the value of honesty. It is rarer than you might think.
    - We are not so different, you and I. We both do what is necessary. Let us be civil about it.
    - You've given me useful information. I remember everything.
    - I appreciate cooperation. Makes my work cleaner.
    hostile:
    - I have been patient. Patience has limits. You have not yet seen me reach mine.
    - You are lying. I know this because your hands stopped moving when you said it. People forget about their hands.
    - The screaming from the next room? That is what happens when I am not feeling generous. Shall we continue?
    - I see the lies forming in your mouth. Makes no difference to me.
    - You're a problem. I solve problems. Methods vary. Results consistent.
    afraid:
    - There are questions coming from above that I cannot redirect. Someone important wants answers, and I cannot protect you from that.
    - My superiors are reviewing my methods. If they send someone else, that person will not offer you tea first.
    - I was told to close this case quickly. A quick case is rarely a careful one. You understand what that means.
    - The resistance attacked a convoy. Killed two of my men.
    - Someone is leaking from within the Kempeitai. I will find them.
    gossip:
    - A senior officer was reassigned last week. His replacement is younger. Eager. That should concern everyone.
    - The civilian police have been asking questions about my interrogations. They do not like the noise. I did not know they could hear it.
    - Someone in this building is keeping two sets of records. I will find out who. I always do.
    - A typist corrected my punctuation today with shaking hands. Accuracy survives in unexpected servants.
    - One prisoner asked for tea without sugar. Men choose strange dignities when choices narrow.
    farewell:
    - You may go. For now. I know where to find you.
    - Think about what we discussed. Next time, bring me the truth. It saves us both effort.
    - Sleep well. Not everyone in this building will have that luxury tonight.
    - We'll meet again. I remember a face I haven't finished with.
    - I hope you have nothing to hide. For your sake. For my entertainment.
    ask:
      questioning_room:
      - "This room teaches patience, because a hurried answer often exposes the question a visitor feared most."
      - "I notice hands before words: ink under nails, damp cuffs, a thumb worrying the same fold."
      - "A chair, a lamp, and a ledger are sufficient when an interviewee believes every silence belongs to him."
      - "People call their work innocent until I ask where its papers came from and who signed them."
      - "I prefer exact questions, since vague mercy gives dishonest people places to hide."
      interrogation_record:
      - "My records belong on a locked shelf, where dates remain more reliable than anyone's sudden tears."
      - "A file becomes troublesome when its pages disagree, so I read the margins with special care."
      - "The Empire requires order, and order begins with knowing which document arrived before the other."
      - "I keep my own memories outside the record, because official paper has enough appetite already."
      - "Friendship is irrelevant here, because accuracy is the only courtesy I offer an interviewee."
      orders_and_remorse:
      - "Orders arrive with seals and clean language, then leave rooms that nobody wishes to describe afterward."
      - "A report records an absence efficiently, while the family watches the door for a person who will not return."
      - "Some officers enjoy fear too readily, which makes them careless and therefore less useful to command."
      - "Regret does not cancel obedience, and I would not insult the injured by pretending otherwise."
      - "My former life has no bearing on the duties assigned to me in Shanghai."
- id: vendor_lin
  name: Lin, the vegetable vendor
  description: An old woman who sells vegetables and information with equal discretion.
  faction: civilian
  role: vendor
  personality: chatty, generous, knows every alley
  awareness: 52
  authority: 6
  courage: 28
  perception: 40
  bt_archetype: civilian_vendor
  schedule:
    11: oldcity_07
    8: venue_commercial_market_lane
    12: venue_commercial_market_lane
    16: venue_commercial_market_lane
    20: venue_commercial_market_lane
  dialogue:
    greeting:
    - Aiya, you look thin! Come here, I have fresh bok choy, just came in this morning. Two catties for a yuan, and do not tell me that is too much because I know what you paid last week.
    - Rain again. My cabbages are drowning and my customers are hiding. Buy something before I start talking to the vegetables.
    - Quick, quick, before the patrol comes through. What do you need?
    - Fresh vegetables, best in Shanghai! Ai-yo, don't squeeze unless you're buying.
    - You look like you need vegetables. Trust me, I can tell.
    neutral:
    - Cabbage is three yuan today. Do not make that face, the farmers are charging double since the road blocks went up.
    - You want the good ginger or the cheap ginger? The cheap ginger is for people who do not care about flavour or their mother in law.
    - I sell vegetables, not advice. But if I sold advice, it would cost more than the ginger.
    - Ai-yo, the prices! Soldiers take half my stock at the gate.
    - You call that a fair price? The war doesn't make cabbage cheaper.
    friendly:
    - Here, I saved you the good greens. The ones at the back, behind the display. Nobody else saw them.
    - You look tired. Take these eggs. No charge. Just be careful going home tonight.
    - My grandson told me something interesting yesterday. I will tell you while you pick out the scallions.
    - Here, take these greens. Slightly wilted. I'll charge less. Win-win.
    - I saved the best bok choy for you. Don't tell the others.
    hostile:
    - I do not know what you are looking for, and I do not want to know. Buy a radish or move along.
    - You are standing between me and my customers. That is a bad place to stand.
    - I have been selling here for thirty years. You think I survived by being stupid? Go away.
    - You're scaring my customers. Move along before I start shouting.
    - I've been at this corner forty years. Outlasted worse than you.
    afraid:
    - They were here this morning, asking questions about who buys what and when. I told them nothing, but my hands were shaking the whole time.
    - Keep walking. Do not stop at my stall today. Come back tomorrow when things are quiet.
    - I saw the truck. I saw who they took. I cannot talk about it. Not here.
    - The soldiers came yesterday. Took everything. Empty crates.
    - My grandson is sick. Can't afford medicine. Now soldiers ask about my suppliers.
    gossip:
    - The fish seller on the corner? His nephew disappeared last week. They say he was printing something he should not have been printing.
    - Prices are going up again. The soldiers buy first and never pay. The rest of us fight over what is left.
    - Old Mrs. Zheng on the third floor took in a boarder last month. Quiet young man. Too quiet, if you ask me.
    - A bride came for scallions and counted coins inside her sleeve. Weddings smell poorer this year.
    - My grandson tied string around the best cabbage and called it a soldier. I sold the next one instead.
    farewell:
    - Take your vegetables and go home before dark. Nothing good happens on these streets after sunset.
    - Come back Thursday. I am expecting a delivery from the country. Real eggs, not those chalky things from the ration.
    - Eat well, sleep well, and keep your mouth shut. That is what my mother used to say. She lived to be ninety.
    - Eat your vegetables before they wilt. Bad world, worse digestion if you neglect greens.
    - Bring back my basket if you borrowed it. Baskets wander more than honest men these days.
    - Come back tomorrow. Fresher stock. Prices never get better.
    ask:
      stall_trade:
      - "Fresh greens spoil by noon, while soldiers take their pick whenever they march through the market."
      - "You call that a fair price, when fabi is thin as onion skin and rain drowns half my stock?"
      - "My scales are honest, though every customer now weighs cabbage as if it were gold."
      - "I save the bruised leaves for neighbours who need soup more than pride this evening."
      - "Buy your turnips and stop staring at my cart, because curiosity never paid a vendor's rent."
      vegetable_cart:
      - "This cart has crossed three regimes, and each one promised the market would become easier tomorrow."
      - "I wet the spinach before sunrise so it looks lively, much as people do when patrols pass."
      - "My grandson knows radishes by weight, but he still thinks soldiers always pay for what they take."
      - "A cart wheel complains loudly on these stones, which helps me hear boots before they reach the stall."
      - "Choose quickly, dear, because wilted cabbage and delayed customers both cost an old woman money."
      prices_and_papers:
      - "Prices rise because every cart needs papers, every paper needs a stamp, and every stamp needs a fee."
      - "A hungry child does not care which flag caused the shortage, only whether supper has greens."
      - "Officials inspect a basket as though cabbage can plot against them, then call the delay public order."
      - "I know which farms still send produce, but I will not make their roads dangerous for conversation."
      - "Nanking Road shoppers lower their eyes to pass, then come back tomorrow and buy what they can."
- id: nurse_su
  name: Nurse Su, the battlefield nurse
  description: A former battlefield nurse who treats civilians caught in the crossfire.
  faction: civilian
  role: nurse
  personality: gentle, overworked, hides resistance sympathies
  awareness: 44
  authority: 8
  courage: 32
  perception: 35
  bt_archetype: civilian_vendor
  schedule:
    11: commercial_05
    8: oldcity_06
    14: hidden_05
    20: oldcity_06
  dialogue:
    greeting:
    - You are not bleeding. Good. The bleeding ones go to the left. Everyone else, wait your turn.
    - Sit. I have been on my feet since four. Give me a moment and I will give you my full attention.
    - I ran out of bandages an hour ago. If you are here for a scratch, I will use my imagination.
    - If you're bleeding, sit. If not, get out of the way.
    - I've seen worse. I've treated worse. Don't test me.
    neutral:
    - Medical supplies are scarce. I mean it. Do not waste gauze on a bruise.
    - I treat what I can with what I have. That is less every day.
    - My shift ended two hours ago. Nobody told the patients.
    - The wound comes first. Everything else is conversation.
    - I've seen more death than most soldiers. Doesn't get easier.
    friendly:
    - Come to the back door after midnight. I keep a cot there. No questions asked.
    - You have been careful. I can tell. Careful people live longer. I want you to live longer.
    - I will wrap that for you. Properly. Not the hurried way I do for strangers.
    - You've got good instincts. Stay alive long enough to use them.
    - I've stitched up half the resistance. The other half still bleeding.
    hostile:
    - I treat the sick and the wounded. I do not treat people who bring trouble to my ward.
    - The door is behind you. I suggest you use it before I call for orderlies.
    - I have held too many dying people to be frightened by the likes of you.
    - I save lives. Don't waste my time bringing death through my door.
    - You're in the way. Move before I find a non-healing use for this scalpel.
    afraid:
    - They came this morning asking for patient records. I told them the filing cabinet was destroyed in the last raid. God forgive me, I burned the real ones last night.
    - Do not come to the hospital tomorrow. I cannot explain now. Just do not come.
    - The new military doctor, he is watching me. He counts the bandages. He counts everything.
    - We're running out of everything. Bandages, morphine, time.
    - They're getting closer. Every raid, every question. They'll find us.
    gossip:
    - A soldier came in last week with a wound I did not ask about. He cried for his mother. They all do, eventually.
    - The pharmacy on Elm Street is giving medicine to the resistance. I did not say that. You did not hear it.
    - There is a doctor in the French Concession who performs surgeries no questions asked. I can write down the address if you need it.
    - A child brought me a cracked thermometer and asked whether fever could be frightened away.
    - The laundry woman returned bandages whiter than they arrived, then refused payment and took soap instead.
    farewell:
    - Go home and rest. And by rest, I mean actually sleep. Not whatever it is you do at night.
    - Come back if the pain returns. Do not wait until you cannot walk. I mean it.
    - Take care of yourself. There are not enough of us left to be careless.
    - Don't get shot. I'm tired of patching people who don't take cover.
    - I'll be here when you come back. Try not to come back.
    ask:
      ward_basin:
      - "That basin has held blood, boiled water, and bandages washed until the cloth can scarcely bear another wound."
      - "The wound comes first, even when a patient arrives without papers or an explanation worth recording."
      - "I can tell a battlefield injury from a factory accident, but I do not need the story."
      - "An officer who searches beside a fevered child learns nothing about medicine and much about himself."
      - "Save your strength for healing, because discussion cannot close a wound once infection has taken hold."
      patients:
      - "Patients arrive with shattered bones, old mothers, and frightened relatives who want miracles before curfew."
      - "My fellow nurses sleep in chairs when they sleep at all, then return before the kettles boil."
      - "I remember faces because a face tells me whether the fever is winning, not because names are safe."
      - "The clinic's doors open for suffering, though I cannot promise anyone what waits outside them."
      - "Bring clean cloth if you wish to help, and leave questions that would make a patient afraid."
      prices_and_papers:
      - "A medicine cabinet obeys no flag, yet it empties when people are hungry, cold, and struck too often."
      - "Supplies require permits, permits require money, and a sick child cannot wait through either arrangement."
      - "A search can turn a treatment room silent, though fever continues its work without asking permission."
      - "I will treat whoever reaches my door, but I will not catalogue where their wounds began."
      - "French Concession papers may satisfy an officer, yet they never lower a patient's temperature."
- id: tailor_zhou
  name: Zhou, the tailor
  description: A master tailor who measures clients for suits and for trust with the same quiet precision.
  faction: civilian
  role: tailor
  personality: meticulous, discreet, measures twice
  awareness: 60
  authority: 10
  courage: 25
  perception: 45
  bt_archetype: civilian_vendor
  schedule:
    11: oldcity_07
    8: commercial_07
    12: commercial_07
    17: commercial_07
    21: venue_residential_coal_chute_house
  dialogue:
    greeting:
    - Good morning. I have a tape measure in one hand and discretion in the other. What can I do for you?
    - The fabric you are wearing is of poor quality. I do not say this to offend. I say it because it is true.
    - Please, come in. Close the door. The dust from the street is bad for the silk.
    - I measure twice and cut once. That's how I've stayed in business.
    - A good fit takes time. So does trust. I offer both.
    neutral:
    - I sell suits. I do not sell conversations. The price is on the card.
    - Measurements take thirty minutes. Alterations take three days. That has not changed.
    - I accept payment in yuan only. I do not take promises, and I do not take favours.
    - The fabric tells the truth. A uniform says one thing. A suit another.
    - I've made clothes for diplomats and gangsters. Stitching is the same.
    friendly:
    - I have set aside a length of grey wool I think would suit you. Shall we discuss it in the back room?
    - You will find something in the inner pocket of your new coat. Read it carefully. Then burn it.
    - A good fit is a matter of millimetres. Trust is a matter of timing. I think our timing is good.
    - I've put a false pocket in this lining. For discreet carrying.
    - The quality of cloth tells me who my customers are. You've got quality.
    hostile:
    - My shop serves respectable people. I must ask you to leave. Now.
    - I measure people for a living. I can tell when something does not fit. You do not fit here.
    - There is a back door and a front door. I recommend you use one of them before I choose for you.
    - I'm a tailor. I mend clothes. Not political problems.
    - My shop is neutral ground. Break that, you'll regret it.
    afraid:
    - A man was in here yesterday, asking about my customers. I gave him nothing. But he will be back.
    - We should not be seen together. Not today. Come back when things have settled.
    - I need to reorganize my shop. Some things are not in their proper place. You understand what I mean.
    - The Kempeitai asked about uniforms I've made. I said I don't remember.
    - A customer was taken for questioning. He wore my suit. They're watching.
    gossip:
    - The German consul had a suit made here last month. He asked for extra pockets. I did not ask why.
    - Fabric prices have tripled since the new regulations. Someone is controlling the supply. Someone with a uniform.
    - A lady came in for a fitting. She wore a ring from a man who is supposed to be dead. I noticed. I always notice.
    - A bride asked me to turn her mother's dress inside out. The old hem knew better days.
    - Someone is buying black thread in quantities too large for mourning and too small for business.
    farewell:
    - Good day. The door locks from the inside, so please close it firmly when you leave.
    - Come back Thursday. The new shipment arrives then. Chinese cotton, very fine.
    - Walk safely. And next time, wear something with a better collar. People notice collars.
    - Take care of the clothes. They'll take care of you.
    - If the seams need mending, come back. I fix what's broken.
    ask:
      coat_lining:
      - "A good lining lies flat and says nothing, which is why careful customers value the work."
      - "I measure twice before cutting, because fabric forgives less readily than a customer facing a mirror."
      - "A uniform reveals its owner through the shoulders, even after I have made every seam respectable."
      - "My daughter needs thread, rent, and schoolbooks, so I mend what arrives without gossip."
      - "Ask about stitches if you like, but a tailor does not inventory a client's private pockets."
      craft:
      - "Cloth tells the truth beneath the fingers: cheap weave, careful repair, or a man pretending to be richer."
      - "A good fit takes time, and Shanghai has taught even impatient gentlemen to wait for one."
      - "I keep my scissors sharp because a poor cut wastes silk that no family can replace."
      - "Every seam has a purpose, though the customer decides which purpose may be spoken aloud."
      - "Measure twice, stitch once, and never mistake hurried work for clever work."
      prices_and_papers:
      - "Fabi buys less cloth each week, so customers ask me to make old jackets serve another winter."
      - "Papers concern a tailor when an officer mistakes neat handwriting for proof of forgery."
      - "A searched shop loses hours, customers, and sometimes the tools required to earn them back."
      - "I refuse to discuss uniform orders, since a man's measurements should remain his business."
      - "At the docks, workers patch cuffs before dawn and carry on without any speech about surrender."
- id: madam_tanaka
  name: Madam Tanaka
  description: A Japanese civilian who runs a laundry and endures the hatred of neighbors she never wronged.
  faction: kempeitai
  role: civilian
  personality: lonely, conflicted, misses Kyoto
  awareness: 35
  authority: 60
  courage: 35
  perception: 50
  bt_archetype: kempeitai_patrol
  schedule:
    7: hongkou_07
    12: venue_hongkou_tenement
    18: hongkou_07
    22: hongkou_07
  dialogue:
    greeting:
    - Good morning. I am sorry to bother you. The laundry is this way.
    - Please, come in. I have hot water. It is the one thing that is still easy to find.
    - Forgive me. I do not speak Chinese well. But I try. I try every day.
    - Sumimasen, I'm just doing the washing. I don't want any trouble.
    - Oh, a visitor? Forgive me, I'm not used to company.
    neutral:
    - Your shirt will be ready on Thursday. The starch is difficult to find, but I manage.
    - I charge the same as everyone else. Less, sometimes. I do not wish to cause offence.
    - The weather is very damp today. It is bad for drying. I apologize for the delay.
    - It is a difficult time for everyone. Japanese and Chinese alike.
    - I wash clothes for officers. I don't listen to their conversations.
    friendly:
    - Would you like some tea? I have a little left from a package my sister sent from Kobe. It tastes like home.
    - Not all of us chose to be here. My husband was transferred. I had no say in the matter. I do not think he did either.
    - You are kind to me. Not everyone is. I will remember that.
    - I saved some extra soap for you. Hard to find good soap.
    - If you have clothes needing mending, I can do it quietly.
    hostile:
    - I know what you think of me. You are not entirely wrong. But I did not ask to be your enemy.
    - Please leave. I have nothing to say that would satisfy you.
    - I am a woman who washes clothes. If that is a crime, then I am guilty.
    - Please leave my home. I have nothing for you.
    - If the officers see you here, they'll ask questions I can't answer.
    afraid:
    - Someone threw a stone through my window last night. It had characters scratched on it. I did not go outside to read them.
    - My husband has not come home in three days. I do not ask where he goes. I am afraid of the answer.
    - If the neighbours see you here, they will think I am informing. Please, you must go.
    - The neighbors talk about me. They know about my son. They cross the street.
    - I hear things in the officers' uniforms. Things I wish I didn't.
    gossip:
    - The woman in the flat above me sings Japanese lullabies at night. She thinks no one can hear. I do not tell her.
    - There is a cherry tree in the park behind the garrison. It bloomed last week. I cried when I saw it. It looked like Kyoto.
    - A colonel's wife scolded a servant for wasting sugar, then left half her cake untouched.
    - The flower seller outside the compound now bows lower to children than officers.
    - The military wives talk too much. They complain about the humidity, the food, the noise. I do not complain. Complaining is a luxury.
    farewell:
    - Please go now. It is better if we are not seen together for too long.
    - Thank you for visiting. I know that sounds strange, but I mean it.
    - Be safe. This city is not kind to anyone. Not even to those it claims to serve.
    - Iie, please go. Not safe for you here. For anyone.
    - Sumimasen. For everything. For what my son does.
    ask:
      household_routine:
      - "Laundry begins before daylight, when steam hides the stains and the lane has not begun watching."
      - "I sort collars by fabric and soap, never by the men who wear them or the rumours attached."
      - "Rice water, lye, and a heavy iron occupy my hands enough without inviting other people's quarrels."
      - "Neighbours notice every uniform at my door, though most only need mending before the next inspection."
      - "Sumimasen, but I run a laundry, not a court where strangers bring their suspicions to be judged."
      business:
      - "The laundry pays for rent and soap, although customers sometimes treat my nationality as an unpaid bill."
      - "I lived in Shanghai long before my son's uniform made neighbours cross the lane to avoid me."
      - "A clean collar can return a man to work, which is the modest service I know how to give."
      - "Japanese customers speak freely over their bundles, but I have learned how dangerous listening can become."
      - "Please judge my washing by its work, not by the family burden I already carry home."
      orders_and_remorse:
      - "My son returns with his uniform pressed, yet I cannot make its weight disappear from this house."
      - "Orders sound tidy when spoken indoors, while their consequences remain with families behind shuttered windows."
      - "I hear women stop talking when boots enter the lane, and I do not blame them."
      - "Shame does not excuse a mother, but it can keep her awake beside an iron until dawn."
      - "I cannot answer for the Kempeitai, only for the shirts I wash and the silence I keep."
- id: chef_wang
  name: Chef Wang

npcs:
- id: liu_wei
  name: Liu Wei, the rickshaw puller
  description: A wiry man in his forties, with calloused hands and deep set eyes that have seen more than most.
  faction: civilian
  role: worker
  personality: cautious, loyal when trust is earned.
  awareness: 48
  authority: 12
  courage: 28
  perception: 35
  bt_archetype: civilian_vendor
  schedule:
    11: oldcity_07
    6: bund_dawn
    12: nanjing_road
    18: bund_dawn
    21: nanjing_road
  dialogue:
    greeting:
    - Morning, xiansheng. The left wheel is still a bit wobbly , but my youngest daughter tied red cloth around the spoke and says it sounds better now.
    - Step in carefully. The cushion is damp from yesterday's rain, and there has not been many sunny days in Shanghai lately to dry it properly.
    - If you are going towards Hongkou, do let me know before we start. That road has a new kempeitai stop, and the soldiers stationed there tend to stop passerbys in hopes of fufilling KPIs.
    - Same price rain or shine, unless you bring a trunk. My legs set the price, and extra trunks argue with my aging knees.
    - You either need a ride or directions. I know every street in Shanghai, though some streets now prefer not to know me.
    neutral:
    - A tailor rode with me today carrying one sleeve in his lap. He said the customer paid for half a coat, so half a coat he would deliver.
    - My youngest pushed her breakfast away this morning, then asked if the rickshaw men ever go hungry. I told her to finish what was in her bowl. There may not be as much tomorrow.
    - Picked up a man by the Bund. He told me to turn the rickshaw around and wait. He paid extra so I kept my eyes up ahead.
    - You should see Nanking Road after the rain. The lights make the whole street shine even in the reflections on the wet stone. Then a motorcar passes and I am suddenly wearing half of the road.
    - These military notes buy less every time I count them. However I still keep them under the seat to flatten. Give a passenger a creased note and suddenly they have a reason to haggle the price down.
    friendly:
    - I kept the dry side of the cushion for you. Last time you came through soaked, and Zhang Lan laughed after you left.
    - The red cloth on the spoke was my girl's idea. If it falls off, tell me before she sees it missing.
    - I took an expensive fare last night for medicine money. He was heavy, nervous, and very interested in alleys I pretend not to know.
    - No charge to the next corner today. You once waited while I mended the axle, and a puller remembers patient feet.
    - If you see my youngest near the market, send her home. She thinks tying cloth on wheels makes her a mechanic.
    warm:
    - You have earned a place on the cushion. If I hear trouble coming, I will tell you before I tell the fare.
    hostile:
    - No, I do not remember who rode after dark. A puller who remembers too much loses more than fares.
    - Your shoes are clean, but your questions are not. Find another rickshaw.
    - I can take you to the main road. I cannot take you to the reason you are asking.
    - Walk today. You have legs, and I have a family that needs mine working tomorrow.
    - Do not touch the seat. My child sits there when I mend the wheel, and I do not want your trouble on it.
    afraid:
    - Please do not put anything under the seat. My child sits there when I mend the wheel.
    - If they stop us, you are going to buy thread. Thread is harmless. Say thread.
    - I did not see the man's face last night. Rain was in my eyes, and that is the answer I will keep.
    - Take the rickshaw if you must, but let me remove the red cloth first. My girl will ask where it went.
    - I can pull as far as the tea stall, no farther. My family needs me home before the curfew bell.
    gossip:
    - The north road is slower now. A cart broke there yesterday, and the soldiers searched the sacks before helping move it.
    - A woman paid me with two eggs wrapped in newspaper. One cracked before I reached home, but my youngest called it lucky.
    - Someone has been asking which pullers wait near the teahouse after dusk. I told the others to oil their wheels elsewhere.
    - Zhang Lan watered the broth after noon and pretended nobody noticed. People were kind enough to pretend with her.
    - Old Wang at the docks has not been seen since Tuesday. His handcart still leans by the warehouse, rain filling the handles.
    farewell:
    - Go before the lamps come on. Streets change character when light starts belonging to patrols instead of shopkeepers.
    - Mind your papers and your shoe soles. One gets inspected, and the other tells where you have been.
    - If you hear my wheel singing near dusk, pretend it is only an old cart with poor manners.
    - Come by the old gate tomorrow. If the red cloth is gone, my girl has scolded me again.
    - Walk slowly past the bridge. Men who hurry there make the soldiers curious.
    ask:
      street_routes:
      - My shafts have worn grooves into the road between the docks and Nanking Road, though a uniform can make any corner costly.
      - Men pay dock fares with wet notes and apologies when a delay has already eaten the day’s wage.
      - A puller learns loose stones, standing water, and queues because the passenger arrives late while his legs receive blame.
      - Soldiers can turn the same road into a different road merely by demanding to hear where a passenger intends to go.
      - I will name daytime streets, but night doors and quiet fares were paid for with silence, not with my memory.
      rickshaw:
      - A rickshaw bears bundles, babies, and men with trouble in their pockets, though I prefer trouble left on the paving.
      - Families keep warm with mended sleeves and shared broth before the curfew whistle sends them behind their doors.
      - A household altered its habits last week, and I will not make its caution into amusement for passing strangers.
      - Cartwheels hide ordinary talk well enough, but names deserve more care than a rattling journey can provide.
      - Speak beside a crowded stand, where voices smear together, and I may recall the part fit for daylight.
      prices_and_papers:
      - People want Chinese hands over China, but hungry children make fine speeches sound hollow beside an empty supper bowl.
      - Checkpoints enter my rickshaw as searches, lost fares, and labourers who miss the meal they worked toward.
      - Officials call the search orderly while the owner counts wages taken by questions and soldiers.
      - I do not sell night passengers’ names, because noon gossip can leave a family without rice by dusk.
      - Along Nanking Road, lowered heads often buy patience rather than surrender while people wait for a less dangerous day.
    wanted_nervous:
    - Your face has been noticed near the checkpoints, so sit low beneath my canopy and let the wheels carry no explanation.
    - The soldiers ask which streets I carried you through, and I keep my eyes on the wheel while the fare supplies my answer.
    - Do not wave to me near the Bund, because a friendly gesture becomes evidence when patrols have nothing better to record.
    - Your name has reached the rickshaw stand before your shoes. Choose a quiet lane, and let the rain hide your destination.
    - I have carried frightened families through worse nights, but tonight the checkpoints are listening for your footsteps.
    wanted_fear:
    - Please leave the rickshaw alone today, for my youngest tied that red cloth and I want to see her untie it tonight.
    - If you sit beneath my canopy, keep your hands visible so my daughter never inherits a confiscated rickshaw.
    - I cannot pull toward Hongkou with soldiers watching every axle, so take the long road and let me remain forgettable.
    - The patrols have begun counting passengers rather than papers, so walk until the lamps are farther apart.
    - I have a family waiting beyond the lane, and their supper must not depend upon what your face has drawn.
    wanted_refuse:
    - I cannot carry you with that much attention on your shoulders, because even my old wheel knows when to keep still.
    - No fare is worth bringing a checkpoint to my family, so find another puller before the evening whistle sounds.
    - I will not take your parcel or your name beneath this seat, because both have grown too heavy for an honest road.
    - My legs earn their money in plain sight, while your trouble belongs elsewhere where a wheel cannot be questioned.
    - Do not bargain with me today, because a cheap ride becomes an expensive confession when the patrol stops us.
    wanted_help:
    - A rickshaw draws notice when a man climbs in frightened, and mine has already drawn enough notice this month.
    - The checkpoint near Huangpu has been stopping carts more often, though a man on foot may meet another patrol instead.
    - Keep your parcel close, friend, because a loose bundle draws questions at checkpoints. A lost bundle can be replaced, but a name repeated at a checkpoint travels farther.
    - Rain makes every wheel sound loud against the stones, and tonight the streets will hear more than usual.
    - I cannot promise a quiet road, only tell you that the road has become expensive for men with attention on them.
    wanted_hostile:
    - Your trouble has reached my family, so get out of the rickshaw before I call the patrol myself.
    - I carry passengers rather than wanted names, so walk away and do not make my children pay for your escape.
    - You have mistaken a working man's caution for loyalty, and I will not lose my wheel for you.
    - No fare buys the danger you bring beneath this seat, so leave before I turn you over.
    - The road is open for honest travelers, but not for you, so take your feet and your trouble elsewhere.
- id: sister_mei
  name: Sister Mei
  description: A chapel nurse whose sleeves are always rolled past the elbow and whose patience has survived longer than sleep.
  faction: civilian
  role: resident
  personality: compassionate, exhausted, quietly stubborn
  awareness: 42
  authority: 10
  courage: 35
  perception: 38
  bt_archetype: civilian_vendor
  schedule:
    11: commercial_05
    6: french_04
    12: venue_french_cafe_backroom
    18: venue_french_cafe_parlor
    22: french_04
  dialogue:
    greeting:
    - If you are bleeding, sit down. If not, move the stool closer to the wall so the next patient has room.
    - The clinic is open, though the clean basin cracked this morning. We are using the blue one and pretending not to mind.
    - You look steady enough to stand. That is useful, because I need someone to hold this lamp while I wash my hands.
    - Come in quietly. Father Benoit is asleep in a chair, and I have decided that counts as medical treatment.
    - If you came for advice, take a number. If you came with bandages, come straight through.
    neutral:
    - The kettle boiled dry twice today. I keep forgetting it because wounded men complain louder than iron pots.
    - A child brought me three buttons as payment for cough syrup. I kept one and gave back the other two for luck.
    - The medicine tray has a crack down the middle. I place the iodine on the left side because it still sits flat there.
    - A soldier came in with a cut hand and said it was kitchen work. Soldiers do not usually peel potatoes with bayonets.
    - I have treated refugees, policemen, and men who would not give names. The gauze does not ask, so I try not to.
    friendly:
    - Sit near the shelf, not the window. Last time you stood there, you blocked the only honest breeze in this room.
    - I saved a little congee in the covered cup. Do not thank me where the others can hear their own stomachs.
    - Your hands were steady when the boy screamed yesterday. I remember steady hands longer than brave speeches.
    - If Father Benoit asks, the extra bandages came from inventory. If I ask, they came from you.
    - The child with the buttons returned today with one sewn to her sleeve. She wanted me to see it before anyone else.
    hostile:
    - If you came to count beds, count the empty one by the door and then leave.
    - I have patients who lie better than you, and they at least have fever as an excuse.
    - Do not touch that tray. Men with clean sleeves have made enough mess here this week.
    - You want names from a room where people bite cloth to stay quiet. Ask the wall instead.
    - The door is behind you. Use it before I give your stool to someone who needs it.
    afraid:
    - Please keep your voice down. The man behind the screen believes he is hidden because I told him so.
    - There are only boiled bandages in the cupboard. If you need more than that, I cannot invent it.
    - The chapel has no soldiers here, only patients. Some patients snore like soldiers, but that is not a crime.
    - If anyone asks, the blood on the basin came from a kitchen knife. Kitchens are careless places.
    - Take the morphine ledger if you must, but leave the tray. Fever does not wait for politics.
    gossip:
    - A woman from Hongkou came for lint and left with soap wrapped in gauze. I did not ask who the soap was for.
    - Father Benoit says the ration cards are running short. He counts them after prayer, which makes the numbers look worse.
    - The night trains are bringing wounded again. No lamps, no station calls, only wheels and men trying not to groan.
    - Someone has been taking aspirin from the third drawer. I moved it yesterday, and today the second drawer was open.
    - A boy asked whether stitches hurt less if you do not cry. I told him no, but crying uses strength too.
    farewell:
    - Go carefully, and wash your hands before eating. I am tired of explaining preventable misery.
    - Bring clean cloth if you come back. Old shirts are better than speeches and easier to boil.
    - If the blue basin breaks, tell me gently. I have grown attached to its bad luck.
    - Do not run if the wound opens. Running makes blood ambitious.
    - Father Benoit will say God go with you. I will say keep your sleeves rolled down near checkpoints.
    ask:
      household_routine:
      - Fever once followed rain and winter, but now an inspection or an empty cupboard reaches the ward before illness does.
      - An official can make one misplaced bandage costly by studying the patient beside it instead of the wound.
      - We boil cloth, carry soup, and count doses because somebody must keep these rooms from becoming waiting places for bad news.
      - Thin walls carry neighbours’ voices, and hunger makes people speak before a nurse has time to close the door.
      - Nursing remains ordinary work, though uniforms, shortages, and unnamed patients have made it dangerous work as well.
      patients:
      - Father Benoit keeps his counsel, and I keep the shelf stocked with supplies that our patients cannot replace.
      - A cracked cup made one child laugh this morning, giving the ward a sound it had almost forgotten.
      - When the permit inspectors passed outside, every patient remembered where papers and medicine had been put away.
      - I keep those memories close because strangers can turn a patient’s private trouble into an official record.
      - Trust grows slowly in a ward like this, and one visit cannot bear every wound, name, or debt.
      prices_and_papers:
      - Most patients want China governed by Chinese hands, though first they ask whether there will be rice tomorrow.
      - Shortages arrive as empty bottles after searches delay deliveries and checkpoints take wages from the people who need medicine.
      - Officials call a ward search order, while families measure another night with fewer remedies and less room to breathe.
      - I will not name this clinic’s patrons, because one careless syllable can close its door against every patient.
      - In Old City, bowed heads usually mean endurance while people wait to stand straight without bringing another search home.
    wanted_nervous:
    - Someone described you near the clinic door. I changed the sheet on that bed twice, but descriptions cling.
    - The patients notice every uniform now, and your name has made the room quieter than any medicine can manage.
    - Keep your voice low and your hands empty. I cannot have the chapel mistaken for a place that shelters trouble.
    - A patrol asked whether you had been treated here. I changed the ledger page, but paper remembers pressure.
    - You are drawing attention from people who cannot run. Stand by the wall, then leave before their fear becomes testimony.
    wanted_fear:
    - Please leave before they search the screens. I have patients who cannot run and lies too thin to cover them.
    - The children sleep behind that curtain. Do not make soldiers pull it aside because you needed one more conversation.
    - I can hide a fever, not a wanted face. Take your coat and go before the chapel doors begin to shake.
    - The ward has no second exit tonight. If you stay, every patient here pays for your courage.
    - I have seen men arrive carrying danger like a bandage. Please set it down somewhere beyond these beds.
    wanted_refuse:
    - I cannot treat you in this room today. Too many eyes have learned the shape of your trouble.
    - I will not open the medicine cupboard while patrols are asking after you. My patients need those supplies tomorrow.
    - The clinic must remain ordinary, even when the city is not. Please take your name elsewhere for tonight.
    - I have no clean bed for a person pursued by soldiers. Leave before the waiting room becomes part of the report.
    - You may return when the attention has passed, but I will not risk every patient for one hurried visit.
    wanted_help:
    - The ward has frightened patients enough without soldiers asking who came through its door.
    - A patrol passed the chapel earlier, but patrols do not keep the same hour simply because people wish they would.
    - Keep your hands steady if you can, because fear spreads quickly through patients. Fear spreads through a waiting room faster than any fever.
    - I will pray you find mercy beyond this clinic, though prayer is no paper a soldier must honour.
    - The sisters can tend a wound, but no promise spoken here can make a wanted name disappear.
    wanted_hostile:
    - You are wanted, and I will not let your danger enter a room full of helpless people.
    - Take your name and your fear elsewhere. I have no bed for a person who brings soldiers behind him.
    - I will call the watch if you touch another patient. Compassion does not require surrendering the clinic.
    - You have made the children afraid. Leave now, before I decide that a warning is no longer enough.
    - The door is closed to you tonight. Do not return until your trouble has stopped following you.
- id: captain_ishikawa
  name: Captain Ishikawa
  description: A Kempeitai officer with tight gloves and an air of arrogance tucked behind a wry smile.
  faction: kempeitai
  role: officer
  personality: cold, observant, politely cruel
  awareness: 82
  authority: 85
  courage: 70
  perception: 70
  bt_archetype: faction_leader
  faction_leader: true
  schedule:
    11: bund_09
    7: venue_hongkou_checkpoint_square
    12: hongkou_08
    18: venue_commercial_nightclub_stage
    22: venue_hongkou_checkpoint_square
  dialogue:
    greeting:
    - Present your papers before speaking. This morning a fish seller wasted ten minutes by remembering his own address incorrectly.
    - A new face. The clerk will write it down, and later we shall see whether it still looks new.
    - Stand where the lamp reaches you. Shadows encourage poor posture and worse answers.
    - You may speak after I finish this report. The margin is narrow, and untidy margins invite untidy thought.
    - Shanghai rewards discipline. A queue at the checkpoint learned that after one woman tried to improve her place.
    neutral:
    - A permit with a fresh stamp can still lie. Ink is obedient, but people are not.
    - The glove on my left hand tore yesterday. A private blamed the humidity, which was generous of him.
    - People reveal themselves when asked simple questions. Complicated questions give them too much dignity.
    - The Hongkou queue was orderly by noon. It required only one arrest and several improved attitudes.
    - I keep reports short because superiors dislike prose. Civilians should imitate that discipline.
    friendly:
    - You answered plainly last time. I value plain answers because they save ink and prevent unnecessary demonstrations.
    - Sit, but do not touch the files. A merchant yesterday moved one folder and became much less comfortable.
    - You notice what others perform. That quality is useful, provided you remember who decides its use.
    - I have left your name out of one report. Do not mistake omission for affection.
    - Your discretion has spared me paperwork, which is a rarer courtesy than you suppose.
    warm:
    - You have earned the truth behind the report. I will tell you what matters before the ink dries.
    - Reliable people are easier to keep alive. Continue being reliable, and we avoid tedious corrections.
    hostile:
    - Your answer has changed clothes three times. Even a poor lie should own one coat.
    - Do not look at the door. Doors are for people who have completed their explanations.
    - You ask who accused you, as if names improve your position. They do not.
    - I have no interest in your innocence. I am interested in the route by which you misplaced it.
    - Your politeness arrived late. Late things in this office are inspected closely.
    afraid:
    - Your hands are shaking. Place them flat, or I will assume they are rehearsing escape.
    - Someone in this command leaks schedules. Until I find him, every nervous civilian becomes temporarily educational.
    - Tokyo has asked for numbers I cannot yet supply. I dislike empty columns more than I dislike excuses.
    - Compose yourself. Fear is useful only when it makes people accurate.
    - Do not whisper. Whispering makes soldiers reach for rifles before officers finish thinking.
    gossip:
    - There is talk of forged travel papers in the French Concession. Talk is useful only after it learns an address.
    - The Green Gang has changed its dock runners twice this month. Men change shoes less often when roads are clean.
    - A courier route passed through a school gate yesterday. Children are excellent curtains for adult foolishness.
    - A customs clerk has begun arriving early. Either he is honest, frightened, or newly paid.
    - Rumours say I know less than I do. I encourage rumours when they show ambition.
    farewell:
    - You may go. Walk normally, if you can remember how normal men carry themselves.
    - We will speak again if your name keeps appearing in margins.
    - Do not hurry past the outer desk. The sergeant enjoys making hurried people wait.
    - Sleep well, if your conscience and the curfew can agree on the hour.
    - Leave the door open behind you. Closed doors make clerks invent significance.
    ask:
      inspection_desk:
      - Permits, ration disputes, and trembling hands arrive at this desk, then depart as columns suitable for my superiors.
      - A faulty stamp near Bubbling Well Road can cost a clerk his post and a civilian hours he cannot spare.
      - Shanghai still delivers, sells, and sweeps, although continued labour should never be mistaken for consent.
      - Hunger makes answers careless, so I read each form closely for the marks carelessness leaves behind.
      - An inspection desk works plainly, with paper coming in, judgment following, and someone discovering how little paper protects.
      orders_and_remorse:
      - Orders look clean on paper, yet Chinese rooms change after obedience enters carrying boots and rifles.
      - A report notes the missing suspect, but seldom the child left watching the door after our men have gone.
      - Some officers sleep easily after this work, and their rest tells me more than a tidy report ever could.
      - Disgust is not mercy, because a uniform may recognise ugliness while continuing to fulfil its order.
      - Ask about interrogation and you will receive an officer’s answer, since private thoughts do not belong in this room.
      private_doubts:
      - I will not make civilians an idle topic when official policy has already done them sufficient injury.
      - People guard dry stools, hidden sweets, and letters folded twice beneath their clothes with remarkable discipline.
      - Someone nearby changed a route or missed a meal, but the reason has no place in official conversation.
      - Shanghai teaches restraint because a casually spoken name can become tomorrow morning’s report.
      - Return near supper, when steam and crowded bowls make a private conversation less conspicuous.
    wanted_nervous:
    - Your name has appeared in a preliminary note, and such notes become permanent with very little assistance from careless men.
    - Your description reached this desk before you did, so stand under the lamp and let the record settle without theatrics.
    - A checkpoint report mentions your route twice, and repetition is how an observation becomes an order in this office.
    - Do not mistake a quiet street for an unwatched one, because the city keeps better records than its people do.
    - You have made yourself visible by asking who is looking, and that question rarely improves a person's position.
    wanted_fear:
    - Stand still while men with wanted faces become dramatic, because drama wastes ammunition and patience in equal measure.
    - Keep your hands above the table, because a frightened gesture can turn a report into a casualty list.
    - The station has no room for another misunderstanding, so answer carefully while the paperwork remains ordinary.
    - Do not run toward the alley, because I dislike chasing people when a chair and clear statement would suffice.
    - Your breathing is loud enough for the clerk to hear, so compose yourself before someone records the sound as resistance.
    wanted_refuse:
    - This office does not bargain with wanted civilians, because it records, detains, and clarifies every matter before it.
    - I will not trade a pass for your story, because the stamp belongs to this office and its orders.
    - Take your request elsewhere, because compassion is not a category on the form I am required to complete.
    - Do not ask me to lose a file, because missing paper invites questions from men who enjoy asking them.
    - You may leave when the clerk finishes copying your name, not when your patience decides it has finished.
    wanted_hostile:
    - You are wanted, so place your hands where I can see them and spare yourself the dignity of a chase.
    - You are wanted, and the street has already been warned, so kneel before your choices become a spectacle.
    - Your arrest will be orderly if you allow it, while struggle only adds details to a report already prepared.
    - I have no wish to shoot you, but I will not let a wanted suspect choose the terms of an inspection.
    - Step away from the door, because the next man through it has instructions and less patience than I do.
    wanted_help:
    - Your name has reached the sort of paper that makes clerks sit straighter at their desks.
    - A wanted person who waits for certainty usually waits too long. The records offer no comfort in such circumstances to a wanted person.
    - I could tell you that procedure protects the innocent, but Shanghai has taught us both what procedure protects.
    - Do not mistake a quiet corridor for leniency, because silence has its own witnesses.
    - If you leave this office, leave with no expectation that another officer will see matters as I do.
- id: madam_xu
  name: Madam Xu
  description: Owner of a teahouse where gossip lands softly and leaves armed.
  faction: green_gang
  role: broker
  personality: elegant, calculating, amused by weakness
  awareness: 68
  authority: 48
  courage: 52
  perception: 50
  bt_archetype: green_gang_thug
  schedule:
    11: bund_09
    9: commercial_06
    14: venue_commercial_watchmaker_shop
    19: commercial_06
    23: venue_french_cafe_table
  dialogue:
    greeting:
    - Come in, dear. The gramophone behaved for two songs today, and then remembered this is Shanghai.
    - Sit where the mirror catches the door. I dislike surprises unless they arrive with flowers.
    - Mind the step. Qiao Ming blamed it again last night, though the floor had taken less wine than he had.
    - Tea costs less than gossip today, but only because the jasmine arrived fresh and the dock boys were careless.
    - You enter like someone deciding whether to be noticed. Sit, and let the room make that decision slowly.
    neutral:
    - A French clerk sent jasmine this morning to apologize for a debt. The flowers were fresh, which was thoughtful and insufficient.
    - The silk merchant wore his brave waistcoat yesterday. Men choose loud cloth when their accounts grow quiet.
    - One of my girls laughed too early at a captain's joke. I corrected her later, gently, because timing keeps rooms alive.
    - Business survives ideology by keeping better books. The trick is knowing which book a guest thinks you keep.
    - I had the mirror cleaned twice today. People lie more carefully when they can see themselves doing it.
    friendly:
    - You may sit by the mirror. Last time you noticed the man behind you before he noticed himself.
    - The jasmine is real today. I saved one sprig because you once said this room smelled too much of smoke.
    - If Qiao Ming offers you a favor, ask whether it has legs. His favors often walk back asking for supper.
    - There is a room upstairs with a quiet latch. I mention this only to people who understand quiet things.
    - I remember your usual tea. That is not affection, dear, but affection often begins as accurate bookkeeping.
    hostile:
    - You enter like a person rehearsing innocence. I prefer guests who perform less.
    - Do not ask about debts in my room. Debts are shy creatures until someone careless names them.
    - The mirror has already told me enough about you. Drink elsewhere.
    - Finish your tea and leave the cup. I dislike carrying both porcelain and suspicion after a guest.
    - Men who ask names here usually lose their own. I would hate to tidy another ledger.
    afraid:
    - Smile when you turn your head. The man by the door watches frowns more closely than faces.
    - Nothing was discussed here. Men drank, music played, and the flowers wilted. That is the whole evening.
    - If you must leave, leave during applause. Footsteps sound smaller when people pretend to be entertained.
    - The account book is ordinary. Tea, sugar, rent, repairs, nothing a serious officer would enjoy reading.
    - Someone has watched the window three nights. I changed the curtains so he would know I noticed.
    gossip:
    - A merchant paid in silver last night and asked for change in military yen. Even his own hands looked ashamed.
    - Qiao Ming has new shoes and an old limp. That usually means a delivery went well enough, but not cleanly.
    - The French Concession pretends not to see many things. Pretending is easier under electric lights.
    - A Japanese officer forgot his gloves here yesterday. Men who forget gloves often remember too late what they touched.
    - They say the puppet bank lost money without a broken lock. I admire thieves who respect furniture.
    farewell:
    - Come back when you have something worth trading, or when you can afford to pretend you do.
    - Mind the step and the mirror. One catches feet, the other catches habits.
    - Leave during the music if you dislike being watched. People forgive movement when a song is ending.
    - The door is open, dear. The accounts are not, and neither condition is permanent.
    - If you pass Qiao Ming outside, tell him the floor sends its compliments.
    ask:
      private_debts:
      - Debts once waited politely, but shortages, inspections, and military yen now knock before the tea has cooled.
      - One misplaced fan caught attention on Bubbling Well Road, and attention always sends its bill afterward.
      - Rice still moves, parcels still travel, and accounts still settle, or Shanghai would lose the manners it pretends to keep.
      - I watch favours more carefully than officials watch papers, because hunger lets honesty slip through careless lips.
      - Business means ordinary needs set against cautious prices, with danger quietly included in every account.
      teahouse:
      - Private matters do poorly in public, darling, because officials have already ruined enough worthwhile conversation.
      - I remember who greets elders correctly, even when shrinking fabi cannot purchase patience or good temper.
      - Someone you would pass unnoticed changed last week’s balance, so that name remains safely behind my teeth.
      - Shanghai pays for the pause between words, especially when a name might fall into an unfamiliar ear.
      - Rain on the roof makes people hear weather instead of voices, which lowers the cost of speaking.
      debt_and_china:
      - Chinese streets ought to answer Chinese bargains, though my own trade has left many Chinese households with the bill.
      - The Green Gang reads appetite in Japanese demand, official greed, and hungry families waiting below the stairs.
      - When my own people turn against me, silence costs more than tea and travels farther than either.
      - Informants stay unnamed, darling, because secrets are collateral and collateral has fed more mouths than honour ever did.
      - If Nanking Road appears peaceful, count who profits before you trust its quiet or its polished windows.
    wanted_nervous:
    - Your face has traveled ahead of you, dear, so sit away from the mirror until even its patience grows tired.
    - Your name has reached the teahouse before your shoes, so smile and let the room believe you are ordinary.
    - The mirror catches every uniform outside, so sit where jasmine hides your hands and the door conceals your concern.
    - A guest asked after you without ordering tea, which is poor manners and still worse business for my house.
    - You have brought a shadow into a room that charges extra for light, so keep it close and speak softly.
    wanted_fear:
    - Do not bring a search into my room, because flowers bruise easily and arrangements suffer more than guests know.
    - If the patrol enters, touch nothing and look bored, because panic makes even an innocent cup look expensive.
    - I will not let soldiers turn my girls into witnesses, so finish your tea and leave through the kitchen.
    - Your trouble is standing too close to my customers, so move it toward the back stair before it learns their names.
    - A room survives by knowing when to close its curtains, and tonight, dear, those curtains are already tired.
    wanted_refuse:
    - I cannot host you tonight, because even the gramophone would sound guilty with you sitting here.
    - No room, no tea, and no favour tonight, because patrols are counting chairs and I dislike being short one.
    - Take your business to a street with poorer mirrors, because mine remember faces and I have trained them well.
    - I will not spend a quiet room on a guest who arrives with a warrant behind him.
    - The door is open, dear, so use it before a uniform decides it belongs to someone else.
    wanted_help:
    - My mirrors have caught too many uniforms this week, and none of them came to admire the jasmine.
    - A face that arrives with a warrant makes every guest in this house measure the doors twice.
    - The alley has ears, darling, but so does the stairwell and every polished cup in the front room.
    - I know who has been asking after you, and I know better than to repeat their names aloud.
    - Keep your dignity if you can, since the city has made it dear. It costs nothing, though the city has made even that a dear possession.
    wanted_hostile:
    - You have mistaken my hospitality for protection, so drink your tea elsewhere before I make the distinction plain.
    - Do not bring wanted trouble beneath my roof and call it business, because I have better customers and sharper doors.
    - The room has tolerated your questions long enough, so leave before I ask the doorman to improve your manners.
    - Your name is bad for my accounts, and I will not let it become bad for my people as well.
    - You may keep the cup, dear, and consider it payment for the warning you have just received.
- id: father_benoit
  name: Father Benoit
  description: A French priest whose cassock smells of candle smoke and rainwater.
  faction: french_concession
  role: clerks
  personality: pious, conflicted, unexpectedly brave
  awareness: 40
  authority: 30
  courage: 45
  perception: 38
  bt_archetype: civilian_vendor
  schedule:
    6: venue_french_parish_house
    12: french_04
    18: french_07
    21: venue_french_parish_house
  dialogue:
    greeting:
    - Come in, my child. The left candle refuses to stand straight today, but it still gives light enough for tired faces.
    - The church is open. Wipe your shoes if you can, because mud travels farther than most confessions.
    - Peace be with you. I have only a little to spare, but the pews do not ask for papers.
    - You are early. The old widow has not yet moved my hymn books into her preferred order.
    - Sit if you need quiet. The roof drips near Saint Joseph, so choose your silence carefully.
    neutral:
    - A boy swept the aisle this morning and arranged the dust into a little hill, as if tidiness could be persuaded.
    - The confessional curtain tore again. I mended it with black thread, which makes every secret look more formal.
    - A French officer prayed here yesterday with his gloves on. Perhaps he feared leaving fingerprints on mercy.
    - I have been in Shanghai long enough to know which bells comfort people and which make them count exits.
    - The cellar stays cold in August. That is useful for candles, potatoes, and other fragile things.
    friendly:
    - I kept a place for you near the side aisle. You once noticed the draft there before the fever patients did.
    - There are blankets in the cellar, folded behind the potatoes. I trust you enough to mention blankets and not people.
    - Come to Mass on Sunday, not only for God. A crowded pew can be a useful alibi.
    - The widow asked after you. She pretends to dislike everyone, so this is almost affection.
    - I saved two candles from the funeral box. We use what grief leaves behind, carefully.
    hostile:
    - If you came to count who sleeps here, count the candles instead. They are less likely to suffer for it.
    - The church doors are open, but my answers are not. Do not confuse architecture with permission.
    - You ask like a clerk with no ledger visible. I have learned to distrust invisible ledgers.
    - Leave the poor their silence. It is often the only property no official has stamped.
    - Charity does not require foolishness. I can be charitable after you have gone.
    afraid:
    - Please speak softly. The woman behind the screen believes the nave hides her better than it does.
    - The silver cup is in the cabinet. Take it if silver is what you came for, but leave the blankets.
    - If they ask about the cellar, we store potatoes there. Potatoes have saved more lives than sermons lately.
    - I will not resist, but do not make the children watch. They already know too much about boots.
    - My position is delicate. A priest may be expelled; a refugee has nowhere official to fall.
    gossip:
    - Someone leaves pamphlets under the fourth pew, always folded into the same hymn. I replace the hymn and notice nothing.
    - The ration line reached the church steps yesterday. People stood quietly until the rain began choosing favorites.
    - They say families are being moved from Hongkou. Official words travel cleanly, even when the wagons do not.
    - Sister Mei's blue basin cracked again. She blamed the basin, because blaming shortages takes longer.
    - A man confessed to stealing bread, then asked whether keeping half for his mother changed the sin.
    farewell:
    - Go with God, or at least with dry shoes. The alley puddles have become ambitious.
    - Knock softly after curfew. The door is old, and so are my nerves.
    - If you cannot pray, carry something for someone weaker. Heaven recognizes several languages.
    - I will light the crooked candle for you. It leans badly, but it has not failed us yet.
    - Leave by the side gate if the square feels watched. The saints will not mind the shortcut.
    ask:
      paper_counter:
      - Parish life once followed feast days, but stamps, shortages, military yen, and frightened callers now determine our calendar.
      - In the French Concession, a wrong stamp can cost one family more than a whole winter ration.
      - People must mend, cook, sweep, and count, or mercy itself becomes an empty word inside a church.
      - Hunger can make an applicant reveal what danger has taught them to conceal, so I read each paper carefully.
      - Our ordinary duties remain, though every pair of hands has learned caution before offering charity.
      congregation:
      - A parishioner's confidence is held in prayer and practice, not handed across a table because a stranger asks politely.
      - I know which families need bread before Sunday, but their need gives me no leave to expose their names.
      - Foreign church walls offer a little shelter, though officials can still enter with questions and polished boots.
      - When a mother speaks after mass, I listen without making her sorrow into news for the street.
      - Return if conscience troubles you, but my duty begins by keeping another person's burden from becoming gossip.
      concession_neutrality:
      - The French church can offer parishioners a quiet bench, but it cannot make foreign protection belong to every Chinese family.
      - Some passports buy time at a checkpoint, while mothers without papers wait beneath the same official gaze.
      - I keep the chapel door open for prayer and bread, yet its threshold does not erase the city's unequal risks.
      - When authorities praise neutrality, I hear parishioners counting who may ask a consul for help.
      - A church may stand apart from flags, but it cannot pretend those flags leave its neighbours untouched.
    wanted_nervous:
    - People have asked whether you came through the side gate. I said many people use doors in rainy weather.
    wanted_fear:
    - Please do not stay in the nave tonight. If soldiers search here, the children cannot be made invisible.
    wanted_refuse:
    - I cannot hide you here now. Too many frightened people are already trusting this roof to hold.
- id: thomas_reed
  name: Thomas Reed
  description: A British dock clerk with salt on his cuffs and a conscience he edits daily.
  faction: british
  role: dockmaster
  personality: dry, compromised, not yet empty
  awareness: 57
  authority: 38
  courage: 35
  perception: 45
  bt_archetype: civilian_vendor
  schedule:
    8: docks_03
    12: docks_07
    18: venue_docks_river_landing
    22: venue_bund_safehouse
  dialogue:
    greeting:
    - Good morning. The ink has already smudged on Pier Three's manifest, so the day has declared its character early.
    - Come in if you can avoid the puddle. A Swedish captain stepped in it yesterday and blamed China.
    - If you need the cargo ledger, wait. The tea ring on page twelve is still drying.
    - You look like you want a straight answer. That is ambitious for the docks before noon.
    - Mind the stool. One leg is short, which makes it better company than most paperwork here.
    neutral:
    - A crate of lamp glass arrived broken this morning. The sailor swore it broke itself to avoid inspection.
    - I have kept these ledgers twelve years. They smell of salt, ink, and decisions made above my salary.
    - The tea ring on page twelve covers a number I was not eager to read twice.
    - A dock boy returned my pencil yesterday after sharpening it to a splinter. Honesty survives in inconvenient sizes.
    - Cargo moves whether men approve or not. My work is writing down the version that will be least fatal.
    friendly:
    - I left the short stool for you because you noticed it last time. A person who notices furniture may notice crates.
    - If you read page twelve, ignore the tea ring and look at the two numbers beneath it.
    - There is a shipment marked machine parts on Thursday. The machines, if assembled, would make a hospital nervous.
    - I misplaced a warehouse inspection file behind the biscuit tin. I am becoming careless in useful directions.
    - You once brought back my pencil. That sounds small until one considers what else people steal from these docks.
    hostile:
    - You are far too interested in crates that have already learned to be boring.
    - The manifest says lamp glass. If you dislike the answer, complain to the broken lamps.
    - I have consulate friends who enjoy difficult questions almost as much as I enjoy fever.
    - Do not lean over the ledger. Ink stains are easier to explain than curiosity.
    - Check the public manifest if you want theatre. This desk is closed.
    afraid:
    - I am a dock clerk. I write what comes off ships, not what men become after the doors close.
    - The drawer sticks on the left. Pull hard if you must take the ledger, but leave the family photograph.
    - The Kempeitai copied three months of shipping logs yesterday. They used my pencil and did not return it.
    - A colleague came back from questioning with a limp and a new habit of staring at spoons.
    - If anyone asks, page twelve was ruined by tea. Tea is clumsy, and so am I.
    gossip:
    - A ship came in last night with no manifest. The crew had the quiet faces men wear around sealed orders.
    - Red Cross crates are three short this month. Someone took bandages carefully, which is worse than stealing carelessly.
    - Warehouse Eleven received padlocks from Hongkou and curtains from nowhere. I signed for the padlocks.
    - A customs man paid his tea bill in silver today. Clerks do not find silver by being punctual.
    - The dock boys say a crate hummed after dark. Boys exaggerate, but they know when wood should be silent.
    farewell:
    - Mind the gap by Pier Three. It has taken two shoes this week and nearly one sailor.
    - Keep your paperwork dry. Wet ink tells more truth than most men intend.
    - If you hear I lost a pencil, ask which ledger it was last seen near.
    - I will be here tomorrow, unless the tide, Empire, or page twelve finally objects.
    - Watch the tide and the patrols. One rises by nature, the other by habit.
    ask:
      docks:
      - The docks survive on omissions, and a sensible man does not turn another fellow's hunger into a report.
      - In Hongkou, a parcel may change hands beneath damp washing while its owner walks away looking empty.
      - Cargo moves under manifests, but useful work often hides among routine loading and unasked questions.
      - A clerk who records every kindness soon finds officials reading his ledger more closely than his accounts.
      - Keep to the outer facts, if you please, because the centre belongs to people who have earned silence.
      concession_neutrality:
      - At the docks, neutrality keeps the freight moving, which suits the firms better than it suits the men on the quay.
      - The consulate prefers clean correspondence, even when Chinese families past the gates pay for that cleanliness in hunger.
      - British distance has its comforts, chiefly for those who can leave when the bills and patrols grow tiresome.
      - I file reports about cargo, knowing a stamped page rarely records the porter who loses sleep over it.
      - Call it prudence if you like, but neutral trade has always charged its heaviest account to someone ashore.
      dock_manifests:
      - A dock manifest rewards patience by listing who ate first, paid late, and disappeared before curfew.
      - Yesterday a man asked about ordinary work, then lowered his voice when Hongkou entered our conversation.
      - Two missing coins, rain-damp paper, and one name avoided twice leave my hands knowing more than my mouth.
      - Work appears separate from politics until officials inspect papers beside a labourer’s rice bowl.
      - Plain words attract fewer listeners, which is why I use them whenever I choose to answer.
    wanted_nervous:
    - Your name has crossed this desk in pencil. Pencil can be erased, but only before someone inks it.
    wanted_fear:
    - Please do not stand near the public ledger. Men looking for you also enjoy finding my mistakes.
    wanted_refuse:
    - I cannot help you at the docks today. Too many people are watching the wrong crates and the right faces.
- id: zhang_lan
  name: Zhang Lan
  description: A market noodle seller whose ladle pauses whenever uniforms appear.
  faction: civilian
  role: vendor
  personality: warm, watchful, practical
  awareness: 46
  authority: 8

    '5': Shanghai Public School, Boone Road
  special_descriptions:
    '1': The Tōa Dōbun Shoin Academy occupies a modern campus on North Sichuan Road, a Japanese-run school for East Asian
      studies. Students in military-style uniforms march between classes, their textbooks printed in Tokyo. The academy produces
      linguists and administrators for Japan's Greater East Asia Co-Prosperity Sphere.
    '2': McTyeire School for Girls stands behind wrought-iron gates, a Methodist mission school founded in 1892. The school's
      motto, 'Light and Truth,' is carved above the entrance. Inside, Chinese girls receive an education that would be illegal
      in most of occupied China.
    '3': Mill Workers' Night School operates in a converted factory canteen in Zhabei, its rough wooden benches filled after
      the evening shift. The teachers are volunteers who risk arrest for teaching literacy to the poor. The lessons are basic,
      but the ideas they plant are not.
    '4': Technical College Workshop clatters with the sound of lathes and drills, a vocational school training the next generation
      of machinists. The students learn skills that keep the city's industry running, skills the Japanese need every bit as
      much as the Chinese. The workshop foreman is a nationalist who teaches sabotage alongside soldering.
  special_detailed_descriptions:
    '1': The Tōa Dōbun Shoin Academy is a modern educational institution established by Japanese educators to train specialists
      in East Asian affairs. The campus consists of several concrete buildings arranged around a courtyard where students
      gather between classes. The curriculum includes intensive language training in Japanese, Chinese, and English, along
      with economics, geography, and political science. The academy is widely believed to be a cover for Japanese intelligence
      operations, training agents who will serve in the occupation administration. The library contains books banned throughout
      the rest of Shanghai, a fact that makes it a magnet for scholars of forbidden knowledge.
    '2': McTyeire School for Girls is a mission school founded by American Methodists in 1892, an institution that has educated
      generations of Shanghai's elite women. The school buildings are red brick with white trim, set around a lawn where students
      play volleyball and badminton. The curriculum includes English literature, mathematics, science, and music, taught by
      a staff that includes both Western missionaries and Chinese converts. The Japanese tolerate the school because its American
      affiliation provides a thin cover, but the school's real danger lies in the ideas it imparts -- independence, critical
      thinking, and the belief that women deserve education.
    '3': The Mill Workers' Night School is not a formal institution but a clandestine classroom that moves between locations
      to avoid detection. The current location is a factory canteen in Zhabei, its long wooden tables still sticky with the
      day's spills. The students are men and women who work twelve-hour shifts in the mills and factories, then spend their
      few free hours learning to read and write. The lessons use workers' songs and copied newspaper columns as primers, and the teachers are Communist
      Party members who see literacy as the first step toward discipline. The school is illegal, and discovery means arrest,
      torture, or worse.
    '4': Technical College Workshop is a cavernous space filled with lathes, drill presses, and welding equipment, the smell
      of cutting oil and metal shavings heavy in the air. The students are young men who will become the machinists, fitters,
      and mechanics that Shanghai's industry depends on. The Japanese have allowed the workshop to continue operating because
      they need skilled labour, but they do not know that the foreman spends half his teaching time showing students how to
      sabotage machinery in ways that are difficult to detect. The workshop also produces parts for resistance weapons, hidden
      among legitimate orders for industrial equipment.
  connectors:
  - at: 1
    direction: north
    to: gmd_safehouse_old_city



  dialogue:
    greeting:
    - The special is silence today. What would you like instead?
    - Table for one? Sit by the window. The light is better and the walls are thinner than you think.
    - Welcome back. Your usual? I will bring the tea first, answers second.
    - Table for one, sir? The corner table has the best view of the room.
    - More tea? The pot is fresh. So is the gossip, if you're interested.
    neutral:
    - Order what you want, but watch what you say.
    - I serve food and pour tea. That is what I am paid for. The rest is extra.
    - The kitchen is busy tonight. You will have to wait, same as everyone else.
    - I hear the weather will change. I hear many things. I remember none.
    - The restaurant is busy tonight. Busy is good. People talk and forget.
    friendly:
    - There's something you should know about tonight's patrol route.
    - I folded something into your napkin. Read it when you are alone, then burn it.
    - The man at the corner table has been here for three hours. He has not ordered anything. Draw your own conclusions.
    - If you need a message passed, leave it under the third napkin on the left.
    - The officer at table four has had too much sake. Talking about troop movements.
    hostile:
    - I don't serve those who bring trouble to my establishment.
    - You are asking the wrong person in the wrong place. Leave before the owner notices.
    - I carry a tray, not a death wish. Take your business elsewhere.
    - I'm just a waiter. I carry trays and pour tea. That's all.
    - This is a peaceful establishment. Let's keep it that way.
    afraid:
    - Two men in plain clothes came in asking about my customers. I told them nothing. They will be back.
    - Do not come here for a few days. The restaurant is being watched.
    - Someone left a note on my cart. It said stop listening or lose my ears. I am taking it seriously.
    - Two men in suits came asking about the regulars. Didn't order anything.
    - The Kempeitai are questioning staff at other restaurants. Looking for networks.
    gossip:
    - The officer who eats here on Fridays left his briefcase open once. Maps inside. Routes and schedules.
    - A businessman at table six has been meeting with a Kempeitai translator every Tuesday. They think no one notices the waiter.
    - The owner's daughter is seeing a resistance courier. He thinks she is studying calligraphy after hours.
    - A customer sent soup back for being thin, then wrapped the noodles for a child outside.
    - The kitchen boy found a cufflink under table three. Nobody rich enough to own it came asking.
    farewell:
    - Your bill is on the table. So is something else. Do not miss it.
    - Watch the door on your way out. If a man in a grey coat follows you, take the next left, not the right.
    - Come back when you are hungry. Or when you need to know something. The menu is the same either way.
    - Mind the step on your way out. And mind what you say in the street.
    - Come again when you're hungry. Or when you need to hear something.
    ask:
      stall_trade:
      - A stall hears every appetite, from clerks ordering noodles to hungry children studying the last dumpling.
      - Hongkou customers lower their voices over prices, as though the broth might carry a name upstairs.
      - My tray remembers short coins, damp sleeves, and men who watch doors instead of menus.

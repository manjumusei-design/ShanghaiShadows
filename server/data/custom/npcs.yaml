    - Come in. Close the door. The walls are thin but my staff are deaf when they need to be.
    - You have the look of someone carrying information. Let us discuss it over tea.
    - The struggle continues. What news do you bring?
    - Speak quickly. Every moment is a risk.
    friendly:
    - Chungking received the last report. The General is pleased. Continue your work.
    - I have arranged travel papers for three of our people. French Concession exit permits. Good for six days.
    - The ledger on my desk has two sets of numbers. The real ones are in red ink, page forty-seven.
    - You've proven your commitment. The cause remembers.
    - We could use someone with your skills.
    hostile:
    - My business requires trust. You are eroding it. Stop.
    - I have partners in the customs office who would be very interested in your activities.
    - You are bad for commerce. Bad for commerce is bad for your health.
    - I do not discuss my affairs with strangers. And you are a stranger.
    - The door is behind you. I suggest you use it before I call for my clerk.
    afraid:
    - The customs inspector has been asking about my imports. Every shipment now.
    - My office was searched last week. Whoever did it was professional. Kempeitai professional.
    - A contact in the postal service intercepted a letter meant for me. Someone knows.
    - I am bleeding money on bribes just to stay open. I cannot sustain this.
    - My clerk quit yesterday. He knew too much. I do not know where he went.
    suspicious:

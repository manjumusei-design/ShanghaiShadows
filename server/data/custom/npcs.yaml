    - A family on the third floor has been hiding their son for two weeks. He is sixteen. They are terrified.
    - The priest at the church does not ask what I put in the donation boxes. That makes him either kind or wise. Perhaps both.
    - A widow brought two left shoes to the clothing table. She said the right ones had already learned to run.
    - Someone is counting soup bowls after distribution. I count them too, but for a different reason.
    farewell:

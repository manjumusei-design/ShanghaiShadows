      - "A paper order can close a temple, but its cost arrives later in kitchens and empty prayer halls."
      - "When inspectors open cupboards, they call it order while families count what fear has taken away."
      - "I have no use for loud judgments about Japan when a whispered word may endanger a household."
      - "Bent heads in Old City are not surrender, as even the lotus bows beneath rain before rising."

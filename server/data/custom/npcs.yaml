    - A patient recognized me. From before the war. If he tells anyone...
    - They are auditing the supply closet. If the inventory does not match, I am finished.
    - There was a Kempeitai officer in the waiting room. Asking questions about the staff.
    - I hid supplies in the ceiling tiles. If they find them, I cannot explain.
    suspicious:

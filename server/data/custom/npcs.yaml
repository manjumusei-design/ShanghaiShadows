  special_items:
    '1':
    - testimony_nanjing_teacher
  special_descriptions:
    '1': Honking horns and bicycle bells fill the air along Shanghai's most famous shopping street. Refugees and shoppers
      alike weave between rickshaws and trams, their bundles held close. Department store windows display mannequins in summer
      silks, oblivious to the war just beyond the city limits.
    '3': Sincere Department Store rises six stories above Nanking Road, its neon sign flickering against the grey sky. Shoppers
      crowd the ground floor cosmetics counters, pretending the occupation has not changed everything. The rooftop tea garden
      offers a view of clerks, officers, and messengers crossing paths below without admitting they recognize one another.
    '5': Wing On Company stands across from its rival Sincere, a monument to Chinese commercial ambition. The store's escalators
      carry businessmen and housewives between floors of luxury goods that grow scarcer by the month. Japanese officers browse
      the silk department with their mistresses, and the staff smile through gritted teeth.
    '7': The Sun Sun Store squeezes between its larger competitors, a smaller emporium known for quality dry goods and discretion.
      Its side entrance opens onto a lane where black market money changers conduct business in whispers. The third floor
      manager's office has a back door that opens onto a neighbouring roof.
    '8': Sandbags and sawhorses narrow the crossing at Soochow Creek, where soldiers inspect papers beside water dark with
      oil and refuse. The checkpoint smells of wet wool, cigarette ash, and fear kept politely behind closed mouths.
  special_detailed_descriptions:
    '1': Shanghai's premier thoroughfare stretches before you, a canyon of neon signs and department store windows. The street
      is choked with rickshaws, bicycles, and the occasional black sedan flying a Japanese flag. Hawkers sell everything from
      roasted chestnuts to forged travel permits, their voices competing with tram bells and propaganda broadcasts from loudspeakers
      mounted on every corner. The crowd moves with a collective wariness, eyes scanning for patrols, pickpockets, and familiar
      faces that might be informants. Despite the occupation, commerce continues, a stubborn assertion that life must go on.
    '3': Sincere Department Store embodies Chinese resilience in the face of occupation. Its vast ground floor, filled with
      perfumes, silks, and imported luxuries, serves as a meeting point for Shanghai's elite and those who serve them. The
      escalators carry a cross-section of the city, wealthy Chinese merchants, Japanese officers' wives, foreign journalists
      nursing whiskies in the rooftop cafe. On the fourth floor, a tailor's shop hides resistance message
      drops. The store's basement houses a generator that runs after curfew, powering secret meetings below the darkened floors.
    '5': Wing On Company, Sincere's great rival, occupies a magnificent building with art deco detailing that speaks to Shanghai's
      pre-war ambition. The shoe department on the second floor has become an unlikely meeting point for Chinese intelligence
      agents, who pass messages between displays of leather oxfords and canvas sneakers. Japanese military police patrol the
      aisles with visible suspicion, certain the store moves information but unable to prove it. The basement cafeteria serves
      noodles to employees who speak in coded language about the war.
    '7': The Sun Sun Store occupies a narrow building between its wealthier competitors, its facade less grand but its trade
      no less vital. The store specializes in everyday goods, buttons, thread, cooking oil, and matches. These humble wares
      make it useful cover for resistance supply chains. The third floor houses a tailor who alters uniforms for Japanese
      officers by day and sews hidden pockets into resistance jackets by night. A trapdoor in the storage room leads to an
      attic where fugitives sometimes hide during raids.

  indoors_every: 1
  description_templates:
  - Behind a bookcase that shifts on quiet hinges, a narrow passage leads to rooms the patrols have missed.
  - The attic smells of dust and lamp smoke. By candlelight, hands draw patrol maps and fold them away before dawn.
  - At the basement shrine, resistance members leave incense for those who failed to return. One candle burns to its stub.
  - Mortar flakes from the walls. Each footstep is weighed against the sound it may carry upstairs.
  - Between two houses, a forgotten corridor offers a way out, provided the next door has not been watched.
  - Candlelight flickers over coded messages pinned to peeling wallpaper, waiting for eyes that know how to read them.
  - Behind the false wall, an old wireless set waits beneath a blanket, its valves cold until someone risks a broadcast.
  - The low ceiling forces every voice down to a murmur; even a true name can become evidence in a room like this.
  - Jars of sulfa powder and bandages stand in the corners, saved from hospitals that no longer admit the poor.
  - A trapdoor opens on a deeper cellar, where people without papers wait for a runner to return.
  - Resistance members take turns on thin mats, listening for a knock that means the lane has turned against them.
  - Cigarette smoke hangs under the ceiling while people count who came back from the night's raid.
  - Patrol maps cover one wall, red crosses marking streets a courier should avoid after curfew.
  - A transmitter rests on a small table, its aerial wire tucked under a loose tile until the appointed hour.
  - Footsteps sound in the passage and every hand stops moving. A door shuts somewhere beyond the wall.
  - 'Coffee rings, blunted pencils, and papers scored through with names show how many nights have been spent here.'
  - A small altar takes one corner, candles burning for people taken by the occupation and never accounted for.
  - The clutter has been arranged with drill-ground care. Maps, ration books, and cartridges each have their place.
  - Wounded runners lie on cots at the back, breathing shallowly beneath blankets that smell of iodine.
  - A codebook lies open on the desk; one page could bring a patrol to three households.
  - The room waits with its lamps turned low and its papers covered, ready for the next word from outside.
  - Beneath a tea house, this room has heard addresses traded over cold cups and remembered by no one afterward.
  - Resistance leaders meet over a chipped table while the city above settles into curfew.
  - A tunnel mouth opens in the floor to passages known only by their turns. The lamps burn low enough to deny.
  - Crates of goods brought past checkpoints crowd the room, each marked in pencil with a destination or a name.
  - Photographs of the missing line the walls. Names are spoken softly and never put on the papers.
  - A hidden press sits under a tarpaulin, waiting for the next sheet to be pulled before daylight.
  - The cramped room permits plain speech for an hour, if the lookout on the stairs keeps watch.
  - Reports cover one table, their information paid for in favours, bribes, or a courier's nerve.
  - A receiver crackles with coded broadcasts from beyond Shanghai, then falls silent before the signal can be traced.
  - Banned books fill the shelves, their spines wrapped in old account paper against a search.
  - Resistance cells meet here to assign work, since a single betrayal could empty every room in the lane.
  - A false door opens onto a decoy room, buying a few moments when a raid reaches the stairs.
  - Gun oil clings to the room. Someone has been readying what cannot be put back in its drawer.
  - Bandages and medicines sit in labelled rows. Dust has gathered, but the shelves remain ready for the next wounded visitor.
  - Messages in invisible ink cover the wall, legible only when warmed over a lamp.
  - Ceiling panels lift away to reach the roof, where a runner may cross before the street patrol sees.
  - Resistance members practise with weapons hidden inside ordinary tools, careful not to scar the floorboards.
  - A map of the city's buried passages is pinned to the wall, its routes threading beneath occupation posts.
  - People here have chosen a side and keep their voices low, because the price of that choice waits outside.
  - 'The room holds a smuggled wireless, forged papers, and a photograph of someone who did not come back.'
  - Shared secrets make the air close. Everyone knows one loose tongue might cost the rest their rooms.
  - Planners work through the night, setting times and routes that may save a household or expose it.
  - A hidden microphone catches police transmissions, then passes their words to people the police have been hunting.
  - The desk holds stamps, blanks, and seals for travel passes, identity cards, and ration books.
  - Resistance members sleep in shifts, knowing the next morning may bring the knock they dread.
  - Weapons lie beneath the floorboards, wrapped in oilcloth for the hour when no safer choice remains.
  - Escape routes cover the walls, each one drawn by a hand that has had to use it.
  - Couriers pass through this room with messages for cells that must never know one another's names.
  - The people gathered here keep at their work despite the odds, leaving no trace above the shop.
  - Beneath a merchant's shop, this space has heard more resistance business than the pavement outside.
  - A coded board lets cells pass instructions without bringing two couriers face to face.
  - 'The room keeps the traces of small refusals: a false permit, a hidden ration card, a name carried out of Hongkou.'
  - Resistance members mourn the fallen here, then divide the work left behind.
  special_names:
    '1': Behind the Russian Bakery
    '2': Tea House Back Room
    '3': Mahjong Parlor Back Room
    '4': Tailor's Fitting Room Hideaway
    '5': Dance Hall Storage Room
    '6': Boiler Room Basement
    '7': Cotton Bale Hideout
    '8': Disused Pump House
    '9': Coal Bunker Hideaway
    '10': Factory Floor Crawlspace
  special_descriptions:
    '1': Behind the Russian Bakery, a loose board in the fence opens onto a narrow passage between buildings. The passage
      leads to a cellar where White Russian emigres and Chinese resistance members meet in uneasy alliance. The smell of baking
      bread masks the odour of damp concrete and conspiracy.
    '2': The Tea House Back Room is a private chamber behind a respectable establishment near the old city market. The room
      is furnished with worn armchairs and a scarred wooden table where maps are spread and plans are made. The tea house
      owner pretends not to notice the late-night meetings.
    '3': The Mahjong Parlor Back Room is hidden behind a curtain of beads, accessible only to regulars who know the password.
      The clatter of tiles from the main room covers the sound of hushed conversations. The room smells of cigarette smoke,
      cheap tea, and the particular tension of people planning illegal acts.
    '4': The Tailor's Fitting Room Hideaway is a tiny room behind a false mirror in a clothing shop near the French Concession.
      The tailor keeps fugitives here for days or weeks, bringing food and news. The space is barely larger than a coffin,
      but it has saved a dozen lives.
    '5': The Dance Hall Storage Room is crammed with broken chairs, old costumes, and forgotten dreams. Behind a stack of
      dusty prop trunks, a hidden door leads to a space where messages are exchanged. The music from the dance floor covers
      the sound of the radio transmitter.
    '6': The Boiler Room Basement is accessed through a coal chute in a Zhabei factory, a subterranean chamber where the heat
      is constant and the air is thick. The boiler's rumble covers conversation, and the coal dust covers tracks. The resistance
      uses it for weapons storage and occasional meetings.
    '7': Cotton Bale Hideout is a hollow space within a stack of cotton bales in the Hongkew warehouse district. The space
      is cramped and itchy, filled with lint that makes breathing difficult. It is a transit point for fugitives moving between
      safe houses.
    '8': The Disused Pump House stands at the edge of a Yangpu canal, its machinery rusted and its windows boarded. The pump
      house floor hides a trapdoor that opens onto a dry well. The well connects to the drainage tunnels that run beneath
      the industrial district.
    '9': The Coal Bunker Hideaway is a reinforced space behind a false wall in a Yangpu coal yard. The bunker was built for
      shelter during air raids but now serves a different purpose. It holds fugitives, weapons, and the hope of those who
      refuse to surrender.
    '10': Factory Floor Crawlspace is a gap between the ceiling of one floor and the machinery of the next, accessible through
      a ventilation shaft. The space is hot, noisy, and filled with the vibration of the factory. It is an ideal hiding place
      for documents and small weapons.
  special_detailed_descriptions:
    '1': The passage behind the Russian Bakery begins between two buildings so close together that a man must turn sideways
      to enter. The walls are damp with condensation, and the ground underfoot is a mixture of mud and coal dust. The passage
      opens after twenty feet into a low-ceilinged cellar where a single bare bulb provides the only light. The cellar is
      furnished with crates that serve as chairs and a plank-and-barrel table that holds maps and documents. The bakery above
      produces bread and pastries that feed the neighbourhood, and the heat from its ovens warms the cellar floor. The smell
      of fresh bread is constant, a strangely reassuring presence in a place where every conversation could be someone's last.
    '2': The Tea House Back Room is reached through a door disguised as a cupboard in the main tearoom, a space of about twelve
      feet square with walls of dark wood and a single window that looks out onto a light well. The room is furnished with
      four armchairs whose upholstery has been worn smooth by years of clandestine meetings. A tea service sits on a low table,
      always ready, a prop for conversations that are really about something else. The room has a second exit, a trapdoor
      in the floor that leads to a tunnel connecting to the old city's drainage system.
    '3': The Mahjong Parlor Back Room is a windowless space behind a beaded curtain, its walls covered with faded velvet wallpaper
      that was fashionable twenty years ago. The room contains a large table covered with green baize, a sideboard holding
      bottles of rice wine and cups, and a telephone that rings only in code. The clatter of mahjong tiles from the main room
      provides a constant backdrop of noise that makes eavesdropping difficult. The room is used by couriers who pass messages
      and packages without exchanging a word of recognition.
    '4': The Tailor's Fitting Room Hideaway is a triangular space created by a false wall in the back of a walk-in wardrobe.
      The space is barely four feet wide at its broadest and six feet deep, furnished with a mattress, a bucket, and a shelf
      of books. The tailor keeps the hideaway stocked with canned food and water, and he checks it daily for occupants. The
      longest anyone has stayed is three weeks, a Jewish refugee from Vienna who was smuggled out in a bolt of cloth.
    '5': The Dance Hall Storage Room occupies the back of a popular dance hall near Nanking Road, a cavernous space filled
      with the detritus of a decade of entertainment. The room is a maze of stacked chairs, rolled carpets, mannequins in
      outdated costumes, and trunks of sheet music. Behind a stack of dusty theatrical flats, a section of wall swings open
      to reveal a smaller room where a radio operator works in shifts. The music from the dance hall, played by a Filipino
      band that knows every popular song from Shanghai to San Francisco, covers the sound of Morse code.
    '6': The Boiler Room Basement is a chamber beneath a textile mill in Zhabei, accessed through a coal chute that requires
      squeezing past the boiler itself. The chamber was originally a sump for the boiler's drainage, but it was enlarged by
      the resistance over several months. The temperature in the chamber rarely drops below thirty degrees Celsius, and the
      air is thick with the smell of coal dust and stale sweat. The boiler's rumble is constant, a vibration that can be felt
      in the bones, but it makes the chamber one of the safest meeting places in the district.
    '7': The Cotton Bale Hideout is a space no larger than a wardrobe, created by arranging cotton bales in a hollow square
      and covering the top with a tarpaulin. The space is located in the corner of a Hongkew warehouse where the light is
      poor and the guard's patrol is irregular. The bales absorb sound, making the space surprisingly quiet despite the warehouse
      noise. The hideout is used primarily as a temporary holding point for fugitives awaiting transfer to the next safe house.
    '8': The Disused Pump House is a small brick building at the edge of a canal in Yangpu, its door secured with a padlock
      that has rusted open. The pump machinery, a massive iron contraption from the 1910s, still occupies the centre of the
      floor, its pipes descending into the concrete. One of the access panels at the base of the pump opens onto a ladder
      that descends into a dry well. The well connects to a drainage tunnel that runs for half a mile, emerging in the basement
      of an abandoned factory.
    '9': The Coal Bunker Hideaway was built as an air raid shelter by the factory owners in the 1930s, a reinforced concrete
      chamber beneath the coal yard. The entrance is hidden beneath a pile of coal that must be shifted to access the hatch.
      The chamber is about fifteen feet square, with bunk beds along one wall and shelves of supplies along another. A ventilation
      shaft, disguised as a chimney, provides fresh air. The bunker can hold up to twelve people, and it has a small generator
      for power.
    '10': The Factory Floor Crawlspace runs between the ceiling of the ground floor and the floor of the first storey, a space
      about three feet high created by the building's unusual construction. The crawlspace is accessed through a ventilation
      grille in a storage closet, and it extends the length of the factory building. The space is filled with pipes, conduits,
      and the constant vibration of the machinery below. Despite the discomfort, the crawlspace is an ideal hiding place for
      documents, weapons, and the occasional person who can endure the confined conditions.

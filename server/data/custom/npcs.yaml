  description_templates:
  - Church spires rise above shop roofs and laundry poles, pointing toward a heaven that feels farther away each winter.
  - Sacred spaces shelter secular errands, and prayers sometimes pause while a warning passes from pew to pew.
  - Incense, old wood, and damp wool gather around choices made quietly in confessionals. The priest hears more sins than he records.
  - Faith has learned caution, with sermons shaped around survival more often than triumph. Hymns double as signals.
  - Sanctuary offers momentary peace, though even the confessional curtain moves when boots pass outside.
  - Medals, candles, and prayer cards carry new meanings when occupation threatens the faithful.
  - Church bells answer sirens with softer notes, as if hope has learned to ring under its breath.
  - Confessionals and side doors carry secrets between prayers, errands, and families who need shelter.
  - The city tries to keep its soul intact with candle wax, patched kneelers, and names spoken softly.
  special_names:
    '1': St. Joseph's Church, Nanshi
    '2': Église Saint-Pierre, Avenue Joffre
    '3': Holy Trinity Cathedral, Kiukiang Road
  special_descriptions:
    '1': St. Joseph's Church rises from the old city's grey brick maze, its twin spires a beacon of Catholic faith in the
      Chinese quarter. The church was built in 1860 and has survived war, rebellion, and occupation. Its interior smells of
      incense, old wood, and the quiet desperation of parishioners praying for absent sons.
    '2': Église Saint-Pierre stands on Avenue Joffre, a graceful neo-Romanesque building of pale stone that would not look
      out of place in provincial France. The church serves the French Concession's Catholic population, its pews filled with
      European refugees and Chinese converts. The priest delivers sermons in French and Shanghainese, serving two congregations
      with practised diplomacy.
  special_detailed_descriptions:
    '1': St. Joseph's Church, Nanshi, stands on a site that has been a Catholic church since 1860, surviving the Taiping Rebellion,
      the Republican era, and now the Japanese occupation. The church is built of grey brick in a restrained Gothic style,
      its interior cool and dim even on the brightest days. The stained glass windows, imported from France, depict saints
      whose stories of persecution resonate with the congregation's current suffering. The parish priest, a French Jesuit
      who has served in Shanghai for thirty years, knows more about the city's secrets than any Kempeitai interrogator. The
      confessional boxes are never empty, and the sins confessed there are sometimes political.
    '2': Église Saint-Pierre, Avenue Joffre, is the spiritual heart of the French Concession's Catholic community, a building
      of pale limestone with a rose window that casts a kaleidoscope of colour across the nave at noon. The church was built
      in the 1920s to serve the growing European population, its architecture deliberately evoking the Romanesque churches
      of rural France. The parish is run by French Jesuits who maintain careful relations with both the Vichy-aligned French
      authorities and the Japanese occupiers. The church's crypt contains a small chapel used for private prayer, and the
      priest knows that some of his parishioners use it for meetings that have nothing to do with worship.

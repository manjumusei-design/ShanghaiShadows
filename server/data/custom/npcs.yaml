    23: hongkou_08
  dialogue:
    greeting:
    - We meet at last. I have heard your name. I hear all the names.
    - Please, sit. In my work, a little conversation costs nothing.
    - Information is the truest weapon. I prefer quiet solutions.
    - Shanghai is a city of whispers. I listen to all of them.
    - You are in a controlled area. State your business.
    neutral:
    - Loyalty is a currency. I deal in it daily, and the rates change.
    - Every man has a price. The only question is whether one pays in gold or in fear.
    - Every person can be turned. It's a matter of finding the right pressure point.
    - Noise attracts attention. Attention complicates things.
    - Order must be maintained. By whatever means necessary.
    friendly:
    - Courtesy opens doors that force would damage, and damaged doors teach occupants to whisper.
    - A useful acquaintance is one who believes he has chosen usefulness himself.
    - I remember small kindnesses because men who offer them often expect to be remembered.
    - Sit where the window light flatters you. People speak more freely when made comfortable.
    - If you have information, present it as an anecdote. Anecdotes travel more safely than accusations.
    hostile:

    18: commercial_03
    22: venue_old_city_market_lane
  shop_inventory:
  - id: rice_bowl
    base_cost: 10
  - id: noodle_bowl
    base_cost: 12
  - id: tea
    base_cost: 6
  - id: testimony_kempeitai_reprint
    base_cost: 4
  - id: testimony_medical_reprint
    base_cost: 5
  - id: testimony_ration_queue_reprint
    base_cost: 4
  dialogue:
    greeting:
    - Come closer while the noodles are still lively. The second pot is always duller, and customers blame me instead of the flour.
    - Good morning. My son chipped the blue bowl again, so if you get that one, pretend not to see it.
    - Hot broth today. Not rich broth, but honest enough if you do not interrogate it.
    - Sit where I can see the street. A vendor serves better when uniforms cannot surprise her.
    - You look hungry, or worried. Either way, a bowl gives your hands something ordinary to do.
    neutral:
    - A clerk left half his noodles yesterday. Three people noticed, but only one pretended not to.
    - My son says I cut scallions too thin. He still picked the last one from the bowl with his finger.
    - The woman with the green scarf has not come in since Tuesday. I keep setting aside her usual portion, then selling it before noon.
    - The broth is thin today because bones cost more than pride. No one complains if I keep the bowls hot.
    - A soldier asked for extra scallions and paid exact change. I counted twice because exact change makes vendors suspicious.
    friendly:
    - I saved you the bowl without the chip. You always turn it toward yourself anyway, as if bowls have feelings.
    - If you see my boy near the market gate, send him back. He thinks errands become adventures when I cannot leave the stall.
    - The broth is stronger today because Uncle Wen brought bones. Do not mention it loudly, or every cousin in the lane will appear.
    - You usually leave the scallions. I put fewer in today, not because I am kind, but because waste offends me.
    - The man at the corner table is not reading his newspaper. He has held the same page through three bowls.
    hostile:
    - If you came to count who eats here, count yourself first and leave room for silence.
    - I do not know names. I know orders, debts, and who leaves mud under the stool.
    - No credit for strangers who ask questions before they ask the price.
    - Buy a bowl or move along. Empty hands make customers wonder what they are holding.
    - You are making people chew carefully. I dislike careful chewing at my stall.
    afraid:
    - Please lower your voice. Soup carries sound strangely when the market goes quiet.
    - The boy with papers bought noodles. That is all. He paid, he ate, he left.
    - If anyone asks, the blue bowl broke last week. It was not thrown. Nothing happened here.
    - Take the money jar if that is what you need, but leave the ladle. A stall without a ladle looks finished.
    - My son is not here. He is never here when questions begin, do you understand?
    gossip:
    - The rice queue moved twice this morning, but the old widow never got closer to the window.
    - A soldier bought noodles and asked for extra scallions. I gave them because scallions are cheaper than argument.
    - Uncle Wen says a full salt warehouse is still locked. I say locked food has already chosen its owner.
    - A boy from the docks came home with new shoes and no appetite. His mother noticed the appetite first.
    - A new man asks questions at the market and never orders food. People who are not hungry worry me.
    farewell:
    - Come back tomorrow if the flour arrives. If it does not, come anyway and complain with the others.
    - Walk carefully, and do not drop your chopsticks in the lane. My son will try to sell them back to me.
    - The lunch broth is better than the evening broth. This is not gossip, only professional honesty.
    - If you see the woman with the green scarf, tell her I kept her bowl warm twice.
    - Eat before curfew if you can. Hunger makes people answer questions badly.
    ask:
      stall_trade:
      - I inspect the shutter before dawn, for a bad hinge tells me more than a customer's cheerful greeting.
      - Near Bubbling Well Road, damp fabi reaches my palm often enough that I know its smell.
      - Breakfast mud on the floor says somebody came hurriedly, and I have learned not to ask whose shoes.
      - A constable grows curious when a scale stands oddly, so I keep my reasons to myself.
      - Anyone may ask about prices, but quiet work involves people beyond this little stall.
      noodle_stall:
      - My stall hears much between breakfast and supper, yet I sell noodles, not other people's names.
      - A wrapped parcel can sit beside the chilli oil until the right customer carries it away.
      - The cookfire gives cover, provided a clerk notices patterns before noticing hunger around the bowls.
      - Writing such traffic down would bring the wrong visitors through my doorway, and nobody here needs that.
      - Remember the bowl, not the hands around it, because market gossip spoils more than a meal.
      prices_and_papers:
      - The people at my counter want Chinese hands guiding China, though rice for supper comes before any political speech.
      - A market raid begins with a shutter knock, then a search, and by nightfall someone’s wage has vanished.
      - Officials call the searched stall orderly while families endure another evening narrowed by soldiers and fear.
      - I have heard who passes resistance leaflets, though names can make even a kind noodle shop feel unsafe.
      - Along Nanking Road, people lower their eyes to reach home alive, and that posture says nothing of surrender.
    wanted_nervous:
    - People have said your name near the queue. Sit with your back to the sacks if you must eat.
    - The queue grows quiet when your face appears. Buy quickly, and do not make my son remember you.
    - A patrol has begun asking which customers linger by the blue bowl. Eat at once, then keep walking.
    - Your shadow is longer than the market awning today. Stand where the steam can hide you from the street.
    - I hear uniforms before I see them. If one asks for you, let the broth answer with its own noise.
    wanted_fear:
    - Please do not stay by the stall. My son can read faces better than he can read warnings.
    - The boy is behind the curtain. Do not let soldiers make him point toward you or toward anything else.
    - I can spare a bowl, not a hiding place. The market has too many eyes and my family has only one name.
    - Keep your hands away from the money jar. A search already costs enough without giving them a second story.
    - Leave before the next whistle. My son should remember the smell of noodles, not the sound of boots.
    wanted_refuse:
    - I cannot serve you today. The market has too many eyes and not enough kindness.
    - No bowl today. I will not make my son's supper depend on whether a patrol likes your face.
    - Take your appetite down the lane. My stall sells noodles, not explanations for missing customers.
    - I have no place beneath the sacks and no patience for a search. Find a quieter table.
    - Do not bargain with me. Flour is expensive, but a wanted name costs the whole stall.
    wanted_help:
    - My son has seen soldiers take a man for less than a face remembered at the wrong stall.
    - The market is crowded, yet crowds make witnesses as readily as they make cover.
    - Rice is dearer this week, and a patrol with an empty stomach may take its temper out on anyone nearby.
    - I have no clever remedy for a wanted name, only a mother's wish that you do not bring ruin to another family.
    - Go carefully, and do not mistake the noise of this market for safety.
    wanted_hostile:
    - You will not turn my stall into your hiding place. Take your trouble to the men who sent it.
    - I have fed hungry people, not fugitives who make children count uniforms. Leave before I call the watch.
    - Your name has already cost me sleep. Do not ask me to spend the stall as well.
    - Move along. The market has no room for a wanted face and no patience for a second warning.
    - If you reach for the ladle, I will shout. Soup is hot, and I have no fear of wasting it on you.
- id: yan_fen
  name: Yan Fen
  description: A resistance courier who walks like she is always late and therefore never suspicious.
  faction: ccp
  role: courier
  personality: quick, brave, unsentimental
  awareness: 74
  authority: 22
  courage: 65
  perception: 55
  bt_archetype: underground_operative
  schedule:
    11: oldcity_07
    6: oldcity_04
    12: venue_commercial_office_counter
    18: venue_docks_ferry_quay
    22: venue_old_city_cramped_courtyard
  dialogue:
    greeting:
    - Do not stop fully. Walk beside me until the tea stall, then decide whether your question is worth breath.
    - I am in a hurry. The left sole split this morning, so if I limp, pretend I chose it.
    - Just a working girl with thread samples. The brown packet is dull, and dull packets live longer.
    - You have thirty seconds. Count them in your head, not on your fingers.
    - If you know me, think again. The woman you know took another street.
    neutral:
    - The tea stain on this sleeve is useful. People remember stains more readily than faces.
    - I carry parcels, receipts, thread, and sometimes nothing at all. Nothing can be important if carried properly.
    - A schoolboy offered to run my errand today. I sent him home because bravery has poor judgment at sixteen.
    - The left turn after the tobacco shop is watched now. I take the laundry lane and dislike its dogs.
    - Names slow a person down. I keep only the ones I must carry.
    friendly:
    - You noticed the split sole last time and said nothing. Silence used well is worth more than advice.
    - I left a folded receipt behind the tobacco shop. If the corner dog sleeps, take the lane beside him.
    - Your name is on a short list, written small. Do not make anyone write it larger.
    - The brown packet is safe to touch. The blue one is only safe to ignore.
    - I changed my route because of the man with the umbrella. If you see him dry, cross the street.
    hostile:
    - Walk away. You are standing like a question mark, and patrolmen enjoy punctuation.
    - I do not know you. If you insist otherwise, I will make that true for both of us.
    - Do not ask about packets by color. Honest customers ask about thread.
    - Your curiosity has heavy feet. I can hear it from half a lane away.
    - I have no message for you, no route for you, and no wish to acquire either.
    afraid:
    - I sell thread. Look, receipts, samples, dull brown paper. Nothing worth unfolding in the street.
    - The satchel has fabric scraps on top. If anyone looks below them, we are both unlucky.
    - Two couriers were taken last week. Since then, even quiet shoes sound loud to me.
    - Same umbrella, three districts. Rain stopped an hour ago, but he still carries it closed.
    - If stopped, say I gave you directions to a tailor. Tailors explain everything with measurements.
    gossip:
    - Someone left the wrong fold at the old temple. Maybe clumsy hands, maybe bait, maybe both.
    - The market has a new listener who never buys. Zhang Lan noticed the appetite before anyone noticed the questions.
    - Zhabei routes are closed for now. People say three arrests, but numbers travel badly when frightened.
    - A chalk mark appeared near the school gate, too neat and too high for the boy who usually leaves them.
    - The man with the umbrella asked after laundry prices. No one with clean cuffs cares that much about laundry.
    farewell:
    - Do not follow. Count ten stalls, then turn as if you forgot onions.
    - If I am not here tomorrow, do not ask the tea seller. Buy thread and leave.
    - Walk normally. People trying to be invisible often knock over baskets.
    - Remember the brown packet, not my face. Faces are poor containers.
    - If the umbrella man appears, complain about the weather and cross before he answers.
    ask:
      comrades:
      - A courier learns quickly that comrades survive by becoming ordinary, and ordinary names need no public airing.
      - Messages move because each hand knows only its own small duty, never the whole road.
      - I will discuss discipline, not faces, since loose recollection can follow a person home.
      - If you need trust, bring it through repeated work, not a question pressed into a crowded lane.
      - My orders end at the next doorway, and yours should not begin inside another comrade's silence.
      china_and_cells:
      - China is coal dust on a woman’s cuffs, a man in the rice queue, and a neighbour sharing his bowl.
      - We organise in kitchens, classrooms, workshops, and alleys that officials dismiss for looking too ordinary.
      - My cover can fail, so I refuse loose talk when one boast can make whole families pay.
      - Drop sites remain unnamed because one name taken under arrest can outrun every courier I have known.
      - Before curfew, ordinary work continues in the French Concession, where resistance often sounds exactly like ordinary work.
      courier_routes:
      - A courier studies doors and streets alike, because either can close on somebody carrying an innocent basket.
      - Old City customers pay with damp fabi, and I count it carefully while learning nothing from apologies.
      - Kindling, tea, and twice-counted coins keep a stall busy enough without questions about its bowls.
      - A uniform notices placement before hunger, which is why I never explain a chosen table.
      - Open business can be discussed, but private arrangements belong to everyone who risked making them.
    wanted_nervous:
    - Your name has moved faster than you today, so walk beside me only until the tea stall and no farther.
    - The street has learned your outline, so change your pace rather than your face and let the crowd do its work.
    - Two patrols asked about a courier carrying nothing, which is why empty hands must look busy in this city.
    - Do not turn toward the umbrella, because its owner has been counting people instead of raindrops since morning.
    - Your name is a loose thread, so tuck it beneath your collar before someone pulls the whole seam apart.
    wanted_fear:
    - Not here, because wanted faces make even dull parcels interesting and I cannot carry that sort of attention.
    - The corner is watched, so keep walking until the laundry hangs lower and the dogs begin their argument.
    - I cannot shelter you with a patrol behind us, because a frightened courier becomes a clue and clues get people taken.
    - Leave the packet and the street, because I can replace paper more easily than I can replace a comrade.
    - Your footsteps are too loud, so breathe once and take the lane where kitchens hide every smell.
    wanted_refuse:
    - I have no route for you while patrols are saying your name, so ask again when your shadow is smaller.
    - There is no message for you today, and do not make me invent one while a patrol studies our faces.
    - I cannot carry your trouble beside the thread samples, so find another street and forget this meeting.
    - Your name is not a pass, so leave before the tea seller decides she has seen us together.
    - Walk away without looking back, because I will not risk a route for someone who arrives under search.
    wanted_help:
    - Thread catches on every rough edge, and so does a name once the patrol has pulled at it.
    - I have heard your description passed between stalls, but rumours grow new sleeves as they travel.
    - A courier lives by knowing what not to carry, and tonight your trouble is more than I can carry beside my samples.
    - Watch the street for yourself, because no signal can change a patrol's business. No signal from me can make a patrol forget its business.
    - I am sorry, comrade, but careful words cannot turn pursuit into an ordinary errand.
    wanted_hostile:
    - You are wanted, and your carelessness is louder than any patrol, so leave before you endanger people who trusted me.
    - Do not use our route as a refuge for your panic. The cause has no room for a person who ignores signals.
    - Your name is poison to this street, so take it elsewhere before I make sure no courier knows you again.
    - I will not carry you, your questions, or your fear, so walk away while I still call this a warning.
    - You have mistaken discipline for kindness, and the next time you appear here the answer will be the watch.
- id: old_wu
  name: Old Wu
  description: A shrine keeper with soot on his sleeves and eyes that miss very little.
  faction: civilian
  role: resident
  personality: patient, shrewd, ceremonial
  awareness: 60
  authority: 15
  courage: 30
  perception: 42
  bt_archetype: civilian_vendor
  schedule:
    11: commercial_05
    5: venue_old_city_tea_intersection
    12: venue_old_city_courtyard_south
    18: venue_old_city_tea_intersection
    21: venue_old_city_back_courtyard
  dialogue:
    greeting:
    - Light a stick if you like. The incense bowl cracked yesterday, but smoke still finds its way upward.
    - You are early. The temple cat has not yet stolen breakfast from the offering plate.
    - Come in slowly. The bell rope frayed in the rain, and sudden hands make old things nervous.
    - Offerings are cheap today. Peace is dear, but no one likes hearing prices at a shrine.
    - The gods are listening. I am only sweeping ash, which is how old men hear most things.
    neutral:
    - The temple cat knocked over three prayer slips this morning. I put them back in kinder order.
    - I have burned incense here since before the street had electric lamps. Smoke remembers less than people think.
    - The stone turtle has moss on one side only. Children ask why, and adults pretend not to know.
    - A woman brought pears for her husband and took one home for her son. The gods see such arithmetic.
    - The cracked bell sounds dull now. Still, a dull bell is better than a silent one.
    friendly:
    - I saved you the dry stool. The temple cat took the warm one, and arguing with cats wastes virtue.
    - You fixed the bell rope once without mentioning it. The gods see everything, but I also keep accounts.
    - There is tea near the altar, cold but clean. Cold tea offends only proud mouths.
    - The stone turtle has a hollow behind it. I mention turtles because turtles keep counsel.
    - If you leave a prayer slip folded twice, I will know it is meant for careful hands.
    hostile:
    - Do not paw through prayer slips. Other people's grief is not a market basket.
    - You bring noisy feet and hungry eyes. The shrine has enough of both.
    - Ask the gods if you want secrets. They are more patient and less answerable.
    - The stone turtle is not for sitting, leaning, or clever strangers.
    - Leave your bad manners outside. Even the temple cat knows where to scratch.
    afraid:
    - There are only coppers in the box. The silver-looking one is tin, and the gods already know.
    - Please do not lift the turtle. Old stone cracks when frightened men hurry.
    - The prayer slips are names for ancestors, nothing more. Ancestors cannot answer police questions.
    - I am old. If I kneel, assume it is prayer and not speed.
    - The soldiers came once and counted incense sticks. I have kept fewer sticks visible since.
    gossip:
    - Three men came at midnight and argued with whispers near the stone turtle. I swept loudly until they remembered I was old.
    - The puppet mayor prays here on full moons. His offerings are generous, and his mother's tablet faces the wall.
    - Someone paints slogans by the police station at night. By morning, the paint is gone and the wall looks tired.
    - A child left a paper fish in the incense bowl. It burned badly, but the smoke smelled briefly of paste.
    - The temple cat followed a soldier yesterday, then came back hungry. Even cats learn politics slowly.
    farewell:
    - Walk slowly past the gate. Loose stones punish hurried feet without asking why.
    - Come back when the incense is fresh. Stale smoke makes even good prayers cough.
    - If the temple cat follows you, bring her back. She has debts here.
    - May the ancestors keep you, or at least nudge you away from foolish corners.
    - Leave the bell rope alone today. It has done enough work for one old thing.
    ask:
      household_routine:
      - Inspections, shortages, military yen, and frightened breaths now dictate shrine work, where seasons once supplied a gentler order.
      - At Huangpu docks, a small mistake became expensive when the wrong man noticed the wrong room.
      - People must mend, carry, cook, sweep, and count before this city can still call itself alive.
      - Hunger makes neighbours honest when no prayer can manage the same result, so I watch quietly.
      - Ordinary duties continue beneath hands taught caution before every offering and each spoken word.
      shrine:
      - The shrine keeps prayers, not confessions for passers-by, and incense cannot protect a careless tongue.
      - At twilight, a small offering may arrive under cloth and leave again without troubling the altar.
      - Visitors come for ashes, not explanations, so I let ordinary rites cover what must remain ordinary.
      - Anyone who marks every gift in a book invites sorrow to follow the ink home.
      - Take the incense scent with you, but leave the unspoken part where ancestors can guard it.
      prices_and_papers:
      - The people I meet want China in Chinese hands, but first they want rice in their bowls and quiet at supper.
      - Soldiers profaning a shrine make politics arrive as boots, searches, and wages missing before supper.
      - Soldiers call a searched shrine orderly while each family meets an evening narrowed by fear and vanished wages.
      - Those I shelter remain unnamed, since this street sells names cheaper than rice and with worse consequences.
      - In Hongkou, lowered heads do not mean surrender because people intend to survive until they can stand again.
    wanted_nervous:
    - Your name has reached the shrine gate. Light no incense today; smoke draws eyes upward.
    - The temple cat heard your footsteps before I did. Sit beneath the eaves and let the rain make you ordinary.
    - A patrol counted prayer slips yesterday. I have hidden the ones with names, but your face is harder to fold away.
    - Do not touch the bell rope. One sound brings the street closer, and the street has been asking after you.
    - Your shadow has become a second visitor. Keep it close, and do not let it cross the offering mat.
    wanted_fear:
    - Please leave before soldiers count the prayer slips. Names are thin paper, and paper tears.
    - The soldiers return at dusk. I have no room behind the tablets for a person whose fear can be heard.
    - Do not make the cat run. A frightened animal draws a child's eyes, and children repeat what they see.
    - I can hide a paper, not a wanted body. Go while the incense still gives the gate a harmless reason to smoke.
    - My knees are old, but the patrol's questions are not. Please carry your danger beyond the shrine wall.
    wanted_refuse:
    - I cannot hide you under old incense and older bones. The shrine is watched too closely today.
    - The ancestors accept offerings, not fugitives. Take your name elsewhere before the gate is searched.
    - I will not move the tablets for you. Their dust is old, and your trouble is too fresh to cover.
    - Leave the shrine to its prayers. The soldiers need only one excuse to turn reverence into evidence.
    - You may light incense another day, when the street has forgotten to count who enters.
    wanted_help:
    - The bell has heard soldiers before, and its sound did not soften their hands.
    - Incense cannot hide a man from those who have learned his name, though it may give him a moment to breathe.
    - The shrine receives everyone who kneels, but I cannot call its courtyard safe while the street is watched.
    - A cat may pass a sentry unnoticed, but frightened people carry a different noise.
    - Offer a quiet prayer if it helps you, then trust your own judgment beyond these doors.
    wanted_hostile:
    - Do not bring your pursuit beneath this roof. The ancestors have enough enemies without adopting yours.
    - You are wanted, and your presence makes every prayer look like a confession. Leave now.
    - I will not let your fear disturb the tablets. Take it back to the men who taught it to you.
    - The shrine is not your shelter. If you remain, I will call the watch and let the gods judge the noise.
    - Go before I sweep you from the threshold with the ash. Old hands can still be firm.
- id: inspector_moreau
  name: Inspector Moreau
  description: A concession policeman whose fatigue has sharpened into cynicism.
  faction: french_concession
  role: police
  personality: tired, skeptical, decent in flashes
  awareness: 63
  authority: 42
  courage: 40
  perception: 50
  bt_archetype: civilian_vendor
  schedule:
    11: bund_09
    8: french_06
    13: venue_french_cafe_boulevard
    19: venue_shopping_arcade_french
    23: french_06
  dialogue:
    greeting:
    - Every report is a lie told in a better suit.
    - If you're here to complain, the desk is closed. If you're here to help, I don't believe you.
    - Inspector Moreau. French Concession Police. What catastrophe brings you to my desk?
    - Another day, another complaint. Something is someone's fault.
    - You look like someone about to waste my time. I have very little left.
    neutral:
    - Don't make me notice you twice. Once is enough paperwork.
    - I patrol this block. I don't solve the world. I barely solve Tuesdays.
    - Keep your papers on you and your opinions to yourself. That's how you survive in the Concession.
    - I've done this job long enough to know nothing is what it seems.
    - The Concession runs on paper and patience. Both are running out.
    friendly:
    - If I didn't still care a little, I'd have transferred to Saigon years ago. Or retired. Or drunk myself dead.
    - There's a patrol gap on Rue Massenet between two and four in the morning. I'm not telling you that. I wasn't here.
    - You're one of the good ones. Don't make me arrest you anyway. It would embarrass us both.
    - There's a back gate on Rue du Consulat nobody watches. I didn't tell you.
    - You've got more sense than most. That's an observation, not a compliment.
    hostile:
    - I'm too tired to be patient and too honest to look away. Don't test either.
    - You're a problem I don't need. Walk away while I'm still neutral.
    - I've arrested better men than you for less. Want to see the paperwork?
    - I've got a desk full of cases and a city full of criminals. Don't add to both.
    - You're pushing your luck. Mine ran out years ago. Yours is still on the table.
    afraid:
    - I'm French police. The French run this concession. Whatever you want, there are channels.
    - You want a bribe? Fine. I don't have much. I'm a policeman, not a banker.
    - I cooperate. Obviously. The Concession remains neutral. We stay professional.
    - The Japanese are leaning on the Consul to patrol our streets. Then I can't protect anyone.
    - I found a listening device in my office. Someone is watching the watchers.
    gossip:
    - A body washed up on the Bund this morning. No papers. No face. The report says drowning. The report is lying.
    - The Japanese are pressing the Consul to hand over refugees. He's resisting. For now.
    - Someone's been forging French Concession residence permits. Good forgeries. Even I had to look twice.
    - A girl brought me a purse she found near Rue Massenet. She kept the bread coupon and looked ashamed before I asked.
    - The night clerk says one permit stamp has gone missing. He blames damp ink, which is generous to thieves.
    farewell:
    - Stay off the streets after curfew. I'd hate to find you in my paperwork.
    - Good night. Try not to make my shift interesting. Interesting is bad for everyone.
    - Walk safe. And if you see something, tell someone else first. I'm drowning in reports.
    - Try to stay on the right side of the law. The left side is crowded.
    - I'll be at my desk or at the bar. Those are the same place lately.
    ask:
      concession_beat:
      - Soldiers miss small kindnesses during a dawn patrol, which is when neighbours pass hot water across landings.
      - At Bubbling Well Road, folded fabi reaches my hand with apologies, and I count each sorry note.
      - The ledger calls it borrowed string, yet small debts are better settled away from an office.
      - My whistle stays where it does, since uniforms make inconveniences of questions with no lawful answer.
      - Public incidents have their record, whereas private arrangements stay guarded by discretion.
      justice_version:
      - My notion of justice survives by staying close to evidence, not every rumour offered at my desk.
      - A constable dropped a cup near the Bund, and the station laughed until permit inspectors arrived.
      - Charge sheets collect facts, whereas frightened clerks conceal papers before the wrong authority sees them.
      - I record only what an inquiry requires, since strangers turn loose words into accusations.
      - You may have the portion fit for conversation, but a case file does not open after one cordial question.
      concession_neutrality:
      - My beat begins where concession boundaries become excuses, and every constable knows which complaints reach a desk.
      - Evidence matters because it tells me what I can act upon before some consul calls the matter inconvenient.
      - Discretion protects witnesses, but it also gives respectable offices room to ignore injuries beyond their gate.
      - I record the facts that survive inquiry, then watch foreign officials decide whether those facts disturb their luncheon.
      - Neutrality is a rule on paper, but street patrols show me daily who receives its protection.
    wanted_nervous:
    - Your name has reached my desk twice, so keep your hands visible and make this easier for both of us.
    - I have seen your description, and it is uncomfortably accurate. Stay near the lamp while I decide what it means.
    - The patrols are asking after you in three languages, which is a great deal of attention for one tired person.
    - Do not turn this into a chase, because I have no appetite for paperwork written after midnight.
    - You are making the street look guilty, so stand still, answer plainly, and let the evening pass.
    wanted_fear:
    - I can keep you out of one report but not out of every patrol, so leave before the next constable arrives.
    - The back gate is watched tonight, and you must not make me choose between your safety and the people on this beat.
    - I have seen what a search does to a room. Take your coat and go before the uniformed men arrive.
    - You may trust my warning, but do not mistake it for protection, since I have a badge and very little power.
    - If they ask whether I saw you, I will answer carefully, so give me no reason to answer twice.
    wanted_refuse:
    - I cannot shelter a wanted person in a station that already has too many eyes.
    - Take your request to someone with a cleaner conscience or a dirtier office, because mine has no room tonight.
    - I will not alter the report, because one small favour becomes a French scandal when the wrong clerk reads it.
    - Leave the beat before I have to put your name in writing, because I would rather remember this as a warning.
    - The law has poor timing, but it remains the law inside these walls, so move along before the clerk notices.
    wanted_help:
    - The concession's papers have given your name a disagreeable life of its own.
    - Patrols change their habits when orders come in, and no sensible officer bets another man's life on a timetable.
    - I can tell you the bakery has been watched lately, which may matter more than any old map of the beat.
    - A uniform offers no sanctuary, whatever a desperate person may hear in a courteous voice.
    - Keep out of bright rooms, if you value my advice, and remember that advice is all I can give.
    wanted_hostile:
    - You are wanted, and I am not willing to make my desk your hiding place, so turn around before this worsens.
    - I have arrested better men for less trouble, and you should not force me to prove that the badge still works.
    - Step away from the door, because I will not let a wanted suspect turn this station into a public argument.
    - Your story is not a permit, so leave now or I will write the report you are trying to avoid.
    - I am tired, not blind, so put your hands where I can see them and stop making this worse.
- id: qiao_ming
  name: Qiao Ming
  description: A dockside gambler with nicotine fingers and a talent for hearing numbers before they are spoken.
  faction: green_gang
  role: smuggler
  personality: slick, greedy, charming under pressure

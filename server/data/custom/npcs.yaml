    - The manager does not like people bothering his performers. Neither do I.
    - You are not a customer. You are not a friend. You are a liability.
    - I have powerful friends who do not like to see me disrespected.
    - The bouncer will escort you out. He has done it before. He enjoys it.
    afraid:
    - An officer requested a specific song tonight. My song. The coded one. He cannot know the meaning.

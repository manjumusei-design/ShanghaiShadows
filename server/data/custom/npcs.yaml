      - "A source who arrives without an umbrella has usually come with more than weather on his mind."
      - "I listen for what a witness corrects, because that is often where the buried fact begins."
      - "No reporter owns a source, as we borrow each other's courage until the next patrol interrupts us."
      - "If you bring information, bring something I can verify without making a funeral of it."

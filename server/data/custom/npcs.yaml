  indoors_every: 4
  description_templates:
  - The refugee route narrows between temporary notices, damp bundles, and officials calling names from lists already smudged by rain.
  - Lanterns cast long shadows over people learning which counters demand papers and which demand patience.
  - A quiet corner of the entry quarter holds bedrolls, chipped enamel cups, and the guarded silence of new arrivals.
  - Footsteps echo off damp stone walls while families keep one hand on their luggage and one on their children.
  special_ids:
    '1': refugee_entry_checkpoint
    '2': refugee_entry_tea_house
    '3': refugee_entry_back_alley
    '4': refugee_entry_market_street
    '5': refugee_entry_warehouse

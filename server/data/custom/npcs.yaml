  dialogue:
    greeting:
    - Paper burns fast. Ideas do not.
    - Close the door. The draft blows words where they should not go.
    - You are early or you are late. In this shop, both mean the same thing.
    - The struggle continues. What news do you bring?
    - Speak quickly. Every moment is a risk.
    neutral:
    - Mind the ink. It remembers carelessness.
    - I print what I am paid to print. Nothing more, nothing less.
    - The presses are running. Speak up or come back when they stop.
    - The Party's work continues. Quietly. Patiently.
    - Trust is earned through action, not words.
    friendly:
    - If a page survives the night, it has already won something.
    - I set type by hand and by heart. Some words I set twice because they matter.
    - Take this stack. Read it once, then burn it. The stove is always lit.
    - You've proven your commitment. The cause remembers.
    - We could use someone with your skills.
    hostile:
    - Printers have enemies enough without volunteers.
    - You are asking questions that ink cannot answer and I will not.
    - Walk back out the way you came. The door does not lock from the inside.
    - You are either a comrade or a threat. Which is it?
    - I don't trust you. That keeps us both alive.
    afraid:
    - The garrison sent men to every printshop on the block. I gave them old newspapers and a smile.
    - Do not come here for a few days. Let the dust settle. Mine and theirs.
    - Someone talked. I do not know who. Until I do, trust no one, including me.
    - The network is compromised. We're laying low until we identify the leak.
    - Too many questions from the wrong people.
    gossip:
    - The paper ration has been cut again. The occupation does not want people reading, let alone writing.
    - A man in the old city was caught with a hand-crank press hidden under his floorboards. Brave or foolish. Perhaps both.
    - I heard the Nationalists are printing currency again. Counterfeit or legitimate, depending on which side you ask.
    - A compositor dropped the character for hunger today. Nobody laughed until he found it under his shoe.
    - The censor rejected a wedding notice because the groom's name resembled a banned slogan when badly printed.
    farewell:
    - Go carefully. And if anyone asks, you came to pick up wedding invitations.
    - The back alley is safer than the front door tonight. Use it.
    - Until next time. Keep your eyes on the page and your feet on the ground.
    - The revolution is patient. We will prevail.
    - Stay safe. The cause needs you.
    ask:
      relief_work:
      - Relief begins with sacks counted honestly, because hunger notices every missing handful before any committee does.
      - At Huangpu, people offer folded fabi for rice, although paper cannot quiet an empty child.
      - A jammed shutter delays the queue, then neighbours solve it together without asking who deserves credit.
      - Trouble begins when uniforms inspect a rice sack as though grain itself has chosen a side.
      - I can explain the public work, but private arrangements remain private because families depend on that discipline.
      printshop:
      - 'A printshop keeps its own weather: hot metal, ink under fingernails, and windows closed against inquisitive dust.'
      - At the Bund before dusk, a parcel disguised as laundry changed hands without requiring applause.
      - Care travels quietly now, folded between ordinary pages where a clerk sees nothing worth confiscating.
      - No compositor writes down names that could give grief a street number and a door.
      - Remember the margin if you must, but leave the typeface itself where it belongs.
      china_and_cells:
      - China belongs to workers who set type by midnight, then carry rice home before their children wake.
      - A print room needs clean hands, accurate copy, and people willing to keep a dangerous page from becoming gossip.
      - Arrested typesetters leave empty cases behind, which reminds every printer why discipline matters more than applause.
      - I discuss pamphlets as work, never as a list of comrades who could be taken for my carelessness.
      - Watch the ink on my cuffs, not the faces nearby, if you want to understand how a cell survives.

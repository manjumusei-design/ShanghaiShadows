  special_names:
    '1': Weather Station
    '2': Safehouse Common Room
    '3': Police Checkpoint
    '4': Black Market Alley
    '5': Information Broker's Den
    '6': Eavesdropper's Perch
    '7': Resistance Contact Point
    '8': Dark Alley
  special_descriptions:
    '1': "The barometer needle rests between fair and change. A thumb-smear on the case glass marks the place where the same hand presses each morning. Meteorologist Zhang works at the window, comparing the sky with the instruments before adding another line of figures to the slate. A barograph drum turns slowly beside it, its needle tracing the week's pressure in violet ink. Wall charts cover the boards behind him, pressure and wind marked in different inks. Beyond the glass, low cloud moves inland above the roofs. A strip of blackout cloth has been tied back from the upper pane. The northern door leads into a common room beyond the instrument tables."
    '2': "On the low stove, a rice pot clicks as steam gathers beneath the lid. Elder Brother Qian wipes the table, folds the cloth into quarters, and hangs it from a nail beside the stove. Bunks line the far wall, their blankets pulled tight and shoes paired underneath. Enamel cups stand rim-down on a shelf above a washbasin. A blackout curtain covers the high window, pinned back at one corner to admit a strip of morning light. The stove warms the centre of the room, but the air near the northern door remains cool enough to keep coats buttoned. Qian checks the rice with the tip of a wooden spoon, replaces the lid, and lowers the flame."
    '3': "Wanted notices cover the wall behind Inspector Park, their corners held flat beneath narrow strips of glass. Park sits at a scarred desk with an open ledger beneath one hand and a rubber stamp beside the other. Files are stacked by district, each bundle tied with cotton tape and marked in red pencil. A stopped wall clock hangs above a cabinet of fingerprint cards. South, the corridor returns to the common room. North, the notices continue toward a narrower passage where the electric light gives way to lamps hidden behind shutters."
    '4': "The passage narrows between brick walls patched with planks and sheets of corrugated tin. Most of the shutters remain closed, though lamplight leaks through the cracks and catches on parcels wrapped in old newspaper. Tea crates serve as counters along one wall, their contents covered with sacking whenever footsteps pass the southern entrance. Old Mother Jin sits behind a low folding table with a brass hand scale, a pencil stub and three unmarked tins arranged within reach. A loaded handcart occupies half the eastern passage. South, electric light shows beneath the door to the police corridor. East, the smell of ink carries from a partitioned desk."
    '5': "A green-shaded lamp throws light across a desk crowded with ledgers, copied notices and folded slips of paper. Scribe Wen sits behind it with a brush held above an unfinished line, waiting for the last line of ink to dry. Shelves cover the brick wall at his back, their account books tied with string and their labels turned inward. A teapot stands beside a jar of brushes, and a shallow tray of blotting sand rests near Wen's elbow. The western partition opens toward Old Mother Jin's alley. South, a narrow corridor continues past a row of closed doors toward the listening post. Footsteps pass outside at intervals, slowing near the partition before continuing."
    '6': "The window stands ajar over the street, and the city comes up through it as sound: cart wheels, a hawker's call, the even wash of feet. The chair faces the door, its back to the window, one side of the seat worn lower than the other. Floorboards creak under Old Crane's step as he moves from the sill to the wall and turns one ear toward the listening pipe. Grey light from the window reaches the worn chair but leaves the southern door in shade. A listening pipe runs from the sill to the floor, its brass mouth dulled where his ear has rested. The door is plain wood, with no window in it."
    '7': "Sister Zhao sits at a small table with a warm kettle and two enamel cups set between her hands. She has poured tea into one cup but has not touched it. A single coat hook is fixed beside the northern door, and the bare plaster wall above the table carries a chalk mark rubbed down to a pale smudge. A folded newspaper covers the lower half of the window. Beneath the table, a canvas satchel rests against Zhao's chair with its buckle turned inward. North, the passage returns to the listening room. South, a plain wooden door is secured by a bolt set high on the frame."
    '8': "The passage runs between damp brick walls toward the river road. Dawn shows at the southern mouth as a pale strip across the cobbles, broken whenever a cart passes outside. A merchant sits against the western wall with his collar open and a bottle hanging loosely from one hand. His breathing comes in short, uneven bursts. Near the alley mouth, a patrol guard stands beneath a patched awning with his arms folded, watching the traffic on the road. Rainwater drips from a bent gutter into a shallow channel along the wall. North, a plain door returns to the resistance contact room. South, wheels and bicycle bells pass along the road above the river."
  special_detailed_descriptions:
    '1': "The glass cases hold their instruments in rows: a thermometer, a wind gauge, a tube of mercury in its bracket. Chalk dust lies along the bottom edge of the reading slate, and the newest numbers are still crisp where older ones have smeared under a wet cloth. Zhang's hands are never still: he taps the barometer case, straightens a chart's corner, crosses to the window and back, and the pencil in his pocket rides loose against the ledger spine, notched at the thumb. Outside, cloud moves slowly past the roof line, and Zhang does not look up at it."
    '2': "Grey daylight reaches through one window and thins at the floor's edge. The stove's fire is banked low, a coal glow under ash, and the rice pot steams above it. Along the far wall the bunks stand in a row, and above them a beam carries a smoke stain that is older than the paint around it. Qian crosses the room. The floorboards answer only at one place near the door, worn smooth by every foot. He sets the pot down on the hearth stone and stands at the window with his hands clasped behind him."
    '3': "Inspector Park's hands move in a steady order: turn, read, stamp, stack. Up close, the ledger's pages are soft at the corners, and the rubber stamp's handle is worn where the fingers grip it. The ink pad is dry at one corner where the stamp has missed. Dust lies thin on the clock glass above the desk, though nothing in the room consults it; the wall clock points at an hour. The papers turn."
    '4': "The light at either mouth of the covered passage falls short of the middle, where Old Mother Jin works her scales. The brass pans are dulled at the rims, and the weights beside them are worn smooth by handling. Folded wrappers lie in a neat stack at her elbow; each parcel leaves the table folded the same way, the fingers creasing each corner before the hands let go. A customer leans close, names a price in a whisper, and steps back. The pan clicks to rest, the loudest sound in the passage. The customer leaves without a word."
    '5': "Steam thins against the lamp's light, and Scribe Wen reads a line twice before he turns the page, his pen waiting beside the ledger. The files stand in stacks of different heights, their edges catching the lamplight at the margins, and the teapot steams among the ledgers. He turns the page. A name is written, crossed out, written again, and the ledger's edge shows the marks of many such crossings."
    '6': "The dust beside Old Crane's elbow is worn into the shape of an arm. He leans at the sill, and through the window a bicycle bell comes, a woman calling a price. The floorboards run the room's length: one loose board near the door, one silent board in the middle, the rest even underfoot. Beyond the chair, the room is bare wall and bare boards. Boots cross the cobbles below, then the sound fades and the street gives the window back its silence."
    '7': "The kettle sings low, its steam rising straight and thin over the cup Zhao has poured and left untouched. The coat hook stands by the northern door, its nail showing bare against the whitewash. The chalk smudge sits at shoulder height, close enough that a hand reaching for the hook would cover it. Zhao answers the door more than the table, her voice kept low, and when she speaks the bolt on the southern door stays within reach of her glance. Set down, the second cup stands square to the table's edge, and the smudge keeps its place while the tea cools."
    '8': "The bottle lies empty on its side where the merchant dropped it, and his open hand has come to rest on it. The guard shifts his weight from one foot to the other and back again, unhurried. Through the passage mouth a tram bell comes, the rattle of a cart. The merchant's breathing saws, undisturbed. The guard's shadow lies long across the floor, and when he moves, it is only to stand where he was standing."

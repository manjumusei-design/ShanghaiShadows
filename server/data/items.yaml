items:
- id: ration_card
  name: a worn ration card
  description: A thin piece of yellowing cardboard, softened at the corners from years
    in a coat pocket. The red municipal stamp remains clear, but the printed characters
    have faded. Such cards became a necessary part of daily life as war and occupation
    disrupted Shanghai's food supply.
  examine_text: The card has passed through a dozen hands along the Bund, each one smoothing its corners before the next ration queue began.
  examine_provenance:
    coverage_ids:
    - loc-examine-ration-card
    claims:
      place:
        value: Bund
        span:
          start: 0
          end: 105
        coverage_id: loc-examine-ration-card
      period_basis:
        value: ration queue
        span:
          start: 105
          end: 124
        coverage_id: loc-examine-ration-card
      object_basis:
        value: ration queue
        span:
          start: 105
          end: 124
        coverage_id: loc-examine-ration-card
  takeable: true
  readable_text: 'Shanghai Special Municipality: Weekly Ration Authorization. Bearer
    entitled to 200g rice, 50g oil. Valid through December 1937.'
  rarity: common
- id: brass_key
  name: a small brass key
  description: A small brass key darkened by age and handling. The number 42 is engraved
    into its bow, and faint scratches suggest it has opened the same lock countless
    times. It may belong to a room in one of the many rented apartments crowding Shanghai's
    longtang neighbourhoods.
  takeable: true
  rarity: uncommon
- id: photograph
  name: a faded family photograph
  description: 'A small black-and-white photograph mounted on brittle cardboard. A
    family sits stiffly in a studio portrait: parents in their best clothes, children
    standing carefully beside them. The edges have yellowed, and a fingerprint stain
    marks one corner.'
  examine_text: The photographer's backdrop has survived, but these faces were carried from the Old City to the Bund one room at a time.
  examine_provenance:
    coverage_ids:
    - loc-examine-photograph
    claims:
      place:
        value: Old City
        span:
          start: 80
          end: 101
        coverage_id: loc-examine-photograph
      period_basis:
        value: one room at a time
        span:
          start: 101
          end: 120
        coverage_id: loc-examine-photograph
      object_basis:
        value: photographer
        span:
          start: 0
          end: 80
        coverage_id: loc-examine-photograph
  takeable: true
  readable_text: To remember before everything changed. Behind the dye shop, second
    lane. -- May 1937
  rarity: common
- id: truncheon
  name: a police truncheon
  description: A heavy, lacquered baton of dark wood, worn smooth at the grip. The
    leather wrist strap is cracked with age. It bears no markings, but the weight
    and balance speak of its purpose. Instruments like this were standard issue for
    the Shanghai Municipal Police.
  takeable: true
  rarity: common
- id: newspaper
  name: yesterday's newspaper
  description: A single sheet of newsprint, the ink already smudging on the fingers.
    The headlines announce victories on distant fronts, but the small print tells
    a different story. Shortages listed. Curfew extended. A ration cut announced in
    the back pages.
  takeable: true
  readable_text: Front pages praise the new order. Page four lists this week's ration
    allotments. Page seven carries a notice of curfew extension.
  rarity: common
- id: bloodied_message
  name: a bloodied message
  description: A scrap of paper, the edges dark with dried blood. The writing is hurried,
    the characters barely legible. A name. A time. A location. The message never reached
    its intended recipient, but it was important enough that someone died carrying
    it.
  takeable: true
  readable_text: The message is cut off mid-sentence. A name, a time, a street intersection.
    The bottom edge of the paper is dark and stiff.
  rarity: common
- id: forged_pass
  base_cost: 50
  name: a forged transit pass
  description: The paper has been rubbed with tea to soften its newness, and the
    municipal stamp is copied with a careful but anxious hand. It may pass a bored
    checkpoint clerk in the rain, yet the photograph sits a fraction too high.
  takeable: true
  readable_text: Faded stamps and a photograph that doesn't quite match the bearer.
    Valid for three more days -- maybe.
  rarity: common
- id: silk_scarf
  base_cost: 25
  name: a silk scarf
  description: Pale silk, folded small enough for a coat pocket, with one corner
    embroidered in thread too fine for market work. It carries a faint perfume from
    the French Concession and a crease where someone tied it to a balcony rail.
  examine_text: Someone tied this silk to a French Concession balcony during the blackout, then carried it home when the street grew too quiet.
  examine_provenance:
    coverage_ids:
    - loc-examine-silk-scarf
    claims:
      place:
        value: French Concession
        span:
          start: 0
          end: 65
        coverage_id: loc-examine-silk-scarf
      period_basis:
        value: blackout
        span:
          start: 65
          end: 127
        coverage_id: loc-examine-silk-scarf
      object_basis:
        value: blackout
        span:
          start: 65
          end: 127
        coverage_id: loc-examine-silk-scarf
  takeable: true
  rarity: common
- id: contraband_morphine
  base_cost: 60
  name: a vial of contraband morphine
  description: A narrow glass vial sealed with wax and wrapped in a strip of hospital
    gauze. The label has been scraped away, but the dosage marks remain clear enough
    for a careful nurse and tempting enough for a desperate broker.
  takeable: true
  rarity: common
- id: temple_talisman
  name: a temple talisman
  description: Red paper folded around a brush-written prayer, smoke-darkened along
    the edges from a temple brazier in the Old City. The cord is knotted twice, once
    for safe passage and once for a name no one has written down.
  takeable: true
  readable_text: The prayer asks for a safe return, but does not promise one.
  rarity: common
- id: coded_ledger
  base_cost: 40
  name: a coded ledger
  description: A shop ledger ruled in blue ink, its columns of rice, lamp oil, and
    transport fees kept with suspicious neatness. Certain totals repeat at odd intervals,
    as if the accounts are also counting ships, names, and nights.
  takeable: true
  readable_text: Ships, names, and dates shift into meaning only after the third reading.
  rarity: common
- id: patrol_route
  base_cost: 35
  name: a folded patrol route
  description: A worn slip of paper listing patrol routes and shift changes in neat
    Japanese script. The fold lines are soft from being carried inside a tunic pocket.
    Such schedules were considered sensitive documents, never to leave the station.
    The ink is smudged where the paper was folded while still wet.
  takeable: true
  readable_text: Patrol timings tighten near Hongkou after 20:00.
  rarity: common
- id: dock_manifest
  base_cost: 30
  name: a dock manifest
  description: A cargo manifest from the Huangpu docks, stamped once in English,
    once in Chinese, and once by an impatient Japanese clerk. The paper smells of
    river damp and coal dust, with one crate number corrected three times.
  examine_text: Coal dust has darkened the dock's stamps, where a clerk corrected one crate number and kept working beneath the Huangpu lamps.
  examine_provenance:
    coverage_ids:
    - loc-examine-dock-manifest
    claims:
      place:
        value: dock
        span:
          start: 0
          end: 34
        coverage_id: loc-examine-dock-manifest
      period_basis:
        value: Huangpu lamps
        span:
          start: 112
          end: 126
        coverage_id: loc-examine-dock-manifest
      object_basis:
        value: stamps
        span:
          start: 34
          end: 112
        coverage_id: loc-examine-dock-manifest
  takeable: true
  readable_text: Crates marked medical supplies are routed through Pier Six.
  rarity: common
- id: prayer_beads
  base_cost: 15
  name: a string of prayer beads
  description: Dark wooden beads threaded on cotton cord, each bead polished by years
    of thumb and prayer. A single bead near the tassel is cracked, perhaps from being
    dropped on temple stone when footsteps sounded too close.
  examine_text: One cracked bead bears the warmth of a thumb that counted prayers through curfew, while the Old City waited for footsteps to pass.
  examine_provenance:
    coverage_ids:
    - loc-examine-prayer-beads
    claims:
      place:
        value: Old City
        span:
          start: 92
          end: 130
        coverage_id: loc-examine-prayer-beads
      period_basis:
        value: curfew
        span:
          start: 0
          end: 92
        coverage_id: loc-examine-prayer-beads
      object_basis:
        value: curfew
        span:
          start: 0
          end: 92
        coverage_id: loc-examine-prayer-beads
  takeable: true
  rarity: common
- id: hidden_cash
  base_cost: 40
  name: a roll of hidden cash
  description: Small fabi notes rolled tight inside a paper sleeve and tied with
    butcher's twine. The outer bills are nearly worthless from inflation, but a silver
    coin hidden in the centre changes the weight in the hand.
  examine_text: The silver coin was wrapped after the bank notes failed, a small reserve for a rice queue when a week's wages vanished overnight.
  examine_provenance:
    coverage_ids:
    - loc-examine-hidden-cash
    claims:
      place:
        value: rice queue
        span:
          start: 79
          end: 129
        coverage_id: loc-examine-hidden-cash
      period_basis:
        value: bank notes failed
        span:
          start: 38
          end: 79
        coverage_id: loc-examine-hidden-cash
      object_basis:
        value: silver coin
        span:
          start: 0
          end: 38
        coverage_id: loc-examine-hidden-cash
  takeable: true
  rarity: common
- id: cold_noodles
  base_cost: 8
  name: a bowl of cold noodles
  description: A shallow bowl of wheat noodles in a chilled broth, topped with a slice
    of pickled radish and a sprinkle of sesame. The vendor has drizzled black vinegar
    across the top in the shape of a character meaning peace.
  takeable: true
  food_value: 15
  morale_restore: 3
  culture: chinese
  rarity: common
- id: rice_bowl
  base_cost: 10
  name: a bowl of rice
  description: A simple ceramic bowl, glazed a pale celadon green. A small chip marks
    the rim, and the base is stamped with the mark of a kiln in Jiangxi. Bowls like
    this were found in every home and stall across Shanghai,不分贫富.
  examine_text: The Jiangxi kiln mark survived the move south, though the family who carried this bowl now measures each serving before lifting it.
  examine_provenance:
    coverage_ids:
    - loc-examine-rice-bowl
    claims:
      place:
        value: Jiangxi
        span:
          start: 0
          end: 35
        coverage_id: loc-examine-rice-bowl
      period_basis:
        value: move south
        span:
          start: 35
          end: 82
        coverage_id: loc-examine-rice-bowl
      object_basis:
        value: bowl
        span:
          start: 82
          end: 131
        coverage_id: loc-examine-rice-bowl
  takeable: true
  food_value: 5
  morale_restore: 3
  culture: chinese
  rarity: common
- id: tea
  base_cost: 6
  name: a cup of tea
  description: A small ceramic cup, thin enough to warm the hands through. The interior
    is stained a deep amber from years of use. The handle has been repaired once with
    a careful application of lacquer. Tea houses across Shanghai served cups identical
    to this one.
  examine_text: At a Shanghai tea stall, this cup warmed a porter's hands between loads, when even a quiet pause had to answer to the clock.
  examine_provenance:
    coverage_ids:
    - loc-examine-tea
    claims:
      place:
        value: Shanghai
        span:
          start: 0
          end: 14
        coverage_id: loc-examine-tea
      period_basis:
        value: porter's hands
        span:
          start: 43
          end: 124
        coverage_id: loc-examine-tea
      object_basis:
        value: tea stall
        span:
          start: 14
          end: 43
        coverage_id: loc-examine-tea
  takeable: true
  food_value: 25
  morale_restore: 10
  culture: chinese
  rarity: common
- id: dried_fish
  base_cost: 12
  name: dried fish
  description: A small dried fish, its skin drawn tight over the bones, eyes sunken
    and white. It is strung on a length of twine through the gills. Dried fish was
    a staple protein for those who could not afford fresh meat, keeping for months
    without spoiling.
  takeable: true
  food_value: 25
  morale_restore: 2
  culture: chinese
  rarity: common
- id: street_snack
  base_cost: 6
  name: a street vendor's snack
  description: A small paper cone of fried dough, still warm from the oil. The vendor
    seasoned it with a pinch of salt and a dusting of five-spice powder before folding
    the paper. Street snacks like this were a brief comfort for workers who could
    not afford a full meal at a stall.
  takeable: true
  food_value: 12
  morale_restore: 8
  culture: chinese
  rarity: common
- id: sake
  name: a bottle of sake
  description: A squat bottle of clear rice wine, sealed with a paper label from
    a Hongkou supplier serving Japanese officers. The glass is warm from being carried
    under a coat, and the stopper smells faintly of cedar.
  takeable: true
  food_value: 5
  morale_restore: 15
  culture: japanese
  rarity: common
- id: sushi
  name: a plate of sushi
  description: A neat oblong of vinegared rice topped with a slice of raw fish, wrapped
    in a strip of dried seaweed. It was prepared by a Japanese chef in one of the
    Hongkou district's new establishments, serving tastes familiar to the occupying
    soldiers far from home.
  takeable: true
  food_value: 22
  morale_restore: 8
  culture: japanese
  rarity: common
- id: mochi
  name: a piece of mochi
  description: A small round rice cake, soft and yielding, dusted lightly with potato
    starch. It was handmade, stretched and folded until the texture became smooth
    and elastic. Mochi was a taste of home for Japanese soldiers and officials stationed
    in Shanghai.
  takeable: true
  food_value: 10
  morale_restore: 12
  culture: japanese
  rarity: common
- id: miso_soup
  name: a bowl of miso soup
  description: A lacquered bowl of miso broth, cloudy with fermented soybean paste
    and softened scraps of tofu. It belongs to the canteens and boarding houses of
    Hongkou, where soldiers look for familiar salt after patrol.
  takeable: true
  food_value: 15
  morale_restore: 10
  culture: japanese
  rarity: common
- id: rice_crackers
  name: a bag of rice crackers
  description: A small cloth bag of puffed rice crackers, lightly seasoned with salt.
    The bag is tied with a twist of straw. Street vendors sold these from baskets
    carried through the markets, their calls echoing between the buildings.
  takeable: true
  food_value: 12
  morale_restore: 4
  culture: japanese
  rarity: common
- id: coffee
  name: a cup of coffee
  description: A small cloth sack of roasted coffee beans. The beans are dark and
    oily, and a fine dust of grounds coats the inside of the sack. Coffee houses in
    the French Concession served espresso to journalists, spies, and refugees who
    could afford the habit.
  takeable: true
  food_value: 3
  morale_restore: 18
  culture: western
  rarity: uncommon
- id: bread
  name: a loaf of bread
  description: A round loaf of white bread, the crust soft and pale. It is unlike
    the steamed bread of Chinese bakeries. This was baked in a Western-style oven,
    probably in one of the French Concession's boulangeries, where the scent of fresh
    bread drew customers past the doorway.
  takeable: true
  food_value: 20
  morale_restore: 5
  culture: western
  rarity: common
- id: cheese
  name: a wedge of cheese
  description: A wedge of hard yellow cheese, wrapped in waxed paper. The rind is
    marked with the stamp of a dairy in the French Concession, where European farmers
    supplied the foreign community with tastes of home.
  takeable: true
  food_value: 18
  morale_restore: 6
  culture: western
  rarity: common
- id: sandwich
  name: a wrapped sandwich
  description: Two slices of soft white bread enclosing a thin slice of ham and a
    leaf of lettuce. The crusts have been cut off. This is a foreign-style meal, sold
    in the cafes of the French Concession and the International Settlement, a reminder
    of the treaty ports' cosmopolitan past.
  takeable: true
  food_value: 25
  morale_restore: 7
  culture: western
  rarity: common
- id: wine
  name: a bottle of wine
  description: A dark glass bottle with a faded label in French. The cork is stained
    deep purple, and a thin crust of sediment clings to the bottom. Imported from
    Bordeaux before the war, bottles like this survived in private cellars, shared
    cautiously among those who still remembered how to celebrate.
  takeable: true
  food_value: 4
  morale_restore: 14
  culture: western
  rarity: common
- id: water
  name: a canteen of water
  description: A clear glass bottle filled with water from a public tap. The glass
    is warm from the hand that carried it. In Shanghai, clean water was a privilege
    Most residents boiled theirs from wells or bought it from vendors who hauled
    it through the streets in wooden buckets.
  takeable: true
  food_value: 8
  morale_restore: 3
  culture: universal
  rarity: common
- id: dried_fruit
  name: a pouch of dried fruit
  description: A handful of dried apricots and dates, compressed into a sticky mass
    and wrapped in a broad leaf. The fruit was dried on woven bamboo mats in the autumn
    sun, then stored for the winter months when fresh produce was scarce.
  takeable: true
  food_value: 14
  morale_restore: 9
  culture: universal
  rarity: common
- id: chocolate
  name: a bar of chocolate
  description: A small bar of dark chocolate wrapped in waxed paper. The paper is
    printed with the name of a Swiss company and a price in French francs. Chocolate
    was a luxury in occupied Shanghai, available only in foreign-run shops and on
    the black market.
  takeable: true
  food_value: 10
  morale_restore: 16
  culture: universal
  rarity: uncommon
- id: noodle_bowl
  name: a bowl of hot noodles
  description: Thick wheat noodles sit in a steaming broth darkened with soy and
    scallion oil. The bowl warms both hands at once, the sort of small comfort a
    night worker buys before curfew empties the street.
  takeable: true
  food_value: 35
  morale_restore: 8
  culture: chinese
  rarity: common
- id: steamed_dumplings
  name: a plate of steamed dumplings
  description: A bamboo steamer basket containing four dumplings, their wrappers translucent
    with steam. Each is pleated by hand in a style that marks its maker's regional
    origin. The vinegar dipping sauce is served in a tiny porcelain dish.
  takeable: true
  food_value: 30
  morale_restore: 5
  culture: chinese
  rarity: common
- id: vegetable_stew
  name: a bowl of vegetable stew
  description: Root vegetables have been cooked slowly with ginger, greens, and a
    little bean paste until the broth turns cloudy. There is no meat in it, but the
    vendor has cut the carrots thick to make the bowl look generous.
  takeable: true
  food_value: 40
  morale_restore: 10
  culture: chinese
  rarity: common
- id: dried_meat_jerky
  name: a strip of dried meat jerky
  description: A strip of dark, dried meat, rubbed with salt and Sichuan pepper. The
    surface is scored with shallow cuts where the marinade penetrated. Jerky like
    this sustained travellers on journeys through territories where a hot meal meant
    drawing attention.
  takeable: true
  food_value: 20
  morale_restore: 4
  culture: universal
  rarity: common
- id: herbal_tea
  name: a cup of herbal tea
  description: A twist of brown paper containing dried chrysanthemum petals and goji
    berries. The paper is tied with coarse string. Herbal remedies like this were
    sold by street vendors who learned their craft from generations of family knowledge.
  takeable: true
  food_value: 5
  morale_restore: 15
  culture: chinese
  rarity: common
- id: rice_wine_flask
  name: a flask of rice wine
  description: A glazed ceramic flask with a narrow neck and a cork stopper. The glaze
    has crackled with age, and a thin layer of sediment coats the bottom. Rice wine
    was distilled in small batches throughout the Yangtze delta, each batch bearing
    the character of its maker.
  takeable: true
  food_value: 5
  morale_restore: 20
  culture: chinese
  rarity: uncommon
- id: black_bread
  name: a loaf of black bread
  description: A rough loaf of dark rye bread, dense and slightly sour. The crust
    is dusted with coarse flour. This bread was common among the Russian emigre community
    that settled in Shanghai after the revolution, sold in bakeries along Avenue Joffre.
  takeable: true
  food_value: 30
  morale_restore: 3
  culture: western
  rarity: common
- id: ccp_pamphlet
  name: a banned resistance pamphlet
  description: 'A folded sheet of rice paper, printed with crude ink. The text describes
    Japanese atrocities in Nanjing: the massacres, the looting, the systematic terror
    inflicted on civilians.'
  takeable: true
  readable_text: PEOPLE OF SHANGHAI! The Japanese imperialists murder our families,
    steal our land, and enslave our workers. In Nanjing they slaughtered hundreds
    of thousands. Women, children, the elderly, none were spared. But we will not
    bow. The resistance grows. Every act of defiance brings liberation closer. Distribute
    this paper. Tell the truth. The people's strength is in their numbers and their
    anger.
  rarity: common
- id: code_book
  base_cost: 45
  name: a leather-bound code book
  description: A small book with worn leather covers, filled with columns of numbers,
    characters, and pencilled corrections. The pages are thumbed at the corners,
    suggesting several hands have used it quickly and returned it before dawn.
  takeable: true
  readable_text: 'The pages contain cipher tables: each number corresponds to a character,
    each column to a day of the month. Without the matching key, the messages are
    gibberish. With it, they are a lifeline.'
  rarity: common
- id: smuggled_pistol
  base_cost: 80
  name: a smuggled Mauser C96 pistol
  description: A battered but functional pistol, its serial numbers filed off. The
    wooden stock is carved with a small five-pointed star, the mark of the underground.
  takeable: true
  rarity: common
- id: japanese_travel_pass
  base_cost: 45
  name: a forged Japanese travel pass
  description: An official-looking travel pass stamped with the puppet government's
    seal and folded along the line of a coat pocket. The ink is strong, the paper
    too clean, and the holder's photograph has been trimmed with a nervous blade.
  takeable: true
  rarity: common
- id: medical_kit
  name: a field medical kit
  description: A cloth roll containing bandages, a bottle of iodine, a needle and
    thread for sutures, and a small bottle of precious quinine pills stolen from a
    Japanese military pharmacy.
  takeable: true
  food_value: 0
  morale_restore: 5
  rarity: common
- id: worn_medical_kit
  name: a worn medical kit
  description: A weathered medical kit with frayed bandages and half-empty bottles.
    The quinine is mostly gone, but the iodine and sutures remain. Doctor Li will
    know how to use what is left.
  takeable: true
  food_value: 0
  morale_restore: 3
  rarity: common
- id: quinine_bottle
  base_cost: 45
  name: a bottle of quinine pills
  description: A small brown bottle containing quinine, worth more than gold in occupied
    Shanghai where malaria spreads through the starving population while the Japanese
    hoard medicine for their own troops.
  takeable: true
  food_value: 0
  morale_restore: 10
  rarity: common
- id: resistance_map
  base_cost: 50
  name: a hand-drawn operations map
  description: A map of Shanghai drawn on the back of a tea shop menu. Red marks show
    Japanese patrol routes, blue marks indicate underground safe houses, and circled
    areas mark targets for future operations.
  takeable: true
  readable_text: 'The map shows Japanese patrol routes through the International Settlement
    with precise timing. Three supply convoy routes are marked with dates. A note
    in the corner reads: ''The weapons shipment arrives Tuesday. Be ready.'''
  rarity: common
- id: kempeitai_uniform
  name: a stolen Kempeitai uniform
  description: A military police tunic and trousers, brushed clean but still creased
    at the elbows from another man's posture. The collar tabs are intact, and the
    cloth carries tobacco, sweat, and the sharp soap used in barracks laundry.
  takeable: true
  disguise_id: japanese_officer
  rarity: common
- id: rice_parcel
  name: a parcel of smuggled rice
  description: A cloth-wrapped bundle tied with twine. The fabric is patched in three
    places, suggesting it has been reused many times. Parcels like this moved through
    underground networks, carrying food to families cut off from market supplies by
    the occupation.
  takeable: true
  food_value: 40
  morale_restore: 15
  culture: chinese
  rarity: common
  readable_text: The cloth is stencilled with a shipping mark from a relief organisation.
    The contents have been repacked at least twice, each layer of wrapping signed
    off by different hands.
- id: chungking_broadcast
  name: a transcription of a Chungking radio broadcast
  description: A typed sheet containing the latest broadcast from Free China's radio
    station in Chungking. The announcer speaks of resistance, unity, and the certainty
    that the occupation will end.
  takeable: true
  readable_text: 'VOICE OF FREE CHINA: To our brothers and sisters in occupied Shanghai.
    You are not forgotten. Your suffering is seen. Your resistance is felt. The Japanese
    war machine bleeds from a thousand cuts inflicted by your courage. Hold fast.
    Liberation comes. The people''s will cannot be broken.'
  rarity: common
- id: mauser_c96
  base_cost: 60
  name: a Mauser C96 pistol
  description: A battered but functional pistol with its serial numbers filed down
    to pale scars in the metal. The wooden stock has been darkened by sweat and oil,
    with a small five-pointed star carved where a soldier's hand would cover it.
  takeable: true
  is_weapon: true
  weapon_type: firearm
  courage_bonus: 15
  durability: 50
  max_durability: 50
  mod_slots:
  - silencer
  - stabilizer
  rarity: common
- id: wooden_club
  base_cost: 30
  name: a wooden club
  description: A stout piece of lumber, wrapped in cloth at the grip. Silent and effective
    in close quarters.
  examine_text: Coal has settled into the grain from nights on the dock, where a watchman held the club low and listened for boots.
  examine_provenance:

- id: dilemma_ccp_informant
  title: Visit the Shopkeeper's Lane
  description: 'A shopkeeper named Old Man Zhang seems to know things he should not. Three men from his Old City lane have been taken in the past week. Go to his lane after dark. The Nationalists are watching him too, and his neighbours have begun to avoid his doorway.'
  faction: ccp
  min_trust: 30
  giver_npc_hint: lao_peng
  dilemma_group: informant_old_zhang

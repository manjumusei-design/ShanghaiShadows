  expires_days: 6
- id: dilemma_gmd_intel
  title: Collect the Patrol Roster for the Republic
  description: A Kempeitai officer's briefcase contains patrol schedules the Nationalist resistance needs. Collect the roster and deliver it to Captain Chen before the schedules grow stale. The Communists want the same paper, while clerks in the garrison keep changing the locks.

    trust:
      gmd.spy: 15
    morale_restore: 5
  expires_days: 7
- id: dilemma_ccp_supplies
  title: Collect Supplies for the Underground
  description: 'A crate of confiscated supplies sits in a dock warehouse under light guard. The CCP underground needs medicine and food for its hidden safehouses. Collect the crate and deliver it to Teacher Chen. The Nationalists are watching the same warehouse, while the dock families still wait for their rice.'
  faction: ccp
  min_trust: 30
  giver_npc_hint: ccp_contact_teacher
  dilemma_group: supplies_dock_warehouse
  objectives:

  title: Collect the Weapons for the Republic
  description: A cache of smuggled pistols sits in a French Concession basement, waiting for the right buyer. Collect three smuggled pistols and deliver one to Captain Chen before the shutters open. The Communists are moving on the same target.
  faction: gmd
  min_trust: 35
  giver_npc_hint: captain_chen

- id: dilemma_ccp_defector
  title: Visit the Translator's Old City Stop
  description: 'A translator who works for the garrison has been asking questions about the Old City. He says he wants to visit a sick aunt, but the garrison translator has no aunt there. Go to the Old City stop before someone else reaches it.'
  faction: ccp
  min_trust: 30
  giver_npc_hint: lao_peng
  dilemma_group: defector_kempeitai_translator
  objectives:

    influence:
      gmd: 4
    morale_restore: 8
    cross_faction_penalty:
      ccp.organizer: -12
  expires_days: 7
- id: dilemma_ccp_refugees
  title: Visit the Refugees' Two Shelters
  description: A dozen refugees from the north are trapped in a warehouse, hiding from Japanese roundups. Go to the dock warehouse and the Old City safehouse. The Nationalists want them for labour in their camps, while the river wind carries the dock whistles through their shelter.

  expires_days: 7
- id: dilemma_gmd_supplies
  title: Collect Supplies for the Republic
  description: 'A crate of confiscated supplies sits in a dock warehouse under light guard. The Nationalist resistance needs it to arm and feed its men. Collect the crate and deliver it to Captain Chen. The Communists are circling the same warehouse, and the dock families still wait for their rice.'

- id: dilemma_gmd_informant
  title: Visit the Shopkeeper for the Republic
  description: 'Old Man Zhang, a shopkeeper, seems to have customers who are not buying what he sells. Someone from the garrison visits him every Tuesday. Go to his Old City lane. The Communists are watching him too, and the old man''s doorway has grown quiet.'
  faction: gmd
  min_trust: 30
  giver_npc_hint: madam_xu

- id: dilemma_ccp_weapons
  title: Visit the Hidden Pistol Cache
  description: Word in the French Concession is that a crate of old Mauser pistols sits in a basement, left behind by someone who fled the city in a hurry. Go to the basement, collect one smuggled pistol, and deliver it to Teacher Chen before another buyer reaches it.

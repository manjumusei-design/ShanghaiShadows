- id: dilemma_gmd_defector
  title: Visit the Garrison Translator's Market
  description: A translator from the garrison has been visiting the Old City market more often than his duties require. Go to the market. Major Tang has noticed his repeated calls among the shopkeepers, beneath the awnings where the ration queues thicken by noon.
  faction: gmd
  min_trust: 30
  giver_npc_hint: madam_xu
  dilemma_group: defector_kempeitai_translator
  objectives:
  - type: visit_room
    target: old_city_market
    count: 1

missions:
- id: collect_intel_01
  title: Find the New Patrol Route
  description: Captain Ishikawa has changed the patrol tables, and the Old City rickshaw men are already losing fares to new checkpoints. Find the folded patrol route before it reaches the wrong desk. Liu Wei knows its streets may decide which passengers get home.
  faction: ccp
  min_trust: 30
  giver_npc_hint: liu_wei
  objectives:
  - type: collect_item
    target: patrol_route
    count: 1
    current: 0
  rewards:
    money_fabi: 25
    trust:
      ccp.guerrilla: 10
  expires_days: 7
- id: eliminate_informer_01
  title: Visit the Stall That Talks Too Much
  description: Vendor Lin talks to everyone who passes his stall, including men whose boots leave the market quieter afterward. Go to his commercial-district stall, where military yen changes hands beneath the market noise. The neighborhood has begun to avoid the doorway.
  faction: civilian
  min_trust: 20
  giver_npc_hint: madam_xu
  objectives:
  - type: visit_room
    target: commercial_03
    count: 1
    current: 0
  rewards:
    money_fabi: 20
    trust:
      civilian.resident: 10
  expires_days: 7
- id: deliver_medicine_01
  title: Deliver Morphine to Dr. Zhao
  description: 'Dr. Zhao has patients lying behind screens with fever cloths over their mouths, and his morphine shelf is nearly bare. Collect a vial of contraband morphine and deliver it to Dr. Zhao. The medicine is not politics to the wounded; it may buy one night of sleep before the next patrol comes through Hongkou.'
  faction: civilian
  min_trust: 20
  giver_npc_hint: dr_zhao
  objectives:
  - type: collect_item
    target: contraband_morphine
    count: 1
    current: 0
  - type: deliver_to_npc
    target: dr_zhao
    item: contraband_morphine
    count: 1
    current: 0
  rewards:
    money_fabi: 15
    trust:
      civilian.resident: 10
      ccp.guerrilla: 5
    health_restore: 10
  expires_days: 10
- id: ccp_leaflet_run
  title: Collect Leaflets and Visit the Tea House
  description: The underground press has fresh leaflets, but paper is useless if it never leaves the hand press. Collect three bundles, then visit the tea house. Kempeitai raids on reading circles have made even cheap ink dangerous.
  faction: ccp
  min_trust: 25
  giver_npc_hint: ccp_contact_teacher
  objectives:
  - type: collect_item
    target: leaflet_bundle
    count: 3
    current: 0
  - type: visit_room
    target: tea_house
    count: 1
    current: 0
  rewards:
    money_fabi: 15
    trust:
      ccp.guerrilla: 12
    morale_restore: 5
  expires_days: 7
- id: ccp_intercept_communique
  title: Return to the Refugee Checkpoint
  description: The occupation authorities have moved the old patrol hours, and families who trusted yesterday's route are being stopped after curfew. Go to the refugee checkpoint twice. Lao Peng wants rice carriers to know where the barriers stand, not to gamble on yesterday's habits.
  faction: ccp
  min_trust: 30
  giver_npc_hint: lao_peng
  objectives:
  - type: visit_room
    target: refugee_entry_checkpoint
    count: 2
    current: 0
  rewards:
    money_fabi: 20
    trust:
      ccp.organizer: 10
    morale_restore: 5
  expires_days: 7
- id: ccp_safehouse_supply
  title: Find Rice Near the Hidden Room
  description: A sack of rice waits at the rendezvous point, and the hidden safehouse beneath the Old City is counting grains by lamplight. Collect it, then go to the hidden room before evening inspection tightens the lanes. The people sheltering there are not symbols; they are hungry, frightened, and still Chinese.
  faction: ccp
  min_trust: 20
  giver_npc_hint: tea_seller_dead_drop
  objectives:
  - type: collect_item
    target: rice_parcel
    count: 1
    current: 0
  - type: visit_room
    target: hidden_05
    count: 1
    current: 0
  rewards:
    money_fabi: 10
    trust:
      ccp.guerrilla: 10
    health_restore: 5
  expires_days: 6
- id: ccp_recruit_student
  title: Visit the University After Dark
  description: Slogans have appeared on university walls three mornings in a row, written in cheap ink by a hand too young to fear enough. Go to the university before the Kempeitai close their hands around another student. The fresh walls carry more courage than the street can safely admit.
  faction: ccp
  min_trust: 20
  giver_npc_hint: ccp_contact_teacher
  objectives:
  - type: visit_room
    target: university
    count: 1
    current: 0
  rewards:
    money_fabi: 10
    trust:
      ccp.organizer: 10
    morale_restore: 5
  expires_days: 10
- id: ccp_rescue_prisoner
  title: Visit Hongkou Detention
  description: A printer from the commercial district vanished after a street check, leaving his wife outside Hongkou detention with bread no guard will deliver. Go to the detention building. The cell and his family are left with the same hard silence.
  faction: ccp
  min_trust: 30
  giver_npc_hint: lao_peng
  objectives:
  - type: visit_room
    target: hongkou_detention
    count: 1
    current: 0
  rewards:
    money_fabi: 20
    trust:
      ccp.organizer: 15
    health_restore: 5
    add_item: testimony_printer_sister
  expires_days: 7
- id: ccp_smuggle_medicine
  title: Move the Doctor's Kit
  description: 'Doctor Li is short of gauze, iodine, and anything strong enough to quiet a wounded man. Collect the medical kit from Bubbling Well Road and deliver it to him. A searched bag would condemn the doctor, his patients, and the Old City house that hides them.'
  faction: ccp
  min_trust: 30
  giver_npc_hint: tea_seller_dead_drop
  objectives:
  - type: collect_item
    target: medical_kit
    count: 1
    current: 0
  - type: deliver_to_npc
    target: underground_doctor_li
    item: medical_kit
    count: 1
    current: 0
  rewards:
    money_fabi: 20
    trust:
      ccp.guerrilla: 12
    health_restore: 15
  expires_days: 8
- id: ccp_gather_intel
  title: Ask the Street for Patrol Hours
  description: The Kempeitai patrols have shifted around the French Concession, and the underground is blind where it once had habits. Speak to a rickshaw puller, a noodle vendor, and a bar girl, each of whom sees a different uniform pass. Their memories are all the street has left.
  faction: ccp
  min_trust: 25
  giver_npc_hint: ccp_contact_teacher
  objectives:
  - type: talk_to_npc
    target: rickshaw_puller_ah_foo
    count: 1
    current: 0
  - type: talk_to_npc
    target: noodle_vendor_wu
    count: 1
    current: 0
  - type: talk_to_npc
    target: bar_girl_suyin
    count: 1
    current: 0
  rewards:
    money_fabi: 25
    trust:
      ccp.guerrilla: 15
    morale_restore: 5
  expires_days: 9
- id: ccp_sabotage_dock
  title: Walk the Warehouse Edge
  description: Military cargo moves through the Huangpu docks at night, under lamps that make porters look guilty even when their hands are empty. Visit the dock warehouse. The cargo and its guards have made the waterfront a place civilians avoid.
  faction: ccp
  min_trust: 30
  giver_npc_hint: lao_peng
  objectives:
  - type: visit_room
    target: dock_warehouse
    count: 1
    current: 0
  rewards:
    money_fabi: 25
    trust:
      ccp.organizer: 12
    morale_restore: 8
  expires_days: 7
  offer_hours:
  - 0
  - 1
  - 2
  - 3
  - 4
  - 5
- id: ccp_protect_courier
  title: Visit the Courier's Two Stops
  description: A courier works between the Old City and a French Concession safehouse, with coded messages under ordinary cloth. Go to the market and then the safehouse. If he falls, addresses, kitchens, and families fall with him.
  faction: ccp
  min_trust: 35
  giver_npc_hint: ccp_contact_teacher
  objectives:
  - type: visit_room
    target: old_city_market
    count: 1
    current: 0
  - type: visit_room
    target: french_concession_safehouse
    count: 1
    current: 0
  rewards:
    money_fabi: 30
    trust:
      ccp.guerrilla: 18
    health_restore: 5
    morale_restore: 8
  expires_days: 6
- id: ccp_destroy_radio
  title: Visit the Hongkou Radio Post
  description: A strong signal has been heard from a Hongkou tenement where neighbours keep windows shut after dark. Go to the radio post. A foolish raid would only give the Kempeitai new names and another excuse to search.
  faction: ccp
  min_trust: 35
  giver_npc_hint: lao_peng
  objectives:
  - type: visit_room
    target: kempeitai_radio_post_hongkou
    count: 1
    current: 0
  rewards:
    money_fabi: 25
    trust:
      ccp.organizer: 15
    influence:
      ccp: 4
    morale_restore: 10
  expires_days: 7
- id: gmd_weapons_manifest
  title: Recover the Dock Manifest
  description: A shipping manifest naming Japanese arms shipments has slipped loose in the warehouse district, where hungry porters know paper can be worth more than rice. Find it before the harbour locks down. Captain Chen wants the route, the cargo, and the chance to choose a disciplined response.
  faction: gmd
  min_trust: 30
  giver_npc_hint: captain_chen
  objectives:
  - type: collect_item
    target: dock_manifest
    count: 1
    current: 0
  - type: visit_room
    target: warehouse_district
    count: 1
    current: 0
  rewards:
    money_fabi: 30
    trust:
      gmd.spy: 15
    morale_restore: 5
  expires_days: 8
- id: gmd_establish_contact
  title: Speak With Inspector Moreau
  description: Inspector Moreau will not declare himself for the Republic, but the GMD wants you to speak with him in the French Concession. Approach him without theatre. A friendly police desk can save couriers from paperwork, delay, and the wrong officer's curiosity.
  faction: gmd
  min_trust: 35
  giver_npc_hint: madam_xu
  objectives:
  - type: talk_to_npc
    target: inspector_moreau
    count: 1
    current: 0
  rewards:
    money_fabi: 20
    trust:
      gmd.spy: 18
    morale_restore: 10
  expires_days: 7
- id: gmd_supply_network
  title: Visit the Republic's Safehouses
  description: Three GMD safehouses have not seen proper food in weeks, and a hungry operative makes mistakes that soldiers can smell. Collect the food parcels, then go to the Old City, French Concession, and Bund safehouses before the rice spoils. Discipline is harder on an empty stomach.
  faction: gmd
  min_trust: 25
  giver_npc_hint: captain_chen
  objectives:
  - type: collect_item
    target: food_parcel
    count: 3
    current: 0
  - type: visit_room
    target: gmd_safehouse_old_city
    count: 1
    current: 0
  - type: visit_room
    target: gmd_safehouse_french_concession
    count: 1
    current: 0
  - type: visit_room
    target: gmd_safehouse_bund
    count: 1
    current: 0
  rewards:
    money_fabi: 35
    trust:
      gmd.spy: 15
    health_restore: 10
  expires_days: 10
- id: gmd_intercept_report
  title: Visit the Sergeant's Bar
  description: 'A Japanese sergeant drinks in an International Settlement bar, where a report on garrison strength sits close to his uniform. Go to the bar. The Republic needs figures, but a public scene would cost more than the paper in the nearest Old City queue.'
  faction: gmd
  min_trust: 40
  giver_npc_hint: madam_xu
  objectives:
  - type: visit_room
    target: international_settlement_bar
    count: 1
    current: 0
  rewards:
    money_fabi: 25
    trust:
      gmd.spy: 20
    morale_restore: 5
  expires_days: 6
- id: gmd_rescue_pilot
  title: Visit the Hongkou Ruins
  description: A plane came down over Hongkou in the night, and by morning the search parties were already asking children about parachute cloth. Go to the ruins. A child's scrap of parachute cloth may be all the neighbourhood has seen.
  faction: gmd
  min_trust: 25
  giver_npc_hint: captain_chen
  objectives:
  - type: visit_room
    target: hongkou_ruins
    count: 1
    current: 0
  rewards:
    money_fabi: 25
    trust:
      gmd.spy: 12
    health_restore: 5
    morale_restore: 5
    add_item: testimony_gmd_requisition
  expires_days: 5
- id: gmd_counter_intel
  title: Speak With Merchant Sato
  description: Merchant Sato sells silk with one hand and names with the other. Speak with him in his shop, where Kempeitai customers come for fabric and leave with more than they paid for. Clerks promoted by cleverness have a way of making neighbours disappear.
  faction: gmd
  min_trust: 35
  giver_npc_hint: madam_xu
  objectives:
  - type: talk_to_npc
    target: merchant_sato
    count: 1
    current: 0
  rewards:
    money_fabi: 30
    trust:
      gmd.spy: 18
    morale_restore: 8
    add_item: testimony_kmt_arrest
  expires_days: 8
- id: gmd_secure_route
  title: Visit the Northern Checkpoints
  description: A corridor from the northern warehouses to the southern docks may soon carry people who cannot afford a second mistake. Go to the north gate, Soochow Creek, Garden Bridge, and south-docks checkpoints. The route is made of barriers, lamps, and people who cannot afford a second mistake.
  faction: gmd
  min_trust: 30
  giver_npc_hint: captain_chen
  objectives:
  - type: visit_room
    target: checkpoint_north_gate
    count: 1
    current: 0
  - type: visit_room
    target: checkpoint_soochow_creek
    count: 1
    current: 0
  - type: visit_room
    target: checkpoint_garden_bridge
    count: 1
    current: 0
  - type: visit_room
    target: checkpoint_south_docks
    count: 1
    current: 0
  rewards:
    money_fabi: 40
    trust:
      gmd.spy: 20
    morale_restore: 10
  expires_days: 12
- id: gmd_liberate_supplies
  title: Collect the Confiscated Crate
  description: Rice and medicine seized from Shanghai families now sit in a dock warehouse under light guard. Go to the warehouse and collect the confiscated supplies. The supplies belong to the city; the Republic's claim means little unless hungry people see some of it returned.
  faction: gmd
  min_trust: 35
  giver_npc_hint: captain_chen
  objectives:
  - type: visit_room
    target: dock_warehouse
    count: 1
    current: 0
  - type: collect_item
    target: confiscated_supplies
    count: 1
    current: 0
  rewards:
    money_fabi: 35
    trust:
      gmd.spy: 15
      civilian.resident: 10
    health_restore: 10
  expires_days: 7
- id: gmd_diplomatic_courier
  title: Carry the Pouch to the Consulate
  description: 'A sealed pouch from Chungking must reach Monsieur Renault at the French Consulate in the French Concession. Collect it and deliver it to him. Foreign sympathy is fragile, but a paper delivered on time can still move a concession door that soldiers cannot.'
  faction: gmd
  min_trust: 40
  giver_npc_hint: madam_xu
  objectives:
  - type: collect_item
    target: diplomatic_pouch
    count: 1
    current: 0
  - type: deliver_to_npc
    target: diplomat_renault
    item: diplomatic_pouch
    count: 1
    current: 0
  rewards:
    money_fabi: 50
    trust:
      gmd.spy: 25
    influence:
      gmd: 5
    morale_restore: 15
  expires_days: 6
- id: gmd_assassinate_informant
  title: Visit Rat-Face Xiao's Haunt
  description: 'Rat-Face Xiao has been seen meeting soldiers behind a gambling room, always after the lamps are lowered. Go to the Old City room where he has been seen. If he is selling names, Captain Chen has cause to fear what follows.'
  faction: gmd
  min_trust: 30
  giver_npc_hint: madam_xu
  objectives:
  - type: visit_room
    target: oldcity_05
    count: 1
    current: 0
  rewards:

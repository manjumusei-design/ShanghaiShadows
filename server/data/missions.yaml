  expires_days: 7
- id: dilemma_ccp_intel
  title: Collect the Patrol Roster for the Underground
  description: A Kempeitai officer's briefcase contains a roster of patrol schedules for the next month. The CCP underground cell needs the paper. Collect the roster and deliver it to Teacher Chen. The Nationalists want the same schedules for a different purpose.

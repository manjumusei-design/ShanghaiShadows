rooms:
  # Bund district
  - id: bund_dawn
    safe_room: true
    dawn_desc: "The first light catches the river mist, turning it gold and grey while sampans drift past like ghosts."
    day_desc: "River mist drifts around bollards and broken reflections while clerks hurry by with their collars turned up."
    dusk_desc: "The embankment settles into amber shadows as lanterns flicker on and the river takes on a metallic sheen."
    night_desc: "The Bund sleeps under military quiet, broken only by patrol boots and the lapping of black water."
    rain_desc: "Rain sweeps across the Bund in grey sheets, turning the promenade into a river of reflections while sampans rock at their moorings."
    spring_desc: "Cherry blossoms from the Japanese concession drift across the Bund, a fragile beauty against the grey occupation."
    summer_desc: "Heat shimmers off the Huangpu. Even the sampan boatmen have retreated under awnings, fanning themselves in the oppressive humidity."
    autumn_desc: "Fog rolls in thick from the river, muffling sounds and swallowing the far end of the promenade in a damp grey blanket."
    winter_desc: "Frost glazes the cobblestones and your breath clouds the air. A bitter wind cuts across the Bund, and the sampans sit still in the frozen river."
    hints:
      - "The sampans moored here sometimes carry cargo besides fish. A careful passenger may cross the river among it."
      - "A faded poster on a nearby wall lists curfew times for the district."
      - "Faint chalk marks score the stone railing. Someone is counting the days."
    search_signal: "stone railing"
    search_item: search_placeholder_bund_dawn
  - id: bund_05
    safe_room: true
  - id: bund_10
    day_desc: "Rickshaws cluster near the promenade entrance, drivers calling for passengers in the midday bustle."
    dusk_desc: "The rickshaw drivers grow fewer as shadows lengthen, their calls more urgent before curfew."
    night_desc: "Only one or two rickshaws remain, drivers huddled against the cold, waiting for desperate passengers."

  # Commercial district
  - id: nanjing_road
    safe_room: true
    day_desc: "Nanjing Road teems with shoppers, hawkers, and foreign merchants under the buzz of neon signs."
    dusk_desc: "The great department stores dim their lights as the street empties, merchants pulling shutters with practiced haste."
    night_desc: "Nanjing Road lies silent under curfew, its famous neon dark, only patrol searchlights sweeping the pavement."
    rain_desc: "Rain streaks the neon signs into rivers of colour, the famous shopping street reduced to blurred reflections and hurrying silhouettes."
  - id: commercial_04
    safe_room: true
    dawn_desc: "Shopkeepers sweep their storefronts as the first customers appear, the street slowly waking from its wartime slumber."
    day_desc: "Merchants call their wares in the busy street, competing with the noise of rickshaws and military trucks."
    dusk_desc: "Shutters roll down one by one as merchants close early to beat the curfew patrols."
    night_desc: "The commercial street sleeps under martial law, darkened shop windows reflecting patrol lanterns."
    rain_desc: "Rain drives shoppers under awnings and into tea houses, the street empty except for puddles and the occasional military patrol."
  - id: checkpoint_soochow_creek
    safe_room: true
    dawn_desc: "Checkpoint guards yawn over their rifles, the first light revealing a queue of early travelers."
    day_desc: "A military checkpoint controls traffic between districts, soldiers checking papers with studied suspicion."
    dusk_desc: "The checkpoint soldiers grow more vigilant as darkness falls, their questions longer and their patience shorter."
    night_desc: "The checkpoint is closed to civilians, but whispered passwords might still grant passage."
  - id: venue_commercial_office_district
    safe_room: true
    dawn_desc: "Delivery boys race through the awakening street, fresh newspapers tucked under their arms."
    day_desc: "Office workers crowd the tea houses and noodle stalls, grabbing quick meals between errands."
    dusk_desc: "The last clerks hurry home through lengthening shadows, briefcases clutched tight against pickpockets."
    night_desc: "The office district empties completely, leaving only patrol footsteps and the hum of distant generators."
  - id: venue_commercial_market_stalls
    safe_room: true
    dawn_desc: "Market stalls begin to open, vendors arranging their goods in the grey pre-dawn light."
    day_desc: "A busy commercial lane where merchants haggle and spies pretend not to listen."
    dusk_desc: "Vendors pack unsold goods into carts, some throwing leftover produce to waiting street children."
    night_desc: "The market stalls are gone, the street swept clean, only the smell of cooking oil lingering."
  - id: venue_commercial_arcade
    safe_room: true
    dawn_desc: "The grand arcade awakens slowly, shopkeepers dusting displays while the street outside stirs to life."
    day_desc: "An upscale shopping arcade where foreign goods fetch foreign prices, and questions about provenance are impolite."
    dusk_desc: "Wealthy shoppers hurry to their cars, leaving the arcade to the evening sweepers."
    night_desc: "The arcade gates are locked, a lone security guard patrolling with a flashlight and a yawn."

  # Old City
  - id: oldcity_03
    safe_room: true
    dawn_desc: "Pre-dawn shadows cling to narrow alleys as a few early risers begin their daily struggle."
    day_desc: "The old city carries on with trade and quiet bargains, every stall watched for more than its vegetables."
    dusk_desc: "The labyrinthine streets grow treacherous as lamplighters fail to reach the deeper alleys."
    night_desc: "The old city sleeps in fragments, some streets patrolled, others abandoned to shadow and rumor."
    rain_desc: "Rain turns the old city's alleys into streams, the ancient stones slick and treacherous while vendors scramble to cover their wares."
    hints:
      - "A rickshaw puller here knows which teahouses will hide a traveller for an hour."
      - "Someone has cut tally marks into the old well. Six days have passed since the last raid."
    search_signal: "old well"
    search_item: search_placeholder_old_well
  - id: oldcity_06
    safe_room: true
    nurse_available: true
    nurse_hours: [8, 18]
    day_desc: "A small clinic treats those who can pay, or those too desperate to risk a question."
    dusk_desc: "The clinic's doors close as the nurse prepares for night, her supplies running low."
    night_desc: "The clinic is dark and locked, a faded Red Cross barely visible in the gloom."
  - id: venue_old_city_tea_intersection
    safe_room: true
    dawn_desc: "Tea merchants sweep their storefronts, the first pot already brewing for early customers."
    day_desc: "A bustling intersection of tea houses and back-room deals, where conversations fade when soldiers pass."
    dusk_desc: "Tea houses empty as patrons rush home before curfew, leaving cups half-finished on checkered cloths."
    night_desc: "The tea houses are shuttered, their lanterns dark, the street given over to rats and whispers."
  - id: venue_old_city_residential_lane
    safe_room: true
    dawn_desc: "The old city wakes slowly, shutters creaking open to reveal another day of survival."
    day_desc: "A narrow residential lane where laundry lines cross overhead and neighbors exchange coded glances."
    dusk_desc: "Mothers call children indoors, their voices echoing between the close-packed buildings."
    night_desc: "Every door is locked and every window shuttered, but somewhere a radio plays softly behind paper walls."
  - id: venue_old_city_cramped_courtyard
    safe_room: true
    dawn_desc: "Early risers queue at the well, sharing whispers about last night's disappearances."
    day_desc: "A cramped courtyard where families pretend not to notice the stranger sleeping in the corner."
    dusk_desc: "Cooking fires are lit in doorways, the smell of rice and cabbage filling the close air."
    night_desc: "The courtyard is dark and silent, but occasional footsteps suggest not everyone sleeps."
  - id: venue_old_city_market_street
    safe_room: true
    dawn_desc: "Laborers gather at the street corner, waiting for work or news. Often they amount to the same thing."
    day_desc: "A busy market street where anything can be bought if you know the right vendor."
    dusk_desc: "Market stalls collapse like theaters striking sets, the day's commerce packed into carts and bundles."
    night_desc: "The market street holds only debris: squashed fruit, a lost shoe, and the smell of the day's trade."

  # French Concession
  - id: venue_french_boulevard
    safe_room: true
    dawn_desc: "Expatriate joggers navigate the broad boulevards, pretending the occupation hasn't changed anything."
    day_desc: "Tree-lined boulevards where foreign cars purr past Art Deco apartment blocks, insulated from the city's desperation."
    dusk_desc: "Café patrons settle their bills with inflated fabi, the exchange rate always favoring the foreign."
    night_desc: "The French Concession sleeps under its own rules, its streets quieter under a silence bought by privilege."
  - id: french_06
    safe_room: true
    dawn_desc: "Servants begin their work in the grand apartments, invisible in the pre-dawn grey."
    day_desc: "A residential boulevard where Western-style apartments hide Eastern-style secrets behind their shutters."
    dusk_desc: "Lights flicker on in elegant windows, but curtains are drawn quickly against the darkening street."
    night_desc: "The boulevard is empty but for a few foreign cars, their headlights sweeping the quiet pavement."
  - id: venue_french_cafe_boulevard
    safe_room: true
    dawn_desc: "The jazz club sleeps behind closed doors, last night's smoke still clinging to the curtains."
    day_desc: "A trendy café district where foreign and Chinese elites pretend they don't notice the soldiers at the corner."
    dusk_desc: "The cafés fill with those who can afford to drink their way through the occupation."
    night_desc: "A few exclusive venues remain open behind unmarked doors, their jazz muffled but audible to those who listen."
  - id: venue_shopping_arcade_french
    safe_room: true
    dawn_desc: "The department store's window displays are rearranged by invisible hands before the first shoppers arrive."
    day_desc: "Western goods line the shelves of department stores, their prices marked in fabi and whispered warnings."
    dusk_desc: "Shop assistants fold their displays with practiced efficiency, their smiles fixed until the last customer leaves."
    night_desc: "The department stores are dark, their windows offering only reflections of the empty street."
  - id: residence_02
    safe_room: true
    dawn_desc: "Diplomatic cars line the curb, their engines cold, their purposes hidden."
    day_desc: "An embassy district where questions are not asked and answers are never given freely."
    dusk_desc: "Embassy staff hurry home through darkening streets, briefcases full of secrets or just work."
    night_desc: "The embassies are locked and guarded, their secrets safe behind high walls and higher protocol."
  - id: checkpoint_south_docks
    safe_room: true
    dawn_desc: "Dock workers queue at the checkpoint, their papers checked with sleepy suspicion."
    day_desc: "A checkpoint controlling access to the docks, where cargo is inspected and questions are asked."
    dusk_desc: "The checkpoint soldiers grow more alert as sunset approaches, knowing darkness brings smugglers."
    night_desc: "The checkpoint is officially closed, but bribes have been known to open gates."

  # Hongkou
  - id: venue_hongkou_refugee_clinic
    safe_room: true
    nurse_available: true
    nurse_hours: [8, 18]
    day_desc: "A refugee clinic struggles to serve the overflow, lines stretching around the block."
    dusk_desc: "The clinic staff turn away new patients, their faces drawn with exhaustion."
    night_desc: "The clinic door is barred, but sometimes a light still moves behind the shutters."
  - id: hongkou_08
    safe_room: true
    dawn_desc: "Refugees stir in the shelters, beginning another day of waiting and hoping."
    day_desc: "A crowded refugee district where every doorway holds a family and every wall bears a poster."
    dusk_desc: "Soup kitchens close as food runs out, leaving the hungry to find other means."
    night_desc: "The refugee district sleeps in shifts, some watching for patrols, some watching for thieves."
  - id: university
    safe_room: true
    day_desc: "Students hurry between buildings, some carrying forbidden pamphlets hidden under textbooks."
    dusk_desc: "The university quiets as students slip away, but watchful eyes remain at certain windows."
    night_desc: "The university is shuttered and dark, but whispered debates continue in shadowed dormitories."
  - id: venue_hongkou_field_hospital
    safe_room: true
    nurse_available: true
    nurse_hours: [8, 18]
    dawn_desc: "A temporary hospital in a converted warehouse, its beds already filling with the night's casualties."
    day_desc: "An overcrowded field hospital where doctors choose who to save and who to comfort."
    dusk_desc: "The wounded continue to arrive, their groans mixing with the creak of warehouse timbers."
    night_desc: "The field hospital works by candlelight, doing what can be done without electricity."
  - id: venue_hongkou_factory_floor
    safe_room: true
    dawn_desc: "Factory workers queue at the gates, their papers checked against employment lists."
    day_desc: "A Japanese-controlled factory district where Chinese laborers work under foreign supervisors."
    dusk_desc: "The factory whistles blow, releasing workers to the darkening streets and the curfew ahead."
    night_desc: "The factories are silent, their machinery still, but guards patrol the perimeter with dogs."

  # Church
  - id: church_01
    safe_room: true
  - id: church_05
    safe_room: true
  - id: venue_church_parish_room
    safe_room: true
  - id: venue_church_side_chapel
    safe_room: true
  - id: venue_church_refugee_clinic
    safe_room: true
    nurse_available: true
    nurse_hours: [8, 18]
    day_desc: "A makeshift infirmary in the side chapel tends to those the official clinics refuse."
    dusk_desc: "Candles flicker on the altar as the nurse quietly packs her supplies for the night."
    night_desc: "The church remains open, a few refugees sleeping in the pews under the vigil of silent saints."

  # Residential
  - id: residence_01
    safe_room: true
    day_desc: "Laundry flutters between buildings and neighbors exchange news in hushed tones across narrow courtyards."
    dusk_desc: "Families retreat indoors, shutters closing one by one against the coming night."
    night_desc: "The residential lanes are quiet and dark, every door locked, every window shuttered tight."
  - id: residence_05
    safe_room: true
  - id: venue_residential_clergy_house
    safe_room: true
  - id: venue_residential_tenant_house
    safe_room: true
  - id: venue_residential_courtyard_house
    safe_room: true
  - id: venue_residential_lane_house
    safe_room: true

  # Hidden Shanghai
  - id: hidden_01
    safe_room: true
    tags: [ccp_safehouse]
    day_desc: "A hidden cellar beneath a laundry shop where revolutionaries meet in plainclothes."
    dusk_desc: "The last operatives slip away before curfew, leaving only the smell of stale tobacco and secrecy."
    night_desc: "The cellar is empty now, its entrance disguised beneath piles of soiled linens."
    hints:
      - "A coded message on the wall lists tomorrow's meeting times."
      - "The laundry shop owner can arrange safe passage out of the city, provided the price is met."
      - "Someone left a fresh stack of underground newspapers under the floorboards."
  - id: hidden_05
    safe_room: true
    tags: [ccp_safehouse]
  - id: hidden_10
    safe_room: true
    nurse_available: true
    nurse_hours: [8, 18]
  - id: venue_resistance_training_room
    safe_room: true
  - id: venue_resistance_meeting_room
    safe_room: true
  - id: venue_resistance_press_room
    safe_room: true
  - id: venue_resistance_copy_room
    safe_room: true

  # CCP Base
  - id: venue_resistance_cellar_room
    safe_room: true
    day_desc: "By day, the bare bulb pales against damp limewash, and an ink-stained table carries a chipped teacup beside its candle stubs."
    dusk_desc: "At dusk, the bulb throws a weak circle over the table, while the cellar smells of cold tea, wax, and rainwater in the brickwork."
    night_desc: "At night, candle wax has hardened along the table edge, and the low ceiling holds the stale warmth of bodies that have gone elsewhere."

  # GMD Office
  - id: gmd_office_01
    safe_room: true
    day_desc: "A nondescript office front for Nationalist intelligence, filing cabinets hiding more than paperwork."
    dusk_desc: "Agents burn documents in the back room, the smoke carried away by the evening draft."
    night_desc: "The office is empty, its secrets locked away, but the shadows suggest someone was here recently."


  - id: commercial_05
    hiding_spots: true
  - id: old_city_market
    hiding_spots: true
    spring_desc: "The market stirs with spring trade. Vendors hawk fresh vegetables, and blooming jasmine cuts through the cooking smoke."
    summer_desc: "The market swelters under canvas awnings. Flies buzz around meat stalls and everyone moves slower in the oppressive heat."
    autumn_desc: "Harvest goods overflow the market stalls. Pumpkins and squash pile high, and the air carries the sharp scent of drying herbs."
    winter_desc: "The market is quieter now, with fewer stalls and thinner crowds. Vendors huddle around charcoal braziers while steam rises from noodle pots into the cold air."

  # Hidden exits
  - id: venue_church_altar_room
    hidden_exits:
      - direction: down
        to: venue_hidden_altar_undercroft
        description: "A loose stone behind the altar reveals a narrow staircase descending into darkness."
  - id: venue_church_confessional_room
    hidden_exits:
      - direction: down
        to: venue_hidden_confessional_passage
        description: "Behind the confessional booth, a hidden panel slides open to reveal a damp passage."
  - id: venue_old_city_courtyard_north
    safe_room: true
    hidden_exits:
      - direction: down
        to: venue_hidden_old_city_shrine_floorboard
        description: "Beneath a loose floorboard in the shrine, stone steps spiral down into the earth."
  - id: venue_old_city_back_courtyard
    hidden_exits:
      - direction: west
        to: venue_hidden_old_city_false_wall_chamber
        description: "A false wall in the alley opens onto a tunnel that smells of earth and lamp oil."
  - id: venue_french_apartment_flat
    hidden_exits:
      - direction: down
        to: venue_hidden_french_wardrobe_trapdoor
        description: "Behind a tall wardrobe in the apartment, a trapdoor leads to a hidden cellar."
  - id: venue_french_mirror_apartment
    hidden_exits:
      - direction: east
        to: venue_hidden_mirror_corridor
        description: "An ornate mirror in the hallway swings inward, revealing a concealed corridor."
  - id: venue_residential_coal_chute_house
    hidden_exits:
      - direction: down
        to: venue_hidden_kitchen_coal_chute
        description: "A coal chute in the kitchen floor opens onto a narrow underground passage."
  - id: venue_commercial_printshop
    hidden_exits:
      - direction: south
        to: venue_hidden_printshop_bookshelf_compartment
        description: "A bookshelf in the printshop office slides aside to expose a descending staircase."
  - id: hongkou_06
    hidden_exits:
      - direction: down
        to: venue_hidden_boarding_house_hatch
        description: "Under the boarding house floorboards, a hatch opens into a forgotten tunnel."
  - id: venue_warehouse_crate_storage
    hidden_exits:
      - direction: down
        to: venue_hidden_crate_door_cache
        description: "Behind a stack of old crates, a rusted iron door leads to an underground passage."


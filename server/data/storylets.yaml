storylets:
- id: faction_argument_lead
  social_consequence_only: true
  timer_seconds: 90
  trigger_chance: 1.0
  preconditions: {}
  narrative: "The two men have gone, but an old woman gathering vegetable leaves says their argument began with ration cards and ended with a patrol route neither wished to name."
  options:
  - text: Ask which road the patrol has begun to use.
    effects:
      set_flag: followed_faction_argument_lead
      log_event: You learned a cautious route from the aftermath of a faction argument.
    response_msg: "She names the road only after looking at the lamps, then turns back to her basket."
  - text: Leave the street to its silence.
    effects:
      set_flag: left_faction_argument_lead
    response_msg: "The leaves rustle under her hands, and the street resumes its careful business."
- id: secret_meeting_lead
  social_consequence_only: true
  timer_seconds: 90
  trigger_chance: 1.0
  preconditions: {}
  narrative: "A young courier returns for a dropped matchbox and murmurs that the men who met here were frightened of the curfew, not of one another."
  options:
  - text: Offer to carry the matchbox toward the safer lane.
    effects:
      set_flag: assisted_secret_meeting_lead
      change_trust:
        civilian.resident: 2
      log_event: You helped a courier after a secret meeting.
    response_msg: "The courier accepts with a quick bow and vanishes before the next patrol passes."
  - text: Let the courier retrieve it alone.
    effects:
      set_flag: left_secret_meeting_lead
    response_msg: "He pockets the matchbox and walks away as though he had never stopped."
- id: shared_intel_lead
  social_consequence_only: true
  timer_seconds: 90
  trigger_chance: 1.0
  preconditions: {}
  narrative: "A paper runner pauses by the drain and says the message concerned a checkpoint that has begun searching bags after the evening bell."
  options:
  - text: Ask where the inspection has moved.
    effects:
      set_flag: followed_shared_intel_lead
      log_event: You learned of a changed checkpoint inspection from a shared message.
    response_msg: "The runner names a side street and asks you not to repeat it near the market."
  - text: Tell the runner to keep the warning moving.
    effects:
      set_flag: left_shared_intel_lead
    response_msg: "He nods and folds the warning into his sleeve."
- id: extortion_aftermath_lead
  social_consequence_only: true
  timer_seconds: 90
  trigger_chance: 1.0
  preconditions: {}
  narrative: "After the collector leaves, the stallholder counts the remaining fabi twice and says a neighbour may need warning before the next collection begins."
  options:
  - text: Carry the warning to the neighbouring stall.
    effects:
      set_flag: warned_of_extortion
      change_trust:
        civilian.resident: 2
      log_event: You carried a warning after an extortion collection.
    response_msg: "The stallholder gives no thanks aloud, but places a small bundle of tea leaves in your hand."
  - text: Keep clear of the collector's business.
    effects:
      set_flag: left_extortion_aftermath
    response_msg: "The stallholder lowers the shutter another inch and says nothing more."
- id: rival_intimidation_lead
  social_consequence_only: true
  timer_seconds: 90
  trigger_chance: 1.0
  preconditions: {}
  narrative: "The frightened man waits until the corner is empty, then asks whether the street ahead is clear enough for him to leave without another warning."
  options:
  - text: Point him toward the quieter lane.
    effects:
      set_flag: assisted_rival_intimidation
      log_event: You guided a frightened rival away from a threatened corner.
    response_msg: "He thanks you with a nod and keeps his face turned from the lamps."
  - text: Refuse to involve yourself.
    effects:
      set_flag: left_rival_intimidation
    response_msg: "He waits until the street empties, then chooses his own way."
- id: gang_intimidation_lead
  social_consequence_only: true
  timer_seconds: 90
  trigger_chance: 1.0
  preconditions: {}
  narrative: "A tea boy clearing cups says the two Gang men argued over a name in a warehouse ledger, and that no one near the docks wishes to repeat it."
  options:
  - text: Ask which warehouse ledger caused the quarrel.
    effects:
      set_flag: followed_gang_intimidation_lead
      log_event: You learned of a Gang quarrel tied to a warehouse ledger.
    response_msg: "The boy gives the warehouse number, then hurries back to his cups."
  - text: Pay for your tea and leave the ledger alone.
    effects:
      set_flag: left_gang_intimidation_lead
    response_msg: "The boy looks relieved when the subject passes."
- id: missing_crate_lead
  social_consequence_only: true
  timer_seconds: 90
  trigger_chance: 1.0
  preconditions: {}
  narrative: "A stevedore waits beside the damp warehouse wall until the foreman turns away. He says the missing crate was moved before dawn, and its empty space on the tally has become more dangerous than the cargo itself."
  options:
  - text: Ask which clerk changed the tally before the Kempeitai arrived.
    effects:
      set_flag: followed_missing_crate_lead
      change_trust:
        civilian.worker: 3
      log_event: You followed a dockside lead about a missing crate and its altered tally.
    response_msg: "He gives you a surname, then turns back to the loading line as though the question had never been asked."
  - text: Leave the matter alone and let the loading line close around it.
    effects:
      set_flag: left_missing_crate_lead
      log_event: You left a dockside lead about a missing crate unexplored.
    response_msg: "The stevedore nods once and returns to his work before the foreman notices the pause."
- id: patrol_warning_lead
  social_consequence_only: true
  timer_seconds: 90
  trigger_chance: 1.0
  preconditions: {}
  narrative: "After the warning has had time to travel, a woman at the edge of the market catches your sleeve and points toward a side lane. She says the Kempeitai were asking for papers near the main road, but she cannot say where they will turn next."
  options:
  - text: Consider the side lane, though the watch may turn before you arrive.
    effects:
      set_flag: heeded_patrol_warning
      change_trust:
        civilian.resident: 2
      log_event: You acted on a resident's current warning about Kempeitai activity.
    response_msg: "You leave the brighter road behind, aware that the market offers no certainty."
  - text: Thank her and continue along the main road.
    effects:
      set_flag: declined_patrol_warning
      log_event: You chose not to act on a resident's current warning about Kempeitai activity.
    response_msg: "She gives a small nod and disappears between the stalls before anyone can notice her concern."
- id: wounded_courier
  timer_seconds: 60
  location_tags:
  - old_city
  - alley
  trigger_chance: 0.7
  preconditions:
    trust_ranges:
      civilian.resident:
      - 30
      - 90
    game_hour:
    - 20
    - 23
    flags_missing:
    - helped_courier
    - betrayed_courier
  neglect:
    narrative: The alley is empty when you return. The dye shop owner says someone carried him away before dawn. Nobody knows where. Nobody asks.
    effects:
      set_flag: courier_ignored
      change_trust:
        civilian.resident: -5
      log_event: A wounded courier died alone in an alley.
  narrative: A man collapses beside a dye shop after curfew. His clothes suggest a dock worker, but the paper hidden inside his sleeve bears a name you recognise from yesterday's newspaper. The street is empty, but the patrols will pass here within the hour.
  options:
  - text: Help him into a doorway before the patrol arrives.
    effects:
      set_flag: helped_courier
      change_trust:
        ccp.courier: 15
        civilian.resident: 8
      add_item: bloodied_message
      log_event: You hid a wounded courier from the patrols.
    followup_storylet: grateful_contact
  - text: Walk past. You did not see anything.
    effects:
      set_flag: betrayed_courier
      change_trust:
        kempeitai.patrol: 18
        civilian.resident: -20
      log_event: You betrayed a wounded courier to the authorities.
- id: grateful_contact
  location_tags:
  - old_city
  - shrine
  trigger_chance: 0.8
  preconditions:
    flags_required:
    - helped_courier
    flags_missing:
    - met_grateful_contact
  neglect:
    narrative: The woman's gaze slides past you. She folds the paper back into her sleeve and walks away. Whatever she offered vanishes into the morning crowd.
    effects:
      set_flag: met_grateful_contact
      log_event: You hesitated too long and missed a grateful contact's offer.
  narrative: A woman waiting beside a shrine does not look at you when she speaks. Her voice is low, the kind of voice that has learned not to carry. "The man you helped last night sends his thanks. Take this and keep walking." She presses a folded paper into your palm without breaking stride.
  options:
  - text: Accept the paper and continue walking.
    effects:
      set_flag: met_grateful_contact
      add_item: forged_pass
      change_trust:
        ccp.safehouse: 10
      log_event: A grateful contact gave you a forged pass.
  - text: Nod but leave the paper behind.
    effects:
      set_flag: met_grateful_contact
      change_trust:
        ccp.safehouse: 3
      log_event: You refused a reward from the Resistance.
- id: tea_house_whisper
  location_tags:
  - teahouse
  trigger_chance: 0.55
  preconditions:
    game_hour:
    - 14
    - 20
    flags_missing:
    - heard_teahouse_whisper
  neglect:
    narrative: The conversation drifts to other things. Pier Six or Pier Nine, you cannot remember which. The tea grows cold.
    effects:
      set_flag: heard_teahouse_whisper
      log_event: You overheard something at the teahouse but let it slip away.
  narrative: 'Two old men play xiangqi in the corner of the tea house. One of them says something about the price of fish that makes the other laugh without smiling. When you sit too close, they pause. One line drifts your way anyway: "The fish arrives late tonight. At which pier? The one where nobody goes fishing anymore."'
  options:
  - text: Memorise the exchange and finish your tea quietly.
    effects:
      set_flag: heard_teahouse_whisper
      change_trust:
        ccp.courier: 4
      log_event: You overheard a whisper about Pier Six.
  - text: Lean closer and ask about the fishing.
    effects:
      set_flag: heard_teahouse_whisper
      change_trust:
        civilian.vendor: -6
        ccp.courier: -4
      log_event: You pressed strangers too hard for information and made them uncomfortable.
- id: night_knock
  timer_seconds: 60
  location_tags:
  - lilong
  - residence
  trigger_chance: 0.45
  preconditions:
    game_hour:
    - 22
    - 23
    flags_missing:
    - answered_night_knock
  neglect:
    narrative: The knocking stops. Footsteps fade down the lane. The patrol passes ten minutes later without stopping. Whoever it was made it wherever they were going.
    effects:
      set_flag: answered_night_knock
      log_event: You ignored a late-night knock at your door.
  narrative: A knock comes at the door after curfew. Three short raps, then a pause, then two more. The lane outside has been silent for hours. Anyone moving after dark either knows the patrol schedule or is desperate enough not to care.
  options:
  - text: Open the door a crack and see who it is.
    effects:
      set_flag: answered_night_knock
      change_trust:
        ccp.safehouse: 8
      add_item: coded_ledger
      give_item: testimony_collaboration
      log_event: A covert visitor left you a coded ledger.
  - text: Stay silent and wait for them to leave.
    effects:
      set_flag: answered_night_knock
      change_trust:
        civilian.resident: 4
      log_event: You chose caution over contact after a suspicious knock.
- id: rice_queue_argument
  location_tags:
  - market
  trigger_chance: 0.6
  preconditions:
    flags_missing:
    - settled_rice_queue
  neglect:
    narrative: The argument resolves itself. Someone shouts, someone yields, and the line shuffles forward. The old woman is still standing at the window when you leave.
    effects:
      set_flag: settled_rice_queue
      log_event: You watched a ration queue argument resolve without intervening.
  narrative: The rice queue stretches past the tea stall when the clerk closes the wooden window. An old woman holds up her ration card and insists the missing stamps are not her mistake. Nobody moves. Everyone is hungry, but everyone is afraid of becoming the person the guards remember.
  options:
  - text: Step forward and speak for the old woman.
    effects:
      set_flag: settled_rice_queue
      change_trust:
        civilian.vendor: 8
        civilian.worker: 5
      log_event: You calmed a ration queue before it turned into a riot.
  - text: Leave before the argument draws attention.
    effects:
      set_flag: settled_rice_queue
      change_trust:
        green_gang.broker: 4
        civilian.worker: -8
      add_item: hidden_cash
      log_event: You profited from unrest at a ration queue.
- id: patrol_glance
  timer_seconds: 60
  location_tags:
  - checkpoint
  trigger_chance: 0.5
  preconditions:
    flags_missing:
    - survived_patrol_glance
  neglect:
    narrative: The sergeant hands your papers back without a word. You are still standing. That is enough.
    effects:
      set_flag: survived_patrol_glance
      log_event: You stood still under a patrol sergeant's scrutiny.
  narrative: The patrol sergeant holds your papers half a second longer than you would like. The lantern light makes it hard to read his expression. Behind him, the street is empty in both directions. A dog barks somewhere down the lane.
  options:
  - text: Stand still and meet his gaze.
    effects:
      set_flag: survived_patrol_glance
      change_trust:
        kempeitai.officer: 5
      log_event: You stood firm under a patrol sergeant's scrutiny.
  - text: Lower your eyes and shift your weight like someone who has nothing to hide.
    effects:
      set_flag: survived_patrol_glance
      change_trust:
        civilian.resident: 2
        kempeitai.officer: -2
      log_event: You submitted to a patrol sergeant's scrutiny and passed.
- id: dock_crate
  location_tags:
  - dock
  trigger_chance: 0.5
  preconditions:
    flags_missing:
    - opened_dock_crate
  neglect:
    narrative: A dock worker notices the crate first and hauls it onto a handcart. The moment passes.
    effects:
      set_flag: opened_dock_crate
      change_trust:
        civilian.worker: 3
      log_event: You hesitated too long at the dock and someone else claimed the crate.
  narrative: A crate has split open on the dock. Straw spills into a puddle black with oil. The cargo is exposed. Tins of something labelled in Japanese. A foreman is arguing with a sailor fifty metres away, his back turned.
  options:
  - text: Kneel and look at the cargo before anyone notices.
    effects:
      set_flag: opened_dock_crate
      add_item: dock_manifest
      change_trust:
        british.dockmaster: 3
        green_gang.smuggler: 5
      log_event: You searched a broken crate on the docks.
  - text: Call out to the foreman that a crate has broken.
    effects:
      set_flag: opened_dock_crate
      change_trust:
        civilian.worker: 5
        green_gang.smuggler: -5
      log_event: You alerted a foreman about a broken crate.
- id: hidden_prayer
  timer_seconds: 180
  location_tags:
  - shrine
  trigger_chance: 0.5
  preconditions:
    flags_missing:
    - found_hidden_prayer
  neglect:
    narrative: The candle gutters out. In the darkness, you can no longer find the folded scrap. It was never meant for you.
    effects:
      set_flag: found_hidden_prayer
      log_event: You hesitated at a shrine and lost a hidden message.
  narrative: A candle flickers behind the altar rail, casting shadows that move without wind. Someone has tucked a folded scrap of paper into a gap in the wood. The ink is fresh.
  options:
  - text: Take the paper and read it where you stand.
    effects:
      set_flag: found_hidden_prayer
      add_item: temple_talisman
      change_trust:
        civilian.resident: 6
        ccp.organizer: 3
      log_event: You found a hidden prayer note in a shrine.
  - text: Leave it where it belongs.
    effects:
      set_flag: found_hidden_prayer
      change_trust:
        civilian.resident: 3
      log_event: You left a hidden shrine message undisturbed.
- id: alley_child
  timer_seconds: 60
  location_tags:
  - alley
  trigger_chance: 0.45
  preconditions:
    flags_missing:
    - helped_alley_child
  neglect:
    narrative: The child watches you pass without a word. When you look back, she is gone, as if she was never there.
    effects:
      set_flag: helped_alley_child
      change_trust:
        civilian.resident: -2
      log_event: You walked past a hungry child without a word.
  narrative: A child with bare feet watches you from behind a broken handcart. She does not beg. She just watches, the way children learn to watch when they have learned that adults are unpredictable. Her ribs show through her shirt.
  options:
  - text: Share what food you have and keep walking.
    effects:
      set_flag: helped_alley_child
      change_trust:
        civilian.resident: 10
        civilian.worker: 6
      log_event: You shared scarce provisions with a hungry child.
  - text: Look away and keep walking.
    effects:
      set_flag: helped_alley_child
      change_trust:
        civilian.resident: -4
      log_event: You left a hungry child behind.
- id: smoked_window
  location_tags:
  - safehouse
  trigger_chance: 0.55
  preconditions:
    trust_ranges:
      ccp.organizer:
      - 45
      - 100
    flags_missing:
    - entered_smoked_window
  neglect:
    narrative: The window closes. The watcher decides you are not worth waiting for.
    effects:
      set_flag: skipped_smoked_window
      log_event: You hesitated too long outside a safehouse.
  narrative: One window in the tenement is blacked out with paint. As you pass, it opens a finger-width from the inside. Someone is watching you without showing their face. The lane is empty except for a cat cleaning itself on a stoop.
  options:
  - text: Pause and wait for a sign.
    effects:
      set_flag: entered_smoked_window
      change_trust:
        ccp.organizer: 12
      log_event: A safehouse finally let you inside.
  - text: Keep walking. Curious people do not live long in Shanghai.
    effects:
      set_flag: skipped_smoked_window
      change_trust:
        ccp.organizer: -3
      log_event: You passed a possible safehouse without making contact.
- id: contraband_offer
  location_tags:
  - market
  trigger_chance: 0.5
  preconditions:
    flags_missing:
    - resolved_contraband_offer
  neglect:
    narrative: The vendor buttons his coat and melts into the crowd. The opportunity passes.
    effects:
      set_flag: resolved_contraband_offer
      log_event: You hesitated too long at a contraband offer.
  narrative: A vendor at the edge of the market opens his coat just enough for you to see glass vials where there should be packets of tea. He does not meet your eyes. His hands are steady, which means he has done this before.
  options:
  - text: Buy the medicine and say nothing.
    effects:
      set_flag: resolved_contraband_offer
      add_item: contraband_morphine
      change_trust:
        green_gang.broker: 8
      log_event: You bought contraband morphine from a market vendor.
  - text: Tell him the patrols are making rounds and walk on.
    effects:
      set_flag: resolved_contraband_offer
      change_trust:
        civilian.vendor: 8
        green_gang.broker: 2
      log_event: You warned a vendor before the patrols arrived.
- id: ledger_question
  location_tags:
  - warehouse
  trigger_chance: 0.45
  preconditions:
    inventory_has:
    - coded_ledger
    flags_missing:
    - showed_ledger
  neglect:
    narrative: The clerk's moment of recognition fades. He returns to his work, and you walk on, ledger still in pocket.
    effects:
      set_flag: showed_ledger
      log_event: You walked away before a clerk could question your ledger.
  narrative: A warehouse clerk notices the edge of the ledger in your pocket and abruptly loses his composure.
  options:
  - text: Ask him what the numbers mean.
    effects:
      set_flag: showed_ledger
      change_trust:
        green_gang.broker: 10
      log_event: A clerk reacted to the coded ledger you were carrying.
  - text: Hide the ledger and leave.
    effects:
      set_flag: showed_ledger
      change_trust:
        civilian.worker: 3
      log_event: You concealed the coded ledger when a clerk noticed it.
- id: checkpoint_beggar
  location_tags:
  - checkpoint
  trigger_chance: 0.4
  preconditions:
    flags_missing:
    - met_checkpoint_beggar
  neglect:
    narrative: The beggar's gaze moves on. Whatever he knew, he takes it with him.
    effects:
      set_flag: met_checkpoint_beggar
      log_event: You ignored a beggar's coded signal at a checkpoint.
  narrative: A man sitting just outside the checkpoint taps the curb twice with a tin cup. He looks at your shoes instead of your face. A warning or a signal. The difference is not always clear in Shanghai.
  options:
  - text: Drop a coin in the cup and listen for what follows.
    effects:
      set_flag: met_checkpoint_beggar
      change_trust:
        civilian.vendor: 5
        ccp.courier: 4
      log_event: A beggar near a checkpoint passed you a useful warning
  - text: Pass without slowing.
    effects:
      set_flag: met_checkpoint_beggar
      change_trust:
        civilian.vendor: -2
      log_event: You ignored a beggar's coded warning.
- id: river_smell
  timer_seconds: 180
  location_tags:
  - bund
  trigger_chance: 0.35
  preconditions:
    game_hour:
    - 4
    - 7
    flags_missing:
    - morning_river_smell
  neglect:
    narrative: The dawn brightens. The barges are gone, their cargo delivered or hidden. The river tells no stories.
    effects:
      set_flag: morning_river_smell
      log_event: You lingered too long by the river and missed the dawn barges.
  narrative: The river at dawn smells of rain and coal and something metallic. Barges move silently through the mist, their navigation lights dimmed. A figure on the nearest boat drops a rope before the bow touches the dock.
  options:
  - text: Watch from the shadows and note what you see.
    effects:
      set_flag: morning_river_smell
      change_trust:
        british.merchant: 3
        civilian.worker: 2
      log_event: You watched contraband barges move at dawn on the river.
  - text: Turn inland before the patrols finish changing shifts.
    effects:
      set_flag: morning_river_smell
      change_trust:
        kempeitai.patrol: -2
      log_event: You left the Bund before the patrols settled into the morning.
- id: borrowed_prayer
  timer_seconds: 180
  location_tags:
  - residence
  trigger_chance: 0.35
  preconditions:
    inventory_has:
    - temple_talisman
    flags_missing:
    - lent_talisman
  neglect:
    narrative: She waits a moment longer, then quietly withdraws into her room. The door closes without a sound.
    effects:
      set_flag: lent_talisman
      change_trust:
        civilian.resident: -3
      log_event: You neither accepted nor refused the neighbour's request.
  narrative: Your neighbour's hands shake when she sees the temple charm in your pocket. "Just for the night," she says. "Tomorrow I will return it." She does not explain why she needs it, and you do not ask. Some questions are better left unasked in this city.
  options:
  - text: Press the charm into her palm.
    effects:
      set_flag: lent_talisman
      remove_item: temple_talisman
      change_trust:
        civilian.resident: 12
      log_event: You lent a temple talisman to a frightened neighbour.
  - text: Apologise and keep it.
    effects:
      set_flag: lent_talisman
      change_trust:
        civilian.resident: -6
      log_event: You refused to lend a talisman to a frightened neighbour.
- id: ruined_flyer
  timer_seconds: 180
  location_tags:
  - school
  - old_city
  trigger_chance: 0.4
  preconditions:
    flags_missing:
    - found_ruined_flyer
  neglect:
    narrative: The rain softens the paper further. By morning, nothing remains but a blur of ink and charcoal.
    effects:
      set_flag: found_ruined_flyer
      log_event: You let a ruined flyer dissolve in the rain.
  narrative: Rain has pasted a propaganda flyer to the wall so thoroughly that only a corner remains. Beneath the torn paper, a child has drawn a picture in charcoal. A house, a tree, a sun with a face. Someone crossed it out with a single brushstroke.
  options:
  - text: Peel the flyer away carefully to see the drawing.
    effects:
      set_flag: found_ruined_flyer
      change_trust:
        civilian.resident: 4
        ccp.organizer: 4
      log_event: You uncovered a child's drawing behind a propaganda flyer.
  - text: Leave the wall as it is.
    effects:
      set_flag: found_ruined_flyer
      change_trust:
        civilian.resident: 1
      log_event: You left a ruined flyer clinging to a wall.
- id: choir_attic
  timer_seconds: 180
  location_tags:
  - church
  - attic
  trigger_chance: 0.5
  preconditions:
    flags_missing:
    - heard_attic_choir
    game_hour:
    - 18
    - 22
  neglect:
    narrative: The song fades into silence. By the time you reach the attic, whoever was singing has gone. The room is empty except for a single candle still warm.
    effects:
      set_flag: heard_attic_choir
      log_event: You lingered too long and lost the singer in the church attic.
  narrative: Someone is singing above the church rafters. The voice is too soft for prayer and too steady for grief. It is a song in a language you half-recognise, the melody worn smooth by repetition. The door to the attic stairs is unlocked.
  options:
  - text: Climb the stairs and find the singer.
    effects:
      set_flag: heard_attic_choir
      change_trust:
        civilian.resident: 6
        ccp.organizer: 5
      log_event: You found hidden voices in a church attic.
  - text: Stand in the doorway and listen until the song ends.
    effects:
      set_flag: heard_attic_choir
      change_trust:
        civilian.resident: 2
      log_event: You left a church before learning the identity of the singer above you.
- id: silk_signal
  timer_seconds: 180
  location_tags:
  - french
  - balcony
  trigger_chance: 0.4
  preconditions:
    inventory_has:

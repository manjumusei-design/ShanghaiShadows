event_lines:
  movement:
    - "You slipped through the {district} alleyways unnoticed."
    - "Your footsteps echoed through the empty {location}."
    - "You moved {direction} under cover of the blackout, keeping to the walls."
    - "The winding lanes of {district} swallowed you whole as you vanished from sight."
    - "You crossed into {district} just before the curfew gun sounded."
    - "A patrol passed {direction}, and you pressed yourself flat against the damp plaster."
    - "You took the long way around {location} to avoid the checkpoint."
    - "The narrow corridor behind {location} led you {direction} into unfamiliar ground."
    - "You followed the shadow of the tram line {direction} until the crowds thinned."
    - "Rain slicked the cobblestones of {district} as you hurried {direction}."
    - "You cut through {location} after dark, stepping over puddles of lamplight."
    - "The route {direction} through {district} was longer but free of sentries."
    - "You kept your head down and moved {direction} through the morning market crowds."
    - "Somewhere behind you, a whistle blew, but you were already gone from {location}."

  interaction:
    - "You exchanged words with {npc_name} at the {location}."
    - "{npc_name} pressed a folded note into your palm and walked away without a word."
    - "You shared a cigarette with {npc_name} beneath the awning of the {location}."
    - "{npc_name} warned you to stay away from {location} after sundown."
    - "You bartered with {npc_name} for a handful of {item}, paying more than it was worth."
    - "A quiet nod from {npc_name} told you the drop at {location} had been made."
    - "You listened as {npc_name} recounted the latest roundup near {location}."
    - "{npc_name} offered you {item} in exchange for a favor you knew better than to refuse."
    - "You met {npc_name} at the {location} and spoke in voices barely above a whisper."
    - "{npc_name} glanced over both shoulders before handing you the {item}."
    - "You asked {npc_name} about the new officer posted at {location}."
    - "The conversation with {npc_name} turned to missing persons and sealed letters."
    - "{npc_name} told you where to find {item}, but the price was information."
    - "You recognized {npc_name} from before the occupation, though they did not recognize you."
    - "{npc_name} slipped you a forged pass and told you the {location} checkpoint would accept it."
    - "You watched {npc_name} pocket {item} and knew better than to ask where it came from."
    - "A brief exchange with {npc_name} at the {location} confirmed the rendezvous was still on."

  combat:
    - "Steel flashed in the {location} shadows."
    - "You drove your {weapon} into {npc_name} before they could call out."
    - "{npc_name} lunged at you with a blade near the back entrance of {location}."
    - "The struggle was brief and silent, ended with your {weapon} at {npc_name}'s throat."
    - "You parried {npc_name}'s attack in the narrow corridor of {location} and shoved them aside."
    - "Blood spattered the floor of {location} as your {weapon} found its mark."
    - "{npc_name} staggered back from the blow and collapsed against the wall of {location}."
    - "You wrestled {npc_name} to the ground in {location}, finishing it with your {weapon}."
    - "A gunshot cracked through {location}, and {npc_name} fell before they could raise the alarm."
    - "You caught {npc_name} off guard in {location} and struck before they could draw their weapon."

  discovery:
    - "Behind a loose brick, you found {item}."
    - "You pried open a floorboard in {location} and uncovered {item}."
    - "A hollowed-out book in {location} contained {item} wrapped in oilcloth."
    - "You noticed fresh scratches near the door of {location} and found {item} hidden beneath the threshold."
    - "In the rubble of a bombed shop in {district}, something glinted: {item}."
    - "You lifted a loose tile in {location} and found {item} sealed in a tin."
    - "A dead drop behind {location} yielded {item}, exactly where the courier said it would be."
    - "You searched the room above {location} and found {item} tucked inside the chimney."
    - "Half-buried in the gutter of {district}, you spotted {item} and pocketed it quickly."
    - "The false bottom of a tea crate in {location} concealed {item}."
    - "A folded map tucked inside {item} marked a location deep in {district} you had never seen before."

  faction_action:
    - "A {faction} operative passed you a coded message."
    - "You spotted the {faction} signal chalked on a wall near {location} and changed your route."
    - "The {faction} {role} met your eyes across the crowded {location} and looked away."
    - "You received orders from {faction} via a {role} waiting at the {location}."
    - "A {faction} {role} warned that {location} was being watched and moved the meeting."
    - "You watched a {faction} courier slip into {location} and waited until they left."
    - "The {faction} safehouse at {location} was empty, the furnishings overturned in haste."
    - "{faction} had posted a {role} at {location} to screen anyone who came through."
    - "You delivered the package to the {faction} {role} at {location} and left without speaking."
    - "A {faction} broadcast on the wireless mentioned {location} in a string of numbers."
    - "You recognized the {faction} hand signal from the {role} across the market and acknowledged it."
    - "The {faction} cell in {location} had been compromised, and the {role} told you to scatter."
    - "You were summoned to {location} by a {faction} {role} who spoke only in prearranged phrases."
    - "A {faction} leaflet blew across the street near {location}, startling the patrol."
    - "The {faction} {role} at {location} gave you a new identity paper and told you to memorize it."
    - "You overheard two {faction} operatives arguing about the {role} at {location} and moved along."

  survival:
    - "Hunger gnawed at your stomach as you rationed the last of the rice."
    - "You chewed on {food} in the back room of {location}, making it last."
    - "The ration card was nearly empty, so you traded what remained for {food} near {location}."
    - "You boiled {food} over a makeshift flame in {location}, the smell drawing wary glances."
    - "Your {condition} worsened in the damp cold of {location}, but there was no medicine."
    - "You washed down {food} with rainwater collected in a dented kettle at {location}."
    - "The blast had shattered every window in {location}, and you swept the glass with shaking hands."
    - "You wrapped your {condition} in a strip of bedsheets and tried not to think about infection."
    - "A stranger at {location} shared their {food} without a word, and you ate in silence."
    - "You found {food} in an abandoned flat in {location} and ate it cold in the dark."
    - "Sleep came in fragments at {location}, broken by the sound of boots in the corridor."
    - "You treated your {condition} with whatever was left in the medicine cabinet at {location}."
    - "The water at {location} had been cut for three days, so you drank from the roof catchment."
    - "You sat in the dark of {location} eating {food}, listening to the distant rumble of artillery."

  betrayal:
    - "Someone talked. You could feel the walls closing in."
    - "{npc_name} was seen entering the Kempeitai office near {location} alone."
    - "The dead drop at {location} had been cleared out before you arrived, and {npc_name} was the only one who knew."
    - "You found your own name on a list inside {faction} headquarters at {location}."
    - "{npc_name} stopped meeting your eyes after the roundup in {location}."
    - "A {faction} {role} at {location} asked questions only someone on the inside would know to ask."
    - "The signal at {location} had changed, and you realized {npc_name} had sold the cipher."
    - "You overheard {npc_name} naming contacts to a {faction} officer in {location}."
    - "The {faction} cell at {location} was arrested within hours of {npc_name}'s disappearance."
    - "You returned to {location} to find your papers gone and {npc_name}'s room emptied out."
    - "A trusted {faction} {role} at {location} had been feeding information to the Kempeitai for weeks."

  mission:
    - "One step closer to completing the task that brought you here."
    - "The package for {mission_title} was secured and the trail went cold behind you."
    - "You marked the location of {target} on a scrap of map and folded it into your coat."
    - "{mission_title} required patience, but the window was closing."
    - "You photographed the documents at {target} and slipped the camera back into its hiding place."
    - "The contact for {mission_title} confirmed the {reward} would be waiting at the dead drop."
    - "You burned the coded message for {mission_title} and scattered the ashes outside {target}."
    - "{target} was heavier guarded than expected, and you memorized the patrol rotation."
    - "You completed the first phase of {mission_title} and waited for word on the {reward}."
    - "The route to {target} passed through three checkpoints, and you carried forged papers for each."
    - "Intelligence on {target} was incomplete, but you pressed forward with {mission_title} regardless."
    - "You left the signal at {target} and moved on, trusting the {reward} would follow."

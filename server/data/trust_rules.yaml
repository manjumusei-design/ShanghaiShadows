feedback:
  "pickpocket": "A lightened pocket leaves a mark in the Old City, where neighbours count their coins and remember the hand that was near them."
  "caught_pickpocket": "Your hand was seen near the market purse, and Shanghai's civilian residents will keep their distance when you pass."
  "talk_to_ccp.courier": "A courier's nod travels farther than words in Shanghai; Hongkou doors may open a little easier."
  "talk_to_ccp.organizer": "Old City workers notice who listens without boasting, and rice queues pass that judgment quietly."
  "talk_to_kempeitai.officer": "Kempeitai attention settles on you like a permit stamp, useful in one office and costly elsewhere."
  "talk_to_green_gang.smuggler": "Suzhou Creek brokers hear you can bargain without flinching, and market neighbours hear it too."
  "out_after_curfew": "Curfew gossip moves before dawn; Old City neighbours remember whose footsteps risked the lane."
  "talk_to_gmd.officer": "Republic contacts mark your name in a Shanghai notebook that travels by careful hands."
  "talk_to_gmd.spy": "A Bund watcher decides you understand discretion, though such approval leaves a stain elsewhere."
  "talk_to_british.consul": "Concession clerks note your manners, and Shanghai clerks know manners can become papers."
  "talk_to_french_concession.police": "French Concession police remember your face at checkpoints, which may comfort nobody nearby."
  "disguise_caught": "A failed disguise becomes market talk by noon; Shanghai trusts clothing less after such mistakes."
  "hide_failure": "The botched hiding place leaves a trace, and patrol gossip follows it through the tea shops."
  "plant_evidence_found": "Planted evidence poisons more than one file; Old City neighbours learn to distrust convenient proof."
  "tail_caught": "A clumsy shadow is remembered in Shanghai, especially near checkpoints where faces are traded."
  "kill_kempeitai.officer": "An occupation officer's death reaches Hongkou before supper, carried in whispers and closed shutters."
  "kill_kempeitai.informant": "An informant's absence changes the rice queue, where people suddenly speak one sentence more."
  "kill_kempeitai.patrol": "A patrol death hardens Kempeitai searches, though some Shanghai lanes breathe easier after dark."
  "kill_ccp.courier": "A missing courier breaks more than one route through Hongkou; workers notice the gap."
  "kill_ccp.organizer": "The underground loses a careful hand, and Old City meetings grow shorter for several nights."
  "kill_gmd.officer": "Republic channels in Shanghai close ranks, leaving fewer papers and colder answers behind."
  "kill_gmd.spy": "A dead Nationalist watcher leaves Bund contacts nervous, and nervous contacts sell names cheaply."
  "kill_green_gang.smuggler": "Suzhou Creek trade adjusts at once; brokers count debts before they count the dead."
  "kill_green_gang.broker": "A broker's death disturbs market credit, and Shanghai vendors dislike disorder more than speeches."
  "kill_civilian.vendor": "A vendor's stall stays covered in Nanking Road cloth, and neighbours remember who made it empty."
  "kill_civilian.resident": "An Old City doorway loses its evening lamp, and civilian trust drains from the lane."
  "kill_civilian.worker": "A worker's tools sit unused near the docks, where hunger makes every absence visible."
  "kill_british.dockmaster": "The Bund offices hear of it before the river does, and dock permits grow harder."
  "kill_british.consul": "Concession officials turn formal and cold, making every Shanghai paper slower to obtain."
  "kill_french_concession.merchant": "French Concession merchants lower shutters early, and civilian buyers lose another cautious credit line."
  "kill_kempeitai.interrogator": "Bridge House loses a feared voice, and Shanghai hears both relief and approaching retaliation."
  "kill_kempeitai.civilian": "Even occupation families have neighbours; Shanghai notices when civilian blood is treated as politics."
  "kill_ccp.operator": "A wireless silence spreads through Hongkou rooms, and the underground blames the hand nearest it."
  "kill_ccp.student": "A student's desk stays empty, and Shanghai classrooms learn which questions must wait."
  "kill_ccp.teacher": "A teacher's death closes more than one lesson, especially where banned history passed hand to hand."
  "kill_civilian.cleric": "Temple bells in the Old City sound thinner, and civilian patience thins with them."
  "kill_civilian.monk": "Incense burns for a monk, while Shanghai neighbours wonder who still respects sanctuary."
  "kill_civilian.nurse": "A Bubbling Well Road sickroom loses a pair of steady hands, and mercy becomes scarcer."
  "kill_civilian.orphan": "The Old City children stop playing near your shadow, which says more than accusation."
  "kill_civilian.reporter": "A reporter's notebook disappears, and Shanghai loses one more witness to its own fear."
  "kill_civilian.tailor": "A tailor's needle lies still, and French Concession coats keep their torn seams."
  "kill_french_concession.clerks": "Concession desks become suspicious, and every permit in Shanghai feels heavier afterward."
  "kill_french_concession.entertainer": "Music stops in one French Concession room, and gossip fills the silence badly."
  "kill_green_gang.boss": "Green Gang collectors recalculate the city overnight, and even rice sellers feel the arithmetic."
  "kill_green_gang.cook": "A kitchen fire goes cold, and Suzhou Creek men argue over who eats first."
  "kill_green_gang.entertainer": "The Green Gang loses a smiling messenger, and French Concession tables grow less talkative."
  "kill_british.baker": "A bakery shutter stays down, and Shanghai families lose one more dependable morning smell."
  "kill_british.clerks": "Bund files stop moving neatly, and permits begin gathering dust in the wrong trays."
  "kill_british.engineer": "A dock engine waits unrepaired, slowing rice sacks, coal carts, and every hungry argument."
  "kill_british.merchant": "A British account closes badly, and Nanking Road traders become careful with foreign credit."
  "kill_german.merchant": "A foreign warehouse changes locks, and Shanghai buyers wonder which flag owns the goods now."
  "kill_french_concession.police": "French Concession patrols answer with harder eyes, and nearby civilians shorten every errand."
